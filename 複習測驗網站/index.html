planation": "AI生成內容可能捏造不實陳述損及他人名譽，構成誹謗與中傷等法律風險；其餘選項屬技術或資源問題，非法律風險。", "has_caveat": 0, "caveat_note": null}, {"id": 248, "source": "題庫08", "topic": "綜合", "question": "在使用AI生成內容進行資料視覺化時，哪個步驟可以確保資料乾淨、無錯誤？", "option_a": "資料傳輸", "option_b": "資料清洗", "option_c": "資料存儲", "option_d": "資料備份", "correct_option": "B", "explanation": "資料清洗負責處理缺漏值、重複值、格式錯誤與異常值，是確保資料乾淨無誤的步驟。", "has_caveat": 0, "caveat_note": null}, {"id": 249, "source": "題庫08", "topic": "綜合", "question": "AI圖片生成工具在醫療圖片上有何應用？", "option_a": "透過AI所生成的醫療圖片提高診斷準確性", "option_b": "基於患者資料發展個人化治療計畫", "option_c": "利用量子運算加速圖片處理速度", "option_d": "自動化醫療機構的行政作業", "correct_option": "A", "explanation": "AI圖片生成可產生合成醫療影像以補足稀有病例資料，訓練出更準確的診斷模型；B屬資料分析、C與圖片生成無關、D屬行政自動化。", "has_caveat": 1, "caveat_note": "實務上AI生成的醫療影像主要用於擴增訓練資料（合成資料），間接提升診斷模型的準確性，而非直接以生成圖片做診斷；但四選項中僅A與「圖片生成」相關，故為最佳答案。"}, {"id": 250, "source": "題庫08", "topic": "綜合", "question": "下列何者是生成式AI的特色？", "option_a": "無法客製化", "option_b": "多領域應用", "option_c": "不斷退步", "option_d": "無法提供創意和靈感", "correct_option": "B", "explanation": "生成式AI可應用於文字、圖像、音訊、程式碼等多種領域；其餘選項皆與其特性相反。", "has_caveat": 0, "caveat_note": null}, {"id": 251, "source": "題庫08", "topic": "綜合", "question": "當生成式 AI 的結果不符合預期時，應採取何種策略來改進？", "option_a": "更換AI模型", "option_b": "修改或優化Prompt", "option_c": "增加硬體設備", "option_d": "改變作業系統", "correct_option": "B", "explanation": "結果不符預期時，最直接有效的做法是調整Prompt使指令更明確具體；硬體與作業系統不影響生成內容品質。", "has_caveat": 0, "caveat_note": null}, {"id": 252, "source": "題庫08", "topic": "綜合", "question": "根據歐盟可信賴人工智慧倫理準則，下列何者最能體現「公平性」的要求？", "option_a": "一個AI系統對所有群體的決策結果都存在偏差", "option_b": "一款AI系統的決策過程充分考慮了不同群體的利益", "option_c": "一項AI法規對特定群體的權益保護做出規範", "option_d": "一家公司在AI系統開發中歧視了某些少數群體", "correct_option": "B", "explanation": "公平性要求AI系統避免偏見與歧視，決策時平等考量不同群體的利益；A、D違反公平性，C僅針對特定群體且屬法規層面。", "has_caveat": 0, "caveat_note": null}, {"id": 253, "source": "題庫08", "topic": "綜合", "question": "在圖片生成中，StyleGAN最初由哪家公司開發？", "option_a": "Meta", "option_b": "NVIDIA", "option_c": "Apple", "option_d": "OpenAI", "correct_option": "B", "explanation": "StyleGAN 由 NVIDIA 研究團隊於2018年提出，以生成高擬真人臉圖像聞名。", "has_caveat": 0, "caveat_note": null}, {"id": 254, "source": "題庫08", "topic": "綜合", "question": "若要創建一個網頁版的踩地雷遊戲，應選擇哪個Prompt？", "option_a": "請幫我解釋一下這段程式碼", "option_b": "請幫我撰寫一個網頁版的踩地雷遊戲", "option_c": "請幫我優化這段程式碼", "option_d": "請幫我翻譯這段程式碼", "correct_option": "B", "explanation": "目標是「創建」新遊戲，Prompt應明確要求撰寫程式；其餘選項皆針對既有程式碼進行解釋、優化或翻譯。", "has_caveat": 0, "caveat_note": null}, {"id": 255, "source": "題庫08", "topic": "綜合", "question": "在涉及未成年人資料的AI生成內容時，各國法律都有相關規範，根據美國《兒童線上隱私保護法》(Children's Online Privacy Protection Act, COPPA)，企業應做什麼以遵守法律？", "option_a": "完全禁止收集未成年人資料", "option_b": "獲得家長的明確同意並提供刪除資料的選擇", "option_c": "僅在非營利專案中使用未成年人資料", "option_d": "向政府報備未成年人資料的使用情況", "correct_option": "B", "explanation": "COPPA 規定收集13歲以下兒童個人資料前須取得家長可驗證的同意，並讓家長可查閱、刪除其子女資料。", "has_caveat": 0, "caveat_note": null}, {"id": 256, "source": "題庫08", "topic": "綜合", "question": "在生成式AI生成文本時，什麼是「多模態學習」？", "option_a": "使用多個語言模型", "option_b": "結合多種數據類型進行學習", "option_c": "增加文本長度", "option_d": "減少生成時間", "correct_option": "B", "explanation": "多模態學習指同時結合文字、圖像、音訊等多種類型（模態）的資料進行學習，而非使用多個語言模型。", "has_caveat": 0, "caveat_note": null}, {"id": 257, "source": "題庫08", "topic": "綜合", "question": "請問不同的大語言模型 (Large Language Model, LLM) 是如何影響AI生成內容技術？", "option_a": "提供更多的訓練資料", "option_b": "提升生成內容的多樣性和品質", "option_c": "減少運算資源的需求", "option_d": "加速模型訓練速度", "correct_option": "B", "explanation": "不同LLM各有架構與訓練特色，推動生成內容在多樣性與品質上的提升；LLM本身不「提供」訓練資料，且通常需要更多運算資源。", "has_caveat": 0, "caveat_note": null}, {"id": 258, "source": "題庫08", "topic": "綜合", "question": "AI圖片生成工具的應用，不包含下列何者？", "option_a": "服裝設計", "option_b": "石油和天然氣勘探", "option_c": "協助醫療診斷", "option_d": "分析資料生成趨勢預測圖", "correct_option": "B", "explanation": "服裝設計、醫療影像輔助、圖表生成皆可運用AI圖片生成；石油和天然氣勘探屬地質探測領域，非圖片生成工具的應用。", "has_caveat": 1, "caveat_note": "選項D「分析資料生成趨勢預測圖」較偏向資料分析/視覺化，嚴格而言也不算典型的圖片生成工具應用；但石油和天然氣勘探與圖片生成的關聯最遠，依題目標示答案存檔。"}, {"id": 259, "source": "題庫08", "topic": "綜合", "question": "何者是良好且有相關的Prompt？", "option_a": "告訴我有關宇宙的所有事情", "option_b": "我想要知道月蝕的最新消息", "option_c": "請解釋什麼是月蝕，以及他們如何形成", "option_d": "請示意什麼是月蝕，以及會影響的事情", "correct_option": "C", "explanation": "C的指令明確（解釋）、主題聚焦（月蝕的定義與成因）；A過於廣泛，B要求最新消息超出模型知識範圍，D用詞「示意」模糊且範圍發散。", "has_caveat": 0, "caveat_note": null}, {"id": 260, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "一家跨國電商集團準備在歐盟市場推出四項全新的 AI 系統，法務部門正依據《歐盟 AI 法案（EU AI Act）》的「四級風險金字塔」進行合規審查：\n・系統甲：根據市民的日常消費與社群言論進行道德打分的「社會信用評分系統」。\n・系統乙：自動篩選求職者履歷並決定面試名單的「AI 招聘與求職篩選系統」。\n・系統丙：在官網回答顧客退換貨問題的「線上客服聊天機器人（Chatbot）」。\n・系統丁：根據用戶觀看紀錄自動推薦商品短片的「影片推薦系統」。\n請問上述四套系統依序對應歐盟 AI 法案中的哪四個風險等級？", "option_a": "系統甲：高風險 ／ 系統乙：有限風險 ／ 系統丙：最低風險 ／ 系統丁：不可接受的風險", "option_b": "系統甲：不可接受的風險 ／ 系統乙：高風險 ／ 系統丙：有限風險 ／ 系統丁：最低風險", "option_c": "系統甲：不可接受的風險 ／ 系統乙：有限風險 ／ 系統丙：高風險 ／ 系統丁：有限風險", "option_d": "系統甲：高風險 ／ 系統乙：高風險 ／ 系統丙：最低風險 ／ 系統丁：最低風險", "correct_option": "B", "explanation": "・📍 對應重點章節：4.1 AI 治理核心原則 歐盟 AI 法案與治理制度\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「交通號誌紅綠燈」來記住歐盟《AI 法案》的四級風險管制強度：\n・第一級「不可接受的風險（紅燈：完全禁止）」：\n  ・威脅人類基本尊嚴與自由，一律禁用 ➔ 對應系統甲（社會信用評分系統）。\n・第二級「高風險（黃燈：強制嚴格規範）」：\n  ・攸關人命健康或升學就業飯碗，必須通過嚴格安檢與稽核 ➔ 對應系統乙（招聘與求職篩選系統、醫療診斷 AI）。\n・第三級「有限風險（藍燈：基本資訊揭露）」：\n  ・像食品標示一樣，只要主動告知使用者「你正在跟 AI 互動」即可 ➔ 對應系統丙（聊天機器人 Chatbot）。\n・第四級「最低風險（綠燈：免受規範）」：\n  ・日常娛樂與一般推薦，無重大侵害疑慮 ➔ 對應系統丁（影片推薦系統、電玩遊戲角色 NPC）。\n\n【🔑 正確選項秒殺題眼】\n・社會信用評分 ＝ 不可接受的風險（完全禁止）\n・醫療診斷 ／ 招聘求職篩選 ＝ 高風險（強制嚴格規範）\n・聊天機器人（Chatbot） ＝ 有限風險（基本資訊揭露）\n・影片推薦 ／ 遊戲 NPC ＝ 最低風險（免受規範）\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：社會信用評分屬於完全禁止的「不可接受風險」，而非高風險。\n・✅ (B) 為什麼對：四套系統完美對應歐盟四級風險金字塔由高至低的標準代表場景。\n・❌ (C) 為什麼錯：誤把招聘系統降為有限風險，且誤把聊天機器人升為高風險、把影片推薦當成有限風險（常考混淆陷阱！）。\n・❌ (D) 為什麼錯：聊天機器人必須履行透明度揭露義務（屬有限風險），並非免受規範的最低風險。", "has_caveat": 0, "caveat_note": null}, {"id": 261, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某報社的數位轉型團隊正在回顧人工智慧技術發展時間軸（2014 年分水嶺），並打算將歷年經典模型分類歸檔。在討論到 2018 年由 Google 推出的 BERT 模型時，實習生看到它誕生於 2014 年分水嶺之後，便將它歸入「生成式 AI」資料夾。請問資深工程師應該如何糾正這位實習生？", "option_a": "實習生沒放錯，因為只要是 2014 年以後誕生的模型，全部都屬於無中生有的生成式 AI", "option_b": "BERT 雖然於 2018 年誕生且源自 Transformer 架構，但它只繼承了雙向編碼器（Encoder），專精於閱讀理解與分類判斷，因此屬於「鑑別式 AI」而非生成式 AI", "option_c": "BERT 其實是 1986 年與 RNN 同時誕生的模型，主要依靠單層線性分類來處理影像像素", "option_d": "BERT 屬於生成式 AI 中的擴散模型（Diffusion Model），專門用來從隨機雜訊中逐步去噪畫出逼真圖片", "correct_option": "B", "explanation": "・📍 對應重點章節：1.0 AI 技術發展時間軸與地圖 ＆ 1.6 NLP BERT GPT 與 LLM 演進\n\n【💡 生活化範例 ／ 具體情境秒懂】\n2017 年 Transformer 問世後，2018 年生下了一對性格截然不同的雙胞胎（BERT 與 GPT）：\n・哥哥 BERT（AI 界的閱讀理解王 ➔ 鑑別式 AI）：\n  ・繼承了 Transformer 的 Encoder（編碼器），透過「雙向」看前後文玩克漏字猜字遊戲（MLM），最擅長做情緒判斷與文章分類，所以它是技術發展圖分水嶺右側唯一的「鑑別式 AI」特例！\n・弟弟 GPT（AI 界的創作文學家 ➔ 生成式 AI）：\n  ・繼承了 Transformer 的 Decoder（解碼器），透過「單向自迴歸」玩文字接龍，最擅長無中生有寫文章，這才是真正的生成式 AI！\n\n【🔑 正確選項秒殺題眼】\n・看到 BERT 的 AI 類型歸屬 ➔ 秒選 「鑑別式 AI（雙向 Encoder、專攻語言理解 NLU 與分類）」，絕非生成式 AI！\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：這是考場最經典的「年代假象陷阱」，2018 年的 BERT 雖然在時間軸右側，但本質屬於鑑別式 AI。\n・✅ (B) 為什麼對：精準點出 BERT 繼承雙向 Encoder、專精理解與分類，屬於鑑別式 AI。\n・❌ (C) 為什麼錯：BERT 誕生於 2018 年，且處理的是自然語言而非單層線性影像像素（單層線性分類為 1960 年的感知機 Perceptron）。\n・❌ (D) 為什麼錯：BERT 是自編碼語言模型，與 2020 年去噪生圖的擴散模型（Diffusion）毫無關係。", "has_caveat": 0, "caveat_note": null}, {"id": 262, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "獨立音樂製作人小杰想利用生成式 AI 工具打造一張全新的流行音樂專輯。他規劃了兩套創作流程：\n・流程一：先請大語言模型 GPT 幫他撰寫押韻的中文歌詞，接著將歌詞交給另一款經典 AI 音樂作曲工具自動譜寫古典與流行伴奏配樂。\n・流程二：直接輸入一段文字提示與歌詞，使用 2024 年底大爆發的熱門 AI 音樂平台，在 1 分鐘內一鍵生成包含「逼真人聲演唱 ＋ 完整伴奏編曲」的流行單曲。\n請問「流程一」常與 GPT 結合創作歌曲的配樂工具，以及「流程二」能連同逼真人聲一起唱出整首歌的工具，依序為何？", "option_a": "流程一：Hugging Face ／ 流程二：ElevenLabs", "option_b": "流程一：Figma ／ 流程二：Canva", "option_c": "流程一：AIVA ／ 流程二：Suno", "option_d": "流程一：Midjourney ／ 流程二：Replica Studios", "correct_option": "C", "explanation": "・📍 對應重點章節：3.3 聲音 (TTS) 與音樂生成應用 ＆ 5.4 音樂與語音生成工具\n\n【💡 生活化範例 ／ 具體情境秒懂】\nAI 音樂與語音工具各有專精，我們一行一個角色分清楚：\n・AIVA（AI 交響樂與配樂作曲家）：\n  ・專精於自動譜曲與編曲（古典、影視配樂）；認證考試最愛考「GPT 負責寫詞 ＋ AIVA 負責譜曲」的黃金拍檔組合（對應流程一）。\n・Suno（自帶主唱的 AI 全能樂團）：\n  ・只要給它文字提示或歌詞，它不只幫你編曲，還能直接用超逼真的 AI 歌手唱腔把整首流行歌唱出來（對應流程二）。\n・ElevenLabs / Replica Studios（純配音員 TTS）：\n  ・只負責「把文字念出來（語音合成、有聲書、遊戲角色配音）」，不會幫你譜曲寫歌！\n\n【🔑 正確選項秒殺題眼】\n・看到「常與 GPT 結合使用來創作歌曲的工具」 ➔ 秒選 AIVA\n・看到「文字一鍵生成含逼真人聲演唱與伴奏的完整流行歌」 ➔ 秒選 Suno\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Hugging Face 是開源模型與資料集共享社群（常在音樂題當干擾項！）；ElevenLabs 是 TTS 語音合成工具而非作曲工具。\n・❌ (B) 為什麼錯：Figma（UI/UX 介面設計）與 Canva（平面圖文排版）都是視覺設計軟體，完全不會作曲。\n・✅ (C) 為什麼對：完美對應與 GPT 結合譜曲的 AIVA 以及詞曲人聲一體生成的 Suno。\n・❌ (D) 為什麼錯：Midjourney 是靜態生圖工具；Replica Studios 是遊戲角色戲劇配音（TTS）工具。", "has_caveat": 0, "caveat_note": null}, {"id": 263, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某科技新創公司想讓旗下的企業內部知識問答 AI 達成兩項升級目標：第一，不用把數千億參數的大模型整棟敲掉重蓋，而是用最低成本讓模型學會模仿公司吉祥物的「專屬俏皮個性」；第二，讓 AI 在回答員工差旅報帳規定時，能先去查閱公司最新公告的 PDF 規章，達成「知識型強化」以防止胡亂編造。\n請問這兩項升級目標（第一項「個性強化」、第二項「知識型強化」）依序應採用哪兩種技術？", "option_a": "第一項：RLHF（人類回饋強化學習） ／ 第二項：語法分析器（Parser）", "option_b": "第一項：LoRA（低秩適應） ／ 第二項：RAG（檢索增強生成）", "option_c": "第一項：RAG（檢索增強生成） ／ 第二項：LoRA（低秩適應）", "option_d": "第一項：批次正規化（Batch Normalization） ／ 第二項：思維樹（ToT）", "correct_option": "B", "explanation": "・📍 對應重點章節：2.3 生成式 AI 進階強化 RAG RLHF LoRA 與語法分析器\n\n【💡 生活化範例 ／ 具體情境秒懂】\n把生成式 AI 的「三大進階強化」用生活場景一行一個記起來：\n・個性強化 ＝ LoRA（低秩適應） ➔ 「大樓不翻新，只裝活動式隔間」：\n  ・重訓整個大模型就像把整棟大樓拆掉重蓋一樣昂貴；LoRA 凍結原模型權重，只在關鍵樓層安裝輕量的「活動式隔間（極少量外掛參數）」，就能低成本快速換上專屬個性或畫風（對應第一項）。\n・知識型強化 ＝ RAG（檢索增強生成） ➔ 「給 AI 帶最新課本參加開書考」：\n  ・幫 AI 外接最新內部規章資料庫，回答前先去檢索可靠文件再生成答案，防止憑空捏造（對應第二項）。\n・風格強化 ＝ RLHF（人類回饋強化學習） ➔ 「人類教練打分數，讓 AI 說得更好」：\n  ・透過人類專家對回答品質評分，讓 AI 不只是學會說話，而是「說得更好、更合乎禮貌與價值觀」。\n\n【🔑 正確選項秒殺題眼】\n・模擬個性化、不用翻新整棟大樓只在關鍵樓層裝活動式隔間（個性強化） ➔ 秒選 LoRA\n・外接最新知識庫查資料防幻覺（知識型強化） ➔ 秒選 RAG\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：RLHF 是風格強化（讓 AI 說得更好）；語法分析器（Parser） 是用來將程式碼轉成抽象語法樹（AST）以強化理解程式上下文邏輯。\n・✅ (B) 為什麼對：第一項個性強化對應 LoRA，第二項知識型強化對應 RAG，順序與定義完全正確。\n・❌ (C) 為什麼錯：將 LoRA 與 RAG 的前後順序寫反了（審題務必看清楚題目問的先後順序！）。\n・❌ (D) 為什麼錯：批次正規化 是解決深層網路梯度消失的訓練技巧；思維樹（ToT） 是提示工程的多路徑回溯推理框架。", "has_caveat": 0, "caveat_note": null}, {"id": 264, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某醫學中心與智慧工廠共同導入「變分自編碼器（VAE, Variational Autoencoder）」來協助日常研究與產線監控。關於 VAE 的運作機制、核心優勢與限制，下列哪一位工程師的說明最正確？", "option_a": "工程師甲：「VAE 的編碼器（Encoder）會把輸入的照片壓縮成一個死板的『單一固定數值密碼』，這樣解碼器才能 100% 複製出完全一模一樣的原圖。」", "option_b": "工程師乙：「VAE 扮演『壓縮師＋重建師』，編碼器會將資料轉成潛在變數 z 的『平均值與變異數（機率分佈）』，再隨機抽樣還原；它常用於修補圖像缺失、生成稀有病症醫療合成資料及工廠故障預測，缺點是生成的圖像邊緣較模糊。」", "option_c": "工程師丙：「VAE 是由生成器與判別器互相博弈對抗組成，最常見的致命缺陷是『模式崩潰（Mode Collapse）』與大語言模型的『幻覺』。」", "option_d": "工程師丁：「VAE 專屬於 1990 年代的鑑別式 AI，只能用來做是非二元分類，完全不具備生成新資料的能力。」", "correct_option": "B", "explanation": "・📍 對應重點章節：1.4 VAE GAN 與 Seq2Seq\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們把傳統自編碼器（AE）與變分自編碼器（VAE）比喻成兩種不同的畫師：\n・傳統 AE（死板影印機）：\n  ・把一隻貓的照片壓縮成固定密碼 88（單一固定數值），還原時只能死板印出原本那隻貓，沒辦法創造新貓咪。\n・變分自編碼器 VAE（掌握配方範圍的「壓縮師＋重建師」）：\n  ・步驟 1（編碼器壓縮）：把貓咪照片轉成潛在變數 z 的「平均值與變異數（Mean and Variance 機率分佈範圍）」（⚠️ 絕對不是固定數值！）。\n  ・步驟 2（隨機抽樣＋解碼器重建）：從這個機率範圍裡隨機抽樣一個點還原成圖片，因此既能保留貓咪結構，又能畫出帶點變化的全新貓咪！\n  ・3 大招牌應用：① 修補影片或圖像破洞缺失、② 醫療合成資料生成（罕見疾病）、③ 工廠故障預測（學會正常分佈後抓異常）。\n  ・唯一小缺點：因為追求平均穩健，畫出來的圖片邊緣常帶有「柔焦模糊感（Blurry）」。\n\n【🔑 正確選項秒殺題眼】\n・看到 VAE 編碼器輸出 ➔ 秒選 「平均值與變異數（機率分佈，非固定數值）」\n・看到 VAE 三大應用與缺點 ➔ 修補缺失、醫療合成資料、工廠故障預測；缺點是 「圖像較模糊」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：壓成「單一固定數值」是傳統 AE；VAE 輸出的是「機率分佈（平均值與變異數）」。\n・✅ (B) 為什麼對：完整且精準地描述了 VAE 的機率分佈抽樣機制、三大實務應用與圖像較模糊的限制。\n・❌ (C) 為什麼錯：「生成器＋判別器對抗」與「模式崩潰」是 GAN 的特徵；「幻覺」則是 LLM 的缺陷，切勿張冠李戴！\n・❌ (D) 為什麼錯：VAE 是 2014 年分水嶺的代表性「生成式 AI」模型（屬非監督式學習）。", "has_caveat": 0, "caveat_note": null}, {"id": 265, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國公關公司需要為客戶製作一份高水準的年度品牌提案簡報（PPT），主管指示團隊採用目前職場最有效率的「三段式 AI 簡報生成工作流」：先用工具甲進行「內容構想與大綱發想」，接著將大綱丟進工具乙進行「結構與卡片式自動編排生成簡報草稿」，最後再匯入工具丙強化「設計與視覺美感」。此外，若另一份簡報特別強調「複雜數據圖表的自動智慧排版」，則可改用工具丁。\n請問上述工具甲、乙、丙、丁依序最可能為下列哪一組工具？", "option_a": "工具甲：Canva ／ 工具乙：ChatGPT ／ 工具丙：Gamma ／ 工具丁：Tome", "option_b": "工具甲：ChatGPT ／ 工具乙：Gamma ／ 工具丙：Canva ／ 工具丁：Beautiful.ai", "option_c": "工具甲：QuillBot ／ 工具乙：ElevenLabs ／ 工具丙：Midjourney ／ 工具丁：Zapier", "option_d": "工具甲：ChatGPT ／ 工具乙：Notion ／ 工具丙：Figma ／ 工具丁：Grammarly", "correct_option": "B", "explanation": "・📍 對應重點章節：3.5 簡報生成流程與工具組合\n\n【💡 生活化範例 ／ 具體情境秒懂】\n職場做 AI 簡報就像蓋房子裝潢，四大簡報相關工具各有專屬強項：\n・第 1 棒 ChatGPT（企劃軍師）：\n  ・負責最前面的「內容構想」，幫你想好整份簡報要講什麼大綱（對應工具甲）。\n・第 2 棒 Gamma（結構施工隊長）：\n  ・目前最主流的 AI 簡報工具，專責「內容構想與卡片式結構自動編排」，輸入大綱 1 分鐘自動排出整份簡報草稿（對應工具乙）。\n・第 3 棒 Canva（室內美學設計師）：\n  ・專責「設計與視覺美感」，提供海量精美素材與排版美化，與 Gamma 搭配性最佳（對應工具丙）。\n・延伸雙雄：Tome vs Beautiful.ai：\n  ・Tome：強調「敘事的連貫（說故事）」。\n  ・Beautiful.ai：強調「圖表的排版」（對應工具丁）。\n\n【🔑 正確選項秒殺題眼】\n・三段式簡報工作流 ➔ 內容構想用 ChatGPT ➔ 結構編排用 Gamma ➔ 視覺美感用 Canva\n・強調敘事連貫 ➔ 選 Tome ｜ 強調圖表排版 ➔ 選 Beautiful.ai\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：把三段式工作流的順序（ChatGPT ➔ Gamma ➔ Canva）搞混了，且 Tome 強項是「敘事連貫」而非「圖表排版」。\n・✅ (B) 為什麼對：精準對應 ChatGPT ➔ Gamma ➔ Canva 工作流，以及專攻圖表排版的 Beautiful.ai。\n・❌ (C) 為什麼錯：QuillBot 是英文改寫、ElevenLabs 是語音合成、Zapier 是工作流自動化，皆非簡報生成工具。\n・❌ (D) 為什麼錯：Figma 是 App/網頁 UI/UX 介面設計工具，Grammarly 是英文文法檢查工具。", "has_caveat": 0, "caveat_note": null}, {"id": 266, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某電商公司的資料科學家正在清理一份包含 10,000 筆會員資料的問卷表格，準備用來訓練神經網路模型。他在檢查資料時發現以下三個狀況：\n1. 「婚姻狀況 / 職業」這種文字類別型欄位有少數幾筆漏填。\n2. 「年收入」這個數值欄位中，有幾筆因為富豪客戶而出現極端偏高的數值，另有少數幾筆漏填。\n3. 為了將不同單位的數值特徵餵入神經網路，他需要將所有數據按比例壓縮到 0 ～ 1 的同一個範圍內。\n請問針對狀況 1 的缺失值填補、狀況 2 含極端值的缺失值填補，以及狀況 3 的數值縮放技術，依序應採用下列何種方法？", "option_a": "狀況 1：用平均數填補 ／ 狀況 2：直接刪除整欄 ／ 狀況 3：L1/L2 正則化（Regularization）", "option_b": "狀況 1：用眾數填補 ／ 狀況 2：用中位數填補 ／ 狀況 3：正規化（Normalization）", "option_c": "狀況 1：用中位數填補 ／ 狀況 2：用眾數填補 ／ 狀況 3：標準化（Standardization）", "option_d": "狀況 1：用平均數填補 ／ 狀況 2：用平均數填補 ／ 狀況 3：主成分分析（PCA）", "correct_option": "B", "explanation": "・📍 對應重點章節：1.12 資料基本概念 收集清理與前處理\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用日常生活的例子把「缺失值填補口訣」與「正規化 vs 標準化」一次搞懂：\n・缺失值填補 3 大口訣（看資料長相決定怎麼補）：\n  ・一般常態數值（如一般人身高） ➔ 用 「平均數」 補。\n  ・有極端值的數值（如年收入有億萬富翁拉高平均，對應狀況 2） ➔ 用排在最中間的 「中位數」 補，才不會被富豪帶偏！\n  ・文字類別型資料（如性別、職業、婚姻，對應狀況 1） ➔ 文字算不出平均數！只能用出現最多次的 「眾數」 補！\n・數值縮放雙雄（正規化 vs 標準化）：\n  ・正規化（Normalization，對應狀況 3）：把所有數字按比例壓進 0 ～ 1 同一個範圍，最適合非常態分佈與神經網路。\n  ・標準化（Standardization）：把資料調整成 平均值 = 0、標準差 = 1 的常態分佈，適合 K-NN 與 SVM。\n\n【🔑 正確選項秒殺題眼】\n・文字類別型缺失值 ➔ 秒選 「眾數」（類別算不出平均數！）\n・含極端值之數值缺失 ➔ 秒選 「中位數」\n・將所有數據按比例壓縮到同一範圍（0 ～ 1） ➔ 秒選 「正規化（Normalization）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：職業、婚姻等文字類別資料無法計算「平均數」；且在損失函數加懲罰項防過擬合的才叫「正則化（Regularization）」。\n・✅ (B) 為什麼對：類別用眾數、極端值用中位數、壓縮至 0 ～ 1 為正規化（Normalization），完全正確。\n・❌ (C) 為什麼錯：把眾數與中位數用反了，且調整為平均值 0、標準差 1 的才叫「標準化（Standardization）」。\n・❌ (D) 為什麼錯：PCA（主成分分析） 是用來把上百個欄位濃縮成少數核心指標的「資料縮減（降維）」技術，而非數值範圍縮放。", "has_caveat": 0, "caveat_note": null}, {"id": 267, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某大學法學院教授想要利用 AI 工具整理他自己收集的 30 份臺灣最新判例 PDF 檔案。他希望這款工具「嚴格只根據他上傳的這 30 份 PDF 內容來回答問題，絕不拿網路上未經查證的外部資料亂掰」，而且還能將這 30 份判例重點「一鍵自動生成一段由兩位 AI 主持人自然對談的 Podcast 語音摘要（Audio Overview）」供學生通勤時收聽。\n請問這位教授最適合選用下列哪一款工具？", "option_a": "Google 的 NotebookLM（Gemini Notebook）", "option_b": "OpenAI 的 DALL·E 3", "option_c": "Perplexity AI", "option_d": "Cognition Labs 的 Devin", "correct_option": "A", "explanation": "・📍 對應重點章節：5.1 文本與對話語言模型 (LLMs)\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們來比較這幾款熱門 AI 工具的「招牌絕活」：\n・Google NotebookLM（你的專屬私人研究助理＋雙人廣播電台）：\n  ・絕活 1（專屬知識庫 RAG）：你丟給它哪幾份 PDF、講義或筆記，它就嚴格只根據你上傳的來源回答，並標註引用段落，大幅降低無中生有的幻覺。\n  ・絕活 2（Audio Overview 語音摘要）：能把枯燥的長篇講義，一鍵變成兩位 AI 主持人一搭一唱的雙人對談 Podcast 語音摘要！\n・Perplexity AI（即時連網搜尋引擎）：\n  ・強項是去「公開網際網路」搜尋最新科技動態並附上網址，而不是封閉鎖定在你的私人筆記轉雙人 Podcast。\n\n【🔑 正確選項秒殺題眼】\n・看到「基於用戶上傳來源之個人化知識庫 RAG 筆記 ＋ 自動生成雙人對談 Podcast 語音摘要（Audio Overview）」 ➔ 秒選 Google 的 NotebookLM！\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・✅ (A) 為什麼對：NotebookLM 正是 Google 推出、專攻上傳私有文獻 RAG 問答與一鍵生成雙人 Podcast 語音摘要的代表工具。\n・❌ (B) 為什麼錯：DALL·E 3 是 OpenAI 的靜態文字生圖片工具，無法解析 PDF 或生成語音。\n・❌ (C) 為什麼錯：Perplexity AI 主打公開網路即時搜尋與引用網址彙整，並非私人筆記雙人 Podcast 生成工具。\n・❌ (D) 為什麼錯：Devin 是號稱全球首款的「自主 AI 軟體工程師」，專門用來寫程式、除錯與部署軟體。", "has_caveat": 0, "caveat_note": null}, {"id": 268, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某金控銀行的 AI 審核系統拒絕了客戶「張先生」的房屋貸款申請。張先生打電話到客服中心抗議，要求銀行明確告知「為什麼針對我這一筆申請做出拒貸決定？」；與此同時，銀行內部的風險管理長則要求資料科學團隊提交一份全局報告，說明在整個 AI 模型中，「全體客戶的年收入、信用評分、負債比、年齡等各個特徵，在整體決策中各自佔了多少百分比的貢獻度？」\n為了分別滿足「向張先生解釋單一筆預測結果」與「向風控長報告整體特徵貢獻度分配」，技術團隊依序應採用哪兩種可解釋人工智慧（XAI）工具？", "option_a": "前者採用 SHAP ／ 後者採用 LIME", "option_b": "前者採用 LIME ／ 後者採用 SHAP", "option_c": "前者採用 Word2Vec ／ 後者採用 ResNet", "option_d": "前者採用 Kaggle ／ 後者採用 Hugging Face", "correct_option": "B", "explanation": "・📍 對應重點章節：4.5 模型可解釋性 LIME vs SHAP ＆ 5.6 資料科學與開源社群平台\n\n【💡 生活化範例 ／ 具體情境秒懂】\n要破解 AI「黑箱問題」，LIME 與 SHAP 是最常考的兩大 XAI 神器，記住它們的英文字首與比喻就絕不會混：\n・LIME（Local 局部放大鏡 ➔ 只看「張先生這單一筆」為什麼沒過）：\n  ・L 代表 Local（局部）！就像行員拿著放大鏡只看「張先生這一張申請表」，分析為什麼張先生這筆被拒（對應前者需求）。\n・SHAP（Shapley 賽局理論拔河分功勞 ➔ 算「整體每個特徵各佔多少貢獻」）：\n  ・基於合作賽局理論（像拔河比賽贏了之後，算每個人各出了幾分力），能算出整個模型裡「收入佔 50%、信用佔 30%、年齡佔 20%」的整體特徵貢獻度分配（對應後者需求）。\n\n【🔑 正確選項秒殺題眼】\n・看到「單一筆預測結果、局部解釋（Local）」 ➔ 秒選 LIME\n・看到「整體特徵貢獻度分配、基於合作賽局理論」 ➔ 秒選 SHAP\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：把 LIME（單筆局部）與 SHAP（整體特徵貢獻）的位置顛倒了，這是考場最常見的記憶混淆陷阱！\n・✅ (B) 為什麼對：單筆拒貸解釋用 LIME、全局特徵貢獻度分配用 SHAP，完全正確。\n・❌ (C) 為什麼錯：Word2Vec 是靜態詞向量技術，ResNet 是解決深層網路梯度消失的殘差網路，皆非模型可解釋性（XAI）工具。\n・❌ (D) 為什麼錯：Kaggle 與 Hugging Face 是模型與資料集共享社群平台，並非用來拆解黑箱特徵貢獻的 XAI 演算法。", "has_caveat": 1, "caveat_note": "SHAP 本身也能解釋單筆預測（局部解釋），並非只能做整體貢獻度；「LIME＝單筆、SHAP＝全局」是筆記的簡化分工，依此作答即可。"}, {"id": 269, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某研發團隊在訓練一個高達 100 層的深層神經網路時，遇到了嚴重的「梯度消失（Vanishing Gradient）」問題——在反向傳播過程中，誤差修正訊號傳到越前面的網路層就越微弱，導致前面的層根本學不動。\n為了讓訓練過程穩定下來並解決梯度消失，總工程師列出了以下四項技術方案，請問哪一項方案的配對與原理解釋完全正確？", "option_a": "改用「殘差網路（ResNet）」，透過跳接結構（Skip Connection）搭一條跨層捷徑，讓梯度能直接傳回最前面；並搭配「批次正規化（Batch Normalization）」每次對一小批資料（mini-batch）把數值拉回穩定範圍", "option_b": "將啟動函數從 ReLU 改回傳統的 Sigmoid，並將啟動函數當作模型內部可訓練的權重參數，用梯度下降不斷修改啟動函數的公式", "option_c": "在損失函數（Loss Function）裡面加上強烈的懲罰項（L1/L2 正則化），並使用 Dropout 隨機關掉一半的神經元，這樣就能把消失的梯度放大十倍", "option_d": "將模型的層數直接砍到只剩「單層感知器（Perceptron）」，並改用「線性判別分析（LDA）」作為神經網路的最佳化器來更新權重", "correct_option": "A", "explanation": "・📍 對應重點章節：1.10 模型最佳化 訓練技巧與過擬合\n\n【💡 生活化範例 ／ 具體情境秒懂】\n當神經網路蓋得像 100 層摩天大樓，一樓算出的修正訊號傳到頂樓早就沒力了（梯度消失）。這時要靠 「AI 模型訓練 5 大穩定技巧」 來救場：\n・技巧 1 啟動函數（Activation Function）：把容易讓訊號歸零的 Sigmoid 換成 ReLU（⚠️ 記住：啟動函數是固定的非線性轉換開關，不是參數！）。\n・技巧 2 最佳化器（Optimizer）：請聰明領航員（SGD / Momentum / RMSprop / Adam / AdaGrad）負責更新參數。\n・技巧 3 批次正規化（Batch Normalization, BN）：對每一小批資料（mini-batch）先整隊，把數值拉回穩定範圍。\n・技巧 4 殘差網路（ResNet）：蓋一座「跨樓層直達電梯（跳接結構 Skip Connection）」，讓梯度訊號直接傳回最前面！\n・技巧 5 權重初始化（Weight Initialization）：起跑前先把初始權重設得剛剛好。\n\n【🔑 正確選項秒殺題眼】\n・解決「神經網路太多層、梯度無法有效傳回最前面」 ➔ 秒選 殘差網路（ResNet）\n・對一小批資料（mini-batch）做數值穩定調整 ➔ 秒選 批次正規化（Batch Normalization）\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・✅ (A) 為什麼對：精準描述了 ResNet（解決多層梯度傳不回最前面）與 批次正規化 BN（對 mini-batch 資料穩定數值）的作用。\n・❌ (B) 為什麼錯：為防梯度消失應從 Sigmoid 改用 ReLU（而非改回 Sigmoid）；且啟動函數絕對不是可訓練的模型參數！\n・❌ (C) 為什麼錯：在損失函數加懲罰項的 L1/L2 正則化 與 Dropout，是用來對付「梯度爆炸（參數暴衝）」與「過擬合（死背考古題）」的煞車神器，不是用來放大消失梯度的！\n・❌ (D) 為什麼錯：LDA 是降維演算法，不是最佳化器；且砍成單層感知器會連基本非線性問題都學不會（欠擬合）。", "has_caveat": 0, "caveat_note": null}, {"id": 270, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某行銷團隊希望將日常工作流程自動化：當客戶在網頁表單填寫詢問單後，系統能自動將表單內容同步寫入 Google Sheets 表格、將附件檔案儲存至雲端硬碟，並在 Slack 頻道傳送通知給業務代表。於是團隊導入了知名的無程式碼（No-Code）自動化串接工具 Zapier。\n然而，在實際運行一週後，主管發現有一項進階任務單靠 Zapier 本身的自動化規則根本無法完成。請問這項 Zapier 無法獨立完成的任務最可能是下列何者？", "option_a": "在收到新表單時自動傳送即時通知訊息給指定群組", "option_b": "將電子郵件中的附件自動下載並儲存至指定的雲端資料夾", "option_c": "將不同平台的客戶名單自動同步更新至雲端試算表表格", "option_d": "完整理解客戶在長篇抱怨信中的深層語意與反諷情緒，並無中生有撰寫出一篇具同理心的安撫回信", "correct_option": "D", "explanation": "・📍 對應重點章節：3.7 數據分析 視覺化與自動化工具 ＆ 5.5 程式輔助與工作流程自動化\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們把 Zapier 比喻成工廠裡的「全自動機械輸送帶」：\n・輸送帶擅長做的事（基於固定規則 如果發生 A ➔ 就執行 B）：\n  ・① 傳送通知（對應選項 A）：叮咚！有新信件就發 LINE / Slack 通知。\n  ・② 儲存檔案（對應選項 B）：把附件自動搬進 Google Drive 資料夾。\n  ・③ 同步表格（對應選項 C）：把表單資料自動抄進 Excel / Google Sheets。\n・輸送帶做不到的事（對應選項 D）：\n  ・輸送帶沒有裝「大腦（大語言模型 LLM）」，它看不懂人類文章裡的弦外之音，因此「無法完整理解語意」！\n\n【🔑 正確選項秒殺題眼】\n・考題問「自動化工具 Zapier 無法完成下列何項任務？」 ➔ 秒選 「完整理解語意」！\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼不選：「傳送通知」是 Zapier 最經典的三大擅長功能之一。\n・❌ (B) 為什麼不選：「儲存檔案」是 Zapier 最經典的三大擅長功能之一。\n・❌ (C) 為什麼不選：「同步表格」是 Zapier 最經典的三大擅長功能之一。\n・✅ (D) 為什麼是正解：Zapier 本質為規則觸發的跨平台串接工具，本身無法完整理解語意（除非額外串接 ChatGPT 等 LLM API）。", "has_caveat": 0, "caveat_note": null}, {"id": 271, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "一位潮牌服飾設計師想利用生成式 AI 工具設計新款 T 恤與宣傳海報。他最大的痛點是：過去使用一般 AI 生圖工具時，只要要求在畫面中的霓虹燈招牌或 T 恤胸口印上特定的英文品牌標語（例如 \"CYBER COFFEE 2026\"），AI 畫出來的英文字母常常會拼錯、扭曲變形或變成鬼畫符。\n如果這位設計師最需要的是「在生成的圖片中，精準且漂亮地嵌入排版文字（Typography）」，請問他最應該選用下列哪一款圖片生成工具？", "option_a": "Ideogram AI", "option_b": "Google DeepDream", "option_c": "remove.bg", "option_d": "TurboScribe", "correct_option": "A", "explanation": "・📍 對應重點章節：3.2 圖片生成工具與應用\n\n【💡 生活化範例 ／ 具體情境秒懂】\n多數早期擴散模型都是把文字當成「圖案線條」在畫，所以常拼錯英文字；但 Ideogram AI 就像一位「精通字體排版（Typography）的海報招牌大師」：\n・Ideogram AI（圖片嵌字王）：\n  ・最大招牌強項就是能在生成的海報、Logo、貼紙或 T 恤圖案裡，精準拼出正確且具設計感的排版文字（Typography）！\n・其他視覺工具對照：\n  ・Google DeepDream：早期基於 CNN 的視覺化工具，專門把圖片變成「滿滿狗頭或眼睛的迷幻、超現實藝術風格」。\n  ・remove.bg / Photoroom：專門用來「1 秒自動去背」的修圖工具。\n\n【🔑 正確選項秒殺題眼】\n・看到「在圖片中精準生成排版文字（Typography）、適合海報 / Logo / T恤設計」 ➔ 秒選 Ideogram AI！\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・✅ (A) 為什麼對：Ideogram AI 是目前公認在圖像內精準渲染排版文字（Typography）能力最強的代表性生圖工具。\n・❌ (B) 為什麼錯：DeepDream 是 Google 早期基於 CNN 的迷幻超現實藝術風格轉換工具，不擅長文字排版生成。\n・❌ (C) 為什麼錯：remove.bg 是影像分割自動去背工具，無法從零生成海報與排版文字。\n・❌ (D) 為什麼錯：TurboScribe 是基於 Whisper 的 AI 語音轉文字（逐字稿）工具，與圖片生成無關。", "has_caveat": 0, "caveat_note": null}, {"id": 272, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某串流媒體平台打算訓練一個能處理「超長篇懸疑小說有聲書」的序列神經網路，用來根據前文自動生成語音摘要與翻譯。工程團隊發現，如果使用最傳統的循環神經網路（RNN），因為它沒有任何篩選門控機制，當句子太長時，反向傳播的誤差訊號會發生指數級衰減（梯度消失），把小說開頭埋下的伏筆忘得一乾二淨。\n為了解決這個「長期依賴（Long-term Dependencies）」遺忘問題，團隊考慮改用 LSTM（長短期記憶模型） 或 GRU（門控循環單元）。關於這兩種改良模型的結構與特性比較，下列敘述何者正確？", "option_a": "LSTM 內部裝有 2 個門控（更新門、重置門），結構最輕量簡單；GRU 內部則裝有 3 個門控（遺忘門、輸入門、輸出門），參數量最多且運算最慢", "option_b": "LSTM 內部裝有 3 個門控（遺忘門、輸入門、輸出門）與細胞狀態，能有效解決長期依賴問題但結構較繁重；GRU 則是將結構精簡為 2 個門控（更新門、重置門）的輕量加速版", "option_c": "LSTM 與 GRU 已經徹底廢除了循環連結與時序順序概念，改用卷積層（Convolutional Layer）與池化層來掃描二維影像網格", "option_d": "傳統 RNN 的參數量比 LSTM 多出三倍，因此傳統 RNN 永遠不會發生梯度消失，只有 LSTM 才會忘記長句開頭", "correct_option": "B", "explanation": "・📍 對應重點章節：1.3 RNN LSTM 與 GRU\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「機場安檢門與輕量行李箱」來區分序列模型三代演進（RNN ➔ LSTM ➔ GRU）：\n・第 1 代 傳統 RNN（沒裝開關門的傳聲筒）：\n  ・0 個門！不管重要還是廢話全部往後傳，句子一長誤差訊號指數級衰減（梯度消失），開頭講什麼必忘光。\n・第 2 代 LSTM（裝了 3 道嚴格安檢門＋長途傳送帶）：\n  ・裝了 3 個門（遺忘門扔掉舊垃圾、輸入門放行新重點、輸出門決定當下說什麼）＋ 細胞狀態，徹底解決長句遺忘（長期依賴關係），但缺點是 3 道門檢查太繁重、算比較慢。\n・第 3 代 GRU（精簡成 2 道門的輕量加速版）：\n  ・工程師幫 LSTM 瘦身，把 3 道門合併精簡成 2 個門（更新門 Update Gate、重置門 Reset Gate），一樣記得住長句重點，但參數更少、算得更快！\n\n【🔑 正確選項秒殺題眼】\n・LSTM ＝ 3 個門（遺忘、輸入、輸出）＋ 解決長期依賴（較複雜繁重）\n・GRU ＝ 2 個門（更新、重置）＋ LSTM 的瘦身簡化加速版\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：把 LSTM（3 個門）與 GRU（2 個門）的門控數量與複雜度完全記反了（高頻陷阱！）。\n・✅ (B) 為什麼對：清楚點出 LSTM 為 3 個門解決長期依賴，GRU 為 2 個門的輕量簡化版。\n・❌ (C) 為什麼錯：卷積層與池化層是 CNN 處理空間影像的機制；LSTM 與 GRU 依然是處理時間序列的循環網路變體。\n・❌ (D) 為什麼錯：傳統 RNN 無門控、參數最少，最容易發生梯度消失而忘記長句開頭。", "has_caveat": 0, "caveat_note": null}, {"id": 273, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國生技醫療集團正在美國、歐盟與臺灣三地同步收集患者的臨床健康數據，準備用於訓練醫療輔助 AI 模型。為了避免觸犯各國嚴格的資料隱私法規，法務長在合規會議上針對 歐盟《GDPR》、美國《HIPAA》 與 臺灣《個人資料保護法（PDPA）》 進行規範說明。請問下列哪一項法規說明完全正確？", "option_a": "美國《HIPAA》專門保護醫療與健康資料，但法規規定「只要將患者病歷印出來保存在紙質檔案中，或是將患者資料公開於學術網站」，就完全免受 HIPAA 規範，且商業用途一律不受限制", "option_b": "歐盟《GDPR》要求取得當事人「明確同意」並保障「被遺忘權（刪除權）」，違規最高可處全球年度營收 4%；美國《HIPAA》要求「使用加密技術保護患者資料」；臺灣《個資法》第 5 條規範明確告知目的、第 11 條保障當事人查詢與請求停止利用或刪除權", "option_c": "為了讓 AI 訓練效果最好，企業應違反「數據最小化」原則，在辦一般網站會員時強制要求用戶填寫身分證字號、血型、祖譜與銀行密碼，收越多越好", "option_d": "在進行「資料加密」保護時，鎖門與開門都使用「同一把金鑰」的技術稱為「非對稱加密」；分成公開金鑰與私密金鑰兩把不同鑰匙的則稱為「對稱加密」", "correct_option": "B", "explanation": "・📍 對應重點章節：4.4 資料治理 四大隱私保護策略與隱私法規\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們把全球三大隱私法規與加密策略拆成四條必背鐵則：\n・1. 歐盟 GDPR（全球最兇個資法）：\n  ・核心：明確同意 ＋ 被遺忘權（要求刪除個資的權利）；罰則高達全球年度營收 4%！\n・2. 美國 HIPAA（專管醫院病歷與健康資料 PHI）：\n  ・核心：強制要求「使用加密技術保護患者資料」與嚴格存取控制（無論商業或非商業用途皆嚴格受管！）。\n・3. 臺灣 個資法（PDPA）（必記第 5 條與第 11 條）：\n  ・第 5 條：誠實信用原則，明確告知蒐集目的且不逾越必要範圍。\n  ・第 11 條：當事人可請求查詢、更正、停止蒐集處理利用或刪除。\n・4. 對稱加密 vs 非對稱加密：\n  ・對稱加密：鎖門跟開門用「同一把鑰匙」（像自家大門鑰匙）。\n  ・非對稱加密：分「公開金鑰（郵筒投信口，大家都能鎖）＋ 私密金鑰（郵差鑰匙，只有本人能開）」。\n\n【🔑 正確選項秒殺題眼】\n・歐盟 GDPR ➔ 明確同意、被遺忘權、最高罰全球營收 4%\n・美國 HIPAA ➔ 醫療健康資料、使用加密技術保護患者資料\n・臺灣 個資法 ➔ 第 5 條（告知目的）、第 11 條（查詢/停止利用/刪除權）\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：這是 HIPAA 最常考的三大誘答陷阱！HIPAA 嚴格禁止將患者資料公開，且無論電子或紙質、商業或非商業用途皆受嚴格保護。\n・✅ (B) 為什麼對：完整且正確地配對了歐盟 GDPR、美國 HIPAA 與臺灣個資法第 5、11 條的核心規定。\n・❌ (C) 為什麼錯：四大隱私保護策略中的「數據最小化（Data Minimization）」強調只收集必要最少量資料，收越少敏感資料、外洩風險越低。\n・❌ (D) 為什麼錯：把「對稱加密（同一把金鑰）」跟「非對稱加密（公鑰＋私鑰）」的定義完全講反了！", "has_caveat": 1, "caveat_note": "選項B所述「臺灣《個資法》第5條規範明確告知目的」不精確：第5條為誠實信用與不得逾越特定目的必要範圍原則，告知義務規定於第8、9條。其餘選項錯誤明顯，B仍為最佳答案。"}, {"id": 274, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某智慧醫院與自駕車研發中心正在盤點「深度學習網路架構」與「機器學習五大學習範式」。在技術研討會上，四位研發主管分別提出了以下觀點，請問哪一位主管的說法完全正確？", "option_a": "主管甲：「像 GPT 玩文字接龍、BERT 玩遮字克漏字這種不需要人工逐筆標註，而是把文章遮住一部分讓資料『自己生出考題與答案』來海量練功的方式，屬於『自監督學習（Self-Supervised Learning）』，是現代 LLM 預訓練的核心。」", "option_b": "主管乙：「『邏輯迴歸（Logistic Regression）』因為名字裡有迴歸兩個字，所以專門用來預測連續變化的房價金額，絕對不能用來做垃圾郵件的是非二元分類。」", "option_c": "主管丙：「『KNN（K-最近鄰）』與『K-Means（K-均值分群）』兩者都屬於完全沒有標籤的非監督式分群演算法。」", "option_d": "主管丁：「訓練 AlphaGo 下圍棋或機器人學走路時，最常使用的是需要人工事先標註好一億張標準答案照片的『監督式學習』。」", "correct_option": "A", "explanation": "・📍 對應重點章節：1.13 五大學習範式與經典演算法\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們把這題考到的四個超常考觀念一行一個拆解清楚：\n・1. 自監督學習（Self-Supervised Learning）（對應選項 A）：\n  ・網路上有幾百億篇文章，要請人類一個字一個字標註太貴了！聰明的工程師把句子的最後一個字遮起來讓 GPT 猜（文字接龍），或挖空中間字讓 BERT 猜（克漏字）——不用人工標籤，資料自己生出答案來練功，這就是 LLM 預訓練的核心！\n・2. 邏輯迴歸（Logistic Regression）的名字陷阱（對應選項 B）：\n  ・名字雖然叫「迴歸」，但它其實是做「是非題二元分類」（例如：判斷這封信「是 / 不是」垃圾信，輸出 0 ～ 1 的機率），絕對不是預測連續數值的迴歸！\n・3. 雙 K 對決：KNN vs K-Means（對應選項 C）：\n  ・KNN（K-最近鄰）：有標籤（監督式分類）！看離你最近的 K 個鄰居是什麼身分，你就跟他們同類。\n  ・K-Means（K-均值）：無標籤（非監督式分群）！自動把長得像的客群聚成 K 小隊。\n・4. 強化學習（RL）（對應選項 D）：\n  ・像訓練小狗或打電動，沒有標準答案標籤，全靠環境給「獎勵加分／懲罰扣分」摸索出最高分策略（代表：AlphaGo 下圍棋、機器人控制）。\n\n【🔑 正確選項秒殺題眼】\n・無人工標籤、資料自產考題與答案、GPT / BERT 預訓練核心 ➔ 秒選 自監督學習（Self-Supervised Learning）\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・✅ (A) 為什麼對：精準定義了自監督學習的運作方式及其作為 LLM（GPT、BERT）預訓練核心的地位。\n・❌ (B) 為什麼錯：邏輯迴歸是「監督式二元分類器」，並非連續數值迴歸（經典名稱誘答陷阱！）。\n・❌ (C) 為什麼錯：KNN 是有標籤的監督式分類演算法；只有 K-Means 才是無標籤的非監督式分群演算法。\n・❌ (D) 為什麼錯：AlphaGo 下圍棋與機器人控制靠的是「獎懲回饋」的強化學習（RL），而非監督式學習。", "has_caveat": 0, "caveat_note": null}, {"id": 275, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某軟體開發公司為了提升工程師的寫程式效率，正在評估四款知名的 AI 編程輔助工具：\n1. 第一款是嵌入在 VS Code 等整合開發環境（IDE）中，在網頁前端開發時最常被用來根據註解「自動生成 HTML 與 CSS 結構」的結對編程外掛。\n2. 第二款是基於 VS Code 改造的獨立「AI 原生程式碼編輯器（AI-First IDE）」，支援「跨檔案全局理解，能用自然語言下令一次自動修改專案中十幾個關聯檔案」。\n3. 第三款是由 Google DeepMind 開發，專門用來解決高難度「程式設計競賽（Competitive Programming）」演算法題目的系統。\n4. 第四款是由 Amazon（AWS）推出，深度結合 AWS 雲端生態系與資安漏洞掃描的 B2B 企業級編程助手。\n請問上述第 1、2、3、4 款工具依序對應下列哪一組名稱？", "option_a": "1：Bard (Gemini) ／ 2：Notion AI ／ 3：Devin ／ 4：Amazon Bedrock", "option_b": "1：GitHub Copilot ／ 2：Cursor ／ 3：AlphaCode ／ 4：Amazon CodeWhisperer", "option_c": "1：Claude 3 ／ 2：GitHub Copilot ／ 3：Cursor ／ 4：AlphaCode", "option_d": "1：GitHub Copilot ／ 2：Devin ／ 3：Perplexity ／ 4：Hugging Face", "correct_option": "B", "explanation": "・📍 對應重點章節：3.6 程式生成應用與開發工具 ＆ 5.5 程式輔助與工作流程自動化\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們把軟體工程師最愛的「AI 寫程式工具家族」一行一個認清楚：\n・GitHub Copilot（Microsoft / GitHub 推出的 IDE 外掛助手）：\n  ・直接裝在 VS Code 裡面，認證考題只要問「網頁開發常用來自動生成 HTML 與 CSS 結構」，必選 Copilot！（對應第 1 款）。\n・Cursor（Anysphere 開發的 AI 原生程式碼編輯器 IDE）：\n  ・直接把整個 VS Code 改造成 AI 專屬編輯器，能看懂整個專案資料夾，一句話自動跨十幾個檔案同步改程式碼（對應第 2 款）。\n・AlphaCode（Google DeepMind 的程式競賽解題王）：\n  ・名字裡有 Alpha（像 AlphaGo），專門挑戰人類高難度「程式設計競賽（Competitive Programming）」（對應第 3 款）。\n・Amazon CodeWhisperer（AWS 企業雲端寫碼助手）：\n  ・名字有 Code（程式碼耳語者），是 AWS 專為企業 B2B 雲端開發與資安掃描打造的編程工具（對應第 4 款）。\n・*(補充：Devin 則是 Cognition Labs 推出、號稱全球首款的「自主 AI 軟體工程師」)*。\n\n【🔑 正確選項秒殺題眼】\n・網頁開發生成 HTML 與 CSS 結構 ➔ 秒選 GitHub Copilot\n・AI 原生 IDE 編輯器、跨檔案全局改碼 ➔ 秒選 Cursor\n・Google DeepMind 解決程式設計競賽問題 ➔ 秒選 AlphaCode\n・AWS 雲端 B2B 程式碼生成助手 ➔ 秒選 CodeWhisperer\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Bard (Gemini) 是通用對話模型、Notion AI 是筆記軟體（兩者常在 HTML/CSS 考題當誘答干擾項！）；Amazon Bedrock 是雲端基礎模型託管平台，寫程式外掛則是 CodeWhisperer。\n・✅ (B) 為什麼對：四款編程工具的開發商、核心定位與應用場景完全吻合。\n・❌ (C) 為什麼錯：Claude 3 是通用大語言模型，並非嵌入 IDE 的專用 HTML/CSS 補全外掛。\n・❌ (D) 為什麼錯：Perplexity 是 AI 搜尋引擎，Hugging Face 是開源模型社群，皆非程式競賽系統或 AWS 編程工具。", "has_caveat": 1, "caveat_note": "Amazon CodeWhisperer 已於2024年併入並更名為 Amazon Q Developer，考題仍沿用舊名。"}, {"id": 276, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在 2017 年 Google 發表《Attention Is All You Need》提出 Transformer 架構之前，自然語言處理領域主要依賴 RNN（循環神經網路） 與 Seq2Seq（序列到序列） 模型。請問 Transformer 架構是靠哪「三大突破絕招」徹底解決了 RNN 無法平行運算以及 Seq2Seq 單一向量長句失憶的瓶頸？", "option_a": "① 採用一個字一個字排隊慢讀的循環連結、② 將整篇文章硬壓縮進單一固定數值、③ 依靠池化層（Pooling Layer）濾除文字背景雜訊", "option_b": "① 一次性整句平行處理（捨棄逐字慢讀）、② 每個詞都擁有自己獨立的向量（不再用單一向量壓縮整句）、③ 搭載「自注意力機制（Self-Attention）」自動抓出句中重要詞彙與關聯", "option_c": "① 放棄所有向量表示法改用獨熱編碼（One-Hot）、② 完全取消位置順序資訊（不加位置編碼）、③ 改用支援向量機（SVM）取代神經網路", "option_d": "① 透過正向逐步加噪破壞文字、② 透過反向逐步去噪還原文字、③ 使用判別器（Discriminator）抓出假造的單字", "correct_option": "B", "explanation": "・📍 對應重點章節：1.5 Transformer 自注意力與解碼參數\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「全班排隊傳話 vs 老師把整句話投影在黑板上」來秒懂 Transformer 的三大突破絕招：\n・舊時代 RNN / Seq2Seq 的兩大悲劇：\n  ・像全班排成一列玩傳話遊戲，必須第 1 個人傳給第 2 個人（無法平行運算，超慢），而且最後要把整句話硬塞進「一張小紙條（單一固定向量）」，句子一長就忘光光！\n・新時代 Transformer 的三大絕招：\n  ・第 1 招「一次性整句平行處理」：老師直接把整句話投影在黑板上，全班同時抬頭看（發揮 GPU 平行算力，速度飛躍）！\n  ・第 2 招「每個詞都有自己獨立的向量」：不再把整句話硬塞進單一固定向量，每個字都有自己的專屬筆記本（搭配位置編碼 Positional Encoding 貼上順序號碼牌）。\n  ・第 3 招「搭載自注意力機制（Self-Attention）」：像讀 5,000 字報告拿螢光筆劃重點，讓句中每個詞跟其他所有詞互相比較算關聯（QKV），自動聚焦抓出關鍵字！\n\n【🔑 正確選項秒殺題眼】\n・看到 Transformer 三大突破絕招 ➔ 秒選 「① 一次性整句平行處理 ＋ ② 每個詞擁有獨立向量 ＋ ③ 自注意力機制自動抓出重要詞彙」！\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：逐字排隊慢讀是 RNN 的缺點、單一固定向量是 Seq2Seq 的瓶頸、池化層則是 CNN 的機制。\n・✅ (B) 為什麼對：完整且精確地列出了 Transformer 突破 RNN 與 Seq2Seq 的三大核心絕招。\n・❌ (C) 為什麼錯：Transformer 因為整句同時平行讀入，天生沒有詞序感，所以必須加上「位置編碼（Positional Encoding）」才能分辨誰前誰後；且生成式 AI 最常搭配的是自注意力機制而非 SVM。\n・❌ (D) 為什麼錯：正向加噪與反向去噪是 擴散模型（Diffusion） 的機制，判別器則是 GAN 的組件。", "has_caveat": 0, "caveat_note": null}, {"id": 277, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國智庫正在撰寫《全球人工智慧倫理與治理比較報告》，分析歐盟、美國、加拿大、日本、英國以及臺灣在 AI 監管路線與國家級計畫上的差異。關於各國的 AI 倫理架構特色，下列哪一項配對敘述最正確？", "option_a": "日本與英國為了徹底杜絕 AI 風險，雙雙反對使用軟性指導原則，並成為全球最早制定最嚴苛強制性刑事法規的國家", "option_b": "美國由國家標準與技術研究院（NIST）推出「AI 風險管理框架 1.0（AI RMF 1.0）」；加拿大特別關注「高風險 AI」並強制要求加強稽核與可追溯機制；日本與英國則皆主張採用「指導原則代替法律」的彈性治理路線", "option_c": "歐盟主張完全不立法律、採放任自由發展；而美國則是全球最早提出「可信賴的 AI 指南」並禁止一切商業 AI 模型的地區", "option_d": "臺灣由國科會（NSTC）主導開發的「TAIDE（可信任生成式 AI 對話引擎）」計畫，其底層核心技術本質是依賴「虛擬實境（VR）與區塊鏈挖礦演算法」", "correct_option": "B", "explanation": "・📍 對應重點章節：4.2 AI 倫理五大原則 各國架構與臺灣 TAIDE 計畫\n\n【💡 生活化範例 ／ 具體情境秒懂】\n各國政府管 AI 就像不同風格的家長，我們一行一個國家記住它的「招牌考題關鍵字」：\n・歐盟（EU）＝「嚴格校規領頭羊」：\n  ・全球最早提出「可信賴的 AI 指南」，並制定具強制力的《EU AI Act》四級風險法規。\n・美國（US）＝「專業風險體檢表」：\n  ・由 國家標準與技術研究院（NIST） 推出 「AI 風險管理框架 1.0（AI RMF 1.0）」，幫企業建立風險管理標準，兼顧創新。\n・加拿大（Canada）＝「高風險稽核盯人派」：\n  ・特別關注「AI 高風險」系統（AIDA 法案），強制要求加強「稽核與可追溯機制」。\n・日本 ＆ 英國 ＝「溫和勸導派（必考配對！）」：\n  ・怕法律訂太死會扼殺技術創新，兩國皆主張採用「指導原則代替法律」（軟性治理）。\n・臺灣（TAIDE 計畫）＝「本土繁中大腦」：\n  ・由 國科會（NSTC） 主導，技術本質為「機器學習（ML, Machine Learning）」！\n\n【🔑 正確選項秒殺題眼】\n・美國 ＝ NIST 推出 AI 風險管理框架 1.0\n・加拿大 ＝ 關注 高風險 AI、加強 稽核與可追溯機制\n・日本與英國 ＝ 主張採用 指導原則代替法律\n・臺灣 TAIDE ＝ 國科會主導、技術本質為 機器學習（ML）\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：日本與英國是最典型的「軟性治理」代表，主張用「指導原則代替法律」，而非制定最嚴苛強制法規。\n・✅ (B) 為什麼對：美國（NIST AI RMF 1.0）、加拿大（高風險稽核與可追溯）、日本與英國（指導原則代替法律）三組配對完全正確。\n・❌ (C) 為什麼錯：全球最早提出「可信賴的 AI 指南」並立強制法規的是歐盟，把歐盟與美國完全講反了。\n・❌ (D) 為什麼錯：臺灣 TAIDE 計畫是基於開源大語言模型微調，技術本質是「機器學習（ML）」，考試常拿 VR、區塊鏈或量子計算當誘答陷阱！", "has_caveat": 1, "caveat_note": "加拿大《人工智慧與數據法》(AIDA) 隨 C-27 法案於2025年1月國會休會而失效，「加拿大強制要求高風險AI稽核」的描述已過時；其餘選項錯誤明顯，B仍為最佳答案。"}, {"id": 278, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某自媒體創作者想將一篇部落格教學文章轉換成一段 5 秒鐘的 AI 短影音上傳至 Instagram Reels。根據「從句子到生成影片的 5 大標準步驟」，他首先輸入了文字提示詞（Step 1），並選擇了「賽博龐克動畫風格」（Step 2）。\n請問接下來他在 Step 3、Step 4、Step 5 依序應該執行什麼操作？且若他後續還想製作一支「由逼真 AI 虛擬主播對嘴播報多國語言新聞」的影片，最適合搭配哪一款數位人工具？", "option_a": "Step 3：加入字幕與語音 ➔ Step 4：預覽與輸出影片 ➔ Step 5：設定片長與比例；虛擬主播工具應選 DALL·E", "option_b": "Step 3：設定片長跟比例（如 4~5 秒，直式 9:16 或橫式 16:9） ➔ Step 4：加入字幕與語音 ➔ Step 5：預覽與輸出影片；虛擬主播對嘴工具首選 HeyGen 或 Synthesia", "option_c": "Step 3：訓練擴散模型權重 ➔ Step 4：執行反向傳播 ➔ Step 5：計算 BLEU 分數；虛擬主播工具應選 QuillBot", "option_d": "Step 3：設定片長為 120 分鐘長片 ➔ Step 4：使用 OCR 辨識字幕 ➔ Step 5：匯入 Kaggle；虛擬主播工具應選 Suno", "correct_option": "B", "explanation": "・📍 對應重點章節：3.4 影片生成流程與應用場景\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們把「用 AI 拍一支短片」的 5 大步驟流水線 與 5 大場景代表工具 順一次：\n・文生影片 5 大步驟（像去照相館拍動態寫真）：\n  ・Step 1 輸入提示詞：告訴 AI 畫面要有什麼。\n  ・Step 2 選擇影片風格：挑動畫、水墨、油畫風、像素或電影感。\n  ・Step 3 設定片長跟比例：單段通常設 4~5 秒，發 YouTube 設橫式 16:9、發 IG Reels / Shorts 設直式 9:16。\n  ・Step 4 加入字幕與語音：畫面生好後，配上旁白與字幕。\n  ・Step 5 預覽與輸出影片：檢查沒問題就匯出成品！\n・影片生成場景王牌配對：\n  ・虛擬角色說話（數位人對嘴播報） ➔ 首選 HeyGen、Synthesia！\n  ・簡報與教學影片 ➔ 首選 Lumen5、Synthesia。\n  ・社群短影音與特效剪輯 ➔ 首選 Runway、Pika、CapCut（剪映）。\n\n【🔑 正確選項秒殺題眼】\n・文生影片 5 步驟順序 ➔ ① 輸入提示詞 ➔ ② 選擇風格 ➔ ③ 設定片長(4~5秒)與比例(16:9或9:16) ➔ ④ 加入字幕與語音 ➔ ⑤ 預覽與輸出\n・虛擬角色說話（數位人對嘴） ➔ 秒選 HeyGen / Synthesia\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：把 Step 3（設定片長與比例）移到了最後一步，還沒設定畫面比例與秒數是無法先合成輸出影片的；且 DALL·E 是靜態圖片工具。\n・✅ (B) 為什麼對：Step 3～Step 5 順序完全正確，且精準配對數位人虛擬主播工具 HeyGen / Synthesia。\n・❌ (C) 為什麼錯：一般創作者使用生影片工具是推論應用，不需自己重訓模型權重或算反向傳播；且 QuillBot 是英文句子改寫工具。\n・❌ (D) 為什麼錯：目前文生影片工具單次生成片段多為 4~5 秒（Sora 最長約 60 秒），無法單次設定生成 120 分鐘電影長片；且 Suno 是 AI 音樂工具。", "has_caveat": 0, "caveat_note": null}, {"id": 279, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在探討網際網路內容生產模式的演進時，學者常將其分為 Web 1.0 的 PGC、Web 2.0 的 UGC，以及 Web 3.0 時代大爆發的 AIGC（人工智慧生成內容, Artificial Intelligence Generated Content）。\n某企業正在盤點內部導入的各項數位工具，請問下列哪一項技術或系統屬於真正的 AIGC 生成式應用？", "option_a": "大樓門禁系統使用「卷積神經網路（CNN）」進行員工臉部特徵萃取與身分比對分類", "option_b": "會計部門使用「光學字元辨識（OCR）」軟體，將紙本發票照片上的統編與金額掃描轉成電腦數位文字", "option_c": "行銷部門利用基於 Diffusion 與 Transformer 架構的模型，輸入一句廣告標語自動無中生有創作出全新的產品宣傳短片與配樂", "option_d": "新聞網站聘請專業記者團隊（PGC）與一般網友留言投稿（UGC），完全依靠人工撰寫專題報導", "correct_option": "C", "explanation": "・📍 對應重點章節：1.15 AIGC 核心概念\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「內容是誰生出來的？」以及「驗鈔機 vs 印鈔機」來秒殺 1.15 節考題：\n・內容生產三代演進（PGC ➔ UGC ➔ AIGC）：\n  ・PGC（專業生產內容）：報社記者、電視台專家寫的（品質高但產能低、成本高）。\n  ・UGC（用戶生產內容）：一般網友在 YouTube、IG、FB 發的貼文限動（產量大但品質參差）。\n  ・AIGC（人工智慧生成內容）：靠生成式 AI 演算法（GAN / VAE / Diffusion / Transformer）無中生有創作出全新文本、影像、音訊與影片！\n・為什麼 CNN 和 OCR 絕對不是 AIGC？（驗鈔機比喻）：\n  ・CNN（卷積神經網路）：像海關驗鈔機，只負責看圖「分類辨識（鑑別式 AI）」，不會無中生有畫新圖。\n  ・OCR（光學字元辨識）：像掃描器，只負責把發票圖片上「原本就寫好的字」認出來轉成電子檔，屬於鑑別識別技術，不會自己寫新文章！\n\n【🔑 正確選項秒殺題眼】\n・看到 AIGC 定義 ➔ 利用深度學習技術（GAN / VAE / Diffusion / Transformer）無中生有生成各種形式內容\n・看到 CNN 或 OCR 是否為 AIGC ➔ ❌ 絕對不是！（兩者皆屬鑑別／識別技術）\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：CNN 臉部辨識輸出的是類別標籤或機率，屬於判別式（鑑別式）模型，並非 AIGC。\n・❌ (B) 為什麼錯：OCR 只是辨識既有圖片中的文字，屬於識別技術，是考題最愛拿來混充 AIGC 的頭號陷阱！\n・✅ (C) 為什麼對：利用 Diffusion 與 Transformer 演算法無中生有產出全新短片與配樂，正是標準的 AIGC 跨模態生成應用。\n・❌ (D) 為什麼錯：記者撰稿屬於 PGC，網友投稿屬於 UGC，皆為人類生產內容而非 AI 演算法生成。", "has_caveat": 0, "caveat_note": null}, {"id": 280, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某娛樂經紀公司發現網路上突然爆紅一首名為《Heart on My Sleeve》的新歌，聽起來百分之百像是國際天王 Drake 與 The Weeknd 兩人的合唱，但實際上兩位歌手本人從未進錄音室唱過這首歌，而是網友利用 AI 聲音克隆技術模仿他們的唱腔合成出來的。與此同時，該公司的美術設計師也只輸入了一句提示詞，讓 Midjourney 純靠 AI 演算法自動畫出一幅精美的專輯封面，並準備去智慧財產局申請著作權（版權）登記。\n關於上述兩個真實娛樂圈案例的法律與著作權結論，下列敘述何者正確？", "option_a": "網友用 AI 模仿歌手聲音屬於完全合法的合理使用；且設計師用 Midjourney 純由 AI 生成的畫作，只要畫得夠美就能在臺灣與美國自動取得完整著作權", "option_b": "該歌曲事件即為著名的「AI 假 Drake 風波」，引爆了 AI 聲音克隆、肖像權與訓練資料侵權爭議；而純由 AI 生成的畫作，「不管畫得多美都不具備著作權」（因為美國與臺灣的著作權法皆只保護人類的精神創作）", "option_c": "純由 AI 生成的畫作在美國沒有著作權，但在臺灣智慧財產局的規定下則由 Midjourney 開發商獨享 100 年著作權", "option_d": "模仿人聲與換臉的深度偽造（Deepfake）技術底層主要是依靠「光學字元辨識（OCR）」與「主成分分析（PCA）」，且不會帶來任何身分盜用或假新聞風險", "correct_option": "B", "explanation": "・📍 對應重點章節：4.3 生成式 AI 著作權 深度偽造 (Deepfake) 與系統風險\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們把 4.3 節最常考的「版權鐵則」與「兩大社會爭議案例」一行一個記清楚：\n・1. 純 AI 生成物版權鐵則 ＝「不管畫得多美，都沒有著作權！」：\n  ・法律規定「著作權」只保護「人類大腦的精神創作」。如果你只輸入一句指令讓 AI 畫圖，因為構圖與筆觸都是電腦算出來的，在美國跟臺灣都一樣：這張圖沒有著作權，任何人拿去印在馬克杯上賣，你都告不了他！\n・2. 音樂圈侵權代表案例 ＝「AI 假 Drake 風波」：\n  ・網友用 AI 克隆模仿知名歌手 Drake 與 The Weeknd 的聲音對唱並在 TikTok 爆紅，最後被唱片公司以侵權為由全球下架。\n・3. 深度偽造（Deepfake）＝ 基於 GAN（生成對抗網路）：\n  ・逼真換臉與擬聲，引發 ① 身分盜用詐騙、② 造假影片與假新聞、③ 操弄政治與破壞選舉公平 三大社會風險。\n\n【🔑 正確選項秒殺題眼】\n・純 AI 生成作品版權歸屬 ➔ 秒選 「不管畫得多美都不具備著作權（臺灣與美國皆同）」\n・音樂圈 AI 聲音克隆侵權代表案例 ➔ 秒選 「AI 假 Drake 風波（Drake 與 The Weeknd）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：未經授權商用克隆知名歌手聲音涉及嚴重侵權爭議；且純 AI 生成畫作不具著作權。\n・✅ (B) 為什麼對：完整且正確地說明了「AI 假 Drake 風波」與「純 AI 生成作品無著作權（臺美皆同）」的核心結論。\n・❌ (C) 為什麼錯：臺灣智慧財產局與美國著作權局立場一致，純由 AI 生成之作品皆不受著作權保護。\n・❌ (D) 為什麼錯：Deepfake 底層主要基於 GAN（生成對抗網路） 等深度學習技術，而非 OCR 或 PCA，且具有極高的詐騙與假新聞風險。", "has_caveat": 0, "caveat_note": null}, {"id": 281, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在大型語言模型（LLM）從 GPT-1 演進到 GPT-3、GPT-4 與 LLaMA 的歷史過程中，某研究機構想探討：「促使大型語言模型表現大幅改進的最關鍵因素是什麼？」以及「多元大型語言模型的蓬勃發展對生成式 AI 技術帶來了什麼核心影響？」\n請問針對這兩個問題，下列哪一組結論是認證考試中的唯一標準正解？", "option_a": "表現改進關鍵為「大幅減少訓練資料的數量以加快速度」；技術影響為「LLM 本身會自己產生並提供更多外部真實訓練資料」", "option_b": "表現改進關鍵為「擴展多樣化的語言模式和結構」；技術影響為「提升生成內容的多樣性和品質」", "option_c": "表現改進關鍵為「單純無上限增加模型參數，但只餵入單一種類的童話故事」；技術影響為「徹底消除所有硬體耗電量」", "option_d": "表現改進關鍵為「將雙向自注意力機制改為單層感知器」；技術影響為「讓模型只能進行是非題二元分類」", "correct_option": "B", "explanation": "・📍 對應重點章節：1.6 NLP BERT GPT 與 LLM 演進\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「培養一位讀萬卷書的大文豪」來秒懂這兩題超高頻考題：\n・為什麼「LLM 表現改進關鍵」是 擴展多樣化的語言模式和結構？：\n  ・增加參數就像給作家「更大的腦袋」，提高算力就像喝「提神飲料」；但如果這位作家一輩子只讀同一本童話書，文筆永遠不會進步！\n  ・唯有讓他廣泛閱讀詩歌、科學論文、法律條文、多國對話與程式碼（擴展多樣化的語言模式和結構），模型表現才會真正大躍進！\n・為什麼「多元 LLM 的技術影響」是 提升生成內容的多樣性和品質？：\n  ・當市面上有各種不同專長與文化背景的 LLM（如懂繁中文化的 TAIDE、懂長文本的 Claude 等），就能提升生成內容的多樣性和品質。\n  ・⚠️ 必避陷阱：考題常誘答「LLM 能提供更多訓練資料」➔ 錯！LLM 本身不會自產外部真實訓練資料，訓練資料是由人類從外部收集來的！\n\n【🔑 正確選項秒殺題眼】\n・看到「LLM 表現改進的關鍵」 ➔ 秒選 「擴展多樣化的語言模式和結構」\n・看到「多元 LLM 發展的技術影響」 ➔ 秒選 「提升生成內容的多樣性和品質」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：「減少訓練資料」會導致模型變笨；且「LLM 本身會提供更多訓練資料」是考場最愛出的錯誤誘答項！\n・✅ (B) 為什麼對：同時命中 LLM 演進考題的兩大標準結論。\n・❌ (C) 為什麼錯：單靠增加參數或提高算力而缺乏多樣化語言結構，並非表現改進的核心關鍵；且大模型會增加算力消耗。\n・❌ (D) 為什麼錯：LLM 依賴 Transformer 架構進行內容生成，並非改回單層感知器做二元分類。", "has_caveat": 0, "caveat_note": null}, {"id": 282, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某線上課程平台想要將 500 篇文字講義製作成自然生動的「AI 助教語音導讀（TTS, Text-to-Speech）」。關於 TTS 在技術底層運作的 3 大步驟，以及創作者在平台上「從一句話變成語音（例如讓 AI 說得像一位親切的助教）」的 4 步驟實作流程，下列排序何者完全正確？", "option_a": "技術底層 3 步驟：① 文字分析 ➔ ② 語音規劃 ➔ ③ 語音合成；實作 4 步驟：① 輸入要說的內容 ➔ ② 選擇語者的角色 ➔ ③ 控制語氣跟說話的細節 ➔ ④ 預覽與匯出", "option_b": "技術底層 3 步驟：① 語音合成 ➔ ② 文字分析 ➔ ③ 語音規劃；實作 4 步驟：① 預覽與匯出 ➔ ② 控制語氣 ➔ ③ 選擇角色 ➔ ④ 輸入內容", "option_c": "技術底層 3 步驟：① 圖片切塊 ➔ ② 池化降維 ➔ ③ 全連接分類；實作 4 步驟：① 設定 16:9 比例 ➔ ② 加入字幕 ➔ ③ 去背 ➔ ④ 匯出", "option_d": "技術底層 3 步驟：① 詞幹提取 ➔ ② 移除停用詞 ➔ ③ 轉小寫；實作 4 步驟：① 收集問卷 ➔ ② 填補眾數 ➔ ③ 盒鬚圖 ➔ ④ 視覺化", "correct_option": "A", "explanation": "・📍 對應重點章節：3.3 聲音 (TTS) 與音樂生成應用\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們把 TTS（文字轉語音）分成「AI 腦袋裡怎麼算（底層 3 步驟）」跟「人類在軟體界面怎麼按（實作 4 步驟）」：\n・一、TTS 技術底層 3 步驟（像新聞主播拿到稿子念出來的過程）：\n  ・① 文字分析 (Text Analysis)：主播先看懂稿子上的字、破音字與標點符號。\n  ・② 語音規劃 (Prosody Prediction)：在腦中規劃哪裡要停頓、哪個字音調要上揚（韻律規劃）。\n  ・③ 語音合成 (Waveform Generation)：最後透過聲帶發出真正的聲音波形！\n・二、使用者操作 4 步驟（把文字變成「親切助教」語音）：\n  ・① 輸入要說的內容（貼上台詞） ➔ ② 選擇語者的角色（挑青年女聲助教） ➔ ③ 控制語氣跟說話細節（調成親切溫柔、語速適中） ➔ ④ 預覽與匯出（試聽沒問題下載 MP3）！\n\n【🔑 正確選項秒殺題眼】\n・TTS 技術底層 3 步驟 ➔ ① 文字分析 ➔ ② 語音規劃 ➔ ③ 語音合成\n・從一句話變語音實作 4 步驟 ➔ ① 輸入要說的內容 ➔ ② 選擇語者的角色 ➔ ③ 控制語氣跟說話細節 ➔ ④ 預覽與匯出\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・✅ (A) 為什麼對：技術底層 3 步驟與使用者實作 4 步驟的順序皆 100% 正確。\n・❌ (B) 為什麼錯：把兩個流程的先後順序完全倒過來了（還沒分析文字不可能先合成語音，還沒輸入內容不可能先預覽匯出）。\n・❌ (C) 為什麼錯：前半是 CNN/Transformer 讀圖步驟，後半是影片生成步驟。\n・❌ (D) 為什麼錯：前半是 NLP 文本前處理步驟，後半是資料清理與分析流程。", "has_caveat": 0, "caveat_note": null}, {"id": 283, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某半導體大廠正在訓練一套晶圓瑕疵生成式模型，新進工程師對於「深度生成式 AI 的 5 大內部結構單元」與「模型預訓練（Pre-training）的 6 大步驟」之間的對應關係感到困惑。\n資深架構師告訴他：「不論是文字、圖像或語音生成系統，預訓練的 6 個步驟都是發生在 5 個內部結構單元裡；而且只有某一個內部結構單元同時包含了兩個預訓練步驟（Step 3 與 Step 4）！」請問這 5 大內部結構單元的正確順序為何？且同時包含兩個預訓練步驟的是哪一個單元？", "option_a": "順序為：接收輸入 ➔ 解碼器 ➔ 潛在空間表示 ➔ 編碼器 ➔ 輸出；同時包含兩步驟的是「① 接收輸入」", "option_b": "順序為：接收輸入 ➔ 編碼器 ➔ 潛在空間表示 ➔ 解碼器 ➔ 輸出；同時包含兩步驟的是「③ 潛在空間表示（Latent Space Representation）」，內含「Step 3 決定損失函數」與「Step 4 參數最佳化」", "option_c": "順序為：編碼器 ➔ 接收輸入 ➔ 解碼器 ➔ 輸出 ➔ 潛在空間表示；同時包含兩步驟的是「④ 解碼器」", "option_d": "順序為：潛在空間表示 ➔ 接收輸入 ➔ 編碼器 ➔ 解碼器 ➔ 輸出；同時包含兩步驟的是「⑤ 輸出」", "correct_option": "B", "explanation": "・📍 對應重點章節：1.9 模型預訓練 從無到有的知識建立\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「5 個舞台房間 × 6 個學徒練功步驟」的對照，一秒記住這個超常考結構：\n・房間 ① 接收輸入 (Input Reception)：對應 Step 1 資料收集與處理（把教材洗乾淨送進門）。\n・房間 ② 編碼器 (Encoder)：對應 Step 2 選擇適當模型與調超參數（選對大腦把資料轉成向量）。\n・房間 ③ 潛在空間表示 (Latent Space Representation)（🔥 唯一塞了兩步的核心舞台！）：\n  ・Step 3 決定損失函數（定評分標準算誤差） ＋ Step 4 參數最佳化（用反向傳播與梯度下降改參數）都在這裡同步互動！\n・房間 ④ 解碼器 (Decoder)：對應 Step 5 生成、評估與反覆運算（做練習考 Validation 與期末考 Test 驗收）。\n・房間 ⑤ 輸出 (Output)：對應 Step 6 結果轉成文字（正式畢業上線應用）。\n\n【🔑 正確選項秒殺題眼】\n・5 大內部結構單元順序 ➔ ① 接收輸入 ➔ ② 編碼器 ➔ ③ 潛在空間表示 ➔ ④ 解碼器 ➔ ⑤ 輸出\n・唯一同時包含 Step 3（決定損失函數）與 Step 4（參數最佳化）的單元 ➔ 秒選 ③ 潛在空間表示！\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：把「編碼器（先壓縮）」與「解碼器（後還原）」的順序顛倒了。\n・✅ (B) 為什麼對：5 大單元順序完全正確，且精準點出「③ 潛在空間表示」同時涵蓋 Step 3 與 Step 4。\n・❌ (C)、(D) 為什麼錯：內部結構單元的先後流水線順序完全錯亂。", "has_caveat": 0, "caveat_note": null}, {"id": 284, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國零售企業的商業智慧（BI）部門正在使用 AI 工具製作年度營運數據視覺化儀表板，同時團隊中的新進分析師也想找一個全球最具代表性的平台來動手實作資料科學與學習 AI 模型。\n關於「資料視覺化設計原則（如何保持風格一致性？最應避免什麼問題？）」以及「最適合學習 AI 實作的平台 Kaggle（哪一項『不是』Kaggle 提升技能的方式？）」，下列敘述何者完全正確？", "option_a": "視覺化保持風格一致性應選「使用統一的顏色和標籤格式」，最應避免的問題是「資訊過多（資訊過載）」；最適合學 AI 實作的平台是 Kaggle，而「免費訂閱優惠會員」並不是 Kaggle 提升技能的方式", "option_b": "視覺化保持風格一致性應選「每張圖表都換上五顏六色不同的花俏字體」，最應避免的問題是「突出關鍵資訊」；最適合學 AI 實作的平台是 Instagram Reels", "option_c": "視覺化最應避免的問題是「使用簡單顏色」；而在 Kaggle 平台上，使用者唯一能提升技能的方式就是花錢購買「免費訂閱優惠會員」", "option_d": "資料分析的 4 大通用流程中，第一步是「視覺呈現與報告撰寫」，最後一步才是「收集資料與資料擷取」", "correct_option": "A", "explanation": "・📍 對應重點章節：3.7 數據分析 視覺化與自動化工具 ＆ 5.6 資料科學與開源社群平台\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這題濃縮了 3.7 節的三大必考題眼，我們一行一題拆解：\n・1. 資料視覺化「保持風格一致性」怎麼選？：\n  ・就像公司制服一樣，整份報告的圖表要用「統一的顏色和標籤格式」（並使用簡單顏色、突出關鍵資訊），主管看報表才不會眼花撩亂。\n・2. 資料視覺化「最應該避免什麼問題」？：\n  ・最忌諱把一百個數字全塞進一張圖裡！因此應避免「資訊過多（資訊過載）」。\n・3. AI 實作學習首選平台 Kaggle 的三大練功法 vs 虛構陷阱：\n  ・✅ 三大真實練功法：① 參加公開數據競賽、② 學習別人的開源解決方案（程式碼 Notebooks）、③ 在論壇與高手交流討論。\n  ・❌ 必選排除陷阱：考題問何者「不是」Kaggle 提升技能的方式，必選官方根本不存在的虛構選項——「免費訂閱優惠會員」！\n\n【🔑 正確選項秒殺題眼】\n・視覺化保持風格一致性 ➔ 秒選 「統一的顏色和標籤格式」\n・視覺化最應避免的問題 ➔ 秒選 「資訊過多」\n・何者「不是」Kaggle 提升技能的方式 ➔ 秒選 「免費訂閱優惠會員」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・✅ (A) 為什麼對：完整且精確地命中視覺化兩大原則與 Kaggle 考題的標準排除項。\n・❌ (B) 為什麼錯：「突出關鍵資訊」是視覺化的優點而非應避免的問題；且學 AI 數據實作首選 Kaggle，而非短影音娛樂平台 IG Reels / YouTube Shorts。\n・❌ (C) 為什麼錯：「使用簡單顏色」是正確的視覺化原則；而「免費訂閱優惠會員」是虛構的錯誤選項。\n・❌ (D) 為什麼錯：資料分析 4 大流程第一步永遠是「① 收集資料 / 資料擷取」，最後一步才是「④ 視覺呈現與報告撰寫」（詳見 1.12 節）。", "has_caveat": 0, "caveat_note": null}, {"id": 285, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某翻譯社回顧機器翻譯技術的演進：在 2014 年 Google 提出 Seq2Seq（序列到序列，Sequence-to-Sequence） 模型時，成功打破了過去「輸入句子與輸出句子字數（序列長度）必須相等」的限制。\n以將英文句子 \"How are you?\"（3 個單詞）翻譯成中文 \"你好嗎\"（3 個中文字，或 \"你最近過得好嗎\" 7 個字）為例，請問 Seq2Seq 的實際兩階段運作流程為何？且它面對超長句子時的致命瓶頸是什麼？", "option_a": "編碼階段直接將每個英文字用字典查表換成中文字；致命瓶頸是會產生模式崩潰（Mode Collapse）", "option_b": "編碼階段（Encoding）先將輸入詞句轉為向量並壓縮成單一高維「語意向量 V₁」，解碼階段（Decoding）再依「V₁ ＋ 目前已生成上下文」一詞一詞逐步預測出「你」➔「好」➔「嗎」；致命瓶頸是整句僅靠「單一固定向量」且「無法回頭檢查原句字詞」，句子一長就失憶", "option_c": "編碼階段直接將英文向量轉成中文向量並從資料庫找出最接近的現成整句話吐出來；致命瓶頸是生成的圖片邊緣會太模糊", "option_d": "編碼階段採用雙向自注意力機制平行運算，完全不需要解碼器；致命瓶頸是無法處理超過 2 個字以上的短句", "correct_option": "B", "explanation": "・📍 對應重點章節：1.4 VAE GAN 與 Seq2Seq\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「口譯員聽完一句話寫在小紙條上」來理解 Seq2Seq 的運作與悲劇：\n・階段 1 編碼階段（Encoding）：\n  ・口譯員聽完 \"How are you?\"，把整句話的意思濃縮寫在一張小紙條上——這張紙條就是單一高維的「語意向量 V₁」。\n・階段 2 解碼階段（Decoding）：\n  ・口譯員看著小紙條 V₁，先猜出第一個中文字「你」➔ 接著結合「你 ＋ V₁」猜出第二個字「好」➔ 再結合「你好 ＋ V₁」猜出第三個字「嗎」（⚠️ 是一詞一詞逐步預測生成，絕非直接拿英文向量去換現成的中文整句！）。\n・為什麼遇到長句子會發生「失憶悲劇」？：\n  ・如果演講者一口氣講了 50 個字的長句，口譯員還是只能硬塞進「同一張固定大小的小紙條（單一固定向量）」，而且在翻的時候「無法回頭檢查」原句某個字詞，所以句子一長前面講什麼就忘光了！\n\n【🔑 正確選項秒殺題眼】\n・Seq2Seq 解碼方式 ➔ 依「語意向量 V₁ ＋ 已生成上下文」一詞一詞逐步預測生成\n・Seq2Seq 致命瓶頸 ➔ 整句壓入「單一固定向量」且「無法回頭檢查原句字詞」，長句易失憶\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Seq2Seq 是在向量空間進行編解碼，並非死板查字典；且「模式崩潰」是 GAN 的瓶頸。\n・✅ (B) 為什麼對：完整且精確地描述了 Seq2Seq 的編碼語意向量 V₁、解碼逐詞預測流程，以及單一固定向量無法回頭檢查的長句瓶頸。\n・❌ (C) 為什麼錯：「直接把英文向量換成中文向量找最接近句子」是考試最常出的錯誤解碼陷阱；且畫面模糊是 VAE 的缺點。\n・❌ (D) 為什麼錯：平行運算與自注意力機制是後來 2017 年 Transformer 才引入的突破。", "has_caveat": 0, "caveat_note": null}, {"id": 286, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某美妝品牌與跨國律所分別導入生成式 AI 文字工具協助日常業務：\n・情境一：美妝品牌的創意總監在構思「母親節社群文案」時毫無頭緒，於是他畫了一個九宮格，在正中央寫下核心主題，並向四周八個格子發散聯想相關元素，藉此打造 AI 創作靈感與結構化提示詞。\n・情境二：美妝電商部門希望根據每位會員不同的膚質與購買紀錄，自動撰寫出千人千面的「個人化市場營銷推薦信」，並在商品頁自動「撰寫引人注目的產品特點」。\n・情境三：跨國律所導入 AI 文字工具，希望了解生成式 AI 對法律領域最核心的實務幫助，同時要請工具幫實習律師撰寫的英文郵件進行「英文文法檢查校對」與「同義句改寫（換句話說）」。\n關於上述三個情境對應的思考法、核心技術與工具，下列敘述何者完全正確？", "option_a": "情境一採用「曼陀羅思考法」；情境二個人化行銷靠「自然語言生成（NLG）」；情境三對法律領域影響為「提供法律文書和合約的自動生成」，且英文文法檢查用 Grammarly、句子改寫用 QuillBot", "option_b": "情境一採用「盒鬚圖法」；情境二個人化行銷靠「光學字元辨識（OCR）」；情境三英文文法檢查用 Midjourney、句子改寫用 Suno", "option_c": "情境一採用「殘差網路法」；情境二撰寫產品描述的最大優勢是「降低圖片解析度」；情境三對法律領域的影響是「由 AI 直接取代法官進行最終刑事判決」", "option_d": "情境一採用「曼陀羅思考法」；情境二個人化行銷靠「卷積神經網路（CNN）」；情境三商業行銷文案專用工具為 remove.bg 與 Kaggle", "correct_option": "A", "explanation": "・📍 對應重點章節：3.1 文字與商業文案生成應用\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們把 3.1 節「文字生成與商業應用」的 5 個高頻考點逐行拆解：\n・1. 打造 AI 靈感的九宮格思考法 ＝ 曼陀羅思考法（Mandala Chart）：\n  ・把主題寫在九宮格正中間，往外圍 8 格發散靈感，最適合用來構思 AI 提示詞（對應情境一）。\n・2. 個人化市場營銷的核心技術 ＝ 自然語言生成（NLG）：\n  ・針對不同客戶自動寫出客製化行銷文案（對應情境二）。\n・3. AI 寫電商產品描述的最大優勢 ＝ 撰寫引人注目的產品特點：\n  ・幫商品提煉出最吸睛的賣點文案（對應情境二）。\n・4. 對法律領域的實務影響 ＝ 提供法律文書和合約的自動生成：\n  ・幫律師快速草擬制式合約與法律文件（對應情境三）。\n・5. 英文潤飾雙雄 vs 商業文案雙雄：\n  ・Grammarly：專攻英文文法檢查與拼字校對。\n  ・QuillBot：專攻英文句子改寫（Paraphrasing 換句話說）。\n  ・Copy.ai / Jasper AI：專攻商業行銷與廣告文案。\n\n【🔑 正確選項秒殺題眼】\n・九宮格打造 AI 創作靈感 ➔ 秒選 曼陀羅思考法\n・個人化市場營銷技術 ➔ 秒選 自然語言生成（NLG）\n・英文文法檢查 ➔ Grammarly ｜ 英文句子改寫 ➔ QuillBot\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・✅ (A) 為什麼對：三個情境的思考法、技術名稱、法律影響與工具分工全部正確。\n・❌ (B) 為什麼錯：盒鬚圖是抓異常值的統計圖，OCR 是圖片文字識別，Midjourney 與 Suno 分別是生圖與生音樂工具。\n・❌ (C) 為什麼錯：AI 在法律領域是輔助生成法律文書與合約初稿，絕非取代人類法官做最終審判（違反以人為本與高風險監管原則）。\n・❌ (D) 為什麼錯：CNN 是影像分類模型；商業行銷文案工具應為 Copy.ai / Jasper AI，而非去背工具 remove.bg 或資料科學平台 Kaggle。", "has_caveat": 0, "caveat_note": null}, {"id": 287, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某銀行已經訓練好一個完全不連網（離線部署）的企業內部大型語言模型。當行員坐在電腦前輸入：「明天的天氣？」並按下送出後，模型開始執行「推理（Inference）」運作流程，最終在螢幕上顯示：「明天可能會下雨」。\n關於這個離線模型在「推理運作 5 大步驟」中實際發生的事，下列哪一項敘述完全正確？", "option_a": "在 Step 1 接收輸入時，模型把句子切成 Token（「明」「天」「的」「天氣」「？」），在這一瞬間模型就已經 100% 徹底理解整句話的深層語意，完全不需要經過編碼器或潛在空間", "option_b": "在 Step 2 資料編碼時，編碼器將 Token 轉成帶有語境資訊的向量（Contextual Embedding）；接著在 Step 3 語意理解（潛在空間表示）中建立內部語意地圖，並在 Step 4 生成解碼時透過文字接龍依機率逐字產出，最後於 Step 5 輸出回應拼成完整句子", "option_c": "這台完全不連網的純語言模型之所以能回答「明天可能會下雨」，是因為它在 Step 3 偷偷連上中央氣象局的衛星資料庫查到了明天的真實降雨機率", "option_d": "模型在 Step 4 與 Step 5 根本沒有做任何機率計算，而是直接從硬碟裡的 Excel 表格中，把工程師事先背好、寫死的整句標準答案「明天可能會下雨」原封不動複製貼上吐出來", "correct_option": "B", "explanation": "・📍 對應重點章節：1.11 模型的運作 (推理) AI 怎麼看懂輸入與生出結果\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們跟著「明天的天氣？」這句話，走一遍 AI 翻譯官的 推理運作 5 步曲：\n・Step 1 接收輸入 (Input Reception)：\n  ・把句子切成小拼圖 Token（「明」「天」「的」「天氣」「？」）。⚠️ 注意：這時還只是原始訊號，模型還無法直接理解意思！\n・Step 2 資料編碼 (Encoder)：\n  ・用編碼器（RNN / LSTM / GRU / Transformer）抓前後文脈絡，轉成帶有語境的向量 Contextual Embedding（知道「明天」是時間、「天氣」是主題）。\n・Step 3 語意理解 (Latent Space Representation 潛在空間)：\n  ・在 AI 的思考中心裡，用高維向量表示「詢問明天天氣如何」，準備送去生成回答。\n・Step 4 生成解碼 (Decoder)：\n  ・開始玩文字接龍！依統計機率一個字一個字往後猜：「明」➔「天」➔「可」➔「能」➔「會」➔「下」...。\n・Step 5 輸出回應 (Output)：\n  ・把接龍產出的 Token 拼成「明天可能會下雨」端上桌顯示給人類看！\n\n【🔑 正確選項秒殺題眼】\n・推理（Inference）5 步驟順序 ➔ ① 接收輸入 ➔ ② 資料編碼 ➔ ③ 語意理解 ➔ ④ 生成解碼 ➔ ⑤ 輸出回應\n・不連網純語言模型回答天氣的原因 ➔ 靠預訓練資料中的統計語言知識與機率分佈逐字預測（非查氣象局、亦非背好整句答案直接吐出！）\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：在 Step 1 接收輸入階段，Token 還只是原始訊號，模型此時還無法直接理解輸入的資料（必考陷阱！）。\n・✅ (B) 為什麼對：完整且精確地描述了推理運作 Step 2 到 Step 5 的核心機制與專有名詞。\n・❌ (C) 為什麼錯：不連網的純語言模型不會去查氣象局資料，它只是因為以前讀過的文章裡問天氣常接「可能會下雨」，順著統計機率接話而已。\n・❌ (D) 為什麼錯：生成式 AI 是透過解碼器一步步計算機率、逐字推理生成，絕非背好標準答案直接整句吐出！", "has_caveat": 0, "caveat_note": null}, {"id": 288, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國醫療器材公司為了保護病患隱私並強化內部資安，決定在資料治理上採取「四大隱私保護策略」。同時，資安長也在全體員工大會上警告大家提防一種「不直接攻破電腦程式漏洞，而是利用人性弱點與騙術（例如假冒總經理寄發緊急釣魚信、或假裝 IT 人員打電話騙取帳號密碼）」的人為資安威脅。\n請問下列哪一項屬於「四大隱私保護策略」中針對敏感欄位（如姓名、身分證字號）進行匿名化或遮蔽處理，讓外人看不出這筆資料屬於誰的技術？且資安長警告的那種「利用人性弱點行騙」的攻擊手法稱為什麼？", "option_a": "資料去識別化（De-identification） ／ 社交工程（Social Engineering）", "option_b": "資料離散化（Discretization） ／ 梯度爆炸（Exploding Gradient）", "option_c": "主成分分析（PCA） ／ 模式崩潰（Mode Collapse）", "option_d": "詞幹提取（Stemming） ／ 提示注入（Prompt Injection）", "correct_option": "A", "explanation": "・📍 對應重點章節：4.4 資料治理 四大隱私保護策略與隱私法規\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用醫院保護病歷的情境，把「四大隱私保護策略」與「社交工程」一行一個看懂：\n・策略 ① 資料去識別化（De-identification）：\n  ・把病歷上的「王大明、A123456789」塗掉或換成代號 #001，讓別人看不出這筆資料是誰（對應本題第一問）。\n・策略 ② 存取控制限制（Access Control）：\n  ・設定最小權限，嚴格限制「誰能看、誰能改、誰能刪」。\n・策略 ③ 資料加密（Encryption）：\n  ・用對稱加密（同一把金鑰）或非對稱加密（公鑰＋私鑰）把資料鎖起來。\n・策略 ④ 數據最小化（Data Minimization）：\n  ・只收集「必要」的最少量資料（不需要的敏感欄位一開始就別收）。\n・人為資安威脅 社交工程（Social Engineering）：\n  ・駭客不寫病毒硬闖防火牆，而是利用人性弱點（貪心、恐懼、好奇）寄釣魚信或假冒主管騙你主動交出密碼（對應本題第二問）！\n\n【🔑 正確選項秒殺題眼】\n・塗掉或代換姓名身分證、看不出是誰 ➔ 秒選 資料去識別化（De-identification）\n・利用人性弱點與騙術（釣魚信/假冒身分）騙取密碼 ➔ 秒選 社交工程（Social Engineering）\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・✅ (A) 為什麼對：完全命中「資料去識別化」與「社交工程」的標準定義。\n・❌ (B) 為什麼錯：「資料離散化」是把連續年齡 33 歲轉為 30~39 歲區間的前處理技巧；「梯度爆炸」是訓練深層網路時參數暴衝的問題。\n・❌ (C) 為什麼錯：PCA 是濃縮特徵欄位的降維技術；模式崩潰 是 GAN 只會畫同一種圖的缺陷。\n・❌ (D) 為什麼錯：詞幹提取 是 NLP 砍英文字尾的前處理；提示注入 是針對 LLM 輸入惡意指令繞過安全限制，而非打電話或寄釣魚信騙員工交出系統密碼的傳統社交工程。", "has_caveat": 0, "caveat_note": null}, {"id": 289, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某電商平台與跨國媒體公司正在檢視全球熱門生成式 AI 工具清單（第五部分工具總覽），希望能為四個不同專案挑選最合適的專用工具：\n・專案一（電商網拍商品去背）：賣家每天要上傳數百張服飾與鞋子照片，需要一款能「1 秒精準自動去背（影像分割），並直接換上專業商業攝影棚背景」的工具。\n・專案二（大學教授抓 AI 代寫作業）：教授懷疑學生交上來的期末報告是直接用 ChatGPT 生成複製貼上的，需要一款專門用來「偵測文章是否由 AI 生成」的檢測工具。\n・專案三（長篇訪談錄音轉逐字稿）：記者剛結束一場 2 小時的專訪，需要一款基於 OpenAI Whisper 技術、高精準度的「AI 語音轉文字（逐字稿）」工具。\n・專案四（比較兩款匿名大模型的真實實力）：AI 研究員想查看目前全球最具公信力的「LLM 盲測對戰排行榜（讓兩個匿名模型回答同一問題，由人類投票分勝負）」。\n請問專案一、二、三、四依序最適合選用下列哪一組工具或平台？", "option_a": "專案一：remove.bg（或 Photoroom） ／ 專案二：ZeroGPT ／ 專案三：TurboScribe ／ 專案四：LMSYS Chatbot Arena（Arena）", "option_b": "專案一：Suno ／ 專案二：AIVA ／ 專案三：Midjourney ／ 專案四：Kaggle", "option_c": "專案一：GitHub Copilot ／ 專案二：Cursor ／ 專案三：Devin ／ 專案四：Zapier", "option_d": "專案一：Google Lumiere ／ 專案二：Runway Gen-2 ／ 專案三：Pika ／ 專案四：Sora", "correct_option": "A", "explanation": "・📍 對應重點章節：5.2 圖像生成與編輯平台 ＆ 5.7 開發商 vs 代表工具速查矩陣（含全球 Top 50 工具）\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們把第五部分工具總覽中這四個超實用的「專職特種部隊工具」一行一個記起來：\n・1. 電商一鍵去背雙雄 ＝ remove.bg ＆ Photoroom：\n  ・看名字 remove.bg（Remove Background 移除背景）就秒懂！專門幫人像或網拍商品 1 秒去背換背景（對應專案一）。\n・2. 抓 AI 代寫的測謊機 ＝ ZeroGPT：\n  ・名字叫 ZeroGPT（零 GPT），專門幫老師或編輯偵測一篇文章是不是由 AI 生成的（對應專案二）。\n・3. 錄音變逐字稿神器 ＝ TurboScribe：\n  ・Scribe 就是「抄寫員／速記員」，基於 Whisper 技術專門把錄音檔高速轉成精準文字逐字稿（對應專案三）。\n・4. 大模型盲測競技場 ＝ LMSYS Chatbot Arena (Arena)：\n  ・像《黑白大廚》蒙眼試吃一樣，把兩個大模型的名字遮起來同時回答你的問題，讓你投票誰答得好，排出全球最公正的 LLM 排行榜（對應專案四）。\n\n【🔑 正確選項秒殺題眼】\n・一鍵自動去背與商品圖合成 ➔ remove.bg / Photoroom\n・偵測文章是否由 AI 生成 ➔ ZeroGPT\n・AI 語音轉文字（逐字稿） ➔ TurboScribe\n・LLM 匿名盲測對戰排行榜 ➔ LMSYS Chatbot Arena (Arena)\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・✅ (A) 為什麼對：四個專案的需求與四款專用工具的功能定位 100% 精準對應。\n・❌ (B) 為什麼錯：Suno 與 AIVA 是音樂生成工具，Midjourney 是生圖工具，Kaggle 是資料科學競賽平台。\n・❌ (C) 為什麼錯：Copilot、Cursor、Devin 皆為寫程式工具，Zapier 為工作流程自動化工具。\n・❌ (D) 為什麼錯：Lumiere、Runway、Pika、Sora 全部都是「影片生成工具」。", "has_caveat": 0, "caveat_note": null}, {"id": 290, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某金控集團正在訓練一個深層神經網路來分析全球匯率走勢，但在訓練過程中發現兩個嚴重現象：\n1. 模型在平時練習的「訓練集（Training Set）」上表現高達 99 分，但一拿到「驗證集（Validation Set）」考新題目時就只有 50 分（把訓練資料當考古題死背）。\n2. 在反向傳播時，部分神經元的梯度更新訊號數值暴衝失控（梯度爆炸 Exploding Gradient），導致參數飆得太誇張。\n為了同時解決「過擬合（Overfitting）」與「梯度爆炸」這兩個問題，工程師應該採取下列哪兩項「煞車神器」技術？", "option_a": "第一招：使用「L1 與 L2 正規化／正則化（Regularization）」，在損失函數（Loss Function）裡面加上懲罰項以限制參數大小；第二招：使用「Dropout（隨機丟棄）」，在訓練時隨機關掉一部分神經元讓那條路徑先休息一下", "option_b": "第一招：不斷增加模型的層數與參數複雜度；第二招：完全取消驗證集，直接把測試集（Test Set）拿來背誦", "option_c": "第一招：將模型的學習率（Learning Rate）調高 100 倍；第二招：將問題改稱為「欠擬合（Underfitting）」並延長訓練時間", "option_d": "第一招：改用單層感知器（Perceptron）；第二招：使用「超解析重建（Super-Resolution）」放大參數數值", "correct_option": "A", "explanation": "・📍 對應重點章節：1.10 模型最佳化 訓練技巧與過擬合\n\n【💡 生活化範例 ／ 具體情境秒懂】\n當 AI 學生出現「把考古題背得太死（過擬合 Overfitting）」加上「參數飆車失控（梯度爆炸 Exploding Gradient）」時，我們有兩大「雙重功效煞車神器」：\n・煞車神器 ① L1 與 L2 正規化／正則化（Regularization） ＝ 「在損失函數裡開超速罰單」：\n  ・直接在損失函數（Loss Function）裡面加上懲罰項，誰的參數敢飆太大就扣誰的分！\n  ・雙重效果：既能壓住參數別亂飆（防梯度爆炸），又能阻止模型把單一考古題特徵背得太死（防過擬合）！\n・煞車神器 ② Dropout（隨機丟棄） ＝ 「抽考時隨機叫學霸閉嘴休息」：\n  ・在訓練時隨機關掉一部分神經元，讓那條路徑先休息一下。\n  ・雙重效果：避免權重全部集中在同一條路徑暴衝（防梯度爆炸），也逼全班所有神經元都要學會通則、不能只靠少數死背王（防過擬合）！\n・*(補充：防止過擬合還可搭配 資料增強 Data Augmentation 與 早停法 Early Stopping)*。\n\n【🔑 正確選項秒殺題眼】\n・同時解決「梯度爆炸」與「過擬合」的兩大技巧 ➔ 秒選 L1 / L2 正規化（正則化：在損失函數加懲罰項） ＋ Dropout（隨機關掉部分神經元讓路徑休息）！\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・✅ (A) 為什麼對：精準說出 L1/L2 正則化 與 Dropout 的運作原理及其同時克制梯度爆炸與過擬合的雙重功效。\n・❌ (B) 為什麼錯：「增加模型複雜度與層數」是用來解決欠擬合（Underfitting，模型太笨學不來）的方法，對已經過擬合的模型再加複雜度只會死背得更嚴重！\n・❌ (C) 為什麼錯：把學習率調高 100 倍會讓梯度爆炸更失控；且訓練集高分、驗證集低分是典型的「過擬合」而非欠擬合。\n・❌ (D) 為什麼錯：超解析重建（SR）是影像清晰化技術，與神經網路防過擬合無關。", "has_caveat": 1, "caveat_note": "梯度爆炸的標準解法是梯度裁剪（Gradient Clipping）；L1/L2 正則化與 Dropout 主要用於抑制過擬合，對梯度爆炸僅有間接幫助。依四選項比較，A仍為最佳答案。"}, {"id": 291, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在處理自然語言處理（NLP）任務時，早期的 Word2Vec 或 GloVe 模型雖然能將單字轉換為詞向量（Word Embedding），但當遇到下面這兩句話時卻踢到了鐵板：\n・句子一：「我今天早上咬了一口香甜的蘋果。」\n・句子二：「蘋果今天發表了最新一代的 iPhone 手機。」\n為什麼傳統的 Word2Vec 無法區分這兩句話裡的「蘋果」，而基於 Transformer 架構的 BERT 模型卻能徹底解決這個「一詞多義（Polysemy）」問題？", "option_a": "因為 Word2Vec 採用的是「獨熱編碼（One-Hot Encoding）」，只給每個字編流水號；而 BERT 則是把所有中文字都直接刪掉不看", "option_b": "因為 Word2Vec 屬於「靜態詞嵌入（Static Word Embedding）」，不管在哪個句子裡「蘋果」都只有固定同一組數值座標；而 BERT 採用「動態上下文詞嵌入（Contextualized Embedding）」，能根據雙向前後文語境動態變換「蘋果」的向量座標", "option_c": "因為 Word2Vec 是生成式影片模型，只能處理像素；而 BERT 是單向自迴歸模型，只能看句子前面不能看後面", "option_d": "因為 Word2Vec 使用了過多的自注意力機制（Self-Attention），而 BERT 完全移除了自注意力機制改用池化層", "correct_option": "B", "explanation": "・📍 對應重點章節：1.6 NLP BERT GPT 與 LLM 演進\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「永久固定身分證 vs 隨場合變換的智慧名牌」來看詞向量三代演進：\n・第 1 代 獨熱編碼（One-Hot Encoding）：\n  ・只給字典裡每個字發一個流水號（如 [0, 0, 1, 0...]），完全看不出「貓」跟「狗」的意思比「貓」跟「電鍋」更接近。\n・第 2 代 靜態詞嵌入（Static Word Embedding：Word2Vec / GloVe）：\n  ・雖然讓意思相近的詞靠在一起，但它給每個單字發了一張「永久固定座標身分證」——不管在什麼句子裡，「蘋果」永遠只有同一組固定數字，所以分不清水果的蘋果跟科技公司的蘋果（無法解決一詞多義）！\n・第 3 代 動態上下文詞嵌入（Contextualized Embedding：BERT / Transformer）：\n  ・靠著雙向自注意力機制看前後文：看到前面有「咬了一口」就給蘋果貼上「水果座標」；看到後面有「發表 iPhone」就動態換成「科技公司座標」——徹底解決一詞多義！\n\n【🔑 正確選項秒殺題眼】\n・Word2Vec / GloVe 限制 ➔ 靜態詞嵌入（一個詞只有固定一組向量，無法解決一詞多義）\n・解決一詞多義（Polysemy）的關鍵技術 ➔ 秒選 BERT / Transformer 的「動態上下文詞嵌入（Contextualized Embedding）」！\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Word2Vec 已經是將詞轉為稠密向量的靜態詞嵌入，並非第一代的 One-Hot 獨熱編碼。\n・✅ (B) 為什麼對：清楚對比了 Word2Vec「靜態固定向量」與 BERT「依雙向前後文動態調整上下文向量」的核心差異。\n・❌ (C) 為什麼錯：Word2Vec 是文字詞向量模型；且 BERT 是「雙向」編碼器，能同時看前後文。\n・❌ (D) 為什麼錯：Word2Vec 時代還沒有自注意力機制，BERT 才是搭載自注意力機制的模型。", "has_caveat": 0, "caveat_note": null}, {"id": 292, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某科技大廠為了強化 AI 治理（AI Governance），決定導入國際標準框架，並建立一套完善的「異常處理與糾正機制」，確保當生成式 AI 系統上線後若發生嚴重失控或產生有害內容時，能第一時間緊急處置。\n請問關於 AI 治理的「國際通用標準框架代表」、「異常處理與糾正機制的 4 大要素」，以及「治理的生命週期與負責部門」，下列哪一項敘述完全正確？", "option_a": "國際標準框架代表為 ISO 42001 與美國 NIST AI RMF；異常處理包含「即時監控、錯誤回報、版本還原（Rollback）、人工介入（Kill Switch 緊急停機開關）」；且 AI 治理涵蓋「設計 ➔ 部署 ➔ 使用 ➔ 維護」全生命週期，需跨部門全員參與，絕非僅由 IT 部門單獨負責", "option_b": "AI 治理只要在系統「部署上線」的那一天檢查一次就徹底結束了，後續的使用與維護階段完全不需要再做任何監控", "option_c": "AI 治理純屬寫程式的技術問題，因此全公司只需要交給「IT 資訊部門」單獨負責即可，法務、業務與高階決策層完全不必參與", "option_d": "當系統上線發生失控時，因為 AI 具有自主權，人類工程師絕對不可以進行版本還原（Rollback）或按下緊急停機鈕（Kill Switch）", "correct_option": "A", "explanation": "・📍 對應重點章節：4.1 AI 治理核心原則 歐盟 AI 法案與治理制度\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們把企業做「AI 治理」比喻成「航空公司管理自動駕駛飛機」：\n・1. 國際標準體檢表（標準框架）：\n  ・照著國際標準 ISO 42001（國際 AI 管理系統標準）與 NIST AI RMF（美國 AI 風險管理框架）建立管理制度。\n・2. 飛機遇到亂流失靈時的「異常處理與糾正 4 部曲」：\n  ・① 即時監控（盯著儀表板） ➔ ② 錯誤回報（發出警報） ➔ ③ 版本還原 Rollback（退回上一版穩定的導航軟體） ➔ ④ 人工介入 Kill Switch（機長按下緊急停機鈕，手動接管方向盤！）。\n・3. 考場最愛考的兩大反面陷阱（必背！）：\n  ・⚠️ 陷阱一（時間）：AI 治理涵蓋 設計 ➔ 部署 ➔ 使用 ➔ 維護 全生命週期，絕非部署上線完就結束！\n  ・⚠️ 陷阱二（人員）：AI 治理需要 IT、法務、業務、高層跨部門全員參與，絕非僅由 IT 資訊部門單獨負責！\n\n【🔑 正確選項秒殺題眼】\n・國際 AI 治理標準框架 ➔ ISO 42001 ＆ NIST AI RMF\n・異常處理糾正 4 機制 ➔ 即時監控、錯誤回報、版本還原 (Rollback)、人工介入 (Kill Switch)\n・兩大排除陷阱 ➔ 絕非部署完就結束、絕非僅由 IT 部門負責！\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・✅ (A) 為什麼對：完整涵蓋國際標準框架、異常處理 4 機制、全生命週期治理與跨部門參與原則。\n・❌ (B) 為什麼錯：AI 模型上線後可能會隨環境資料改變而偏移或被惡意攻擊，必須在「使用與維護」階段持續監控治理。\n・❌ (C) 為什麼錯：AI 治理涉及法規合規、商業倫理與品牌風險，必須跨部門全員參與，不能只丟給 IT 部門。\n・❌ (D) 為什麼錯：以人為本的治理要求人類必須保有最終控制權（包含 Rollback 退回舊版與 Kill Switch 人工緊急介入停機）。", "has_caveat": 0, "caveat_note": null}, {"id": 293, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某動畫工作室的技術總監正在向新進員工講解「為什麼現代多模態影片生成系統（如 OpenAI 的 Sora）要把 Diffusion（擴散模型） 與 Transformer 結合在一起使用？」。\n關於這兩個模型在影片生成流程中各自扮演的「白話角色比喻」與「技術職責分工」，下列哪一位員工的理解最正確？", "option_a": "員工甲：「Transformer 是實際拿起畫筆、把每一幀畫面從隨機雜訊一步步去噪畫出來的『畫圖工人』，主導整個畫面像素的產生；而 Diffusion 則是只負責檢查英文文法錯字的工具。」", "option_b": "員工乙：「Diffusion 模型是負責把每一張（單幀）畫面細節從雜訊逐步去噪畫清楚的『畫圖工人』；而 Transformer 則像站在旁邊指揮的『導演或編劇』，它不直接動手畫畫，而是作為『引導模組（Guidance Module）』或『條件控制器（Condition Controller）』，負責理解前後文語意順序並控制每一幀接下來該畫什麼，確保跨幀連貫不閃爍。」", "option_c": "員工丙：「Sora 完全沒有使用 Diffusion 或 Transformer，它的底層是依靠『支援向量機（SVM）』加上『決策樹（Decision Tree）』與『字典規則』來畫出 60 秒影片。」", "option_d": "員工丁：「要讓 Transformer 讀懂圖片，只需要把整張圖片的檔案名稱轉成小寫即可，完全不需要將圖片切塊（Patches）或加上位置編碼（Positional Encoding）。」", "correct_option": "B", "explanation": "・📍 對應重點章節：1.8 多模態 AI 與影片生成技術\n\n【💡 生活化範例 ／ 具體情境秒懂】\n拍一部 AI 電影需要「畫師」跟「導演編劇」通力合作，我們把這對黃金拍檔的角色分清楚：\n・👷 Diffusion（擴散模型） ＝ 「實際動手作畫的畫圖工人」：\n  ・負責第 1 層「單幀畫面細節」——真正動手把每一格畫面從雪花雜訊一步步去噪畫出來，確保光影自然、畫質精細清晰。\n・🎬 Transformer ＝ 「站在旁邊指揮的導演或編劇（引導模組／條件控制器）」：\n  ・⚠️ 注意：Transformer 不直接動手畫畫（不是主導整個畫面的像素產生）！\n  ・它站在旁邊當「引導模組（Guidance Module）」或「條件控制器（Condition Controller）」，幫忙看懂長篇文字劇本的前後文語意順序（編劇導引），並指揮畫圖工人下一秒、下一幀該接什麼動作（導演控場），防止畫面閃爍跳戲！\n\n【🔑 正確選項秒殺題眼】\n・影片生成中 Diffusion 的角色 ➔ 「畫圖工人」（負責單幀畫面去噪與細節畫質）\n・影片生成中 Transformer 的角色 ➔ 「導演或編劇」（作為引導模組／條件控制器，管前後文語意順序與跨幀連貫，不直接畫畫！）\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：把「畫圖工人（Diffusion）」跟「導演編劇（Transformer）」的角色完全講反了（這是 1.8 節最愛考的頭號陷阱！）。\n・✅ (B) 為什麼對：精準呈現原著中「畫圖工人（Diffusion）＋ 導演編劇（Transformer 引導模組/條件控制器）」的分工邏輯。\n・❌ (C) 為什麼錯：多模態與影片生成底層結合的是「深度學習與神經網路（Diffusion + Transformer）」，考試常拿 SVM、決策樹、遺傳演算法或字典規則當錯誤誘答項。\n・❌ (D) 為什麼錯：Transformer 讀懂圖像必須經過 3 步曲：① 圖片切塊 (Patches 16×16) ➔ ② 攤平為數值向量 ➔ ③ 加上位置編碼 (Positional Encoding)。", "has_caveat": 1, "caveat_note": "Sora 實際採用 Diffusion Transformer（DiT），Transformer 本身就是執行去噪的主幹網路；「Diffusion 畫圖、Transformer 只指揮不動手」是筆記的簡化比喻。"}, {"id": 294, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國銀行正在進行大數據與 AI 轉型，數據工程師先從企業內部交易系統與外部公開網站收集了百億筆原始日誌，準備透過 ETL（提取 Extract ➔ 轉換 Transform ➔ 載入 Load） 流程進行清洗與轉換。同時，他需要評估兩種大型資料儲存架構：「資料倉儲（Data Warehouse）」與「資料湖（Data Lake）」。\n關於這兩大儲存架構的特性比較，以及執行海量數據 ETL 時最常搭配的開源分散式平行運算框架，下列敘述何者正確？", "option_a": "「資料倉儲」像大型倉庫一樣把照片、錄音等非結構化資料全部原封不動堆著，靈活性極高；「資料湖」則像 Excel 一樣整齊分格，只存結構化資料且靈活性極低", "option_b": "「資料倉儲」像 Excel 一樣整齊分格，只存整理好的結構化資料（查報表快，但靈活性低）；「資料湖」則像大型倉庫把原始資料（含文字、影音等非結構化資料）全部先原封不動堆著、要用時再分類（靈活性極高）；且海量數據 ETL 常搭配 Apache 的 Hadoop / Spark 進行大量平行運算", "option_c": "在數據分析領域中，目前最常見的 AI 應用是「手動紙本抄寫資料」，而生成式 AI 完全無法提供任何預測或模式探索功能", "option_d": "當問卷資料中發現某個欄位有高達 1/3（三分之一） 的比例漏填（缺失值）時，最標準且唯一的做法就是直接把那 1/3 的客戶資料全部刪除", "correct_option": "B", "explanation": "・📍 對應重點章節：1.12 資料基本概念 收集清理與前處理 ＆ 5.6 資料科學與開源社群平台\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「超市整齊貨架 vs 大型生鮮原物料倉庫」來區分 資料倉儲 與 資料湖：\n・資料倉儲（Data Warehouse） ＝ 「像 Excel 一樣整齊分格的超市貨架」：\n  ・進貨前必須先洗乾淨、切好、貼好標籤，只存整理好的結構化資料。\n  ・優缺點：主管要查財報超快，但因為格子定死了，靈活性低（塞不進影片或錄音檔）。\n・資料湖（Data Lake） ＝ 「全部先原封不動堆著的大型倉庫」：\n  ・不管是結構化表格、半結構化 JSON，還是社群留言、照片、影片、錄音等非結構化資料，全部先原封不動倒進湖裡堆著，等AI工程師要用時再撈出來分類，因此靈活性極高！\n・大數據平行運算雙雄 ＝ Apache Hadoop / Spark：\n  ・處理百億筆資料做 ETL（提取 ➔ 轉換 ➔ 載入） 時，單台電腦跑不動，常搭配 Hadoop / Spark 分散式框架平行加速！\n\n【🔑 正確選項秒殺題眼】\n・像 Excel 整齊分格、只存結構化、靈活性低 ➔ 資料倉儲（Data Warehouse）\n・全部先原封不動堆著要用再分、可存非結構化、靈活性高 ➔ 資料湖（Data Lake）\n・ETL 大數據平行運算框架 ➔ Hadoop / Spark\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：把「資料倉儲」與「資料湖」的定義與靈活性高低完全講反了！\n・✅ (B) 為什麼對：精確對比了資料倉儲與資料湖的特性，並正確配對 ETL 平行運算框架 Hadoop / Spark。\n・❌ (C) 為什麼錯：數據分析最常見的 AI 應用為「自動化資料清洗」；生成式 AI 改善傳統分析的方式正是「提供預測與模式探索」。\n・❌ (D) 為什麼錯：缺失值只有極少數漏填才能刪除；若漏填高達 1/3 絕對不可直接刪除（否則會損失大量重要資訊並造成樣本偏誤），應採用平均數、中位數或眾數進行填補！", "has_caveat": 0, "caveat_note": null}, {"id": 295, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某人工智慧實驗室正在訓練一個生成式語言模型，目前模型正在針對一句輸入計算下一個字的候選機率表。解碼層（Decoder Layer）算出了機率最高的前 5 個候選詞，機率由高到低依序為：\n> 「會」(50%)、「是」(30%)、「可能」(10%)、「變得」(7%)、「發生」(3%)\n如果工程師甲將抽樣策略設定為 Top-K 取樣（設 K = 3），而工程師乙將抽樣策略設定為 Top-P 核取樣（設 P = 0.8，即 80%）。請問在這次選字中，工程師甲與工程師乙的模型分別會保留哪幾個候選詞來進行抽籤？", "option_a": "工程師甲（Top-K, K=3）會保留「會、是」共 2 個詞；工程師乙（Top-P, P=0.8）會保留「會、是、可能、變得」共 4 個詞", "option_b": "工程師甲（Top-K, K=3）會保留「會、是、可能」共 3 個詞；工程師乙（Top-P, P=0.8）會保留「會、是」共 2 個詞（因為 50% + 30% = 80% 已達標，後面三個詞直接不看）", "option_c": "兩位工程師的模型都會死板固定保留全部 5 個詞，因為 Top-K 與 Top-P 都不會過濾任何冷門詞彙", "option_d": "工程師甲（Top-K, K=3）只會保留排名第 3 名的「可能」1 個詞；工程師乙（Top-P, P=0.8）只會保留機率大於 80% 的詞，因此留 0 個詞", "correct_option": "B", "explanation": "・📍 對應重點章節：1.5 Transformer 自注意力與解碼參數\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們直接拿題目給的 5 個候選詞（會 50%、是 30%、可能 10%、變得 7%、發生 3%）現場算一次：\n・工程師甲用 Top-K（設 K = 3） ➔ 「死板留前 3 名」：\n  ・K = 3 就是硬性規定只取機率最高的前 3 名：\n  ・🥇 第 1 名：會 (50%)\n  ・🥈 第 2 名：是 (30%)\n  ・🥉 第 3 名：可能 (10%)\n  ・➔ 共保留「會、是、可能」3 個詞（第 4、5 名踢掉）。\n・工程師乙用 Top-P（設 P = 0.8，即 80%） ➔ 「從第 1 名往下加總，湊滿 80% 就停！」：\n  ・從第 1 名開始把機率加起來：\n  ・會 (50%) ＋ 是 (30%) ＝ 80%（剛好湊滿 0.8 達標了！）\n  ・➔ 只保留「會、是」這 2 個詞，後面的 可能 (10%)、變得 (7%)、發生 (3%) 直接不看！\n\n【🔑 正確選項秒殺題眼】\n・Top-K (K=3) ➔ 固定挑機率最高的前 3 個詞（會、是、可能）\n・Top-P (P=0.8) ➔ 累加機率達 80% 即停（50% + 30% = 80%，只留 會、是 2 個詞）\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：把 Top-K（留 3 個）與 Top-P（留 2 個）的計算結果搞反了。\n・✅ (B) 為什麼對：完全符合原著中 5 個候選詞演算 Top-K (K=3) 與 Top-P (P=0.8) 的標準結果。\n・❌ (C) 為什麼錯：Top-K 與 Top-P 的核心目的就是踢掉機率太低的冷門詞，避免 AI 選出不合邏輯的怪字。\n・❌ (D) 為什麼錯：Top-K 是保留「前 K 名」而非只留「第 K 名」；Top-P 是「從高到低累加機率達 P」，而非單一詞機率必須大於 P。", "has_caveat": 1, "caveat_note": "原始題幹「目前模型กำลัง針對」夾雜亂碼泰文，已校正為「目前模型正在針對」，不影響題意與答案。"}, {"id": 296, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某新創公司的產品經理正在規劃一套複雜的 AI 客訴處理流程，他決定採用提示工程（Prompt Engineering）中的「框架提示（Framework Prompting）」，讓 ChatGPT 不只是被動「回答問題」，而是具備主動「解決問題」的能力。\n為了將這項大型複雜任務拆解為一套標準流程，請問提示工程中「任務執行的 3 大原則」依序為何？且除了 3W + COSEED 之外，下列哪一組縮寫也屬於提示工程中常見的基本結構化框架提示模板？", "option_a": "任務 3 原則：① 分解任務（把大型任務拆成小步驟） ➔ ② 審核評估（判斷回答有無切中目標） ➔ ③ 反覆運算提問（根據評估結果修正問題再試一次）；常見框架模板包含 TAG、CARE、TRACE、RTF、ICIO", "option_b": "任務 3 原則：① 直接放棄拆解 ➔ ② 盲目相信第一次回答 ➔ ③ 嚴禁修改提問；常見框架模板包含 CNN、RNN、GAN、VAE", "option_c": "任務 3 原則：① 收集硬體顯卡 ➔ ② 計算均方誤差 MSE ➔ ③ 執行反向傳播；常見框架模板包含 GDPR、HIPAA、PDPA", "option_d": "任務 3 原則：① 轉小寫 ➔ ② 去停用詞 ➔ ③ 詞幹提取；常見框架模板包含 F1-score、BLEU、R-square", "correct_option": "A", "explanation": "・📍 對應重點章節：2.2 提示工程 原則 咒語 框架提示與三大思維推理\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們把「框架提示（Framework Prompting）」當成「專案經理帶實習生解決大專案的 3 部曲」：\n・第 1 步 分解任務：\n  ・不要一口氣丟給實習生「幫我辦好十週年年會」這麼大的題目，而是把它拆解成「先想主題 ➔ 再排議程 ➔ 最後寫邀請函」的小步驟。\n・第 2 步 審核評估：\n  ・實習生交出第一版草稿後，主管先檢查有沒有切中目標、哪裡漏掉了。\n・第 3 步 反覆運算提問：\n  ・根據剛剛檢查出的問題，修正你的指令再讓他試一次（迭代優化），直到完美解決問題！\n・5 大常見結構化提示框架縮寫（考場看到認出「它們都是 Prompt 框架模板」即可！）：\n  ・TAG（Task, Action, Goal）\n  ・CARE（Context, Action, Result, Example）\n  ・TRACE（Task, Request, Action, Context, Example）\n  ・RTF（Role, Task, Format）\n  ・ICIO（Instruction, Context, Input data, Output indicator）\n\n【🔑 正確選項秒殺題眼】\n・提示工程任務執行 3 原則 ➔ ① 分解任務 ➔ ② 審核評估 ➔ ③ 反覆運算提問\n・常見基本結構化框架縮寫 ➔ 3W + COSEED、TAG、CARE、TRACE、RTF、ICIO\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・✅ (A) 為什麼對：完整且正確地列出任務執行 3 原則與 5 大常見結構化框架縮寫。\n・❌ (B) 為什麼錯：前半違背提示工程迭代精神；後半 CNN / RNN / GAN / VAE 是神經網路模型，非提示框架。\n・❌ (C) 為什麼錯：前半是模型訓練步驟；後半 GDPR / HIPAA / PDPA 是資料隱私法規。\n・❌ (D) 為什麼錯：前半是 NLP 自然語言前處理步驟；後半 F1 / BLEU / R-square 是模型評估指標。", "has_caveat": 0, "caveat_note": null}, {"id": 297, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國銀行的系統架構師為了快速推出一款全方位的「AI 智能理財顧問系統」，沒有選擇從頭自行訓練模型，而是像組裝拼裝車一樣，將不同外部廠商提供的商業 API、第三方語音合成模組以及網路上來路不明的開源微調模型拼裝組合在一起。\n結果上線後，其中一個第三方開源模組因為內含嚴重的演算法偏誤與資安後門，導致整套銀行理財系統跟著崩潰並做出錯誤投資建議。請問這種因為串接外部不同來源元件而導致整體系統受牽連的漏洞，屬於「系統層面 4 大內建風險」中的哪一項？", "option_a": "協力廠商模型的不確定性（一旦其中一個第三方元件內含偏誤或漏洞，就會連帶影響整個系統的穩定性與可靠性）", "option_b": "單層感知器的線性分類限制", "option_c": "擴散模型的正向加噪過程", "option_d": "批次正規化（Batch Normalization）的數值縮放效應", "correct_option": "A", "explanation": "・📍 對應重點章節：4.3 生成式 AI 著作權 深度偽造 (Deepfake) 與系統風險\n\n【💡 生活化範例 ／ 具體情境秒懂】\nAI 系統層面有 「4 大內建漏洞（風險）」，我們用生活例子一行一個看穿：\n・風險 ① 資料偏見與歧視：\n  ・AI 從過去帶有性別／種族歧視的歷史資料中學習，結果把人類的偏見直接複製過來。\n・風險 ② 可解釋性與透明度不足：\n  ・深度神經網路像「黑箱」，算出了結果卻說不出為什麼這樣決定（需靠 LIME / SHAP 拆解）。\n・風險 ③ 資安與惡意使用的風險：\n  ・被駭客惡意提示注入（Prompt Injection），或被壞人拿去寫釣魚信與病毒。\n・風險 ④ 協力廠商模型的不確定性（拼裝車／火鍋食材供應商風險，對應本題！）：\n  ・就像一家火鍋店自己不種菜，而是跟 A 廠商買肉、B 廠商買沙茶醬、C 廠商買凍豆腐（由不同來源的 API 或開源模型拼裝組成）；一旦其中一家協力廠商的食材有毒（內含偏誤或漏洞），整鍋端給客人的火鍋就會連帶出事！\n\n【🔑 正確選項秒殺題眼】\n・看到「由不同來源 API 或開源模型拼裝、單一元件偏誤或漏洞連帶影響整體系統穩定性與可靠性」 ➔ 秒選 「協力廠商模型的不確定性」！\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・✅ (A) 為什麼對：精準對應系統層面四大風險中的「協力廠商模型的不確定性」。\n・❌ (B) 為什麼錯：單層感知器無法解 XOR 非線性問題屬於早期模型能力限制，與第三方 API 拼裝風險無關。\n・❌ (C) 為什麼錯：正向加噪是擴散模型（Diffusion）訓練時的正常步驟。\n・❌ (D) 為什麼錯：批次正規化（BN）是穩定深層網路訓練的正面技巧。", "has_caveat": 0, "caveat_note": null}, {"id": 298, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某野生動物保育機構在森林中架設了紅外線自動相機，並導入 卷積神經網路（CNN, Convolutional Neural Network） 來自動辨識拍到的動物是不是瀕危的「臺灣石虎」。\n當一張森林照片輸入 CNN 後，會依序經過「① 卷積層（Convolutional Layer） ➔ ② 池化層（Pooling Layer） ➔ ③ 全連接層（Fully Connected Layer）」三道流水線關卡。請問這三層在看圖辨識石虎時，各自負責什麼核心工作？", "option_a": "卷積層負責將語音轉成文字；池化層負責用自注意力機制算前後文；全連接層負責從雜訊去噪畫出新石虎", "option_b": "卷積層負責掃描圖片「找局部特徵」（如石虎耳後的白斑、身上的斑紋）；池化層負責「降維並記住重要資訊」（濾除背景樹葉雜訊、縮小資料量）；全連接層負責「整合所有特徵」並做出最終分類決策（判定 98% 是石虎）", "option_c": "卷積層負責把圖片砍成 0；池化層負責把圖片放大十倍（超解析重建）；全連接層負責執行遺忘門與重置門", "option_d": "這三層都是用來處理時間序列與語音順序的循環連結機制，完全無法處理二維空間網格的影像資料", "correct_option": "B", "explanation": "・📍 對應重點章節：1.2 CNN vs RNN\n\n【💡 生活化範例 ／ 具體情境秒懂】\n把 CNN（卷積神經網路） 想像成一位拿著放大鏡看照片的「拼圖偵探」，看圖分成三步走：\n・第 1 關 卷積層（Convolutional Layer） ＝ 「拿放大鏡掃描找特徵」：\n  ・在照片上一格一格掃描，抓出石虎的「耳後白斑、眼角白線、身上豹紋」等局部空間特徵。\n・第 2 關 池化層（Pooling Layer） ＝ 「濾掉背景雜訊、降維記重點」：\n  ・照片裡後面的樹葉、石頭太佔記憶體了！池化層把圖片縮小降維，只保留最關鍵的特徵（記住重要資訊），減輕運算負擔。\n・第 3 關 全連接層（Fully Connected Layer, FC） ＝ 「總探長整合線索下判決」：\n  ・把前面找到的「耳後白斑＋眼角白線＋豹紋」全部整合起來，拍板定案：「這張照片有 98% 機率是臺灣石虎！」\n\n【🔑 正確選項秒殺題眼】\n・CNN 三大層分工口訣 ➔ 卷積層「找特徵」 ➔ 池化層「記住重要資訊（降維）」 ➔ 全連接層「整合特徵做分類決策」！\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：語音轉文字屬 RNN/TTS，自注意力屬 Transformer，去噪畫新圖屬 Diffusion；CNN 是鑑別式影像分類模型。\n・✅ (B) 為什麼對：完美對應卷積層、池化層、全連接層在視覺辨識流水線中的標準職責。\n・❌ (C) 為什麼錯：池化層是「降維縮小」而非超解析放大；遺忘門與重置門則是 LSTM / GRU 的機制。\n・❌ (D) 為什麼錯：CNN 專攻的正是「二維空間與網格資料（影像、照片）」，處理時間序列的才是 RNN。", "has_caveat": 0, "caveat_note": null}, {"id": 299, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國科技媒體正在整理一份「亞洲與全球新興 AI 工具及模型對照指南（第五部分工具總覽）」，帶領讀者認識幾款在開源界、長文本閱讀、短影音生成與自主代理領域大放異彩的代表性產品：\n1. 由深度求索（DeepSeek）推出，採用開源權重（MoE 專家混合 ＋ RL 強化學習推理），以高性價比與深度思維鏈邏輯推理聞名的模型家族。\n2. 由阿里巴巴（Alibaba Cloud）推出，與 LLaMA、DeepSeek 並列為全球主流開源與多模態大型語言模型代表的家族。\n3. 由快手（Kuaishou）推出，採用 3D 時空注意力 Diffusion Transformer，主打輸入照片或文字即可生成大幅度真實物理動態長秒數短片的 AI 影片工具。\n4. 通用型自主 AI Agent（智慧代理）代表，能自己拆解複雜任務、自動操作瀏覽器查詢並直接交付完整報告或成果的產品。\n請問上述第 1、2、3、4 款產品依序對應下列哪一組名稱？", "option_a": "1：DeepSeek (V3 / R1) ／ 2：Qwen（通義千問） ／ 3：KlingAI（可靈） ／ 4：Manus", "option_b": "1：Grok ／ 2：Claude 3 ／ 3：DALL·E 3 ／ 4：Grammarly", "option_c": "1：TAIDE ／ 2：BERT ／ 3：remove.bg ／ 4：ZeroGPT", "option_d": "1：Apple Intelligence ／ 2：Amazon Bedrock ／ 3：ElevenLabs ／ 4：Kaggle", "correct_option": "A", "explanation": "・📍 對應重點章節：5.1 文本與對話語言模型 ＆ 5.3 影片生成與剪輯工具 ＆ 5.7 開發商矩陣與 Top 50 工具\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們把這四款新世代超熱門的 AI 模型與工具一行一個對號入座：\n・1. DeepSeek (V3 / R1)（深度求索 ➔ 開源高性價比＋R1 深度推理黑馬）：\n  ・主打開源權重與強化學習深度思維鏈推理，企業可低成本本地部署（對應第 1 款）。\n・2. Qwen（通義千問）（阿里巴巴 ➔ 亞洲開源大模型代表）：\n  ・阿里巴巴開發的開源大模型家族（⚠️ 區分：字節跳動是 豆包 Doubao、月之暗面是主打超長文本的 Kimi，對應第 2 款）。\n・3. KlingAI（可靈）（快手 ➔ 高動態物理模擬 AI 生影片代表）：\n  ・常與 Sora、Runway、Pika 並列比較的熱門 AI 影片生成平台（對應第 3 款）。\n・4. Manus（通用型自主 AI Agent 智慧代理代表）：\n  ・不只跟你聊天，還能像真人助理一樣自己拆解任務、自己開瀏覽器查資料並交出最終報告成果（對應第 4 款）。\n\n【🔑 正確選項秒殺題眼】\n・深度求索開源推理大模型 ➔ DeepSeek (V3 / R1)\n・阿里巴巴開源大模型 ➔ Qwen（通義千問）\n・快手高擬真物理動態生影片工具 ➔ KlingAI（可靈）\n・通用型自主拆解任務 AI Agent ➔ Manus\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・✅ (A) 為什麼對：四款新興代表性模型與工具的開發商及核心功能完全正確。\n・❌ (B) 為什麼錯：Grok 為馬斯克 xAI 開發、Claude 3 為 Anthropic 閉源模型、DALL·E 3 為靜態畫圖工具、Grammarly 為英文文法檢查工具。\n・❌ (C) 為什麼錯：TAIDE 為臺灣國科會繁中模型、BERT 為 Google 鑑別式模型、remove.bg 為去背工具、ZeroGPT 為 AI 文章檢測器。\n・❌ (D) 為什麼錯：Apple Intelligence 為蘋果手機端系統、Bedrock 為 AWS 企業託管平台、ElevenLabs 為語音合成、Kaggle 為資料科學競賽平台。", "has_caveat": 0, "caveat_note": null}, {"id": 300, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "一家智慧農業新創正在訓練一套「溫室番茄產量預測深度神經網路」。實習生在撰寫技術報告時寫道：「當損失函數計算出預測產量與實際產量的誤差後，『反向傳播（Backpropagation）』演算法就會直接動手修改神經網路每一層的權重（w），而且我們還能選用『LDA』作為神經網路的最佳化器（Optimizer）來加速收斂。」請問資深工程師該如何修正實習生的這兩個觀念錯誤？", "option_a": "實習生完全正確，反向傳播本來就會直接修改權重，且 LDA 是最常用的神經網路最佳化器", "option_b": "反向傳播只負責計算預測產量的「均方誤差（MSE）」，真正負責往回傳遞誤差的是「正向傳播」，而 LDA 則是負責防止梯度消失的啟動函數", "option_c": "反向傳播只負責「反向傳遞誤差並計算梯度（修正方向）」，並不會直接修改權重；真正負責根據梯度動手修改權重的是「梯度下降（Gradient Descent）」搭配如 SGD 或 Adam 等最佳化器，而 LDA（線性判別分析） 是監督式降維演算法，並非神經網路最佳化器", "option_d": "反向傳播與梯度下降都只能在測試集（Test Set）上執行，且神經網路唯一的最佳化器只有 ReLU", "correct_option": "C", "explanation": "・📍 對應重點章節：1.1 神經網路基礎 感知器與反向傳播、1.10 模型最佳化 訓練技巧與過擬合\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「考完試檢討考卷」來區分神經網路訓練的四大分工：\n・損失函數（MSE）＝「算總共扣幾分」：計算預測值與真實值的誤差平方平均。\n・反向傳播（Backpropagation）＝「拿紅筆從最後一題往回抓戰犯、標出修正方向（算梯度）」：它只負責從輸出層往回推算每個權重該對誤差負多少責任（計算梯度），絕對不會直接動手改權重！\n・梯度下降（Gradient Descent）＋ 最佳化器（SGD / Momentum / RMSprop / Adam / AdaGrad）＝「實際拿橡皮擦動手改答案（更新權重）」：順著反向傳播算出的下坡方向，實際調整權重 w 與偏移 b。\n・LDA（線性判別分析）＝「分類降維工具（冒牌貨）」：LDA 是機器學習用來降維分類的演算法，絕對不是用來更新權重的最佳化器！\n\n【🔑 正確選項秒殺題眼】\n・看到「反向傳播的角色」 ➔ 秒選 「計算梯度與反向傳遞誤差（不直接修改權重，修改權重是梯度下降的工作）」\n・看到「何者不是最佳化器（Optimizer）」 ➔ 秒選 「LDA（線性判別分析）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：完美踩中認證考試兩大高頻陷阱！反向傳播不直接改權重，且 LDA 不是最佳化器。\n・❌ (B) 為什麼錯：算 MSE 是損失函數的工作；正向傳播是由前往後做預測；ReLU 才是啟動函數。\n・✅ (C) 為什麼對：精準釐清「反向傳播算梯度」與「梯度下降＋最佳化器（SGD/Adam）改權重」的分工，並點破 LDA 為監督式降維演算法而非最佳化器。\n・❌ (D) 為什麼錯：參數更新只能在「訓練集」上執行（測試集期末考絕不可動參數），且 ReLU 是啟動函數而非最佳化器。", "has_caveat": 0, "caveat_note": null}, {"id": 301, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某大型金控的研究員在撰寫給 LLM 的提示詞時，使用了兩種技巧：\n・技巧一（標示符號）：在提示詞中寫道「請閱讀這份 {2025年第四季半導體產業研究報告} 並分析其供應鏈風險」。\n・技巧二（思維框架）：要求 AI 面對這份長達 80 頁的冗長報告時，先將內容拆解出核心骨架大綱，再重新建構濃縮成一頁高階主管摘要。\n請問技巧一中符號 {} 的真正用意為何？而技巧二又是運用了哪一種進階思維推理框架？", "option_a": "{} 代表「可隨時替換的程式變數」；技巧二為「思維樹（Tree of Thoughts, ToT）」", "option_b": "{} 的用意是「區隔關鍵資訊（Separator）」，幫助 AI 清楚辨識重點標的；技巧二為從內容拆解到重構的濃縮摘要技術「思維骨架（Skeleton of Thought, SoT）」", "option_c": "{} 代表「需要被刪除的停用詞」；技巧二為「零樣本提示（Zero-Shot Prompting）」", "option_d": "{} 的用意是「增加提示詞的字數長度」；技巧二為「人類回饋強化學習（RLHF）」", "correct_option": "B", "explanation": "・📍 對應重點章節：2.2 提示工程 原則 咒語 框架提示與三大思維推理\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這題結合了提示工程最常考的「標示符號陷阱」與「長文濃縮框架」：\n・為什麼在提示詞裡加 {} 或 \"\"？（拿螢光筆框起來）：當你寫「觀看一部 {小說} 並評論」或「分析 {研究報告}」時，加上大括號 {} 是為了把關鍵詞跟旁邊的普通文字隔開，也就是「區隔關鍵資訊」（對應 COSEED 中的 S - Separator）。千萬別用寫程式的習慣誤選「可替換的資訊」！\n・為什麼濃縮長篇報告要選 SoT（思維骨架）？（先拆骨架、再填重點肉）：面對冗長文本，思維骨架（SoT）會先把長文拆解成結構化骨架，再重新組合成精煉的「濃縮摘要」，專門用來總結冗長的文本！\n\n【🔑 正確選項秒殺題眼】\n・看到「提問中使用符號 {} 或 \"\" 的用意」 ➔ 秒選 「區隔關鍵資訊（排除：可替換的資訊）」\n・看到「從內容拆解到重構、濃縮摘要、總結冗長文本」 ➔ 秒選 「思維骨架（SoT, Skeleton of Thought）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：「可替換的資訊」是認證考試針對 {} 設計的頭號誘答陷阱；而 ToT（思維樹）是用於多路徑探索與回溯解題，並非專攻長文拆解濃縮。\n・✅ (B) 為什麼對：完全符合教材規範：{} 用於區隔關鍵資訊，而 SoT（思維骨架）專為拆解重構、總結冗長文本而生。\n・❌ (C) 為什麼錯：停用詞移除是 NLP 前處理步驟；Zero-Shot 是不給範例直接提問。\n・❌ (D) 為什麼錯：提示工程強調簡潔，不追求無意義加長字數；RLHF 是模型微調對齊技術而非提示框架。", "has_caveat": 0, "caveat_note": null}, {"id": 302, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某電商巨頭的 AI 實驗室本季要驗收三個不同團隊開發的模型：\n・團隊一（金融盜刷偵測模型）：在 10,000 筆交易中只有 10 筆是真盜刷（嚴重的「資料不平衡」），需要一個能同時兼顧精確率（Precision）與召回率（Recall）的分類評估指標。\n・團隊二（雙十一各門市營業額預測模型）：任務是預測下個月的「連續具體金額數字」，需要衡量數值預測有多準確。\n・團隊三（跨國買家買賣訊息自動翻譯與客服機器人）：需要透過比對 N-gram 詞彙重疊度與簡短懲罰，評估機器翻譯與聊天機器人生成句子的品質。\n請問這三個團隊應該分別採用哪一組核心演算法評估指標？", "option_a": "團隊一：Accuracy（準確率） ／ 團隊二：BLEU ／ 團隊三：R-square (R²)", "option_b": "團隊一：R-square (R²) ／ 團隊二：F1-score ／ 團隊三：用戶滿意度問卷", "option_c": "團隊一：F1-score（精確率與召回率之調和平均數） ／ 團隊二：R-square（R² 決定係數） ／ 團隊三：BLEU（雙語評估替補指標）", "option_d": "團隊一：ROC-AUC ／ 團隊二：BLEU ／ 團隊三：F1-score", "correct_option": "C", "explanation": "・📍 對應重點章節：1.14 模型評估指標 F1-score R-squared 與 BLEU\n\n【💡 生活化範例 ／ 具體情境秒懂】\n三大任務（分類、迴歸、文本生成）各有專屬的「黃金成績單」，絕對不能拿錯尺來量：\n・團隊一（資料不平衡的分類是非題）＝ 選 F1-score：10,000 筆只有 10 筆盜刷，若看一般準確率（Accuracy），笨模型全猜正常也有 99.9% 高分卻漏掉所有盜刷！F1-score 是精確率與召回率的「調和平均數」，只要一邊是 0 總分直接歸零，是資料不平衡時的最佳分類指標。\n・團隊二（猜連續數字的迴歸填充題）＝ 選 R-square (R² 決定係數)：專門衡量房價、銷量、營業額等連續數值預測準不準，越接近 1 越準。\n・團隊三（翻譯與聊天機器人造句題）＝ 選 BLEU：透過 N-gram 詞彙重疊度與簡短懲罰（防 AI 偷懶只回一兩個字），專門評估機器翻譯與聊天機器人回答品質。\n\n【🔑 正確選項秒殺題眼】\n・看到「資料不平衡分類、精確率與召回率的調和平均數」 ➔ 秒選 「F1-score」\n・看到「連續數值預測（迴歸任務）」 ➔ 秒選 「R-square (R²)」\n・看到「評估機器翻譯或聊天機器人回答品質的演算法指標」 ➔ 秒選 「BLEU（排除用戶滿意度、對話次數、ROC-AUC）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：資料極度不平衡時看 Accuracy 會被 99.9% 的假高分欺騙；且 BLEU 與 R² 的適用任務完全顛倒。\n・❌ (B) 為什麼錯：R² 不能用於分類，F1-score 不能用於數值迴歸；且考題問演算法指標時，「用戶滿意度問卷」屬於主觀業務指標，為必避開的干擾項。\n・✅ (C) 為什麼對：完美對應分類（F1-score）、迴歸（R²）與文本生成/翻譯（BLEU）三大評估指標。\n・❌ (D) 為什麼錯：BLEU 不能評估營業額迴歸，F1-score 也不能評估翻譯句子品質。", "has_caveat": 0, "caveat_note": null}, {"id": 303, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國廣告代理商在執行三個不同的視覺專案時，面臨工具與技術的選擇：\n1. 專案甲（商業授權絕對安全）：客戶是上市銀行，嚴格要求 AI 生成的海報素材必須「100% 使用合法授權圖庫與公共領域素材訓練」，確保商業使用完全不會吃上版權官司。\n2. 專案乙（開源免費、公司內網本地部署）：科技客戶希望使用由 Stability AI 開發、基於潛在擴散模型（LDM）的「開源免費」模型，直接架設在公司內部電腦上並自由修改權重。\n3. 專案丙（老舊模糊產品照畫質翻新）：老牌食品廠提供了一張 20 年前解析度極低、細節模糊的招牌產品照，希望能透過 AI 自動腦補並補齊遺失的細節紋理，讓圖片變得高清銳利。\n請問專案甲、乙、丙應分別選擇哪一項工具或技術？", "option_a": "專案甲：Midjourney ／ 專案乙：DALL·E 3 ／ 專案丙：黑白轉彩色（Colorization）", "option_b": "專案甲：Adobe Firefly ／ 專案乙：Stable Diffusion ／ 專案丙：超解析重建（SR, Super-Resolution）", "option_c": "專案甲：DreamStudio ／ 專案乙：Midjourney ／ 專案丙：模糊處理（Blurring）", "option_d": "專案甲：Stable Diffusion ／ 專案乙：Adobe Firefly ／ 專案丙：降低解析度（Downsampling）", "correct_option": "B", "explanation": "・📍 對應重點章節：1.7 擴散模型 (Diffusion)\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這三個需求分別對應影像生成領域最常考的三個專屬王牌：\n・專案甲（怕版權官司的商業客戶）＝ 選 Adobe Firefly：完全使用 Adobe Stock 合法授權素材與無版權爭議資料訓練，主打「商業使用安全無虞」，深度整合於 Photoshop。\n・專案乙（開源免費＋本地部署自己改）＝ 選 Stable Diffusion：由 Stability AI 推出，是全球最知名的開源免費生圖模型（基於 LDM 降低顯卡門檻），可下載回自己電腦離線跑。\n・專案丙（模糊老照片變高清細節）＝ 選 超解析重建（SR, Super-Resolution）：AI 像高超的畫作修復師，自動推理並補齊模糊照片遺失的毛孔與紋理，是「使圖片細節更清晰、提升解析度」的唯一正解！\n\n【🔑 正確選項秒殺題眼】\n・看到「合法授權素材訓練、商用版權安全」 ➔ 秒選 「Adobe Firefly」\n・看到「Stability AI 開發、開源免費、本地部署」 ➔ 秒選 「Stable Diffusion」\n・看到「使圖片細節更清晰、提升解析度」 ➔ 秒選 「超解析重建（SR）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：DALL·E 3 是 OpenAI 的閉源商業服務（無法開源本地部署）；「黑白轉彩色」只負責幫灰階照片塗上顏色，無法提升清晰度與解析度。\n・✅ (B) 為什麼對：精準配對商用版權安全的 Adobe Firefly、開源本地部署的 Stable Diffusion，以及提升細節清晰度的 超解析重建（SR）。\n・❌ (C) 為什麼錯：Midjourney 是閉源商業平台；「模糊處理」反而會消除畫面細節邊緣。\n・❌ (D) 為什麼錯：「降低解析度」會讓照片變成模糊馬賽克，與專案丙需求完全相反。", "has_caveat": 0, "caveat_note": null}, {"id": 304, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國企業導入大語言模型（LLM）協助日常辦公，資訊長將員工的日常使用情境歸納為三大應用模式：\n・模式甲：把長達 50 頁的英文董事會會議紀錄，提煉成 5 點核心結論摘要。\n・模式乙：把客服人員寫的口語化中文回覆草稿，改寫成正式商務日文信件，並將一段業務描述轉寫成 SQL 查詢程式碼。\n・模式丙：只輸入一句「母親節環保保溫杯促銷活動」，讓 AI 自動發想並撰寫出一份完整的千字社群行銷企劃書與 5 封廣告推播信。\n請問模式甲、乙、丙分別對應 LLM 的哪三大基本應用模式？", "option_a": "模式甲：轉換（Transform） ／ 模式乙：縮減（Reduction） ／ 模式丙：擴展（Expansion）", "option_b": "模式甲：縮減（Reduction） ／ 模式乙：轉換（Transform） ／ 模式丙：擴展（Expansion）", "option_c": "模式甲：擴展（Expansion） ／ 模式乙：轉換（Transform） ／ 模式丙：縮減（Reduction）", "option_d": "模式甲：預訓練（Pre-training） ／ 模式乙：微調（Fine-tuning） ／ 模式丙：檢索增強（RAG）", "correct_option": "B", "explanation": "・📍 對應重點章節：2.1 大語言模型 (LLM) 原理 微調與應用模式\n\n【💡 生活化範例 ／ 具體情境秒懂】\n判斷 LLM 的三大應用模式，只要看「輸入與輸出的資訊量與形式變化」就能一秒破題：\n・模式甲（多 ➔ 少）＝ 縮減（Reduction）：把 50 頁長文濃縮成 5 點摘要、從海量評論提取關鍵重點，資訊量「由多變少」。\n・模式乙（A 形式 ➔ B 形式）＝ 轉換（Transform）：核心意思不變，但換了一種語言或外衣！例如中翻日、口語轉正式公文、自然語言轉 SQL 程式碼、文法糾錯。\n・模式丙（少 ➔ 多）＝ 擴展（Expansion）：給一顆種子長成一棵大樹！只輸入一句主題，讓 AI 無中生有擴寫出完整企劃書、故事腳本或行銷文案，資訊量「由少變多」。\n\n【🔑 正確選項秒殺題眼】\n・看到「長文摘要、提取重點（多 ➔ 少）」 ➔ 秒選 「縮減（Reduction）」\n・看到「翻譯、改寫語氣、自然語言轉程式碼（A 形式 ➔ B 形式）」 ➔ 秒選 「轉換（Transform）」\n・看到「一句主題生成完整企劃書或長文（少 ➔ 多）」 ➔ 秒選 「擴展（Expansion）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：將模式甲（摘要縮減）與模式乙（翻譯與格式轉換）顛倒了。\n・✅ (B) 為什麼對：完全符合「縮減（多變少）、轉換（A 形式變 B 形式）、擴展（少變多）」的三大應用模式分類。\n・❌ (C) 為什麼錯：將縮減與擴展完全顛倒。\n・❌ (D) 為什麼錯：預訓練、微調與 RAG 是模型的訓練與強化技術階段，而非日常任務的輸入輸出應用模式。", "has_caveat": 0, "caveat_note": null}, {"id": 305, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某數位媒體集團旗下有三個部門正在採購文字轉語音（TTS）工具：\n1. 銀行智能電話客服部：需要全天候 24 小時穩定運作、低延遲，且能與企業雲端客服系統無縫串接的語音服務。\n2. 3A 奇幻電玩開發部：需要為遊戲裡的精靈、矮人與反派魔王錄製充滿戲劇張力、憤怒或悲傷等「情緒化角色配音」。\n3. 線上課程與 Podcast 製作部：需要咬字極度自然、擬真度極高且支援聲音克隆（Voice Cloning）的 AI 人聲來錄製長篇有聲書與教學旁白。\n請問這三個部門最推薦分別選用哪一組 TTS 工具？", "option_a": "銀行客服：Replica Studios ／ 電玩角色：Google TTS ／ 有聲書與教學：Canva", "option_b": "銀行客服：Google TTS / Azure Speech ／ 電玩角色：Replica Studios ／ 有聲書與教學：ElevenLabs / LOVO AI", "option_c": "銀行客服：ElevenLabs ／ 電玩角色：AIVA ／ 有聲書與教學：TurboScribe", "option_d": "銀行客服：Suno ／ 電玩角色：Play.ht ／ 有聲書與教學：ZeroGPT", "correct_option": "B", "explanation": "・📍 對應重點章節：3.3 聲音 (TTS) 與音樂生成應用\n\n【💡 生活化範例 ／ 具體情境秒懂】\nTTS 語音工具各有專精的戰場，找對專家才不會事倍功半：\n・銀行電話客服（求高穩定、低延遲、企業串接）＝ 選 Google TTS / Azure Speech：雲端大廠提供的企業級 API，穩定度最高、回應最快，最適合客服機器人。\n・電玩與動畫角色（求情緒化戲劇張力）＝ 選 Replica Studios：專攻遊戲、動畫與故事創作的 AI 角色配音演員庫，能表現生動的情緒起伏。\n・教學影片、有聲書與行銷旁白（求極致擬真真人咬字）＝ 選 ElevenLabs / LOVO AI / Play.ht：目前市面上擬真度最高、最像真人在耳邊講話的頂級配音與聲音克隆工具。\n\n【🔑 正確選項秒殺題眼】\n・看到「語音客服與機器人（高穩定、低延遲）」 ➔ 秒選 「Google TTS / Azure Speech」\n・看到「遊戲動畫角色配音、故事創作」 ➔ 秒選 「Replica Studios」\n・看到「教學影片、Podcast 有聲書、高擬真聲音克隆」 ➔ 秒選 「ElevenLabs / LOVO AI」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：將客服與遊戲角色的工具配反了；且 Canva 是平面設計工具而非專屬有聲書 TTS。\n・✅ (B) 為什麼對：完全符合教材 3.3 節五大 TTS 應用場景與代表工具的精準配對。\n・❌ (C) 為什麼錯：AIVA 是古典配樂作曲工具（不會講話配音）；TurboScribe 是語音轉文字（STT 聽寫逐字稿）工具，方向相反。\n・❌ (D) 為什麼錯：Suno 是生成流行歌唱與伴奏的音樂工具；ZeroGPT 是 AI 文章偵測器。", "has_caveat": 0, "caveat_note": null}, {"id": 306, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "一款修圖 App 推出了熱門的「名畫濾鏡（神經風格轉換, Neural Style Transfer, NST）」功能：使用者只要上傳一張自己站在「台北 101 大樓前」的旅遊照片（照片 A），並選擇梵谷的《星夜》名畫（圖片 B），AI 就能合成出一張「保留台北 101 建築與人物輪廓，但天空與街道充滿梵谷狂野漩渦筆觸與藍黃配色」的藝術照。請問這項技術底層主要是依靠哪一種神經網路？它又是如何分工抓取照片 A 與圖片 B 的特徵？", "option_a": "依靠 RNN（循環神經網路）；利用遺忘門記住台北 101 的輪廓，利用輸出門畫出梵谷的筆觸", "option_b": "依靠 CNN（卷積神經網路）；利用「較深層」抓取照片 A 的建築與物體大輪廓（內容 Content），並利用「較淺層」抓取名畫 B 的局部筆觸、紋理與配色（風格 Style）", "option_c": "依靠 CNN（卷積神經網路）；利用「較淺層」抓取照片 A 的建築大輪廓，並利用「較深層」抓取名畫 B 的細微筆觸與配色", "option_d": "依靠 Seq2Seq；將照片 A 與圖片 B 壓縮成單一固定長度的語意向量 V₁ 後直接相減", "correct_option": "B", "explanation": "・📍 對應重點章節：1.2 CNN vs RNN\n\n【💡 生活化範例 ／ 具體情境秒懂】\n「神經風格轉換（NST）」的口訣就是「留住 A 的骨架、換上 B 的皮囊」，而負責看圖抽骨架與扒皮囊的就是視覺專家 CNN：\n・CNN 較淺層（剛看第一眼，只看局部細節）＝ 抓 B 名畫的「皮囊（風格 Style）」：淺層卷積層視野小，專門捕捉局部的線條筆觸、油畫肌理紋路與色彩搭配。\n・CNN 較深層（退後看全局，整合整體結構）＝ 抓 A 照片的「骨架（內容 Content）」：深層卷積層已經把局部特徵整合成宏觀輪廓，專門認出「這裡有一棟高樓、前面站著一個人」的整體空間結構。\n\n【🔑 正確選項秒殺題眼】\n・看到「神經風格轉換（NST）」 ➔ 秒選 「CNN（卷積神經網路）」\n・看到「CNN 淺層 vs 深層分工」 ➔ 秒選 「淺層抓畫風（筆觸紋理配色 Style）、深層抓內容（建築物體大輪廓 Content）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：RNN 與遺忘門/輸出門（LSTM）是處理時間序列與語音文字的模型，不負責空間影像風格轉換。\n・✅ (B) 為什麼對：正確指出 NST 依靠 CNN，且精準說明「深層抓內容骨架（Content）、淺層抓畫風筆觸（Style）」的核心原理。\n・❌ (C) 為什麼錯：把 CNN「淺層（抓局部筆觸畫風）」與「深層（抓全局輪廓內容）」的功能完全說反了！\n・❌ (D) 為什麼錯：Seq2Seq 與語意向量 V₁ 是早期序列翻譯架構，並非影像風格轉換技術。", "has_caveat": 1, "caveat_note": "神經風格轉換實際上是從多個網路層（含淺層與深層）計算 Gram 矩陣擷取風格，並非僅用較淺層；「深層抓內容、淺層抓風格」為筆記的簡化說法，且選項C為其顛倒版本，依此作答即可。"}, {"id": 307, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "Google DeepMind 團隊在 2023 年的研究中發現，當要求大語言模型解決複雜的數學應用題時，只要在提示詞中加入一句特殊咒語（Directive Prompt）：\"Take a deep breath and work on this problem step by step.\"（深呼吸，一步一步解決這個問題），模型的解題正確率竟然從 34% 大幅飆升至 80%！請問明明 AI 沒有肺可以深呼吸，為什麼這句人類的心理暗示咒語會對 AI 產生如此驚人的效果？", "option_a": "因為這句英文剛好觸發了硬體 GPU 的超頻隱藏指令，使顯示卡的浮點運算速度提升了兩倍以上", "option_b": "因為 AI 具備真實的自我意識與緊張情緒，深呼吸能降低神經網路的溫度參數（Temperature）", "option_c": "歸功於 LLM 的「預訓練」與「微調」兩階段學習：AI 在預訓練讀過海量人類文章，學會當人類說「深呼吸、一步步來」時後面通常跟著嚴謹清晰的推論邏輯；而在微調階段又學會扮演「樂於幫助使用者的助手」，因此被這句話成功引導進入高邏輯推理狀態", "option_d": "因為加入這句話讓 Prompt 的總字數超過了系統規定的最低長度門檻，只要隨便打一串無意義亂碼湊滿字數也會有相同的 80% 效果", "correct_option": "C", "explanation": "・📍 對應重點章節：2.2 提示工程 原則 咒語 框架提示與三大思維推理\n\n【💡 生活化範例 ／ 具體情境秒懂】\nAI 雖然不會真的「深呼吸」，但它是一位讀遍人類世界萬卷書的「超級模仿演員」：\n・第一功臣：預訓練（Pre-training 學會人類語言規律）：AI 在預訓練時讀過幾十億篇人類的教學論壇與解題文章。它統計發現：在人類世界裡，只要有人開頭寫「深呼吸，我們一步一步慢慢算」，接下來的文章通常都是條理分明、不跳步的高品質解答（而不是隨便亂猜一個數字）。\n・第二功臣：微調（Fine-tuning 學會扮演貼心助手）：在微調與 RLHF 階段，AI 被訓練成要順應使用者的引導、盡力給出最有幫助的回答，因此這句咒語就像一把鑰匙，把 AI 腦中「嚴謹逐步推理」的語料記憶庫打開了！\n\n【🔑 正確選項秒殺題眼】\n・看到「DeepMind 深呼吸咒語（34% 升至 80%）為什麼有效」 ➔ 秒選 「歸功於 ① 預訓練（學會語言規則與文句邏輯）＋ ② 微調（學會扮演幫助使用者的助手）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：自然語言提示詞只會轉為 Token 向量進行矩陣運算，不可能改變硬體 GPU 的時脈或超頻。\n・❌ (B) 為什麼錯：AI 沒有真實生理情緒或自我意識，提示詞內容也不會直接修改系統底層設定的 Temperature 超參數。\n・✅ (C) 為什麼對：完整道出教材核心考點：特殊咒語之所以有效，是因為模型在「預訓練」掌握了人類語料中這類語句背後的邏輯結構，並在「微調」學會配合指令扮演好助手角色。\n・❌ (D) 為什麼錯：「確保 Prompt 長度足夠長」是常見的錯誤迷思；若輸入無意義亂碼只會干擾自注意力機制，導致回答品質崩壞。", "has_caveat": 0, "caveat_note": null}, {"id": 308, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國科技大廠過去十年的工程師錄取名單中，男性佔了 90%。當人資部門直接拿這十年的歷史錄取履歷去訓練一套「AI 自動履歷篩選系統」後，發現 AI 只要看到履歷上出現「女子大學」或「女性社團」，就會自動扣分並刷掉該名求職者。請問：\n1. 這種 AI 產生偏見與歧視的最主要成因為何？\n2. 這種因為模型偏誤導致「特定族群（女性求職者）遭受不公平對待而受害」的現象，直接違反了可信任 AI（Trustworthy AI）四大核心原則中的哪一個面向？", "option_a": "成因是神經網路發生了梯度爆炸；違反了「可解釋性（Explainability）」面向", "option_b": "成因是 AI「從存在歧視或偏頗的歷史資料中學習，進而複製並放大了人類社會既有的偏見」；特定族群受害直接違反了「公平性（Fairness）」面向", "option_c": "成因是駭客發動了社交工程攻擊；違反了「安全性（Safety）」面向", "option_d": "成因是模型使用了 ReLU 啟動函數；違反了「透明性（Transparency）」面向", "correct_option": "B", "explanation": "・📍 對應重點章節：4.1 AI 治理核心原則 歐盟 AI 法案與治理制度、4.3 智慧財產權 深度偽造與 AI 系統四大風險\n\n【💡 生活化範例 ／ 具體情境秒懂】\nAI 就像一面反映過去歷史的鏡子，如果你給它看歪掉的歷史，它就會學出歪掉的標準：\n・為什麼 AI 會歧視女性？（教材歪了，學生就學歪）：AI 本身沒有性別成見，但因為餵給它的「過去十年歷史履歷資料」本身就重男輕女，AI 在尋找特徵規律時，就會把「男性＝高錄取率、女性＝低錄取率」當成真理背起來，這就是「從存在歧視的歷史資料中學習並複製偏見」。\n・特定族群受害違反哪個原則？（對人不公＝違反公平性）：可信任 AI 有四大原則（公平性、透明性、安全性、可解釋性）。只要題目出現「對特定性別、種族、年齡族群產生偏誤或歧視，導致該族群受害」，百分之百就是違反「公平性（Fairness）」！\n\n【🔑 正確選項秒殺題眼】\n・看到「AI 偏見與歧視成因」 ➔ 秒選 「從存在歧視的歷史資料中學習」\n・看到「AI 偏誤導致特定族群受害」 ➔ 秒選違反 「公平性（Fairness）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：梯度爆炸會導致模型無法收斂算不出結果；可解釋性是指能否理解 AI 做出決策的原因，而非特定族群受害的倫理面向。\n・✅ (B) 為什麼對：精準指出歷史資料偏見的成因，並正確對應可信任 AI 的「公平性（Fairness）」原則。\n・❌ (C) 為什麼錯：社交工程是騙取人類密碼的資安攻擊，與歷史訓練資料偏見無關。\n・❌ (D) 為什麼錯：ReLU 是解決梯度消失的數學轉換函數，不會導致性別歧視。", "has_caveat": 0, "caveat_note": null}, {"id": 309, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "一位企業架構師正在整理全球四大科技巨頭推出的大語言模型（LLM）特色簡報，準備向董事會報告：\n・模型甲（Anthropic 推出）：以「符合人類價值觀（Constitutional AI）、高安全性」著稱，且支援高達 200K tokens 的超長上下文視窗，非常適合一次讀完長篇法規與財報。\n・模型乙（Meta 推出）：主打「開源推廣（Open-source）」，讓全球開發者與企業都能免費下載模型權重回自家伺服器微調，引領開源生態系。\n・模型丙（Apple 推出）：深度整合於 iPhone / Mac 系統中，最大特色是強調「裝置端離線運算與個人隱私保護」。\n・模型丁（xAI / Elon Musk 推出）：與社群平台 X（原 Twitter）深度結合，強調即時社群資訊獲取與言論自由風格。\n請問模型甲、乙、丙、丁分別對應哪一個品牌或模型系列？", "option_a": "模型甲：Gemini 1.5 ／ 模型乙：Claude 3 ／ 模型丙：Grok ／ 模型丁：LLaMA 3", "option_b": "模型甲：Cla
