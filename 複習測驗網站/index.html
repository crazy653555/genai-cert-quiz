ude 3 系列 ／ 模型乙：LLaMA 3 ／ 模型丙：Apple Intelligence ／ 模型丁：Grok", "option_c": "模型甲：GPT-4o ／ 模型乙：Apple Intelligence ／ 模型丙：LLaMA 3 ／ 模型丁：Bedrock", "option_d": "模型甲：LLaMA 3 ／ 模型乙：Claude 3 系列 ／ 模型丙：NIMs ／ 模型丁：Gemini 1.5", "correct_option": "B", "explanation": "・📍 對應重點章節：2.1 大語言模型 (LLM) 原理 微調與應用模式\n\n【💡 生活化範例 ／ 具體情境秒懂】\n八大科技巨頭的 AI 王牌各有一個「招牌人設」，記住招牌關鍵字就能秒殺配對題：\n・Anthropic 的 Claude 3 ＝「守規矩的安全資優生（200K 超長記憶）」：由前 OpenAI 安全團隊創立，最重視符合人類價值觀與安全性，支援 200K tokens 長文本。\n・Meta 的 LLaMA 3 ＝「大方分享秘笈的開源掌門人」：Facebook 母公司 Meta 主打「開源推廣」，把強大的 LLaMA 模型開源給全世界用。\n・Apple 的 Apple Intelligence ＝「守口如瓶的私人管家（離線運算＋隱私保護）」：優先在手機晶片上離線處理個資，不隨便傳上雲端。\n・xAI 的 Grok ＝「泡在 X 推特上的毒舌時事通」：馬斯克（Elon Musk）創立的 xAI 推出，直接連通 X 社群即時貼文。\n\n【🔑 正確選項秒殺題眼】\n・看到「Anthropic、符合人類價值觀、高安全性、200K tokens」 ➔ 秒選 「Claude 3」\n・看到「Meta、開源推廣標竿」 ➔ 秒選 「LLaMA 3」\n・看到「Apple、離線運算與隱私保護」 ➔ 秒選 「Apple Intelligence」\n・看到「xAI (Elon Musk)、結合 X 社群與言論自由」 ➔ 秒選 「Grok」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Gemini 1.5 是 Google 的模型；且把 Anthropic、Meta、Apple、xAI 的產品全部配錯了。\n・✅ (B) 為什麼對：四個模型的開發商與核心特色完全吻合教材 2.1 節大廠生態系總整理表。\n・❌ (C) 為什麼錯：GPT-4o 屬於 OpenAI；Bedrock 則是 Amazon AWS 的企業雲端託管平台。\n・❌ (D) 為什麼錯：將 Meta 與 Anthropic 的模型顛倒，且 NIMs 是 NVIDIA 的推論微服務平臺。", "has_caveat": 0, "caveat_note": null}, {"id": 310, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "一位 AI 美術工程師在訓練「生成對抗網路（GAN）」來生成動漫少女頭像時，發現因為「生成器（Generator）」與「判別器（Discriminator）」兩邊的實力差距失衡（其中一方跑太快或太強），導致生成器抓到一個能騙過判別器的漏洞後就開始偷懶——無論輸入什麼隨機雜訊，它永遠只會畫出「同一張穿紅衣服、眨左眼的少女臉孔」，完全喪失了生成其他髮型或表情的多樣性！請問這種 GAN 特有的訓練失敗現象稱為什麼？", "option_a": "圖像邊緣柔焦模糊（Blurry Images）", "option_b": "語言幻覺現象（Hallucination）", "option_c": "模式崩潰（Mode Collapse）", "option_d": "指數級梯度消失（Vanishing Gradient）", "correct_option": "C", "explanation": "・📍 對應重點章節：1.4 VAE GAN 與 Seq2Seq\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「假鈔集團（生成器）vs 警察（判別器）」的博弈來理解 GAN 為什麼會發生 模式崩潰（Mode Collapse）：\n・正常情況（勢均力敵）：警察越來越聰明，假鈔集團為了不被抓，只好苦練出百元鈔、五百元鈔、千元鈔等各種逼真花樣。\n・模式崩潰（競爭失衡，一招半式闖天下）：假設警察（判別器）有個盲點，只要看到「印有愛心的粉紅假鈔」就一律放行說沒問題！這時假鈔集團（生成器）發現：「太爽了！我只要無腦狂印這張粉紅假鈔就能拿滿分，幹嘛還學印別種鈔票？」結果生出來的圖片千篇一律、只剩單一風格，完全喪失多樣性，這就叫做「模式崩潰（Mode Collapse）」！\n\n【🔑 正確選項秒殺題眼】\n・看到「GAN 生成器與判別器失衡、只會生成同一種風格圖片、喪失多樣性」 ➔ 秒選 「模式崩潰（Mode Collapse）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：「圖像邊緣較模糊」是 VAE（變分自編碼器） 的缺點（因為追求機率分佈的平均穩健），不是 GAN 的缺點。\n・❌ (B) 為什麼錯：「幻覺（一本正經胡說八道）」是 LLM（大語言模型） 的缺點。\n・✅ (C) 為什麼對：模式崩潰（Mode Collapse） 正是 GAN 雙網路博弈失衡時導致生成結果單調重複、缺乏多樣性的招牌致命瓶頸。\n・❌ (D) 為什麼錯：「梯度消失」主要是傳統 RNN 或極深層網路在反向傳播時訊號衰減的問題。", "has_caveat": 0, "caveat_note": null}, {"id": 311, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在訓練英文客服情緒分析模型前，資料科學家需要對原始英文評論 \"The customers are studying the manuals and they went to the store.\" 進行自然語言前處理（NLP Preprocessing）的 5 大標準步驟。其中在處理詞彙字尾變化時，有兩種不同的技術路線：\n・路線甲（快刀斬亂麻）：不管三七二十一，直接拿菜刀把字尾切掉！例如把 studying 或 studies 直接硬切成沒有字典意義的詞幹 studi。\n・路線乙（查字典還原）：根據單字的詞性與文法規則，去查字典把它還原成真正的「字典原型字（Lemma）」！例如把 studies 還原成 study，甚至能把不規則過去式 went 精準還原成原型動詞 go。\n請問路線甲與路線乙分別稱為什麼技術？而在這之前，把 \"the\", \"are\", \"and\", \"to\" 這類出現頻率極高但對語意毫無幫助的虛詞刪掉，又稱為什麼步驟？", "option_a": "路線甲：詞形還原（Lemmatization） ／ 路線乙：詞幹提取（Stemming） ／ 刪虛詞：標記化（Tokenization）", "option_b": "路線甲：詞幹提取（Stemming） ／ 路線乙：詞形還原（Lemmatization） ／ 刪虛詞：停用詞移除（Stop Words Removal）", "option_c": "路線甲：小寫轉換（Lowercasing） ／ 路線乙：位置編碼（Positional Encoding） ／ 刪虛詞：資料離散化（Discretization）", "option_d": "路線甲：獨熱編碼（One-Hot Encoding） ／ 路線乙：動態詞嵌入（Contextual Embedding） ／ 刪虛詞：批次正規化（Batch Normalization）", "correct_option": "B", "explanation": "・📍 對應重點章節：1.12 資料基本概念 收集清理與前處理\n\n【💡 生活化範例 ／ 具體情境秒懂】\nNLP 文本前處理的 5 大步驟就像「備菜洗菜流程」，尤其第 4 步與第 5 步最容易考比較：\n・前 3 步基本清洗：① Tokenization（斷詞切塊） ➔ ② Lowercasing（統一轉小寫，防 The 與 the 被當不同字） ➔ ③ Stop Words Removal（停用詞移除：刪掉 the/is/are 或 的/了/嗎 等無意義高頻贅字）。\n・路線甲：Stemming（詞幹提取）＝ 拿菜刀硬砍字尾：不管字典裡有沒有這個字，看到 -ing, -ed, -ies 就直接一刀切掉（studies ➔ studi），速度快但粗糙。\n・路線乙：Lemmatization（詞形還原）＝ 翻字典找真正的原型字：懂文法與詞性，能把 studies 還原成真正的單字 study，連長相完全不同的不規則動詞 went 都能查字典還原成 go，最精準有禮貌！\n\n【🔑 正確選項秒殺題眼】\n・看到「直接切掉字尾（如 studies ➔ studi），快但粗糙」 ➔ 秒選 「詞幹提取（Stemming）」\n・看到「依詞性查字典還原原型字（如 studies ➔ study、went ➔ go）」 ➔ 秒選 「詞形還原（Lemmatization）」\n・看到「刪除 the, is, are 或 的、了、嗎 等高頻無實質意義虛詞」 ➔ 秒選 「停用詞移除（Stop Words Removal）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：將 Stemming（切字尾）與 Lemmatization（還原字典原型）完全顛倒了；且 Tokenization 是把句子切成單字，不是刪除虛詞。\n・✅ (B) 為什麼對：完全符合 NLP 前處理五大步驟中 Stemming、Lemmatization 與 Stop Words Removal 的定義。\n・❌ (C) 為什麼錯：位置編碼是 Transformer 貼順序號碼牌的技術；資料離散化是把連續年齡轉成區間。\n・❌ (D) 為什麼錯：獨熱編碼與詞嵌入是文字轉向量的編碼方法，批次正規化則是深度學習穩定訓練技巧。", "has_caveat": 0, "caveat_note": null}, {"id": 312, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某軟體開發公司希望強化自家 AI 編程助手對於「複雜程式碼上下文邏輯（如多層迴圈嵌套、變數作用域與函數呼叫關係）」的理解能力，避免 AI 生出語法結構錯誤的程式碼。請問研發團隊應該在系統中結合下列哪一項關鍵技術，將原始程式碼拆解並轉換成結構化的「抽象語法樹（AST, Abstract Syntax Tree）」，以強化 AI 對程式上下文邏輯的掌握？", "option_a": "圖神經網路（GNN, Graph Neural Network）", "option_b": "語法分析器（Parser）", "option_c": "語意轉換器（Semantic Converter）", "option_d": "語音識別模型（Speech Model）", "correct_option": "B", "explanation": "・📍 對應重點章節：2.3 生成式 AI 進階強化 RAG RLHF LoRA 與語法分析器\n\n【💡 生活化範例 ／ 具體情境秒懂】\n為什麼一般大語言模型看長篇程式碼有時會搞混括號或變數關係？因為它把程式碼當成「普通英文小說」一個字一個字讀！要讓 AI 真正看懂程式邏輯，就必須請出編譯器領域的文法老師——語法分析器（Parser）：\n・語法分析器（Parser）＝「幫程式碼畫出家族樹狀圖（抽象語法樹 AST）」：它能精準檢查哪個大括號配哪個 if、哪個變數屬於哪個函數，把平面的程式碼拆解成邏輯嚴密的樹狀結構，讓 AI 徹底搞懂程式上下文邏輯！\n・其他三個干擾項為什麼不能選？：\n  ・GNN（圖神經網路）：是用來分析社交網路好友關係或分子結構圖的，不是編譯器用來剖析程式語法的工具。\n  ・語意轉換器：一般自然語言白話文轉換，不懂嚴格的程式語法樹。\n  ・語音模型：處理聲音波形訊號，與寫程式八竿子打不著。\n\n【🔑 正確選項秒殺題眼】\n・看到「強化 AI 理解程式上下文邏輯、拆解程式碼結構」 ➔ 秒選 「語法分析器（Parser）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：GNN（圖神經網路）常被考生因為看到「樹/圖」而誤選，但它並非剖析程式碼語法規則的工具。\n・✅ (B) 為什麼對：語法分析器（Parser） 能將原始程式碼轉為抽象語法樹（AST），是認證考試中「強化 AI 理解程式上下文邏輯」的唯一標準正解。\n・❌ (C) 為什麼錯：語意轉換器偏向一般自然語言處理，無法精準檢驗程式碼語法結構。\n・❌ (D) 為什麼錯：語音模型專責處理音訊與語音識別，與程式碼邏輯無關。", "has_caveat": 0, "caveat_note": null}, {"id": 313, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某醫院資訊室正在調校兩套基於 Transformer 的文字生成系統：\n・系統一（醫療診斷書與藥品交互作用警示系統）：要求 AI 說話必須極度保守、精準、理性，每次針對相同病徵給出的建議都要高度一致，絕對不能天馬行空亂掰。\n・系統二（兒童奇幻床邊故事創作系統）：希望 AI 說話放飛大膽、充滿驚喜與想像力，每次生成的故事走向都要千變萬化。\n請問工程師在調整解碼參數「溫度（Temperature）」時，應該如何設定這兩套系統？此外，當工程師已經調整了「溫度」參數後，對於另一個同樣控制選詞隨機性的「Top-P（核取樣）」參數，實務上的最佳調校原則為何？", "option_a": "系統一設高溫（如 0.9）、系統二設低溫（如 0.2）；且必須同時大幅修改溫度與 Top-P 才能見效", "option_b": "系統一設低溫（如 0.2）以保持保守精準、系統二設高溫（如 0.9）以激發大膽創意；且因為「溫度」與「Top-P」都在控制選詞隨機性，實務上建議「二選一調整」即可，不要兩個同時改以免互相干擾", "option_c": "兩套系統都必須固定設為 0；且溫度參數是用來控制顯示卡散熱風扇的轉速", "option_d": "系統一設高溫（如 0.9）、系統二設低溫（如 0.2）；且 Top-P 必須永遠設為 0", "correct_option": "B", "explanation": "・📍 對應重點章節：1.5 Transformer 自注意力與解碼參數\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們可以把解碼參數的「溫度（Temperature）」想像成 AI 腦袋的「嗨度（興奮程度）」：\n・低溫（如 0.1 ~ 0.2，冷靜理性的老醫師）：AI 只挑機率最高、最穩當的詞講，說話一板一眼、保守精準，最適合醫療診斷書、財報分析、法律合約與寫程式。\n・高溫（如 0.8 ~ 0.9，微醺亢奮的吟遊詩人）：連原本機率較低的冷門詞彙也有機會被抽中，說話大膽有創意、驚喜連連，最適合寫奇幻小說、廣告口號腦力激盪。\n・為什麼「溫度」跟「Top-P」不要同時改？（兩個廚師別同時撒鹽）：因為溫度與 Top-P 的目的都是在控制「選詞要多隨機還是多保守」，如果兩個同時亂調，會互相干擾導致輸出品質失控，所以官方與實務黃金法則都是「二選一調整就好」！\n\n【🔑 正確選項秒殺題眼】\n・看到「醫療法規求保守精準 vs 小說腦力激盪求創意」 ➔ 秒選 「低溫（0.2）保守精準、高溫（0.9）大膽有創意」\n・看到「溫度與 Top-P 的調校關係」 ➔ 秒選 「建議二選一調整，不要兩個同時改」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：把高低溫的效果完全記反了（醫療設 0.9 會開始胡言亂語），且同時修改溫度與 Top-P 會造成互相干擾。\n・✅ (B) 為什麼對：正確配對低溫（0.2 保守）與高溫（0.9 創意）的應用場景，並點出「溫度與 Top-P 二選一調整」的黃金法則。\n・❌ (C) 為什麼錯：溫度是數學機率平滑參數，與硬體顯示卡散熱風扇毫無關係。\n・❌ (D) 為什麼錯：高低溫設定顛倒，且 Top-P 若設為 0 將無法累積任何候選詞機率。", "has_caveat": 0, "caveat_note": null}, {"id": 314, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某影視特效工作室正在比較三款知名的多模態影片生成系統，以應付不同客戶的需求：\n1. 系統甲（Runway Gen-2）：目標是專門協助「非專業創作者」快速製作影片草圖與多模態編輯；且在認證考試中，若問及其底層核心技術原理組合，有一組特定的必選配對。\n2. 系統乙（Google Lumiere）：為了徹底解決傳統模型「先畫關鍵幀、再補中間幀」導致動作不連貫的問題，採用了一種能「一次生成整段時空連貫影片」的特殊神經網路架構。\n3. 系統丙（Pika Labs）：採用動畫導向 Diffusion 與多模態控制，專攻原創角色動畫與社群短片，風格自由且互動性高。\n請問在認證考試中，系統甲（Runway Gen-2）的核心技術原理應選何者？而系統乙（Google Lumiere）採用的獨家時空架構又稱為什麼？", "option_a": "系統甲原理：純 RNN 架構 ／ 系統乙架構：16×16 靜態拼圖網格", "option_b": "系統甲原理：GAN（生成對抗網路）＋ 自動編碼器（Autoencoder）（註：實務教材亦列為改良版 Diffusion，惟考題選項出現 GAN+Autoencoder 時為必選正解） ／ 系統乙架構：Space-Time U-Net（時空 U-Net 架構）", "option_c": "系統甲原理：單層感知器（Perceptron） ／ 系統乙架構：LSTM 三門控架構", "option_d": "系統甲原理：支援向量機（SVM） ／ 系統乙架構：主成分分析（PCA）", "correct_option": "B", "explanation": "・📍 對應重點章節：1.8 多模態 AI 與影片生成技術\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這題幫你把多模態影片生成四強中，最容易在考場被突襲的兩個「獨家技術關鍵字」一次釘牢：\n・系統甲：Runway Gen-2 的兩大必考題眼：\n  1. 幫誰做的？ 專門協助「非專業創作者」快速做出影片草圖與特效剪輯。\n  2. 核心原理選哪個？ 雖然現代影片生成大多融合改良版 Diffusion，但在本認證題庫中，當題目問「Runway Gen-2 的核心技術原理為何？」且選項出現「GAN（生成對抗網路）＋ 自動編碼器（Autoencoder）」時，請務必秒選它！\n・系統乙：Google Lumiere 的獨家招牌 ＝ Space-Time U-Net（時空 U-Net）：把「空間（Space 畫面長怎樣）」跟「時間（Time 動作怎麼動）」合體在同一個 U-Net 裡一次算完，讓影片從頭到尾一氣呵成、絕不跳幀！\n\n【🔑 正確選項秒殺題眼】\n・看到「Runway Gen-2 目標客群與考題核心原理」 ➔ 秒選 「協助非專業創作者」 ＋ 「GAN ＋ 自動編碼器（Autoencoder）」\n・看到「Google Lumiere 核心架構」 ➔ 秒選 「Space-Time U-Net（時空 U-Net）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：純 RNN 無法生成高畫質影片；16×16 拼圖切塊是 Vision Transformer 讀取靜態圖片的前處理步驟。\n・✅ (B) 為什麼對：精準命中認證題庫針對 Runway Gen-2（GAN + Autoencoder）與 Google Lumiere（Space-Time U-Net）的標準技術配對。\n・❌ (C) 為什麼錯：單層感知器與 LSTM 皆為早期分類或序列模型，無法支撐現代高畫質影片生成。\n・❌ (D) 為什麼錯：SVM 與 PCA 屬於傳統機器學習分類與降維演算法。", "has_caveat": 1, "caveat_note": "Runway Gen-2 實際是以潛在擴散模型（Latent Diffusion）為基礎；「GAN＋自動編碼器」是考題沿用的標準答案，選項B本身也已加註說明。"}, {"id": 315, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某大學 AI 實驗室正在訓練一個大型語言模型，教授將收集到的 100 萬筆語料切分為三種資料集（訓練集、驗證集、測試集），並嚴格叮嚀學生：\n1. 在預訓練的第 5 步驟「生成、評估與反覆運算」中，模型雖然會在內部嘗試預測下一個字或還原遮蔽詞，但有一個關於「是否對外輸出」的重要限制。\n2. 絕對不可以拿最後驗收用的「測試集（Test Set）」去邊看分數邊調整超參數。\n請問教授叮嚀的第 1 點限制為何？而在訓練過程中，真正用來像「平時模擬考」一樣邊學邊檢查表現、協助調整模型架構與超參數的資料集又是哪一個？", "option_a": "第 5 步驟的內部生成會直接公開發布給全球網友使用；用來邊學邊調超參數的是「訓練集（Training Set）」", "option_b": "第 5 步驟只是訓練中的「內部生成（模擬推理）」，僅用來計算損失與調整參數，絕對不會直接對外輸出給使用者（要到第 6 步正式上線後才會對外輸出）；而用來像平時練習考一樣邊學邊調超參數的是「驗證集（Validation Set）」", "option_c": "第 5 步驟會直接刪除所有模型權重；用來邊學邊調超參數的是「測試集（Test Set）」", "option_d": "第 5 步驟只做資料清理；且三種資料集在訓練時必須全部混在一起同時修改權重", "correct_option": "B", "explanation": "・📍 對應重點章節：1.9 模型預訓練 從無到有的知識建立\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「學生備考升學」來秒懂這兩個超常考的預訓練觀念：\n・為什麼 Step 5 的內部生成「不會對外輸出」？（在教室寫練習卷 vs 畢業後出社會接案）：在預訓練 Step 5 時，AI 學徒還在教室裡受訓！它試著猜下一個字或畫一張圖，只是為了讓老師打分數（算損失）、看看自己哪裡沒學好並繼續微調參數，這時候的作品絕對不會交給外面的客人（不對外輸出）；要等到 Step 6 畢業正式上線後，才會根據使用者的 Prompt 對外輸出結果！\n・三種資料集怎麼分？（課本 vs 模擬考 vs 大學聯考）：\n  ・訓練集（Training Set）＝「平時上課的課本」：用來算損失、直接修改權重 w。\n  ・驗證集（Validation Set）＝「學校辦的平時練習考／模擬考」：在 Step 5 用來測試模型有沒有死背課本，並根據模擬考成績調整超參數（如層數、學習率）。\n  ・測試集（Test Set）＝「最後的大學聯考／期末考」：考題從未見過，只在最後上線前考一次驗收真實實力，絕不能拿來調參數作弊！\n\n【🔑 正確選項秒殺題眼】\n・看到「預訓練 Step 5 生成、評估與反覆運算」 ➔ 秒選 「僅為內部模擬推理與調參，不會對外輸出給使用者」\n・看到「平時練習考、邊學邊調整超參數與模型結構」 ➔ 秒選 「驗證集（Validation Set）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：訓練中的內部生成尚未畢業，不會對外輸出；且訓練集是課本（調權重），若拿課本自己考自己調超參數會導致嚴重過擬合。\n・✅ (B) 為什麼對：精準點破「Step 5 內部生成不對外輸出」的考題陷阱，並正確區分「驗證集（模擬考調超參數）」與「測試集（期末考總驗收）」的職責。\n・❌ (C) 為什麼錯：若拿測試集去調超參數，就等於偷看期末考卷洩題，完全失去客觀驗收意義。\n・❌ (D) 為什麼錯：資料清理是 Step 1；且三種資料集必須嚴格隔離，絕不可混在一起訓練。", "has_caveat": 0, "caveat_note": null}, {"id": 316, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某精品飯店的行銷經理想要請 ChatGPT 撰寫一封給 VIP 客人的致歉與補償信。\n1. 她在提示詞中先寫清楚了 3W（你是五星級飯店公關總監 Who、針對昨晚停電受影響的住客 Where、撰寫一封致歉與贈送免費住宿券的信件 What），接著她想加入 COSEED 結構化公式中的某個要素，要求 AI 「語氣必須極度誠懇、溫暖且充滿同理心」。\n2. 為了讓 AI 完美模仿飯店過去的回信格式，她在提示詞中直接貼了 3 篇過去寫得最好的致歉信範例，結果 AI 不用重新訓練修改權重，當場就順著這 3 篇範例的上下文脈絡，生出了一封格式與口吻一模一樣的完美信件！\n請問：第 1 點控制「語氣、風格與情感態度」對應 COSEED 中的哪一個字母要素？而第 2 點給出 3 個範例並讓 AI 免重訓即時學會的機制，分別稱為什麼提示法與什麼學習機制？", "option_a": "COSEED 要素：C (Constraint 限制條件) ／ 提示法與機制：零樣本提示（Zero-Shot） 與 強化學習（RL）", "option_b": "COSEED 要素：E (EQ 情感語句) ／ 提示法與機制：少樣本提示（Few-Shot Prompting） 與 上下文學習（ICL, In-Context Learning）", "option_c": "COSEED 要素：S (Separator 分隔符號) ／ 提示法與機制：單樣本提示（One-Shot） 與 反向傳播（Backpropagation）", "option_d": "COSEED 要素：O (Output format 輸出格式) ／ 提示法與機制：思維樹（ToT） 與 監督式微調（SFT）", "correct_option": "B", "explanation": "・📍 對應重點章節：2.2 提示工程 原則 咒語 框架提示與三大思維推理\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這題把結構化提示公式 COSEED 與「給範例現學現賣」的機制串在一起考：\n・COSEED 裡有兩個 E，怎麼分？：\n  ・第一個 E 是 Example（範例）：給 AI 看參考範本。\n  ・第二個 E 是 EQ（情感語句／情緒智商）：專門用來定義 AI 說話的「語氣、風格與情感態度」（例如：請用誠懇溫暖、幽默風趣、或嚴肅專業的語氣回答）。\n・給 3 個範例現學現賣 ＝ Few-Shot（少樣本提示） ＋ ICL（上下文學習）：\n  ・給 0 個範例叫 Zero-Shot、給 1 個叫 One-Shot、給 2～數個（如題幹的 3 個）就叫 Few-Shot（少樣本提示）。\n  ・而 AI 為什麼不用重新訓練改權重，光看提示詞裡的這幾個範例就能當場抓到規律照著寫？這項神奇的超能力就叫做「上下文學習（ICL, In-Context Learning：無需重新訓練，根據上下文即時調整回答）」！\n\n【🔑 正確選項秒殺題眼】\n・看到「COSEED 中定義語氣、風格與情感態度」 ➔ 秒選 「E（EQ 情感語句）」\n・看到「給 2~數個範例、無需重新訓練即可依上下文即時調整回答」 ➔ 秒選 「少樣本提示（Few-Shot）＋ 上下文學習（ICL）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Constraint 是限制字數或禁止事項；Zero-Shot 是完全不給範例。\n・✅ (B) 為什麼對：精準對應控制語氣風格的 EQ（情感語句）、提供 3 個範例的 Few-Shot，以及免重訓即時適應的 ICL（上下文學習）。\n・❌ (C) 為什麼錯：Separator 是 {} 等分隔符號；One-Shot 只給 1 個範例；且提示詞階段不會觸發反向傳播改權重。\n・❌ (D) 為什麼錯：Output format 是指定 JSON 或表格等格式；且題幹明確說明「不用重新訓練修改權重」，故非監督式微調。", "has_caveat": 0, "caveat_note": null}, {"id": 317, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某管理顧問公司導入生成式 AI 簡報工具（如 Gamma 與 Tome）來協助顧問每週向客戶提案。在內部培訓測驗中，主管出了三道實務考題：\n1. 生成式 AI 製作簡報的核心邏輯「語意理解＋範本生成」，其內部處理的三階段順序為何？\n2. 顧問每週都要用 AI 幫同一家客戶生成週報簡報，如何避免 AI 每次生出來的簡報內容都千篇一律、不斷重複？\n3. 提案前如何確保 AI 生成簡報中的文字與數據內容具備高度準確性？\n請問這三道題的正確答案組合為何？", "option_a": "1. 先排版 ➔ 再理解 ➔ 再轉換 ／ 2. 把溫度設為 0 ／ 3. 完全依賴人工逐字背誦", "option_b": "1. 先理解 ➔ 再轉換 ➔ 再排版 ／ 2. 定期更新數據源 ／ 3. 使用自動校對工具（並進行審查與修改）", "option_c": "1. 先複製 ➔ 再貼上 ➔ 再匯出 ／ 2. 刪除所有歷史範本 ／ 3. 將字體全部改為粗體", "option_d": "1. 先轉換 ➔ 再排版 ➔ 再理解 ／ 2. 減少提示詞的長度 ／ 3. 關閉網路連線", "correct_option": "B", "explanation": "・📍 對應重點章節：3.5 簡報生成流程與工具組合\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這題一次囊括了教材 3.5 節「簡報生成應用」最常考的三個黃金實務原則：\n・1. AI 做簡報的三部曲 ＝ 先理解 ➔ 再轉換 ➔ 再排版：AI 絕對不是把你的長篇大論原封不動貼到投影片上！它會先理解你整段話的核心語意，再轉換成精煉的投影片列點綱要，最後再套用版型排版。\n・2. 怎麼避免每週簡報內容重複？（換新鮮食材才炒得出新菜）：如果餵給 AI 的背景資料庫永遠是舊的，生出來的簡報當然千篇一律！因此必選「定期更新數據源」。\n・3. 怎麼確保簡報內容準確？（請自動校對把關）：為了防止錯別字或數據引用失誤，應「使用自動校對工具」並配合人工最後審查修改。\n\n【🔑 正確選項秒殺題眼】\n・看到「簡報生成核心邏輯（語意理解＋範本生成）三階段」 ➔ 秒選 「先理解 ➔ 再轉換 ➔ 再排版」\n・看到「如何避免簡報內容重複」 ➔ 秒選 「定期更新數據源」\n・看到「如何確保簡報內容準確性」 ➔ 秒選 「使用自動校對工具」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：還沒理解內容不可能先排版；把溫度設為 0 反而會讓每次生成的文字完全固定一模一樣！\n・✅ (B) 為什麼對：三項答案完全吻合教材 3.5 節簡報生成核心邏輯與高頻考題對策。\n・❌ (C) 為什麼錯：AI 簡報並非死板複製貼上，且改粗體字與內容準確性無關。\n・❌ (D) 為什麼錯：順序錯誤（必須先理解才能轉換），且減少提示詞或斷網無法解決數據源未更新導致的內容重複。", "has_caveat": 0, "caveat_note": null}, {"id": 318, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某科技博物館正在策劃「早期神經網路演進特展」，展示了三種經典神經網路模型：\n・展區一（1960 年代 單層感知器 Perceptron）：只有輸入層與輸出層，雖然能處理簡單的二元分類，但後來被數學家證明它有一個致命限制，導致 AI 進入第一次寒冬。\n・展區二（1980 年代 多層感知器 MLP）：在輸入層與輸出層之間加入了一個關鍵結構，終於突破了單層感知器的致命限制，成為現代深度神經網路（DNN）的原型。\n・展區三（1980 年代 波爾茲曼機 BM / 受限波爾茲曼機 RBM）：一種基於能量（Energy-based）的隨機生成式雙層神經網路，不需人工標準答案就能自己摸索特徵機率分佈規律。\n請問展區一「單層感知器」的致命限制是什麼？而展區二「多層感知器（MLP）」又是加入了什麼關鍵結構才成功突破這個限制？", "option_a": "單層感知器無法做加法運算；MLP 加入了「池化層（Pooling Layer）」才突破限制", "option_b": "單層感知器只能在平面上畫一條直線，無法解決「非線性問題（如經典的 XOR 互斥或問題）」；MLP 則是在中間加入了「隱藏層（Hidden Layer）」，能畫出彎曲分界線解決複雜非線性問題", "option_c": "單層感知器只能處理彩色圖片；MLP 加入了「遺忘門（Forget Gate）」才突破限制", "option_d": "單層感知器會發生模式崩潰；MLP 加入了「位置編碼（Positional Encoding）」才突破限制", "correct_option": "B", "explanation": "・📍 對應重點章節：1.1 神經網路基礎 感知器與反向傳播\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「拿尺在紙上畫分界線」來秒懂單層感知器與多層感知器（MLP）的歷史大突破：\n・單層感知器（Perceptron）＝「手裡只有一把直尺，只能畫直線」：因為只有輸入層跟輸出層，它只能在平面上畫出一條筆直的分界線（線性分類）。一旦遇到像 XOR（互斥或） 這種紅點跟藍點對角交錯排列的「非線性問題」，不管直尺怎麼擺都切不開，當場卡關！\n・多層感知器（MLP）＝「加入『隱藏層（Hidden Layer）』，能折彎畫出任意曲線！」：在輸入與輸出中間加上一層或多層「隱藏層」並搭配非線性啟動函數後，神經網路就能畫出彎曲的曲線甚至圈圈，輕鬆把 XOR 等複雜非線性問題切開，正式開啟了「深度學習」的大門！\n\n【🔑 正確選項秒殺題眼】\n・看到「單層感知器（Perceptron）的限制」 ➔ 秒選 「只能做簡單線性分類，無法解決 XOR 等非線性問題」\n・看到「多層感知器（MLP）如何突破非線性限制」 ➔ 秒選 「加入隱藏層（Hidden Layer）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：感知器本來就是靠加權求和（加法與乘法）運作；而池化層是 CNN 用來降維的結構。\n・✅ (B) 為什麼對：精準點出單層感知器無法解決 XOR 非線性問題，以及 MLP 透過加入 隱藏層（Hidden Layer） 解決非線性問題的核心考點。\n・❌ (C) 為什麼錯：遺忘門是 1997 年 LSTM 用來處理時間序列記憶的結構。\n・❌ (D) 為什麼錯：模式崩潰是 GAN 的缺點，位置編碼則是 2017 年 Transformer 的結構。", "has_caveat": 0, "caveat_note": null}, {"id": 319, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在生成式 AI 工具認證測驗中，有兩道關於 OpenAI 旗下工具 DALL·E 的高頻辨析題經常讓考生混淆：\n・考題一（正向選型）：「某電影美術指導想根據劇本文字描述，快速生成具有強烈光影氛圍的『電影風格概念圖片（靜態劇照）』，請問下列哪一個平台最常被用於此目的？」（選項有：Perplexity、Notion、GPT-3、DALL·E）\n・考題二（反向排除）：「某短影音團隊正在盤點市面上的『AI 影片生成工具』，請問下列哪一個工具『不是』影片生成工具？」（選項有：Runway、Sora、FlexClip、DALL·E）\n請問針對考題一與考題二，正確的分析與答案為何？", "option_a": "考題一選 Perplexity（因為它是電影專用渲染引擎）；考題二選 Sora（因為 Sora 只能生成純文字）", "option_b": "考題一選 GPT-3（因為它是多模態生圖模型）；考題二選 FlexClip（因為它是純語音合成工具）", "option_c": "兩題的答案都是選 DALL·E！因為 DALL·E 是 OpenAI 專門用來「文字生成靜態圖片」的模型，因此考題一問「生成電影風格圖片」（搭配排除 Perplexity 搜尋、Notion 筆記、GPT-3 純文字）必選 DALL·E；而考題二問「何者不是影片生成工具」時，也因為它只生靜態圖片而不生動態影片，同樣必選 DALL·E", "option_d": "考題一選 Notion；考題二選 Runway", "correct_option": "C", "explanation": "・📍 對應重點章節：1.7 擴散模型 (Diffusion)、3.2 圖片生成工具與應用\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這題幫你把考場上關於 DALL·E 最經典的「一正一反」兩道必考題一次打通，只要牢記 DALL·E ＝ OpenAI 的靜態圖片畫家 就絕對不會被騙：\n・考題一（問誰能畫「電影風格圖片」？）：看一眼四個選項——Perplexity 是 AI 搜尋引擎、Notion 是筆記軟體、GPT-3 是純文字模型，全場只有 DALL·E 會畫圖！所以毫無懸念秒選 DALL·E。\n・考題二（問誰「不是」影片生成工具？）：看一眼四個選項——Runway 是生影片工具、Sora 是 OpenAI 生 60 秒影片工具、FlexClip 是線上 AI 影片剪輯與生成工具，全場只有 DALL·E 只會畫「靜態圖片」不會做「動態影片」！所以還是秒選 DALL·E！\n\n【🔑 正確選項秒殺題眼】\n・看到「哪個平台常用於生成電影風格圖片（排除 Perplexity / Notion / GPT-3）」 ➔ 秒選 「DALL·E」\n・看到「下列何者『不是』影片生成工具（排除 Runway / Sora / FlexClip）」 ➔ 秒選 「DALL·E」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Perplexity 是對話式 AI 搜尋引擎；Sora 是 OpenAI 的旗艦影片生成模型。\n・❌ (B) 為什麼錯：GPT-3（2020）是純文字大型語言模型，不具備生圖能力；FlexClip 是常見的線上 AI 影片生成與剪輯平台。\n・✅ (C) 為什麼對：透徹解析 DALL·E 作為「靜態文生圖模型」的核心定位，完美破解正向生圖選型題與反向非影片工具排除題。\n・❌ (D) 為什麼錯：Notion 是知識庫筆記軟體；Runway 是知名的多模態影片生成工具。", "has_caveat": 0, "caveat_note": null}, {"id": 320, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某策略顧問團隊運用大語言模型解決高難度的跨國併購財務推演問題，分別嘗試了兩種進階思維推理框架：\n・方法甲（多數決路線）：讓 AI 針對同一個問題「同時生成 5 條不同的思維鏈（CoT）推理路線」，接著互相比較這 5 條路線推導出的最終結論，挑出出現次數最多、「最一致、最可信的答案」。\n・方法乙（樹狀探索與回溯）：採用「思維樹（Tree of Thoughts, ToT）」架構，像下棋一樣同時展開多條思考分支，若發現某條分支走進死胡同還能「回溯（Backtracking）」換別條路走。\n請問方法甲稱為什麼機制？另外，在認證考試中，若問及「下列何者『不是』思維樹（ToT）的特點？」，應選出哪一個錯誤描述？", "option_a": "方法甲為 零樣本提示（Zero-Shot）；非 ToT 特點為「能分解複雜問題」", "option_b": "方法甲為 自我一致性（Self-Consistency）；非 ToT 特點為「僅依賴單一步驟解答」（因為 ToT 強調逐步思考、多路徑探索與回溯，絕非單一步驟解答）", "option_c": "方法甲為 思維骨架（SoT）；非 ToT 特點為「能提高解答準確性」", "option_d": "方法甲為 上下文學習（ICL）；非 ToT 特點為「具備多路徑探索與回溯能力」", "correct_option": "B", "explanation": "・📍 對應重點章節：2.2 提示工程 原則 咒語 框架提示與三大思維推理\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「解數學壓軸難題」來比較這兩種進階推理技巧：\n・方法甲：自我一致性（Self-Consistency） ＝「算 5 遍不同解法，看哪個答案票數最高！」：單純只跑一條思維鏈（CoT）偶爾還是會粗心算錯；Self-Consistency 乾脆讓 AI 同時跑好幾條不同的推理路徑，如果其中 4 條路算出來都是 X=12、只有 1 條算 X=9，那就挑最一致、最可信的 X=12！\n・方法乙：思維樹（ToT, Tree of Thoughts） 的四大特點 vs 必考排除項：\n  ・ToT 四大真特點：① 分解複雜問題、② 促進逐步思考、③ 多路徑探索與回溯（走不通退回上一步）、④ 提高準確性。\n  ・必考排除項（何者不是 ToT 特點）：「僅依賴單一步驟解答」！ToT 是最複雜的多步驟樹狀推理，怎麼可能只靠單一步驟解答！\n\n【🔑 正確選項秒殺題眼】\n・看到「生成多條思維鏈推理路線，挑出最一致、最可信的答案」 ➔ 秒選 「自我一致性（Self-Consistency）」\n・看到「何者『不是』思維樹（ToT）的特點」 ➔ 秒選 「僅依賴單一步驟解答」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Zero-Shot 是不給範例直接提問；且「分解複雜問題」本來就是 ToT 的核心特點之一。\n・✅ (B) 為什麼對：精準指出多條 CoT 投票比對為 自我一致性（Self-Consistency），並點破「僅依賴單一步驟解答」違反 ToT 逐步多路徑探索的本質。\n・❌ (C) 為什麼錯：SoT（思維骨架）是用於長文拆解濃縮摘要；且 ToT 確實能提高準確性。\n・❌ (D) 為什麼錯：ICL 是給範例即時適應上下文；且多路徑探索與回溯正是 ToT 的招牌特色。", "has_caveat": 0, "caveat_note": null}, {"id": 321, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某健康保險公司的資料工程師正在對 50 萬筆保戶健康檢查資料進行清理與轉換：\n1. 抓出異常值（Outliers）：發現有幾筆血壓與體重數據高得離譜，工程師想畫出一種統計圖表，並計算一個統計指標來抓出「偏離平均值超過 3 個標準差」的異常保戶資料。\n2. 年齡區間轉換：為了簡化保費級距計算，工程師將保戶原本連續的具體年齡（例如 33 歲、37 歲），轉換成區間標籤（例如 30~39 歲）。\n3. 濃縮上百個欄位：健檢表原本有 120 個細項指標，工程師希望濃縮成 5 個最具代表性的核心綜合指標以加速運算。\n請問這三個步驟分別使用了哪一項資料前處理工具或技巧？", "option_a": "1. 圓餅圖與眾數 ／ 2. 資料標準化（Standardization） ／ 3. 詞幹提取（Stemming）", "option_b": "1. 盒鬚圖（Box plot） 與 Z 分數標準化（Z-score，|Z| > 3） ／ 2. 資料離散化（Discretization） ／ 3. 資料縮減（Data Reduction，如主成分分析 PCA）", "option_c": "1. 長條圖與中位數 ／ 2. 資料正規化（Normalization） ／ 3. 停用詞移除", "option_d": "1. 散佈圖與 BLEU ／ 2. 獨熱編碼（One-Hot） ／ 3. 邏輯迴歸", "correct_option": "B", "explanation": "・📍 對應重點章節：1.12 資料基本概念 收集清理與前處理\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這題一次考齊資料清理與轉換的三大實戰技巧：\n・1. 抓異常值雙雄 ＝ 盒鬚圖（Box plot） ＋ Z-score（|Z| > 3）：\n  ・視覺工具看 盒鬚圖：超出上下兩根鬍鬚外面的孤立小圓點，一眼就能看出是異常值。\n  ・數學公式算 Z-score：衡量某筆資料距離平均值有幾個標準差，只要 |Z| > 3（偏離超過 3 個標準差），就會被判定為極端異常值！\n・2. 把 33 歲 變成 30~39 歲 ＝ 資料離散化（Discretization）：把原本連續不斷的數字切分成一格一格的區間（青年、中年、老年），就叫離散化。\n・3. 把 120 個欄位濃縮成 5 個核心指標 ＝ 資料縮減（Data Reduction / PCA）：利用主成分分析（PCA）去除冗餘欄位、保留最核心的特徵。\n\n【🔑 正確選項秒殺題眼】\n・看到「抓出異常值（Outliers）、偏離超過 3 個標準差」 ➔ 秒選 「盒鬚圖（Box plot）＋ Z 分數標準化（Z-score）」\n・看到「把具體年齡 33 歲變成 30~39 歲區間」 ➔ 秒選 「資料離散化（Discretization）」\n・看到「將上百個欄位濃縮成少數核心特徵」 ➔ 秒選 「資料縮減（Data Reduction / PCA）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：圓餅圖只能看比例，看不出異常值；Stemming 是英文切字尾技術。\n・✅ (B) 為什麼對：精準對應異常值偵測（盒鬚圖＋Z-score）、連續值轉區間（資料離散化）與欄位濃縮（資料縮減 PCA）。\n・❌ (C) 為什麼錯：正規化是把數值壓到 0 ～ 1 的小數，不是轉成 30~39 歲 的區間標籤。\n・❌ (D) 為什麼錯：BLEU 是機器翻譯指標，獨熱編碼是類別轉 0/1 向量，皆與題幹需求不符。", "has_caveat": 0, "caveat_note": null}, {"id": 322, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在國際 AI 倫理治理研討會上，講者強調發展生成式 AI 必須遵守「五大 AI 倫理原則」：① 以人為本（Human-Centric）、② 可信任、③ 透明性、④ 問責制（Accountability）、⑤ 避免歧視與確保公平。\n請問：\n1. 五大原則中，強調「AI 的存在是為了服務與增進人類福祉，不能反過來傷害或取代人類尊嚴」的是哪一項核心精神？\n2. 當考題問及「下列哪一項具體行動最能體現 AI 倫理中的『問責制（Accountability）』？」時，應該選擇哪一個選項？", "option_a": "1. 模型參數最大化 ／ 2. 將所有 AI 程式碼全部設為最高機密黑箱不公開", "option_b": "1. 以人為本（Human-Centric） ／ 2. 政府機構設立生成式 AI 監管機制（明確規範開發者與部署者的法律責任歸屬與監管審查）", "option_c": "1. 算力優先原則 ／ 2. 讓 AI 模型在沒有人類監督下自主決定是否刪除使用者資料庫", "option_d": "1. 商業利潤最大化 ／ 2. 要求使用者在註冊時簽署放棄一切法律追訴權的免責聲明", "correct_option": "B", "explanation": "・📍 對應重點章節：4.2 AI 倫理五大原則與各國治理規範\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這題聚焦於教材 4.2 節「AI 倫理五大原則」中最常考的兩個指標性觀念：\n・1. 為什麼一切倫理的起點是「以人為本（Human-Centric）」？：就像醫療倫理一切以病人福祉為中心一樣，AI 倫理的首要原則就是「以人為本」——科技必須配合人類的價值觀、保障人類基本權利，不能本末倒置讓機器主宰人類。\n・2. 什麼叫做「問責制（Accountability）」？（出事找得到負責人、有制度管！）：「問責制」的意思就是當 AI 系統出包、造成損害時，不能兩手一攤說「是電腦自己算錯的，不關我的事！」因此，在認證考試中，「政府機構設立生成式 AI 監管機制」（建立明確的監督、稽核與責任歸屬制度），正是體現「問責制」的標準正解！\n\n【🔑 正確選項秒殺題眼】\n・看到「AI 倫理五大原則之首、服務人類福祉」 ➔ 秒選 「以人為本（Human-Centric）」\n・看到「體現『問責制（Accountability）』的具體實踐」 ➔ 秒選 「政府機構設立生成式 AI 監管機制」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：將系統變成不公開的黑箱違反了「透明性」，更無法落實問責。\n・✅ (B) 為什麼對：正確點出「以人為本」的核心精神，以及「政府機構設立生成式 AI 監管機制」作為問責制的具體體現。\n・❌ (C) 為什麼錯：讓 AI 無人類監督自主刪庫違反安全性與人工介入原則。\n・❌ (D) 為什麼錯：強迫使用者簽署免責聲明是逃避責任，完全背離「問責制」精神。", "has_caveat": 0, "caveat_note": null}, {"id": 323, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某有聲書平台正在研發新一代的「情感語音合成（Emotional TTS）」系統，希望能讓 AI 朗讀小說時，根據劇情自動切換出「喜悅、悲傷、憤怒、驚恐」等真實人類情感。請問在訓練這套情感語音合成模型時，最重要的成功要素為何？而下列哪三個選項屬於考場常見的錯誤干擾項？", "option_a": "最重要成功要素為「語速一致（全程保持一模一樣的講話速度）」；干擾項為情緒標註資料", "option_b": "最重要成功要素為「音高轉換（Pitch Shifting，直接用變聲器把聲音調尖或調低）」；干擾項為深度學習網路", "option_c": "最重要成功要素為「情緒標註資料（Emotionally Annotated Data，附有明確喜怒哀樂情緒標籤的高品質語音訓練集）」；而「語速一致、音量均衡、音高轉換」皆非讓 AI 學會自然情感表達的核心關鍵", "option_d": "最重要成功要素為「音量均衡（把所有句子的分貝數強制拉平）」；干擾項為語音規劃", "correct_option": "C", "explanation": "・📍 對應重點章節：1.8 多模態 AI 與影片生成技術\n\n【💡 生活化範例 ／ 具體情境秒懂】\n要教會一個從沒談過戀愛、也沒哭過的 AI 讀出「悲傷」或「憤怒」的語氣，靠什麼最關鍵？\n・唯一正解：給它聽大量標好情緒的教材 ＝ 情緒標註資料（Emotionally Annotated Data）：就像教配音員演戲一樣，你必須餵給 AI 成千上萬句由真人錄製、而且清楚標記好「這句是生氣怒吼」、「這句是委屈哽咽」的情緒標註語音資料，AI 才能學會不同情緒對應的微妙停頓、嘆氣與語調起伏！\n・為什麼另外三個選項全都是陷阱？：\n  ・❌ 語速一致：人難過時講話慢、激動時講話快；如果全程「語速一致」，聽起來就像早期的呆板機器人！\n  ・❌ 音量均衡：把小聲啜泣跟大聲咆哮強行拉成一樣大聲，情緒張力就全毀了！\n  ・❌ 音高轉換（Pitch Shifting）：那只是像把聲音調成「花栗鼠聲」或「唐老鴨聲」的KTV變聲器，根本不是真正的人類情感！\n\n【🔑 正確選項秒殺題眼】\n・看到「情感語音合成（Emotional TTS）最重要的成功要素」 ➔ 秒選 「情緒標註資料（排除：語速一致、音量均衡、音高轉換）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：語速一致會抹殺情緒變化，讓語音呆板如傳統電子音。\n・❌ (B) 為什麼錯：音高轉換只是單純的物理頻率變調，無法產生自然的情緒抑揚頓挫。\n・✅ (C) 為什麼對：唯有高品質的「情緒標註資料」，才能讓深度學習模型掌握人類各種情緒的真實聲學特徵。\n・❌ (D) 為什麼錯：音量均衡只是後製標準化處理，無法賦予語音情感靈魂。", "has_caveat": 0, "caveat_note": null}, {"id": 324, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國翻譯社打算對一個「純文字生成大語言模型（Text Generation Tool）」進行多國語言翻譯的微調（Fine-tuning）。在評估專案風險時，技術總監列出了四項可能面臨的挑戰，但其中有一項並不屬於純文字翻譯微調的挑戰。請問哪一項是錯誤的誘答項？", "option_a": "適應相似語言之間的細微差異（例如繁體中文台灣用語 vs 香港用語、西班牙語歐洲腔 vs 拉美腔）", "option_b": "在沒有人工介入校對的情況下，難以在所有語境中達到 100% 的完美翻譯準確性", "option_c": "在翻譯過程中整合非文字資料（如直接處理並合成圖片與三維立體影像）", "option_d": "優化跨語言配對表現，以及處理特定專業領域（如罕見醫學或古文法律）的專有名詞", "correct_option": "C", "explanation": "・📍 對應重點章節：2.1 大語言模型 (LLM) 原理 微調與應用模式\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這是一道看清題目關鍵字就能瞬間秒殺的經典防坑題！請看題幹問的是：「文字生成工具（Text Generation Tool）」進行「語言翻譯」微調時面臨的挑戰：\n・真實的三大翻譯挑戰（都跟「文字與語言」有關）：\n  ・(A) 相近語言容易搞混：像是把台灣的「馬鈴薯」翻成大陸的「土豆」，這種相似語言/方言差異很難微調。\n  ・(B) 沒真人把關難達 100% 完美：文化雙關語或詩詞在無人工介入下很難完美無瑕。\n  ・(D) 冷門語言對與專業術語難搞：小語種配對或艱澀醫療法規專有名詞容易翻錯。\n・一眼假陷阱（跟文字翻譯無關）：(C) 整合非文字資料（如圖片）！既然是「文字生成工具」做「語言翻譯」，它的輸入跟輸出全都是文字，根本不需要去整合圖片！\n\n【🔑 正確選項秒殺題眼】\n・看到「AI 文字生成工具進行語言翻譯微調的挑戰，何者除外？」 ➔ 秒選 「在翻譯過程中整合非文字資料（如圖片）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：這是語言翻譯微調真正會面臨的核心挑戰之一。\n・❌ (B) 為什麼錯：這也是純 AI 翻譯在無人工介入下真實存在的限制。\n・✅ (C) 為什麼對：純文字翻譯工具專注於文本序列轉換，不涉及整合圖片等非文字資料，為本題必選的排除項。\n・❌ (D) 為什麼錯：跨語言配對與專業領域術語優化確實是翻譯微調的重要挑戰。", "has_caveat": 0, "caveat_note": null}, {"id": 325, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某金融科技公司的資料科學團隊正在針對不同任務挑選經典機器學習演算法：\n1. 演算法甲（PCA 主成分分析 vs t-SNE）：兩者都屬於非監督式降維，但其中一個專攻「線性降維濃縮核心指標」，另一個則專攻「將高維度資料壓平畫在 2D/3D 平面圖上供肉眼觀察分群（視覺化）」。\n2. 演算法乙（LDA 線性判別分析）：帶有類別標籤的「監督式降維」，目標是在降維的同時「讓不同類別分得越開越好、相同類別聚得越近越好」。\n3. 演算法丙（SVM 支援向量機 vs 隨機森林 Random Forest）：兩者都屬於監督式學習，其中一個專找兩群資料中間「最寬、最清楚的分界線（超平面）」，另一個則是召集「好多棵決策樹一起投票」來防止過擬合。\n請問下列關於這五種演算法的配對說明，何者完全正確？", "option_a": "PCA 屬於監督式學習；LDA 屬於非監督式學習；SVM 是靠多棵樹投票", "option_b": "PCA 負責非監督線性降維濃縮特徵、t-SNE 負責非監督壓平至 2D/3D 視覺化、LDA 負責監督式降維分類、SVM 負責畫出最寬分界線、隨機森林 則是結合多棵決策樹一起投票防過擬合", "option_c": "t-SNE 是神經網路最佳化器；隨機森林 只能在平面上畫一條直線", "option_d": "五種演算法全部都屬於強化學習（Reinforcement Learning），必須靠環境獎懲加扣分運作", "correct_option": "B", "explanation": "・📍 對應重點章節：1.13 五大學習範式與經典演算法\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用一句白話口訣，幫這 5 個最常出現在選項裡的經典演算法發「專屬名片」：\n・PCA（主成分分析） ＝「非監督濃縮果汁機」：不看標籤，把 100 個欄位線性濃縮成幾個最核心的主成分指標。\n・t-SNE ＝「非監督 2D/3D 壓平繪圖師」：不看標籤，專門把幾百維的複雜資料壓平畫在 2D 或 3D 螢幕上，讓人類肉眼能清楚看到一團一團的分群（視覺化首選）！\n・LDA（線性判別分析） ＝「有看標籤的監督式分類降維師」：有標準答案標籤！降維時會故意把「好人聚一團、壞人聚另一團，兩團拉到最遠」。\n・SVM（支援向量機） ＝「畫出最寬馬路分界線的裁判」：在兩群資料中間找出一條間距最寬、最安全的分界線。\n・隨機森林（Random Forest） ＝「三個臭皮匠勝過一個諸葛亮（多棵決策樹投票）」：單一棵決策樹容易鑽牛角尖背死答案（過擬合），隨機森林請出一百棵樹一起投票表決，既準確又穩健！\n\n【🔑 正確選項秒殺題眼】\n・看到「濃縮核心特徵指標（非監督）」 ➔ 秒選 「PCA」\n・看到「高維資料壓平至 2D/3D 視覺化分群（非監督）」 ➔ 秒選 「t-SNE」\n・看到「有標籤、讓不同類分越開同類聚越近（監督式降維）」 ➔ 秒選 「LDA」\n・看到「最寬分界線」選 SVM ／ 看到「多棵樹投票防過擬合」選 隨機森林\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：PCA 是非監督式，LDA 才是監督式；且多棵樹投票是隨機森林而非 SVM。\n・✅ (B) 為什麼對：五種經典演算法的學習範式與核心功能配對完全正確。\n・❌ (C) 為什麼錯：t-SNE 是非監督視覺化降維演算法，並非神經網路最佳化器；隨機森林能處理高度非線性問題。\n・❌ (D) 為什麼錯：這五種演算法分別屬於監督式（LDA、SVM、隨機森林）與非監督式學習（PCA、t-SNE），皆非強化學習。", "has_caveat": 0, "caveat_note": null}, {"id": 326, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某銀行資訊部導入 AI 程式生成工具來提升軟體開發效率，主管在內部講義中指出：「AI 程式工具不只是幫你寫新程式，還能教你寫、幫你改！」並歸納出 4 大核心功能。此外，團隊也關注到由 Cognition Labs 推出、號稱全球首款能夠獨立規劃任務、操作終端機、編寫程式碼、除錯並完成部署的「自主 AI 軟體工程師（Autonomous AI Software Engineer）」。\n請問：\n1. AI 程式生成工具的「4 大核心功能」為何？\n2. 上述由 Cognition Labs 推出的「自主 AI 軟體工程師」名稱為何？", "option_a": "4 大功能為 修圖、配音、剪片、排版；自主軟體工程師為 AlphaCode", "option_b": "4 大功能為 ① 產出註解、② 解釋與翻譯（將程式碼轉成人話或跨語言轉換）、③ 改善跟重構（抓 Bug 與優化結構）、④ 測試及補全（即時自動補全與寫測試）；自主 AI 軟體工程師為 Devin", "option_c": "4 大功能為 資料收集、缺失值填補、Z-score 計算、盒鬚圖繪製；自主軟體工程師為 Midjourney", "option_d": "4 大功能為 預訓練、反向傳播、梯度下降、池化；自主軟體工程師為 Kaggle", "correct_option": "B", "explanation": "・📍 對應重點章節：3.6 程式生成應用與開發工具\n\n【💡 生活化範例 ／ 具體情境秒懂】\n軟體工程師每天被程式碼折磨的四件事，AI 程式助手剛好一對一全部包辦：\n・功能 ① 產出註解：寫完程式懶得寫說明？AI 自動幫每一行跟每個函數補上清楚的中文註解。\n・功能 ② 解釋與翻譯：看不懂前輩留下的祖傳天書程式碼？AI 幫你「轉成人話白話解釋」，還能把舊的 COBOL / Java 自動翻譯成現代的 Python！\n・功能 ③ 改善跟重構（Refactoring）：程式跑太慢或有隱藏 Bug？AI 幫你抓蟲並把雜亂的義大利麵條程式碼重構成乾淨優雅的結構。\n・功能 ④ 測試及補全：打一半自動接龍補全後半段程式碼，並自動幫你寫好單元測試（Unit Test）。\n・誰是全球首款「自主 AI 軟體工程師」？＝ Devin（Cognition Labs 推出）：注意區分！Google DeepMind 的 AlphaCode 是專門去打「高難度程式設計競賽」的選手；而 Devin 則是能自己開瀏覽器查文件、自己開終端機修 Bug 並獨立完成整個專案的「自主 AI 軟體工程師」！\n\n【🔑 正確選項秒殺題眼】\n・看到「AI 程式生成工具 4 大核心功能」 ➔ 秒選 「產出註解、解釋與翻譯、改善跟重構、測試及補全」\n・看到「Cognition Labs、自主 AI 軟體工程師」 ➔ 秒選 「Devin」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：修圖配音剪片是多媒體應用；且 AlphaCode 是專攻程式競賽的系統，並非自主軟體工程師 Devin。\n・✅ (B) 為什麼對：完整列出教材 3.6 節程式生成 4 大核心功能，並精準配對自主 AI 軟體工程師 Devin。\n・❌ (C) 為什麼錯：此為資料清理步驟，且 Midjourney 為生圖平台。\n・❌ (D) 為什麼錯：此為深度學習底層訓練機制，且 Kaggle 為資料科學競賽社群。", "has_caveat": 0, "caveat_note": null}, {"id": 327, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某大學的研究生想要開發一套「台灣本土農作物病蟲害辨識與問答系統」，但實驗室經費有限，無法從頭訓練百億參數模型，也缺乏大型公開資料集。指導教授建議他去全球最大的兩個「開源模型與數據共用平台」下載現成的預訓練開源模型權重與公開資料集，但特別叮囑他：在使用他人分享的開源數據與模型時，必須嚴格遵守平台上的 CC 授權（Creative Commons, 創用 CC） 等開源授權規範。\n請問教授推薦的這兩個「開源模型與數據共用代表平台」為何？而在遵守 CC 授權時，最基本的核心義務是什麼？", "option_a": "代表平台為 Netflix 與 Spotify；核心義務是將電腦離線斷網", "option_b": "代表平台為 Hugging Face（全球最大開源 AI 模型與 NLP 社群）與 Kaggle（Google 旗下全球最大資料科學競賽與公開數據集平台）；遵守 CC 授權的核心義務為「依規定標註原始來源出處（Attribution），並確認是否允許商業使用或改作」", "option_c": "代表平台為 Adobe Firefly 與 Midjourney；核心義務是刪除所有原作者姓名", "option_d": "代表平台為 Zapier 與 remove.bg；核心義務是支付歐盟全球年營業額 4% 的規費", "correct_option": "B", "explanation": "・📍 對應重點章節：4.5 可解釋 AI (XAI) 與開源數據授權平台、5.6 資料分析 雲端與硬體基礎設施\n\n【💡 生活化範例 ／ 具體情境秒懂】\n在 AI 圈子裡，有兩座所有工程師天天造訪的「免費開源寶庫」：\n・第一座寶庫：Hugging Face（抱抱臉 🤗）＝「AI 界的 GitHub 與模型大超市」：上面有超過百萬個開源預訓練模型（如 LLaMA、BERT、Stable Diffusion 權重）與公開資料集，一鍵就能下載微調。\n・第二座寶庫：Kaggle ＝「資料科學家的奧運賽場與數據庫」：提供海量真實世界的乾淨數據集、開源程式碼（Notebooks）與競賽。\n・免費拿寶物要守什麼規矩？＝ 遵守 CC 授權（創用 CC）：開源不等於可以隨便抄襲不講武德！使用 Hugging Face 或 Kaggle 上採用 CC 授權的數據或模型時，最核心的規範就是「標註來源出處（BY）」，並看清楚有沒有「非商業使用（NC）」或「禁止改作（ND）」等限制。\n\n【🔑 正確選項秒殺題眼】\n・看到「模型與數據共用、開源模型與公開資料集兩大平台」 ➔ 秒選 「Hugging Face 與 Kaggle」\n・看到「開源數據與模型共用平台遵守的授權規範」 ➔ 秒選 「CC 授權（Creative Commons，需標註來源出處）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Netflix 與 Spotify 是影音串流娛樂平台，並非開源 AI 模型與數據共用平台。\n・✅ (B) 為什麼對：精準點出 Hugging Face 與 Kaggle 兩大開源模型與數據共用平台，以及遵守 CC 授權 標註來源的合規要求。\n・❌ (C) 為什麼錯：刪除原作者姓名直接違反了 CC 授權最基本的「姓名標示（Attribution）」義務。\n・❌ (D) 為什麼錯：Zapier 是自動化工具、remove.bg 是去背工具；而全球年營業額 4% 是違反歐盟 GDPR 的最高罰款，不是開源規費。", "has_caveat": 0, "caveat_note": null}, {"id": 328, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某 AI 教學中心展示了兩個訓練失敗的極端案例：\n・案例甲（模型太笨學不來）：工程師只用了一個極度簡單的線性小模型去學習複雜的醫療影像，結果不管在「訓練集（平時課本）」還是在「驗證集（模擬考）」上，準確率都只有慘不忍睹的 45%，連最基本的特徵規律都學不會。\n・案例乙（太會背考古題）：工程師用了超大模型把訓練集背到 99.9% 滿分，但一考驗證集卻只剩 50%；為了解決案例乙，工程師除了使用 L1/L2 正則化 與 Dropout 外，還把訓練圖片隨機「旋轉、水平翻轉、微調亮度」變出更多花樣，並在監控到「驗證集誤差開始不降反升」的那一刻立刻提早停止訓練。\n請問案例甲稱為什麼現象？應如何解決？而案例乙中「把圖片旋轉翻面變出更多花樣」與「看到驗證集退步就提早喊卡」又分別稱為什麼技巧？", "option_a": "案例甲為 過擬合，應使用 Dropout 解決；案例乙的兩個技巧為 詞幹提取 與 批次正規化", "option_b": "案例甲為 欠擬合（Underfitting），應透過「增加模型的複雜度（加層數/加參數）與增加訓練時間」解決；案例乙的兩個防過擬合技巧分別為 資料增強（Data Augmentation） 與 早停法（Early Stopping）", "option_c": "案例甲為 梯度爆炸，應調高學習率解決；案例乙的兩個技巧為 資料離散化 與 主成分分析", "option_d": "案例甲為 模式崩潰，應減少訓練資料解決；案例乙的兩個技巧為 位置編碼 與 自迴歸", "correct_option": "B", "explanation": "・📍 對應重點章節：1.10 模型最佳化 訓練技巧與過擬合\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「小學生 vs 大學微積分」來秒懂 欠擬合（Underfitting） 與 過擬合（Overfitting） 的相反醫治方法：\n・案例甲：欠擬合（Underfitting） ＝「派幼稚園小朋友去考微積分，連課本都看不懂！」：\n  ・症狀：訓練集（課本）跟驗證集（模擬考）成績全都爛透了！\n  ・解法（幫大腦升級＋多讀點書）：這時候千萬不能再用 Dropout 關他腦細胞或加懲罰項了！必須反過來「增加模型的複雜度（增加隱藏層數、增加神經元參數）」並「增加訓練時間」，讓模型變聰明！\n・案例乙：對付 過擬合（Overfitting 死背考古題） 的完整四大武器：\n  1. L1 / L2 正則化：在損失函數加懲罰項。\n  2. Dropout：隨機關閉部分神經元。\n  3. 資料增強（Data Augmentation）：把圖片旋轉、翻面、裁切變出更多花樣，讓模型沒辦法死背單一角度的圖片。\n  4. 早停法（Early Stopping）：緊盯驗證集（模擬考）成績，一旦發現模型開始死背課本導致模擬考成績開始退步，立刻踩煞車提早結束訓練！\n\n【🔑 正確選項秒殺題眼】\n・看到「訓練集與驗證集表現都很差、模型太簡單學不會規律」 ➔ 秒選 「欠擬合（Underfitting），解法為增加模型複雜度与訓練時間」\n・看到「圖片旋轉翻面擴充多樣性、驗證集退步提早停止訓練」 ➔ 秒選 「資料增強（Data Augmentation）＋ 早停法（Early Stopping）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：案例甲連訓練集都考不好，是「欠擬合」而非過擬合；若對欠擬合使用 Dropout 只會讓模型更笨！\n・✅ (B) 為什麼對：精準診斷出案例甲為 欠擬合 並給出「增加模型複雜度」的正解，同時正確點出案例乙的 資料增強 與 早停法。\n・❌ (C) 為什麼錯：梯度爆炸是參數數值暴衝成無限大（NaN），若再調高學習率會炸得更快。\n・❌ (D) 為什麼錯：模式崩潰是 GAN 生成圖片千篇一律的問題，與分類準確率低下無關。", "has_caveat": 0, "caveat_note": null}, {"id": 329, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某企業舉辦「提示工程（Prompt Engineering）實戰大賽」，評審長根據教材中的「一般提示 6 大原則（精準、簡潔、對題、目的明確、加上背景、善用標示）」，設計了兩道觀念是非題來淘汰觀念錯誤的參賽者：\n・考題一：「在設計與撰寫 Prompt 時，下列哪一項『不是』必要的考量？」\n・考題二：「在優化 Prompt 以獲得更佳回答時，下列哪一項『不是』有效的協助技巧？」\n請問參賽者應該分別選出哪兩個「錯誤迷思選項」才能順利過關？", "option_a": "考題一選「適當表達任務需求」；考題二選「測試不同的組合與格式」", "option_b": "考題一選「使用模型熟悉的單詞」；考題二選「累積正確回答並訂正錯誤」", "option_c": "考題一選「確保 Prompt 長度足夠長」（違反簡潔原則）；考題二選「開放式的抽象描述」（違反精準與目的明確原則）", "option_d": "考題一選「嘗試不同的 Prompt 方式」；考題二選「持續監控與調整提問」", "correct_option": "C", "explanation": "・📍 對應重點章節：2.2 提示工程 原則 咒語 框架提示與三大思維推理\n\n【💡 生活化範例 ／ 具體情境秒懂】\n在認證考試的提示工程題庫中，有兩個專門用來釣魚的「經典反指標陷阱」，只要背起來看到直接秒選：\n・陷阱一：「確保 Prompt 長度足夠長」 ❌（違反「簡潔 Concise」原則）：跟 AI 說話講求的是「精準、簡潔、重點清楚」，絕對不是像寫作文湊字數一樣越長越好！塞了一堆冗言贅字反而會分散自注意力機制的焦點。\n・陷阱二：「開放式的抽象描述」 ❌（違反「精準 Precise」與「目的明確」原則）：如果你對 AI 說「請幫我寫一篇很有感覺、很深奧、讓人看了會流淚的東西」（開放式抽象描述），AI 根本不知道你要寫廣告、寫情書還是寫財報！提問必須具體明確，絕不能用抽象玄學描述。\n\n【🔑 正確選項秒殺題眼】\n・看到「何者『不是』Prompt 的必要考量？」 ➔ 秒選 「確保 Prompt 長度足夠長」\n・看到「何者『不是』Prompt 的協助技巧？」 ➔ 秒選 「開放式的抽象描述」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：適當表達任務需求與測試不同組合格式，皆為正確且必要的提示工程實踐。\n・❌ (B) 為什麼錯：使用模型熟悉單詞與累積正確回答訂正錯誤，皆為正確的提問優化技巧。\n・✅ (C) 為什麼對：精準揪出違反簡潔原則的「確保 Prompt 長度足夠長」與違反精準原則的「開放式的抽象描述」兩大必考排除項。\n・❌ (D) 為什麼錯：嘗試不同方式與監控調整提問，正是反覆運算提問（Iterative Prompting）的核心精神。", "has_caveat": 0, "caveat_note": null}, {"id": 330, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "自從 Google 在 2018 年推出雙向語言理解模型 BERT 後，各大科技大廠紛紛針對 BERT「參數量太大、運算較慢或訓練任務不夠好」的缺點，推出了三款經典的改良變體：\n・變體甲（Meta 推出）：發現原本 BERT 的「下一句預測（NSP）」任務太簡單沒什麼用，於是果斷拿掉 NSP 任務，改用「動態遮字（Dynamic Masking）」並餵入更多文章訓練，讓雙向理解力變得更強！\n・變體乙（Hugging Face 推出）：採用「知識蒸餾（Knowledge Distillation：大模型當老師教小模型學生）」技術，成功把模型體積縮小 40%、運算速度變快 60%，同時保留了 97% 的理解實力！\n・變體丙（Google 推出）：透過「跨層共用參數（Parameter Sharing）」與詞嵌入矩陣分解，大幅減少記憶體消耗，打造出超輕量級的 BERT。\n請問變體甲、乙、丙分別是哪三個模型？", "option_a": "變體甲：GPT-2 ／ 變體乙：LLaMA ／ 變體丙：Claude", "option_b": "變體甲：RoBERTa ／ 變體乙：DistilBERT ／ 變體丙：ALBERT", "option_c": "變體甲：DistilBERT ／ 變體乙：ALBERT ／ 變體丙：RoBERTa", "option_d": "變體甲：ALBERT ／ 變體乙：RoBERTa ／ 變體丙：DistilBERT", "correct_option": "B", "explanation": "・📍 對應重點章節：1.6 NLP BERT GPT 與 LLM 演進\n\n【💡 生活化範例 ／ 具體情境秒懂】\n記住 BERT 三大變體的「英文名字字根」，連死背都不用就能直接看名字連連看：\n・變體甲：RoBERTa（開頭 Ro = Robustly Optimized 強化最佳化版 BERT）：由 Meta 推出，拿掉沒用的 NSP、改動態遮字並狂讀更多書，是「體格最壯、理解力最強」的強化版 BERT。\n・變體乙：DistilBERT（開頭 Distil = Distillation 知識蒸餾版 BERT）：由 Hugging Face 推出，用「知識蒸餾」讓大老師把畢生功力濃縮傳授給小學生，體積瘦身 40%、速度快 60%。\n・變體丙：ALBERT（開頭 A L = A Lite 輕量版 BERT）：由 Google 推出，讓不同樓層「共用同一套家具（跨層共用參數）」，大幅省下記憶體空間！\n\n【🔑 正確選項秒殺題眼】\n・看到「Meta 推出、拿掉 NSP、動態遮字強化版」 ➔ 秒選 「RoBERTa」\n・看到「Hugging Face 推出、知識蒸餾（Distillation）縮小 40% 快 60%」 ➔ 秒選 「DistilBERT」\n・看到「Google 推出、跨層共用參數輕量版（A Lite BERT）」 ➔ 秒選 「ALBERT」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：GPT-2、LLaMA、Claude 皆為自迴歸生成式模型，並非雙向 Encoder 的 BERT 變體。\n・✅ (B) 為什麼對：完全符合 RoBERTa（強化訓練）、DistilBERT（知識蒸餾）與 ALBERT（共用參數輕量化）的三大變體特徵。\n・❌ (C) 為什麼錯：將三個變體的技術特徵順序全部配錯了。\n・❌ (D) 為什麼錯：同樣將三個變體的開發商與核心技術配錯。", "has_caveat": 0, "caveat_note": null}, {"id": 331, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國製造業集團準備將生成式 AI 全面導入企業內部系統，資訊長同時與兩家科技巨頭簽署了基礎設施合作協議：\n1. 雲端企業平台（Amazon AWS 旗下服務）：企業不想自己從頭管理底層伺服器，希望能透過單一雲端全託管平台，直接藉由 API 安全地調用 Anthropic Claude、Meta LLaMA、Stability AI 與 Amazon Titan 等多家頂尖基礎模型（Foundation Models），快速打造 B2B 企業級生成式 AI 應用。\n2. 算力硬體與推論微服務（NVIDIA 旗下產品）：企業內部的本地端 AI 算力中心採購了被譽為「AI 訓練與算力 GPU 心臟」的頂級加速卡，並搭配該廠牌推出的容器化「推論微服務平臺」，讓模型在企業內部部署推論時能達到極致加速。\n請問第 1 點的 AWS 雲端生成式 AI 託管平台，以及第 2 點的 NVIDIA 算力硬體與推論微服務平臺，分別對應哪一組產品名稱？", "option_a": "AWS 平台：Google AI Studio ／ NVIDIA 產品：Apple Intelligence 與 TPUs", "option_b": "AWS 平台：Amazon Bedrock ／ NVIDIA 產品：H100 / B100（GPU 加速卡） 與 NVIDIA NIMs（推論微服務平臺）", "option_c": "AWS 平台：GitHub Copilot ／ NVIDIA 產品：Hadoop 與 Spark", "option_d": "AWS 平台：Notion AI ／ NVIDIA 產品：ZeroGPT 與 TurboScribe", "correct_option": "B", "explanation": "・📍 對應重點章節：2.1 大語言模型 (LLM) 原理 微調與應用模式、5.6 資料分析 雲端與硬體基礎設施\n\n【💡 生活化範例 ／ 具體情境秒懂】\n企業導入 AI 離不開「雲端模型大管家」與「地端算力火車頭」這兩大基礎設施巨頭：\n・Amazon AWS 的企業雲端王牌 ＝ Amazon Bedrock：Bedrock（基石）是 AWS 專為企業（B2B）打造的全託管生成式 AI 平台，像一座雲端百貨公司，把 Claude、LLaMA 等各家基礎模型都整合在裡面，讓企業用最安全的雲端權限直接串接微調。\n・NVIDIA（輝達）的硬體心臟與推論神器 ＝ H100 / B100 ＋ NIMs：\n  ・H100 / B100：全球各大 AI 巨頭搶破頭的資料中心級 GPU 算力心臟。\n  ・NVIDIA NIMs（NVIDIA Inference Microservices）：把最佳化好的 AI 模型打包成標準貨櫃（微服務容器），讓企業花幾分鐘就能在自家伺服器上高速跑起模型推論！\n\n【🔑 正確選項秒殺題眼】\n・看到「Amazon AWS 企業級雲端基礎模型託管平台（B2B）」 ➔ 秒選 「Amazon Bedrock」\n・看到「NVIDIA 提供 AI 訓練與部署的 GPU 心臟與推論平臺」 ➔ 秒選 「H100 / B100 與 NIMs」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Google AI Studio 與 TPU 屬於 Google 生態系，Apple Intelligence 屬於 Apple。\n・✅ (B) 為什麼對：精準對應 AWS 的 Amazon Bedrock 以及 NVIDIA 的 H100 / B100 與 NIMs。\n・❌ (C) 為什麼錯：GitHub Copilot 是微軟/GitHub 的程式助手；Hadoop 與 Spark 是大數據分散式運算框架。\n・❌ (D) 為什麼錯：Notion AI、ZeroGPT、TurboScribe 皆為應用層小工具，並非雲端託管與 GPU 硬體設施。", "has_caveat": 0, "caveat_note": null}, {"id": 332, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在訓練二元分類模型時，「精確率（Precision）」與「召回率（Recall）」往往像翹翹板的兩端，需要根據業務場景決定誰優先：\n・場景甲（VIP 商務信箱的垃圾郵件過濾器）：總經理最怕「把客戶寄來的千萬合約正常信，誤判成垃圾信丟進垃圾桶（誤抓好人）」！寧可漏掉幾封廣告信留在收件匣，也絕對要保證「凡是被 AI 丟進垃圾桶的信，100% 真的是垃圾信（寧缺毋濫）」。\n・場景乙（醫院的致命傳染病或早期癌症篩檢 AI）：醫師最怕「明明病人已經得癌症，AI 卻沒看出來放他回家（漏掉壞人）」！寧可多叫幾個疑似陽性的健康人回來複檢，也絕對要把所有真正的患者「一個都不漏地抓出來（天羅地網）」。\n請問場景甲與場景乙，應該分別優先拉高哪一個評估指標？", "option_a": "場景甲優先看 召回率（Recall）；場景乙優先看 精確率（Precision）", "option_b": "場景甲（防誤抓好人、寧缺毋濫）應優先拉高 精確率（Precision）；場景乙（防漏抓壞人、天羅地網）應優先拉高 召回率（Recall）", "option_c": "兩個場景都應該只看 BLEU 指標", "option_d": "兩個場景都應該只看 R-square (R²) 決定係數", "correct_option": "B", "explanation": "・📍 對應重點章節：1.14 模型評估指標 F1-score R-squared 與 BLEU\n\n【💡 生活化範例 ／ 具體情境秒懂】\n很多考生永遠背不清 Precision 跟 Recall 誰是誰，請記住這句「警察抓壞人」終極口訣：\n・精確率（Precision） ＝「寧缺毋濫（防誤抓好人！）」：\n  ・白話意思：在 AI 動手抓進警局的 10 個人裡面，有幾個是真的壞人？\n  ・代表場景（垃圾信過濾、YouTube 兒童安全推薦）：如果你把總經理的重要合約信（好人）誤判成垃圾信（壞人）刪掉就慘了！所以要求出手一定要「精準」，沒十成把握寧可別抓，這就是看重 Precision（精確率）！\n・召回率（Recall） ＝「天羅地網（防漏掉壞人！）」：\n  ・白話意思：把散落在社會上的 100 個真壞人「全部召回（Recall）抓回來」了幾個？\n  ・代表場景（癌症篩檢、地震海嘯預警、機場通緝犯辨識、金融盜刷攔截）：漏掉一個癌症病人或恐怖份子會出人命！寧可錯殺一百（請他做二次檢查），也絕不可放過一個，這就是看重 Recall（召回率）！\n\n【🔑 正確選項秒殺題眼】\n・看到「寧缺毋濫、防誤抓好人（如怕正常重要信件被誤判為垃圾信）」 ➔ 秒選 「精確率（Precision）」\n・看到「天羅地網、防漏抓壞人（如癌症篩檢、傳染病與盜刷偵測）」 ➔ 秒選 「召回率（Recall）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：將精確率（防誤抓）與召回率（防漏抓）的適用場景完全顛倒了。\n・✅ (B) 為什麼對：完美對應場景甲（垃圾信防誤判重要信件＝高 Precision）與場景乙（癌症篩檢防漏診＝高 Recall）。\n・❌ (C) 為什麼錯：BLEU 是機器翻譯與文本生成指標，不適用於二元分類。\n・❌ (D) 為什麼錯：R² 是連續數值迴歸指標，不適用於二元分類。", "has_caveat": 0, "caveat_note": null}, {"id": 333, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某多媒體設計學院開設了「AI 圖像生成工具全攻略」課程，教授請學生針對四款各具特色的圖像工具進行配對：\n・工具甲：由 Stability AI 官方推出的「閉源簡化版雲端網頁介面」，讓不想自己安裝複雜程式環境的初學者，打開瀏覽器就能直接體驗 Stable Diffusion 生圖。\n・工具乙：專門針對微調版 Stable Diffusion 打造，在「遊戲美術資產（Game Assets，如武器道具、角色立繪）、概念設計圖與奇幻幻想風格」領域表現最受遊戲開發者青睞。\n・工具丙：Google 早期推出的卷積神經網路（CNN）特徵視覺化工具，以生成充滿眼睛與漩渦圖騰的「迷幻、超現實藝術風格轉換」影像而聞名。\n・工具丁：微軟（Microsoft）將 OpenAI 的 DALL·E 3 深度整合進自家生態系，讓用戶能免費對話生圖並直接套用社群海報排版的設計工具組合。\n請問工具甲、乙、丙、丁分別為何？", "option_a": "工具甲：Midjourney ／ 工具乙：Ideogram ／ 工具丙：Canva ／ 工具丁：Adobe Firefly", "option_b": "工具甲：DreamStudio ／ 工具乙：Leonardo.Ai ／ 工具丙：Google DeepDream ／ 工具丁：Copilot + Designer", "option_c": "工具甲：Sora ／ 工具乙：Runway ／ 工具丙：Lumiere ／ 工具丁：HeyGen", "option_d": "工具甲：Leonardo.Ai ／ 工具乙：DreamStudio ／ 工具丙：Copilot ／ 工具丁：DeepDream", "correct_option": "B", "explanation": "・📍 對應重點章節：1.7 擴散模型 (Diffusion)、3.2 圖片生成工具與應用\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這四款圖片工具各有超鮮明的身分標籤：\n・工具甲：DreamStudio ＝「Stability AI 開給新手的官方體驗店」：Stable Diffusion 本尊是開源模型（要在自己電腦裝環境），而 DreamStudio 則是官方直接架好的網頁版，免裝環境打開就能畫！\n・工具乙：Leonardo.Ai ＝「遊戲美術師的軍火庫」：內建大量專為遊戲角色、寶箱道具、奇幻場景微調好的模型，做遊戲美術概念圖首選。\n・工具丙：Google DeepDream ＝「CNN 做夢畫出的迷幻超現實圖騰」：Google 早期讓 CNN 把看到的特徵不斷強化放大，生出像夢境般迷幻的超現實畫面。\n・工具丁：Copilot + Microsoft Designer ＝「微軟免費送你的 DALL·E 3 海報神器」：微軟把 DALL·E 3 包裝進 Copilot 對話與 Designer 排版工具裡。\n\n【🔑 正確選項秒殺題眼】\n・看到「Stability AI 官方閉源簡化網頁介面、適合初學者入門」 ➔ 秒選 「DreamStudio」\n・看到「擅長遊戲美術資產、概念圖與幻想風格」 ➔ 秒選 「Leonardo.Ai」\n・看到「Google 早期 CNN 迷幻、超現實藝術風格轉換」 ➔ 秒選 「Google DeepDream」\n・看到「微軟整合 DALL·E 3 生圖與海報設計」 ➔ 秒選 「Copilot + Designer」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Midjourney 並非 Stability AI 旗下產品，Ideogram 主打圖片嵌字，Canva 與 Firefly 亦不符合題幹描述。\n・✅ (B) 為什麼對：四款圖像生成工具的開發商與核心特色完全吻合教材 1.7 與 3.2 節規範。\n・❌ (C) 為什麼錯：Sora、Runway、Lumiere、HeyGen 全部都是「影片生成工具」，並非靜態圖片工具。\n・❌ (D) 為什麼錯：將甲與乙、丙與丁的配對順序顛倒了。", "has_caveat": 0, "caveat_note": null}, {"id": 334, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某智慧家庭大廠正在回顧其早期語音助理技術，工程師提到：「在處理人類講話的語音波形或閱讀文章時，前面的字詞會影響後面字詞的意思，因此傳統 RNN（循環神經網路） 透過兩大關鍵內部機制來處理這種時間序列資料；同時，我們日常手機與網頁上的三大經典語音與語言應用，早期也都是 RNN 的代表作。」\n請問：\n1. RNN 能夠處理時間序列與語言的「兩大關鍵內部機制」為何？\n2. 教材中列舉 RNN 最具代表性的「三大經典日常應用實例」為何？", "option_a": "兩大機制為 卷積掃描 與 最大池化；三大應用為 臉部辨識門禁、車牌 OCR、名畫風格轉換", "option_b": "兩大機制為 ① 記憶機制（Recurrent Connections 循環連結：將前一刻資訊傳遞給現在的自己） 與 ② 時序依賴性（Sequential Dependency：捕捉資料的前後時間順序關聯）；三大經典應用為 ① 語音辨識（Google Assistant / Apple Siri）、② 自動字幕生成（YouTube 自動字幕）、③ 機器翻譯（Google 翻譯）", "option_c": "兩大機制為 正向加噪 與 反向去噪；三大應用為 Midjourney、Stable Diffusion、DALL·E", "option_d": "兩大機制為 16×16 圖片切塊 與 空間網格平鋪；三大應用為 Excel 樞紐分析、盒鬚圖、Z-score", "correct_option": "B", "explanation": "・📍 對應重點章節：1.2 CNN vs RNN\n\n【💡 生活化範例 ／ 具體情境秒懂】\n為什麼看圖片要找 CNN，但聽聲音、看字幕、做翻譯這種「有時間先後順序」的事要找 RNN？\n・RNN 的兩大看家本領：\n  1. 記憶機制（Recurrent Connections 循環連結）：神經元身上有一條「小迴紋針（循環線）」，可以把上一秒讀到的字傳給下一秒的自己，不會讀了後面忘前面。\n  2. 時序依賴性（Sequential Dependency）：專門對付「時間軸先後順序不能亂調」的資料（例如「狗咬人」跟「人咬狗」順序一換意思全變）。\n・RNN 三大生活代表作（全都跟「聽聲音、排文字順序」有關）：\n  1. 語音辨識：對著手機喊 Hey Siri 或 Google Assistant。\n  2. 自動字幕生成：看 YouTube 影片時底下隨聲音逐字跳出來的自動字幕。\n  3. 機器翻譯：早期的 Google 翻譯 以及音樂旋律延續。\n\n【🔑 正確選項秒殺題眼】\n・看到「RNN 處理時間序列兩大關鍵機制」 ➔ 秒選 「記憶機制（循環連結）＋ 時序依賴性」\n・看到「RNN 三大經典應用代表」 ➔ 秒選 「語音辨識（Google Assistant/Siri）、自動字幕（YouTube）、機器翻譯（Google 翻譯）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：卷積、池化以及臉部辨識、OCR、風格轉換，全部都是 CNN（卷積神經網路） 的招牌領域！\n・✅ (B) 為什麼對：完整對應教材 1.2 節中 RNN 的兩大核心機制與三大日常應用代表。\n・❌ (C) 為什麼錯：加噪與去噪是 擴散模型（Diffusion） 的機制與生圖工具。\n・❌ (D) 為什麼錯：16×16 切塊是 Vision Transformer 的做法，Excel 與盒鬚圖則是傳統統計工具。", "has_caveat": 0, "caveat_note": null}, {"id": 335, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國銀行為因應生成式 AI 帶來的個資與合規挑戰，召開了「企業資料治理（Data Governance）與隱私保護委員會」。資訊安全長在會中確立了企業資料治理的「三大核心目標」，並要求技術團隊全面落實保護個人隱私的「四大技術與管理策略」。\n請問：\n1. 資料治理的「三大核心目標」為何？\n2. 保護個人資料隱私的「四大策略」為何？", "option_a": "三大目標為 提高溫度、增加 Top-K、擴大批次大小；四大策略為 公開姓名、永久保存、全員皆可讀取、明文傳輸", "option_b": "三大目標為 ① 保證資料品質（Data Quality）、② 確保透明度與合規（Transparency & Compliance）、③ 維持資料一致性（Data Consistency）；四大隱私保護策略為 ① 資料去識別化（De-identification）、② 存取控制（Access Control）、③ 資料加密（Encryption）、④ 數據最小化（Data Minimization，只收集必要的最少資料）", "option_c": "三大目標為 減少算力、刪除測試集、關閉防火牆；四大策略為 社交工程、網路釣魚、模式崩潰、梯度爆炸", "option_d": "三大目標為 縮減、轉換、擴展；四大策略為 卷積、池化、全連接、自迴歸", "correct_option": "B", "explanation": "・📍 對應重點章節：4.4 資料治理 隱私保護技術與全球個資法規\n\n【💡 生活化範例 ／ 具體情境秒懂】\n企業管好資料就像「銀行管理金庫帳冊」，要達成 3 個目標並築起 4 道防盜牆：\n・資料治理 3 大目標：\n  1. 保證資料品質：進去訓練的資料必須乾淨、正確、無偏見（避免垃圾進、垃圾出）。\n  2. 確保透明度與合規：資料從哪來、怎麼用都要清楚合法（符合 GDPR 與個資法）。\n  3. 維持資料一致性：全公司各部門對同一個欄位的定義與格式要統一，不能各唱各的調。\n・隱私保護 4 道防盜牆：\n  1. 資料去識別化：把姓名、身分證字號遮掉或代換掉，讓人認不出是誰。\n  2. 存取控制：設權限門禁，只有獲得授權的人才能看敏感資料。\n  3. 資料加密：傳輸與儲存時鎖進密碼箱（如 HIPAA 醫療法規最強調的核心技術）。\n  4. 數據最小化：不貪心！辦會員只需要電話就別連人家的祖宗十八代跟血型都收，只收集完成任務所需的最少資料！\n\n【🔑 正確選項秒殺題眼】\n・看到「資料治理三大目標」 ➔ 秒選 「保證資料品質、確保透明度與合規、維持資料一致性」\n・看到「保護個人資料隱私四大策略」 ➔ 秒選 「去識別化、存取控制、資料加密、數據最小化」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：公開姓名、全員可讀、明文傳輸會造成毀滅性的個資外洩違法事故。\n・✅ (B) 為什麼對：完整且精準地列出教材 4.4 節資料治理三大目標與隱私保護四大策略。\n・❌ (C) 為什麼錯：社交工程與網路釣魚是駭客的攻擊手段，而非企業保護隱私的策略。\n・❌ (D) 為什麼錯：縮減、轉換、擴展是 LLM 的應用模式；卷積、池化是 CNN 架構。", "has_caveat": 0, "caveat_note": null}, {"id": 336, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在 2025～2026 全球熱門生成式 AI 工具百強榜單中，有四款針對特定專業領域打造的明星工具：\n・工具甲（醫療臨床專用）：專為「醫師與臨床醫療人員」打造的 AI 醫學文獻搜尋與實證醫學問答引擎，回答皆附帶頂級醫學期刊（如 NEJM、JAMA）的精準引用。\n・工具乙（AI 專題懶人包搜尋）：由前百度高管創立的新一代 AI 搜尋引擎，當使用者查詢一個主題時，會自動派出多個 AI Agent 進行深度交叉查證，並即時生成一個客製化的專屬網頁懶人包「Sparkpage」。\n・工具丙（萬用模型 API 轉接站）：提供「單一統一 API 介面」，讓開發者只要寫一套程式碼，就能自由切換並呼叫全球數百種不同的開源與閉源大語言模型（如 Claude、GPT、LLaMA、DeepSeek）。\n・工具丁（AI 超解析放大重繪神器）：專攻將模糊或低解析度的圖片進行「超高倍率放大與細節重繪（Upscaler & Enhancer）」，能為人像皮膚或風景補上驚人的逼真細節。\n請問工具甲、乙、丙、丁分別對應哪一個名稱？", "option_a": "工具甲：Character.ai ／ 工具乙：remove.bg ／ 工具丙：TurboScribe ／ 工具丁：ZeroGPT", "option_b": "工具甲：OpenEvidence ／ 工具乙：Genspark ／ 工具丙：OpenRouter ／ 工具丁：Magnific AI", "option_c": "工具甲：Suno ／ 工具乙：AIVA ／ 工具丙：ElevenLabs ／ 工具丁：HeyGen", "option_d": "工具甲：Kaggle ／ 工具乙：Zapier ／ 工具丙：Canva ／ 工具丁：Grammarly", "correct_option": "B", "explanation": "・📍 對應重點章節：5.3 圖像生成 修圖去背與設計工具、5.7 自主代理 (AI Agents) 開發測試與 Google 生態系\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這題幫你鎖定第五部分工具總覽中，四個名字超好認、功能超聚焦的專業神器：\n・工具甲：OpenEvidence（Open 開放 ＋ Evidence 醫學實證）：看到字根 Evidence（實證醫學），直接聯想「醫師專用的醫學文獻實證搜尋引擎」！\n・工具乙：Genspark（生成 Sparkpage 專題懶人包）：不同於一般只給一段話的搜尋引擎，它會直接幫你生出一個排版精美的「Sparkpage 專題懶人包網頁」。\n・工具丙：OpenRouter（開放路由器／總機轉接站）：就像家裡的 Wi-Fi 路由器（Router），工程師只要接上 OpenRouter 這一個 API 插座，就能一鍵切換呼叫全世界幾百種 LLM 模型！\n・工具丁：Magnific AI（Magnify 放大鏡）：字根就是英文的「放大鏡」，專門把小圖或模糊圖片進行「AI 超解析度放大與極致細節重繪」！\n\n【🔑 正確選項秒殺題眼】\n・看到「醫師專用、臨床醫學文獻實證問答」 ➔ 秒選 「OpenEvidence」\n・看到「AI 搜尋自動生成 Sparkpage 專題懶人包」 ➔ 秒選 「Genspark」\n・看到「單一 API 介面路由聚合數百種 LLM」 ➔ 秒選 「OpenRouter」\n・看到「AI 圖片超解析放大與細節重繪（Magnify）」 ➔ 秒選 「Magnific AI」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Character.ai 是角色扮演聊天、remove.bg 是去背、TurboScribe 是語音轉逐字稿、ZeroGPT 是抓 AI 代寫。\n・✅ (B) 為什麼對：四款工具（OpenEvidence、Genspark、OpenRouter、Magnific AI）完全吻合第五部分工具總覽的定義。\n・❌ (C) 為什麼錯：Suno、AIVA、ElevenLabs、HeyGen 為音樂、語音與數位人影片工具。\n・❌ (D) 為什麼錯：Kaggle、Zapier、Canva、Grammarly 皆非題幹描述之四項新型專業工具。", "has_caveat": 0, "caveat_note": null}, {"id": 337, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "一位高中生在學習神經網路基礎公式 y = wx + b 與損失函數時，老師用「搭計程車算車資」來舉例：\n「假設計程車的總車資為 y，行駛公里數為輸入特徵 x。每多開一公里跳表加收 25 元，而且只要一上車，不管開幾公里都固定先收一筆 85 元的基本起跳價。當神經網路猜出車資後，我們會把『預測車資與真實車資的差（誤差）先取平方、再把所有乘客的誤差平方加起來取平均』，讓猜錯越離譜的樣本被罰得越重！」\n請問在這個例子裡：\n1. 每公里單價「25 元（決定輸入特徵 x 的重要程度）」與上車基本起跳價「85 元（調整輸出的基本基準門檻）」，分別對應神經網路的哪兩個核心參數？\n2. 把「誤差平方後取平均」用來評估數值迴歸準確度的損失函數，稱為什麼？", "option_a": "25 元是 偏移（Bias b）、85 元是 權重（Weight w）；損失函數為 BLEU", "option_b": "25 元（乘在特徵 x 前面，決定特徵重要程度）是 權重（Weight w）、85 元（加在最後面，作為基本起跳門檻）是 偏移（Bias b）；將誤差平方後取平均的迴歸損失函數為 均方誤差（MSE, Mean Squared Error）", "option_c": "25 元是 學習率、85 元是 批次大小；損失函數為 交叉熵（Cross-Entropy）", "option_d": "25 元與 85 元都是 啟動函數 ReLU；損失函數為 F1-score", "correct_option": "B", "explanation": "・📍 對應重點章節：1.1 神經網路基礎 感知器與反向傳播\n\n【💡 生活化範例 ／ 具體情境秒懂】\n用「計程車車資公式 車資 y = 25 × 公里數 x + 85」記神經網路參數，一輩子都不會忘：\n・權重（Weight, w = 25） ＝「每公里單價（決定特徵 x 有多重要！）」：直接乘在輸入特徵 x 身上的倍數。如果某個特徵超級重要，w 就會很大；如果某個特徵根本是廢話，w 就會趨近於 0。\n・偏移（Bias, b = 85） ＝「計程車起跳價（基本基準門檻！）」：就算公里數 x = 0，一上車還是有個基本起跳門檻 b，讓整條預測線可以自由上下平移，不會被死死釘在原點 (0,0)。\n・均方誤差（MSE, Mean Squared Error） ＝「誤差先平方、再取平均（錯越大罰越重！）」：為什麼要先平方？第一是因為有正負號直接相加會抵銷；第二是因為平方後，差 10 元會變成罰 100（10²），讓離譜的大錯被重罰，是迴歸預測最核心的損失函數（數值越小越準）！\n\n【🔑 正確選項秒殺題眼】\n・看到「決定輸入特徵重要程度的乘數 w」 ➔ 秒選 「權重（Weight）」\n・看到「基本起跳門檻、調整平移基準的常數 b」 ➔ 秒選 「偏移（Bias）」\n・看到「預測值與真實值誤差平方後取平均（迴歸損失函數）」 ➔ 秒選 「均方誤差（MSE）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：把權重 w（每公里單價）與偏移 b（起跳價）顛倒了；且 BLEU 是翻譯評估指標。\n・✅ (B) 為什麼對：精準對應公式 y = wx + b 中的權重 w、偏移 b，以及誤差平方取平均的 均方誤差（MSE）。\n・❌ (C) 為什麼錯：學習率與批次大小是訓練前設定的「超參數（Hyperparameters）」，並非神經元內部的 w 與 b。\n・❌ (D) 為什麼錯：啟動函數是固定的非線性轉換函數（非參數），且 F1-score 是分類評估指標。", "has_caveat": 0, "caveat_note": null}, {"id": 338, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某獨立音樂人與視覺藝術家合作製作一首 AI 單曲 MV，他們在工作流程中需要掌握兩個核心模組：\n1. 聲音與音樂生成的「4 大控制要素」：在使用 AI 語音與音樂工具時，創作者主要是透過哪 4 個維度來精細控制生成的聲音表現？\n2. 音樂視覺化與動畫故事短片工具：當歌曲完成後，藝術家想把這首音樂與插畫結合，快速生成「跟著音樂節奏律動的動畫式故事與視覺化流程影片」，應該優先選用哪一組影片生成工具？\n請問下列哪一個選項的組合完全正確？", "option_a": "4 大控制要素為 卷積、池化、斷詞、降維；動畫故事影片工具為 ZeroGPT / TurboScribe", "option_b": "4 大控制要素為 ① 語者的選擇、② 語速與語調、③ 情緒的控制、④ 自然語法的提示；動畫式故事與音樂視覺化影片工具首選為 Canva Video / Animoto / Kaiber", "option_c": "4 大控制要素為 像素切塊、位置編碼、正則化、早停法；動畫故事影片工具為 GitHub Copilot / Cursor", "option_d": "4 大控制要素為 去識別化、存取控制、加密、數據最小化；動畫故事影片工具為 Hugging Face / Kaggle", "correct_option": "B", "explanation": "・📍 對應重點章節：3.3 聲音 (TTS) 與音樂生成應用、3.4 影片生成流程與應用場景\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這題幫你把教材 3.3 節與 3.4 節中，關於「聲音控制」與「動畫故事 MV 工具」的條列重點一次收網：\n・控制 AI 聲音與音樂表現的 4 個旋鈕：\n  1. 語者的選擇：挑誰來唱或誰來唸（低沉大叔、甜美少女、專業新聞主播）。\n  2. 語速與語調：調整講話或節奏的快慢（1.2 倍速）與音調高低。\n  3. 情緒的控制：指定開朗興奮、溫柔療癒還是悲傷嚴肅。\n  4. 自然語法的提示：用白話文提示詞描述想要的聲音質感與曲風氛圍。\n・做「動畫式故事、流程影片與音樂視覺化 MV」的三劍客 ＝ Canva Video、Animoto、Kaiber：特別是 Kaiber，是許多知名樂團（如 Linkin Park）用來製作 AI 動漫風音樂 MV 的招牌神器；而 Canva Video 與 Animoto 則擅長把圖文快速串成流暢的動畫故事與流程短片！\n\n【🔑 正確選項秒殺題眼】\n・看到「聲音與音樂生成的 4 大控制要素」 ➔ 秒選 「語者的選擇、語速與語調、情緒的控制、自然語法的提示」\n・看到「動畫式故事與流程影片、音樂視覺化動畫」 ➔ 秒選 「Canva Video / Animoto / Kaiber」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：卷積池化是 CNN，ZeroGPT 與 TurboScribe 分別為 AI 偵測與語音轉文字工具。\n・✅ (B) 為什麼對：完整對應教材 3.3 節音樂與語音 4 大控制要素，以及 3.4 節動畫式故事與流程影片的代表工具 Canva Video / Animoto / Kaiber。\n・❌ (C) 為什麼錯：前段為模型訓練術語，後段 GitHub Copilot 與 Cursor 為寫程式工具。\n・❌ (D) 為什麼錯：前段為隱私保護四大策略，後段為開源模型與數據平台。", "has_caveat": 0, "caveat_note": null}, {"id": 339, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某金控集團內部培訓在講解「為什麼 ChatGPT 能既博學多聞、又懂得禮貌且安全地回答客戶問題」時，將大型語言模型（LLM）的養成比喻為「大學通識教育（預訓練 Pre-training）」與「企業職前特訓（微調 Fine-tuning）」兩個階段。請問關於這兩個階段的學習方式、產出成果以及微調的「三大核心目標」，下列敘述何者完全正確？", "option_a": "預訓練屬於「監督式學習」，需要人工逐字標註數十億篇文章，產出專才模型；微調則是為了讓模型忘記所有語言規則", "option_b": "預訓練屬於「自監督學習（Self-Supervised Learning）」，讓模型自己讀千萬篇文章玩文字接龍（透過梯度下降與反向傳播調整權重），產出博學但只會接話的「通才基礎模型（Base Model）」；接著再透過微調（Fine-tuning）達成「① 角色扮演（角色訓練）、② 任務訓練、③ 行為對齊（Alignment，如結合 RLHF 貼近人類價值與安全期待）」三大目標，最終蛻變為好用的專才模型（如 ChatGPT）", "option_c": "預訓練只使用 10 筆人工資料；微調則是完全不修改任何參數的零樣本提示（Zero-Shot）", "option_d": "預訓練的唯一目標是「圖片去背」；微調的唯一目標是「降低解析度」", "correct_option": "B", "explanation": "・📍 對應重點章節：2.1 大語言模型 (LLM) 原理 微調與應用模式\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「把一個讀遍圖書館的怪才，訓練成五星級銀行理專」來秒懂 LLM 的兩階段養成：\n・第一階段：預訓練（Pre-training） ＝「在圖書館閉關自學（自監督學習），練成博學『通才（Base Model）』」：\n  ・沒人幫幾十億篇網頁標答案，模型靠「自監督學習」自己遮住最後一個字玩文字接龍。\n  ・這時練出來的叫「通才基礎模型（Base Model）」——他肚子裡什麼知識都有，但沒學過禮貌跟規矩！如果你問他「怎麼做炸彈？」，還沒微調的通才可能會傻傻接著幫你寫炸彈食譜！\n・第二階段：微調（Fine-tuning） ＝「職前三大特訓，變身安全有禮貌的『專才（ChatGPT）』」：\n  1. 角色扮演（角色訓練）：教他認清自己是「樂於助人的 AI 助手」，不是只會接話的複讀機。\n  2. 任務訓練：教他怎麼聽懂指令做摘要、寫信、翻譯、回答問題。\n  3. 行為對齊（Alignment）：結合 RLHF（人類回饋強化學習），讓他的回答符合人類道德價值與安全規範（遇到做炸彈、歧視或洩密問題會禮貌拒絕）！\n\n【🔑 正確選項秒殺題眼】\n・看到「LLM 預訓練學習範式與產出」 ➔ 秒選 「自監督學習 ➔ 產出通才基礎模型（Base Model）」\n・看到「LLM 微調（Fine-tuning）三大目標」 ➔ 秒選 「① 角色扮演、② 任務訓練、③ 行為對齊（結合 RLHF 符合人類價值與安全）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：海量預訓練語料不可能靠人工逐字標註（非監督式/自監督式才對），且預訓練產出的是通才而非專才。\n・✅ (B) 為什麼對：完整串聯「自監督預訓練產出通才 Base Model」到「微調三大目標（角色扮演、任務訓練、RLHF 行為對齊）產出專才 ChatGPT」的核心脈絡。\n・❌ (C) 為什麼錯：預訓練需要海量數據（TB 級語料），且微調會實際調整模型權重（Zero-Shot 才是提示工程）。\n・❌ (D) 為什麼錯：圖片去背與降低解析度屬於影像處理，與大語言模型訓練無關。", "has_caveat": 0, "caveat_note": null}, {"id": 340, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "一位不懂程式語法的非技術背景創業者，想要「只用自然語言打字描述需求（Vibe Coding），就讓 AI 自動生成包含前端介面、後端資料庫與一鍵雲端部署的完整全端網站 App」；而他的工程師朋友則偏愛使用 Google 官方推出的開發者生態系工具來測試 Gemini API、體驗實驗性 AI 原型，並使用代理式（Agentic）AI 編程 IDE。\n請問：\n1. 適合非技術創業者「用自然語言對話直接生成全端網站 App」的三大新興開發平台為何？\n2. Google 官方旗下負責「快速測試 Gemini Prompt 與拿 API Key」、「體驗最新實驗性 AI 專案」與「代理式 AI 軟體開發平台」的三大工具名稱為何？", "option_a": "1. remove.bg / ZeroGPT / TurboScribe ／ 2. Suno / AIVA / ElevenLabs", "option_b": "1. Lovable、Base44、Replit（Replit Agent） ／ 2. Google AI Studio、Google Labs、Google Antigravity", "option_c": "1. Excel / Word / PowerPoint ／ 2. Hadoop / Spark / Kaggle", "option_d": "1. Midjourney / DALL·E / Ideogram ／ 2. Claude / Grok / LLaMA", "correct_option": "B", "explanation": "・📍 對應重點章節：5.5 程式開發 AI IDE 與自動化建站工具、5.7 自主代理 (AI Agents) 開發測試與 Google 生態系\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這題幫你掌握 2025～2026 最火紅的「對話式全端建站（Vibe Coding）」與「Google 開發者三劍客」：\n・不會寫程式也能開口生出整個網站 App 的三劍客 ＝ Lovable、Base44、Replit：\n  ・以前寫網站要學 HTML/CSS/React/資料庫，現在只要對著 Lovable、Base44 或 Replit Agent 說：「幫我做一個像 Airbnb 的寵物寄宿預約網站」，AI 就會把前後端程式碼、資料庫跟網址一次幫你生出來！\n・Google 開發者生態系三劍客：\n  1. Google AI Studio：開發者測試 Gemini 模型參數（如 Temperature、Top-P）與申請 API Key 的最速工作台。\n  2. Google Labs：Google 讓大眾搶先試玩最新實驗性 AI 黑科技（如 Project Astra、MusicFX、 ImageFX）的實驗室大本營。\n  3. Google Antigravity：Google DeepMind 打造的新世代代理式（Agentic）AI 編程與開發平台。\n\n【🔑 正確選項秒殺題眼】\n・看到「自然語言對話生成全端網站 App（No-Code / Vibe Coding）」 ➔ 秒選 「Lovable / Base44 / Replit」\n・看到「Google 官方開發測試、實驗室與代理式開發工具」 ➔ 秒選 「Google AI Studio / Google Labs / Google Antigravity」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：皆為去背、AI 偵測、聽寫與音樂語音工具，無法生成全端網站。\n・✅ (B) 為什麼對：精準對應自然語言全端建站工具（Lovable / Base44 / Replit）與 Google 開發者工具鏈（Google AI Studio / Google Labs / Google Antigravity）。\n・❌ (C) 為什麼錯：傳統文書軟體與大數據框架並非對話式全端建站與 Google AI 實驗室工具。\n・❌ (D) 為什麼錯：生圖工具與他廠 LLM 模型不符合題幹要求。", "has_caveat": 0, "caveat_note": null}, {"id": 341, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "一位美術系學生好奇詢問：「像 Stable Diffusion 與 Midjourney 這類『擴散模型（Diffusion Model）』，到底是怎麼從無到有畫出一張精美圖片的？而且為什麼它能夠打敗早期的 GAN（生成對抗網路），成為當今 AI 畫圖的絕對霸主？」請問下列哪一個解釋最精準地回答了這兩個問題？", "option_a": "Diffusion 是把兩張現成的照片直接用剪刀剪貼拼湊起來；它打敗 GAN 是因為它不需要用到任何顯示卡算力", "option_b": "Diffusion 分為兩個過程：訓練時透過「正向過程（Forward Process）」對清晰原圖一步步加噪破壞成純雜訊，而 AI 實際作畫時則是執行「反向過程（Reverse Process）」，從一張隨機純雜訊（雪花點）出發一步步『去噪（Denoising）』還原出清晰新圖；它能打敗 GAN 的三大優勢在於「① 訓練極穩定（無模式崩潰）、② 畫質超細膩、③ 可透過文字提示詞（Prompt）精準導引創意」", "option_c": "Diffusion 作畫時是執行「正向過程」，把清晰圖片一步步加上雪花雜訊變模糊；它打敗 GAN 是因為生成的圖片邊緣最模糊", "option_d": "Diffusion 是靠遺忘門與輸出門逐字接龍；它打敗 GAN 是因為它只能生成黑白文字", "correct_option": "B", "explanation": "・📍 對應重點章節：1.7 擴散模型 (Diffusion)\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「把墨水滴進清水裡 vs 把渾水變回高清畫作」來秒懂擴散模型（Diffusion Model）：\n・正向過程（Forward Process，搞破壞學經驗）：「滴墨水加噪」！拿一張清晰的貓咪照片，一步一步撒上隨機雜訊（雪花點），直到整張圖變成什麼都看不見的電視雪花純雜訊。\n・反向過程（Reverse Process，AI 真正動筆畫畫的過程！）：「從雪花雜訊中擦掉髒污（逐步去噪 Denoising）」！當你輸入 Prompt「太空人騎馬」時，AI 先拿出一張純隨機雜訊圖，接著走反向過程，一步一步把不屬於太空人跟馬的雜訊擦掉，最後浮現出一張超高清的全新畫作！\n・為什麼 Diffusion 能把老大哥 GAN 打下王座？（三大必考優勢）：\n  1. 訓練極穩定：不像 GAN 兩個網路吵架容易「模式崩潰（Mode Collapse）」。\n  2. 畫質超細膩：不會像 VAE 一樣邊緣柔焦模糊。\n  3. Prompt 精準導引：結合 CLIP 等文字編碼器，你打什麼字它就能精準畫什麼！\n\n【🔑 正確選項秒殺題眼】\n・看到「Diffusion 擴散模型如何生成圖片」 ➔ 秒選 「反向過程（從隨機雜訊逐步去噪 Denoising 生成清晰圖片）」\n・看到「Diffusion 打敗 GAN 的三大優勢」 ➔ 秒選 「訓練穩定（不崩潰）、畫質細膩、提示詞（Prompt）精準導引」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Diffusion 是從像素/潛在空間去噪生成全新圖像，並非剪貼現成照片；且其運算量龐大（需靠 LDM 降低門檻）。\n・✅ (B) 為什麼對：完整且精準地說明「正向加噪、反向去噪作畫」的原理，以及打敗 GAN 的三大核心優勢。\n・❌ (C) 為什麼錯：把正向過程（加噪）與反向過程（去噪作畫）搞反了！AI 畫圖走的是「反向去噪」，且圖片模糊是 VAE 的缺點。\n・❌ (D) 為什麼錯：遺忘門與輸出門屬於處理時間序列的 LSTM。", "has_caveat": 0, "caveat_note": null}, {"id": 342, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在「生成式 AI 進階強化技術」的總複習課堂上，講師在白板上寫下了三個超生動的比喻，請學員配對出正確的技術縮寫：\n・比喻甲（知識型強化 — 允許帶參考書進考場翻閱）：幫 AI 外接一座隨時更新的外部知識庫，回答問題前先去檢索可靠文件再生成答案，解決模型知識過時與胡說八道（幻覺）的問題。\n・比喻乙（風格強化 — 請人類禮儀導師打分數調教）：透過人類專家對 AI 的回答品質進行排序與評分回饋，主要目的是「讓 AI 不只是學會說話，而是『說得更好』」（更符合人類語氣偏好、禮貌與安全性）。\n・比喻丙（個性強化 — 不用翻新整棟大樓，只在關鍵樓層裝活動式隔間）：一種模擬個性化的高效輕量微調法，凍結原本龐大的模型權重不動，只訓練極少量的外掛低秩矩陣參數，就能低成本快速換上專屬角色個性或畫風！\n請問比喻甲、乙、丙分別對應哪三項技術？", "option_a": "比喻甲：CNN ／ 比喻乙：RNN ／ 比喻丙：GAN", "option_b": "比喻甲：RAG（檢索增強生成） ／ 比喻乙：RLHF（人類回饋強化學習） ／ 比喻丙：LoRA（低秩適應）", "option_c": "比喻甲：LoRA ／ 比喻乙：RAG ／ 比喻丙：RLHF", "option_d": "比喻甲：PCA ／ 比喻乙：LDA ／ 比喻丙：SVM", "correct_option": "B", "explanation": "・📍 對應重點章節：2.3 生成式 AI 進階強化 RAG RLHF LoRA 與語法分析器\n\n【💡 生活化範例 ／ 具體情境秒懂】\n教材 2.3 節把這三大進階強化技術封為「補知識、修風格、換個性」三劍客，考場直接考白話比喻配對：\n・補知識選 RAG（檢索增強生成） ＝「開書考查最新資料」：專治知識過時、不懂公司內部機密規章與幻覺問題。\n・修風格選 RLHF（人類回饋強化學習） ＝「讓 AI 不只是學會說話，而是『說得更好』！」：請注意雙引號裡這句教材金句！預訓練已經讓 AI「學會說話」，而 RLHF 靠人類打分數回饋，則是為了讓它「說得更好、更得體、更合乎人類價值觀」！\n・換個性選 LoRA（低秩適應） ＝「不用翻新整棟大樓，只在關鍵樓層安裝活動式隔間！」：這句也是教材原話金句！重訓整個大模型像拆掉整棟百層大樓重建一樣貴；LoRA 只在關鍵樓層裝幾個輕便的「活動式隔間（低秩外掛參數）」，花極少算力就能讓模型秒換專屬個性或特定動漫畫風！\n\n【🔑 正確選項秒殺題眼】\n・看到「外接知識庫先檢索再生成（知識型強化）」 ➔ 秒選 「RAG」\n・看到「讓 AI 不只是學會說話，而是『說得更好』（風格強化）」 ➔ 秒選 「RLHF」\n・看到「模擬個性化、不用翻新整棟大樓，只在關鍵樓層安裝活動式隔間（個性強化）」 ➔ 秒選 「LoRA」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：CNN、RNN、GAN 為基礎神經網路架構，並非大語言模型三大進階強化技術。\n・✅ (B) 為什麼對：完美對應教材 2.3 節中 RAG（知識）、RLHF（風格：說得更好）與 LoRA（個性：活動式隔間）的經典比喻。\n・❌ (C) 為什麼錯：將三項技術的比喻順序配錯了。\n・❌ (D) 為什麼錯：PCA、LDA、SVM 為傳統機器學習降維與分類演算法。", "has_caveat": 0, "caveat_note": null}, {"id": 343, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在 2017 年發表的 Transformer 架構中，為了解決傳統 RNN 必須「一個字一個字排隊慢讀」的缺點，Transformer 改採「一次性整句平行輸入運算」。但這也帶來了一個新問題：如果把「小狗咬郵差」跟「郵差咬小狗」的所有字同時丟進模型裡平行運算，模型天生根本分不清楚誰在前面、誰在後面！\n請問：\n1. Transformer 是靠加入哪一個關鍵機制，像「幫每個字貼上位置順序號碼牌（1號、2號、3號...）」一樣，彌補平行運算沒有前後詞序感的缺陷？\n2. 另外，Transformer 在自注意力層中，為了「同時兼顧文法結構、代名詞指代與語氣情緒等多種不同角度的關聯」，一次派出好幾組注意力探照燈分頭觀察再匯總，這項設計又稱為什麼？", "option_a": "1. 最大池化（Max Pooling） ／ 2. 單層感知器（Perceptron）", "option_b": "1. 位置編碼（Positional Encoding） ／ 2. 多頭注意力機制（Multi-Head Attention）", "option_c": "1. 遺忘門（Forget Gate） ／ 2. 詞幹提取（Stemming）", "option_d": "1. 批次正規化（Batch Normalization） ／ 2. 隨機丟棄（Dropout）", "correct_option": "B", "explanation": "・📍 對應重點章節：1.5 Transformer 自注意力與解碼參數\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這兩個設計是讓 Transformer 既能「一眼看完萬言書」、又能「把字裡行間的細節讀透」的左右護法：\n・1. 位置編碼（Positional Encoding） ＝「給每個字發一張座位號碼牌！」：\n  ・因為 Transformer 不像 RNN 會排隊進場，所有字是「一窩蜂同時衝進教室（平行運算）」的！\n  ・如果不發號碼牌，「我愛你」跟「你愛我」在模型眼裡原料一模一樣。加上「位置編碼（Positional Encoding）」後，第 1 個字貼上 1 號座標、第 2 個字貼上 2 號座標，模型就能在平行高速運算的同時，清楚知道誰先誰後！\n・2. 多頭注意力（Multi-Head Attention） ＝「同時派出『文法組、語意組、語氣組』多位評審一起看！」：\n  ・只用一顆頭（單一注意力）看句子，可能只注意到主詞跟動詞，卻漏掉了反諷語氣。\n  ・「多頭注意力」就像一個長了 8 顆頭的偵探，第 1 顆頭專抓文法結構、第 2 顆頭專找「他」是指誰、第 3 顆頭專聽情緒語氣，最後把所有頭的觀察合起來，理解力瞬間翻倍！\n\n【🔑 正確選項秒殺題眼】\n・看到「貼上位置順序號碼牌、讓平行運算的模型知道字詞前後順序」 ➔ 秒選 「位置編碼（Positional Encoding）」\n・看到「派出多組注意力同時兼顧文法、語氣與語意等不同維度關聯」 ➔ 秒選 「多頭注意力（Multi-Head Attention）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：最大池化是 CNN 降維技術，單層感知器是最早期的線性分類器。\n・✅ (B) 為什麼對：精準對應 Transformer 負責保留字詞順序的 位置編碼 與多角度捕捉關聯的 多頭注意力機制。\n・❌ (C) 為什麼錯：遺忘門屬於 LSTM，詞幹提取屬於 NLP 前處理。\n・❌ (D) 為什麼錯：批次正規化與 Dropout 屬於神經網路防止梯度消失與過擬合的優化技巧。", "has_caveat": 0, "caveat_note": null}, {"id": 344, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國科技公司的法務長在進行歐盟《人工智慧法案（EU AI Act）》合規審查時，發現業務部門常常搞混以下四種系統的風險等級：\n1. 電玩遊戲裡的「NPC 角色自動對話回應系統」與電子郵件的「垃圾信過濾器」。\n2. 電商網站上的「AI 線上客服聊天機器人（Chatbot）」。\n3. 醫院的「AI 癌症影像輔助診斷系統」與企業人資的「AI 自動求職履歷篩選系統」。\n4. 政府對全體國民進行監控打分數、限制買車票的「社會信用評分系統（Social Scoring）」。\n請問若按照風險「由低到高（第 4 級最低風險 ➔ 第 3 級有限風險 ➔ 第 2 級高風險 ➔ 第 1 級不可接受風險）」依序排列，正確的順序為何？且為什麼「AI 履歷篩選系統」會被歐盟列為高風險？", "option_a": "由低到高為 4 ➔ 3 ➔ 2 ➔ 1；因為履歷篩選系統耗電量最大", "option_b": "由低到高為 1（最低風險：免受規範） ➔ 2（有限風險：需履行透明揭露義務告知是 AI） ➔ 3（高風險：強制嚴格審查規範） ➔ 4（不可接受風險：完全禁止）；而履歷篩選與醫療診斷之所以被列為「高風險」，是因為它們直接攸關人類的「性命健康、升學與就業生存等重大基本權益」", "option_c": "由低到高為 2 ➔ 1 ➔ 4 ➔ 3；因為電玩 NPC 屬於完全禁止的不可接受風險", "option_d": "四種系統全部都屬於「高風險」，一律禁止在歐盟境內使用", "correct_option": "B", "explanation": "・📍 對應重點章節：4.1 AI 治理核心原則 歐盟 AI 法案與治理制度\n\n【💡 生活化範例 ／ 具體情境秒懂】\n歐盟《AI 法案》的四級風險金字塔，判斷標準只有一個：「這個 AI 如果出包，會不會害人丟掉性命、工作或基本尊嚴？」：\n・第 4 級 最低風險（免受規範） ＝ 1. 電玩 NPC、影片推薦、垃圾信過濾：遊戲裡的村民 NPC 講錯一句話，玩家頂多笑一笑，完全不會侵害人權，所以免受嚴格規範！\n・第 3 級 有限風險（基本資訊揭露） ＝ 2. 聊天機器人（Chatbot）、Deepfake：只要在視窗上誠實貼一張紙條告訴用戶：「你好， n\n【🔑 正確選項秒殺題眼】\n・看到「True / False 是與否」 ➔ 秒選 「布林值（Boolean）」\n・看到「血型/職業 vs 隨時間變化的股價/氣溫」 ➔ 秒選 「類別資料 vs 時間序列資料」\n・看到「程式資料結構容器」 ➔ 秒選 「list、vector、矩陣（matrix）、資料表（DataFrame）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：True/False 不是圖像；血型不能加減乘除，不是連續數值；JPEG/MP3 是多媒體檔案副檔名。\n・✅ (B) 為什麼對：完全符合教材 1.12 節針對內容形式、統計型態與程式結構的分類定義。\n・❌ (C) 為什麼錯：將資料型態與神經網路層結構混為一談。\n・❌ (D) 為什麼錯：把血型（類別）與股價走勢（時間序列）完全顛倒，且後段為影片生成工具。", "has_caveat": 0, "caveat_note": null}, {"id": 346, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在 2025～2026 全球對話式 AI 與大語言模型百強榜單中，除了全能型的 ChatGPT 與 Gemini 外，還有三類極具特色的垂直領域平台：\n・類別甲（無痕隱私匿名聊天）：專為極度重視個人隱私、不想被記錄 IP 與對話歷史的使用者打造，提供匿名無痕呼叫多種開源與主流 LLM 的對話服務。\n・類別乙（虛擬角色扮演與情感陪伴）：讓使用者可以自創或與數百萬個「動漫人物、遊戲角色、歷史名人虛擬分身」進行沉浸式角色扮演（Roleplay）與情感陪伴聊天。\n・類別丙（亞洲長文本與高普及率雙雄）：其一是由「月之暗面（Moonshot AI）」推出、以支援超長無損上下文閱讀著稱的 AI 助手；其二是由「字節跳動（ByteDance）」推出、在行動端與語音互動普及率極高的全方位 AI 助手。\n請問類別甲、乙、丙的代表工具組合分別為何？", "option_a": "類別甲：remove.bg & Photoroom ／ 類別乙：Kaggle & Hugging Face ／ 類別丙：Suno & AIVA", "option_b": "類別甲：Duck.ai（DuckDuckGo 旗下） 與 Venice.ai ／ 類別乙：Character.ai 與 Emochi ／ 類別丙：Kimi（月之暗面） 與 豆包 Doubao（字節跳動）", "option_c": "類別甲：GitHub Copilot & Cursor ／ 類別乙：Amazon Bedrock & NIMs ／ 類別丙：ZeroGPT & TurboScribe", "option_d": "類別甲：Canva & Gamma ／ 類別乙：Grammarly & QuillBot ／ 類別丙：Lumen5 & Synthesia", "correct_option": "B", "explanation": "・📍 對應重點章節：5.1 核心大語言模型 (LLM) 與對話平台\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這題幫你把第五部分 5.1 核心 LLM 與對話平台 中，三個特殊賽道的明星工具一次記熟：\n・類別甲（怕被追蹤？找隱私無痕雙雄）＝ Duck.ai ＋ Venice.ai：\n  ・Duck.ai：全球最知名的「不追蹤用戶隱私搜尋引擎 DuckDuckGo」推出的免費匿名 AI 聊天室。\n  ・Venice.ai：主打無審查、資料只存在你自己的瀏覽器本地端、不留伺服器紀錄的私密 AI 平台。\n・類別乙（想跟動漫老公老婆聊天？找角色扮演雙雄）＝ Character.ai ＋ Emochi：\n  ・看名字就秒懂！Character（角色）與 Emochi（動漫情感角色），專門做虛擬人物 Roleplay 陪伴聊天。\n・類別丙（亞洲人氣模型）＝ 月之暗面 Kimi ＋ 字節跳動 豆包（Doubao）：\n  ・Kimi：由「月之暗面（Moonshot AI）」開發，招牌強項是「一次讀完幾十萬字超長財報與論文（長文本處理）」。\n  ・豆包（Doubao）：抖音母公司「字節跳動」推出的超人氣全能日常與語音 AI 助手。\n\n【🔑 正確選項秒殺題眼】\n・看到「隱私保護、匿名無痕 AI 對話」 ➔ 秒選 「Duck.ai / Venice」\n・看到「虛擬角色扮演（Roleplay）、動漫人物情感陪伴聊天」 ➔ 秒選 「Character.ai / Emochi」\n・看到「月之暗面（長文本）與字節跳動 AI 助手」 ➔ 秒選 「Kimi 與 豆包（Doubao）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：分別為電商去背、開源數據平台與 AI 音樂工具。\n・✅ (B) 為什麼對：三組工具完全符合教材 5.1 節針對隱私聊天、角色扮演與亞洲主力 LLM 的分類。\n・❌ (C) 為什麼錯：分別為程式 IDE、企業雲端/推論平臺與音訊/偵測工具。\n・❌ (D) 為什麼錯：分別為簡報排版、英文改寫與教學影片生成工具。", "has_caveat": 0, "caveat_note": null}, {"id": 347, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨模態 AI 研發團隊正在訓練一個能同時處理「文字、圖片與影片」的統一 Transformer 模型。首席科學家在內部技術講座中提問：\n1. 「文字、圖像、影片」這三種不同模態的資料，在數學結構本質上有什麼差異？\n2. 原本只會讀「一維文字序列」的 Transformer，到底是如何透過「3 個關鍵步驟」來讀懂一張「二維平面圖片」的？（這也是 Vision Transformer, ViT 的核心原理）\n請問下列哪一個選項的回答完全正確？", "option_a": "1. 三種資料全部都是一維線性序列 ／ 2. 讀圖三步驟為 先轉成 MP3 聲音 ➔ 再用語音辨識轉成文字 ➔ 最後刪除停用詞", "option_b": "1. 資料結構差異為：文字是一維線性序列、圖像是二維空間網格（像素矩陣）、影片則是時間＋空間的多維結構 ／ 2. Transformer 讀懂圖片的 3 步驟為：① 將圖片切成固定大小的方塊（Patches，如 16×16 拼圖塊） ➔ ② 將每個小方塊攤平轉為數值向量（視覺 Token） ➔ ③ 加上位置編碼（Positional Encoding）保留空間位置關係後送入自注意力層", "option_c": "1. 文字是三維結構、影片是一維結構 ／ 2. 讀圖三步驟為 直接取平均值 ➔ 乘上 0 ➔ 輸出空白畫面", "option_d": "1. 三種資料全部都是布林值 ／ 2. 讀圖只靠單層感知器畫一條直線", "correct_option": "B", "explanation": "・📍 對應重點章節：1.8 多模態 AI 與影片生成技術\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這題幫你把教材 1.8 節「多模態資料結構」與「Transformer 怎麼看懂圖片（切拼圖三部曲）」一次打通：\n・1. 三種模態的維度長相（一維線 ➔ 二維面 ➔ 多維時空）：\n  ・文字 ＝ 一維線性序列：像排隊買票一樣，一個字接一個字排成一條線。\n  ・圖像 ＝ 二維空間網格：有「長 × 寬（X 軸 × Y 軸）」的平面像素棋盤格。\n  ・影片 ＝ 時間 ＋ 空間多維結構：每秒鐘播放 24 張二維圖片，除了平面的長與寬（空間），還多了一條往前流動的「時間軸（Time）」！\n・2. 只會讀「一排單字」的 Transformer，怎麼讀懂一張「平面照片」？（切拼圖三部曲！）：\n  ・Step ① 圖片切塊（Patches，如 16×16）：拿把美工刀，把一張大照片切成一塊一塊 16×16 像素的正方形小拼圖塊（就像把句子切成一個個單字 Token 一樣！）。\n  ・Step ② 攤平為數值向量：把每一塊小拼圖裡的顏色數字拉直攤平成一串向量。\n  ・Step ③ 加上位置編碼（Positional Encoding）：在每塊拼圖背面蓋上「我是左上角第 1 塊、我是中間第 5 塊」的號碼章，這樣整排丟進 Transformer 時，才不會拼出一張五官亂飛的畢卡索怪圖！\n\n【🔑 正確選項秒殺題眼】\n・看到「文字 vs 圖像 vs 影片的資料結構差異」 ➔ 秒選 「文字＝一維線性序列、圖像＝二維空間網格、影片＝時間＋空間多維結構」\n・看到「Transformer 讀懂圖像的 3 步驟」 ➔ 秒選 「① 切塊（16×16 Patches） ➔ ② 攤平為數值向量 ➔ ③ 加上位置編碼」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：圖片與影片具有空間與時間維度，並非一維線性序列；且讀圖不會先轉成 MP3 聲音。\n・✅ (B) 為什麼對：精準闡述三種模態的維度差異，並完整列出 Transformer 讀圖的「切塊 ➔ 攤平向量 ➔ 加位置編碼」三步曲。\n・❌ (C) 為什麼錯：文字與影片的維度描述完全顛倒。\n・❌ (D) 為什麼錯：多模態資料並非單純的 True/False 布林值，單層感知器也無法處理複雜視覺。", "has_caveat": 0, "caveat_note": null}, {"id": 348, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國電商集團的文字內容團隊裡有三位不同職責的專員，他們各自需要挑選最對味的 AI 文字工具：\n1. 數位廣告與電商文案專員：每天要針對上百件新款服飾，快速生成符合品牌口吻的「Facebook 轉換率廣告文案、IG 吸睛貼文與電商商品促銷信（撰寫引人注目的產品特點）」，需要專為「商業行銷文案生成」量身打造的專用平台。\n2. 專案管理與會議紀錄專員：需要在團隊共用的雲端工作區中，直接對會議筆記進行「一鍵重點摘要、待辦事項提取與企業內部知識庫問答協作」。\n3. 跨部門全能企劃專員：需要一個具備極強自然語言對話、長文擴寫、跨語翻譯與多模態問答的全能型對話助手。\n請問這三位專員最推薦分別選用哪一組工具？", "option_a": "廣告行銷文案：ZeroGPT ／ 團隊筆記知識庫：remove.bg ／ 全能對話：AIVA", "option_b": "廣告行銷文案：Copy.ai / Jasper AI ／ 團隊筆記知識庫：Notion AI ／ 全能對話：ChatGPT-4o", "option_c": "廣告行銷文案：GitHub Copilot ／ 團隊筆記知識庫：Midjourney ／ 全能對話：Stable Diffusion", "option_d": "廣告行銷文案：TurboScribe ／ 團隊筆記知識庫：ElevenLabs ／ 全能對話：Runway", "correct_option": "B", "explanation": "・📍 對應重點章節：3.1 文字與商業文案生成應用\n\n【💡 生活化範例 ／ 具體情境秒懂】\n在教材 3.1 節「文字與商業文案生成應用」中，這三組工具是辦公室文字工作者的黃金陣容：\n・專寫「商業行銷與電商廣告文案」的雙雄 ＝ Copy.ai ＋ Jasper AI：\n  ・注意英文單字 Copy 在廣告界就是「廣告文案（Copywriting）」的意思！Copy.ai 跟 Jasper AI 內建了上百種高轉換率的行銷漏斗模板（如 AIDA 公式、痛點行銷、電商產品描述），是行銷人寫廣告詞的專屬神器！\n・專管「筆記整理、會議摘要與團隊知識庫」的管家 ＝ Notion AI：直接內建在 Notion 筆記頁面裡，按一下空白鍵就能幫會議紀錄抓重點、列待辦清單。\n・什麼都能聊、能翻譯能擴寫的全能王 ＝ ChatGPT-4o：OpenAI 的全能旗艦對話模型。\n\n【🔑 正確選項秒殺題眼】\n・看到「商業行銷文案、電商廣告貼文專用生成工具」 ➔ 秒選 「Copy.ai / Jasper AI」\n・看到「筆記整理、會議紀錄摘要、團隊知識庫協作」 ➔ 秒選 「Notion AI」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：ZeroGPT 是抓 AI 文章、remove.bg 是圖片去背、AIVA 是古典作曲。\n・✅ (B) 為什麼對：精準對應商業行銷文案雙雄（Copy.ai / Jasper AI）、筆記知識庫（Notion AI）與全能對話（ChatGPT-4o）。\n・❌ (C) 為什麼錯：GitHub Copilot 是寫程式工具，Midjourney 與 Stable Diffusion 是畫圖工具。\n・❌ (D) 為什麼錯：分別為語音轉逐字稿、語音合成與影片生成工具。", "has_caveat": 0, "caveat_note": null}, {"id": 349, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在複習「1.9 模型預訓練（6 大步驟）」與「1.11 模型的運作／推理（5 大步驟）」時，一位細心的考生發現：\n「奇怪！這兩個章節明明都是建立在完全相同的『5 大內部結構單元（① 接收輸入 ➔ ② 編碼器 ➔ ③ 潛在空間表示 ➔ ④ 解碼器 ➔ ⑤ 輸出）』舞台上，為什麼『預訓練』有 6 個步驟，而正式上線後的『推理運作（Inference）』卻剛好變成 5 個步驟？」\n請問下列哪一個解釋最精準地回答了這個核心結構差異？", "option_a": "因為模型上線推理時把「① 接收輸入」單元拆掉了，不需要再接收使用者的提問", "option_b": "因為在『預訓練（在學校讀書）』時，模型必須在「③ 潛在空間表示」單元裡同時執行『Step 3 決定損失函數 ＋ Step 4 參數最佳化』這兩件算誤差改權重的事（所以 5 個單元對應 6 個步驟）；但當模型畢業正式上線『推理運作（出社會工作）』時，模型權重已經固定、不需要再算損失函數與修改參數了，因此在「③ 潛在空間表示」單元裡只需要專心做『Step 3 語意理解』這 1 件事，讓 5 個結構單元剛好 1 對 1 完美對齊 5 個推理步驟！", "option_c": "因為模型上線推理時把「④ 解碼器」與「⑤ 輸出」全部刪除了，永遠不會給使用者任何回答", "option_d": "因為預訓練使用的是 CNN，而推理時會自動變成單層感知器", "correct_option": "B", "explanation": "・📍 對應重點章節：1.9 模型預訓練 從無到有的知識建立、1.11 模型的運作 (推理) AI 怎麼看懂輸入與生出結果\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這題是打通第一部分「1.9 預訓練」與「1.11 推理運作」任督二脈的終極神題！只要看懂「③ 潛在空間表示（Latent Space）」這個房間裡發生的事，兩張大表瞬間融會貫通：\n・舞台永遠是那 5 個房間（5 大內部結構單元）：① 接收輸入 ➔ ② 編碼器 ➔ ③ 潛在空間表示 ➔ ④ 解碼器 ➔ ⑤ 輸出。\n・在學校受訓時（1.9 預訓練 ＝ 6 個步驟）：\n  ・為什麼多出 1 步？因為在 「③ 潛在空間表示」 這個房間裡，學徒要同時做兩件事：Step 3 決定損失函數（算自己錯多少） ＋ Step 4 參數最佳化（動手改腦袋權重）！所以 5 個房間擠了 6 個步驟。\n・畢業上線工作時（1.11 推理運作 ＝ 5 個步驟）：\n  ・客人問「明天的天氣？」，AI 已經畢業不用再考試扣分改腦袋（不用算損失函數、也不用改參數了！）。\n  ・所以在 「③ 潛在空間表示」 房間裡，它只專心做 Step 3 語意理解（搞懂客人在問明天天氣） 這 1 件事！因此 5 個房間剛好 1 對 1 對齊 5 個步驟：Step 1 接收輸入 ➔ Step 2 資料編碼 ➔ Step 3 語意理解 ➔ Step 4 生成解碼 ➔ Step 5 輸出回應！\n\n【🔑 正確選項秒殺題眼】\n・看到「預訓練 6 步 vs 推理運作 5 步在『③ 潛在空間表示』的差異」 ➔ 秒選 「預訓練需做『決定損失函數＋參數最佳化』2 步；推理時免算損失與改參數，只做『語意理解』1 步」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：推理的第一步正是「Step 1 接收輸入（把『明天的天氣？』切成 Token）」，絕不可能拆掉。\n・✅ (B) 為什麼對：一針見血點出「③ 潛在空間表示」在預訓練（Step 3 損失函數＋Step 4 參數最佳化）與推理（Step 3 語意理解）的核心差異。\n・❌ (C) 為什麼錯：若刪除解碼器與輸出，模型將無法生成回答並呈現給使用者。\n・❌ (D) 為什麼錯：預訓練與推理使用的是同一個訓練好的神經網路模型，不會在推理時退化成單層感知器。", "has_caveat": 0, "caveat_note": null}, {"id": 350, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "近年來網路上頻繁出現不肖份子利用 AI 的「深度偽造（Deepfake）」技術，將名人的臉孔與聲音完美換到詐騙影片上。請問：\n1. 傳統與經典的「深度偽造（Deepfake）換臉與逼真偽造技術」，主要是建立在 2014 年誕生的哪一種生成式 AI 模型技術之上？\n2. 根據教材第 4.3 節，Deepfake 技術的濫用主要會引發哪「三大社會與資安風險」？", "option_a": "基於 單層感知器（Perceptron）；三大風險為 耗電量增加、硬碟空間不足、螢幕亮度過高", "option_b": "主要基於 GAN（生成對抗網路，由生成器與判別器相互對抗生出以假亂真的影像與聲音） 技術；引發的三大風險為 ① 身分盜用與金融詐騙（如假冒名人或親友視訊詐騙）、② 製造假影片與散播假新聞（破壞社會信任）、③ 操弄政治輿論與破壞選舉公平", "option_c": "基於 K-Means 分群演算法；三大風險為 梯度消失、過擬合、欠擬合", "option_d": "基於 盒鬚圖與 Z-score；三大風險為 詞幹提取失敗、停用詞過多、正規化失準", "correct_option": "B", "explanation": "・📍 對應重點章節：4.3 智慧財產權 深度偽造與 AI 系統四大風險\n\n【💡 生活化範例 ／ 具體情境秒懂】\n「Deepfake（深度偽造）」這個詞是由 Deep Learning（深度學習）＋ Fake（偽造） 組合而成，考場最愛考它的「底層技術老爸」跟「三大危害」：\n・Deepfake 的底層技術老爸 ＝ GAN（生成對抗網路）：為什麼 Deepfake 換臉可以換得連眨眼、皺眉都看不出破綻？因為它背後就是靠 GAN 裡的「假鈔集團（生成器）」不斷畫出假臉，再給「警察（判別器）」拿放大鏡挑破綻，兩個網路對抗幾百萬次後，就練出了以假亂真的換臉神技！\n・Deepfake 引發的三大社會風險（從個人 ➔ 社會 ➔ 國家選舉）：\n  1. 害個人破財受害（身分盜用與詐騙）：假冒公司老闆開視訊會議騙財務匯款、假冒名医賣假藥、或合成不雅片勒索。\n  2. 害社會真假難辨（造假影片與假新聞）：偽造災難或企業醜聞影片，製造社會恐慌與信任崩潰。\n  3. 害國家民主動搖（操弄政治與破壞選舉公平）：在投票前夕放出偽造的候選人失言或犯罪影片，企圖影響大選結果！\n\n【🔑 正確選項秒殺題眼】\n・看到「深度偽造（Deepfake）主要基於哪項生成式技術」 ➔ 秒選 「GAN（生成對抗網路）」\n・看到「Deepfake 引發的三大風險」 ➔ 秒選 「身分盜用詐騙、造假影片與假新聞、操弄政治與破壞選舉公平」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：單層感知器只能做簡單線性分類，無法合成逼真人臉影片。\n・✅ (B) 為什麼對：精準指出 Deepfake 基於 GAN 技術，並完整列出其對個人詐騙、社會假新聞與政治選舉的三大風險。\n・❌ (C) 為什麼錯：K-Means 是分群演算法；梯度消失與過擬合是模型訓練的數學問題，而非社會倫理風險。\n・❌ (D) 為什麼錯：盒鬚圖與 NLP 前處理皆與 Deepfake 偽造影音無關。", "has_caveat": 1, "caveat_note": "最早期的 Deepfake 換臉程式主要採用自動編碼器（Autoencoder）架構，GAN 常用於提升逼真度；「Deepfake 基於 GAN」為認證考試的標準答案。"}, {"id": 351, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在訓練深度神經網路時，為了讓參數順著梯度下坡更快、更穩地找到損失函數的最低谷，工程師需要挑選合適的「最佳化器（Optimizer）」。教材第 1.10 節列出了五大經典最佳化器：SGD、Momentum、AdaGrad、RMSprop、Adam。\n請問：\n1. 在這五大最佳化器中，透過引入物理學上的「動量／慣性（累積過去的下坡速度方向）」，幫助模型衝過平坦區或跳出局部小坑洞、減少左右震盪的是哪一個？\n2. 結合了「動量（Momentum）」與「自適應學習率（RMSprop）」兩者優點，既能維持慣性方向、又能為每個參數自動調整專屬步伐大小，成為當今深度學習與 LLM 訓練最常用、最推薦的「萬用預設最佳化器」又是哪一個？", "option_a": "1. LDA ／ 2. PCA", "option_b": "1. Momentum（動量法） ／ 2. Adam（Adaptive Moment Estimation）", "option_c": "1. ReLU ／ 2. Sigmoid", "option_d": "1. Dropout ／ 2. Batch Normalization", "correct_option": "B", "explanation": "・📍 對應重點章節：1.10 模型最佳化 訓練技巧與過擬合\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「推鐵球下山谷找最低點」來秒懂這五大最佳化器領航員的演進：\n・SGD（隨機梯度下降） ＝「喝醉酒的登山客」：每次只看少數幾步路就走，走得歪七扭八、容易在山溝裡左右來回震盪。\n・Momentum（動量法） ＝「有沉重慣性的滾動大鐵球！」：加上物理學的「動量（慣性）」！順著同一個下坡方向會越滾越快，就算遇到一個小土坑也能靠慣性直接衝過去，不再左右亂晃。\n・AdaGrad 與 RMSprop ＝「會看路況自動換步幅的聰明鞋子」：常走陡坡的參數步伐自動縮小（防跌倒），少走平路的參數步伐自動邁大。\n・Adam ＝「Momentum（慣性鐵球）＋ RMSprop（聰明鞋子）的終極合體王！」：既有慣性衝刺力，又能自動調節每個參數的步伐大小，又快又穩，是現代訓練深度神經網路與 LLM 的頭號萬用預設值！\n\n【🔑 正確選項秒殺題眼】\n・看到「引入慣性累積過去梯度方向、減少震盪衝出局部小坑」 ➔ 秒選 「Momentum（動量法）」\n・看到「結合 Momentum 與 RMSprop 優點、當今最常用的萬用最佳化器」 ➔ 秒選 「Adam」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：LDA 與 PCA 是降維演算法，絕對不是最佳化器（考場最常拿 LDA 當假選項）。\n・✅ (B) 為什麼對：精準對應引入慣性的 Momentum 與結合兩大優勢的萬用霸主 Adam。\n・❌ (C) 為什麼錯：ReLU 與 Sigmoid 是神經元的「啟動函數（Activation Function）」，不是最佳化器。\n・❌ (D) 為什麼錯：Dropout 與 Batch Normalization 是穩定訓練與防過擬合的結構技巧，並非更新權重的最佳化器。", "has_caveat": 0, "caveat_note": null}, {"id": 352, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某管理顧問在撰寫商業提案與查核報告時，經常在 Prompt 結尾加上教材 2.2 節推薦的「7 大常見實用特殊咒語（Directive Prompts）」來精準控制 AI 的回答方式。請問針對以下三個工作場景，顧問分別使用了哪一句特殊咒語？\n・場景甲（避免外行客戶看不懂）：顧問要請 AI 撰寫一份給傳統產業老董看的區塊鏈導入簡介，為了怕整篇都是艱澀的密碼學專有名詞，顧問在結尾加上了一句咒語。\n・場景乙（防止 AI 產生幻覺亂編數據）：顧問請 AI 查詢 2025 年全球電動車市佔率數據，為了確保數據真實可靠且有憑有據，顧問要求 AI「請確認事實再回答」並加上了另一句索取佐證的咒語。\n・場景丙（提案前的紅隊挑錯演練）：顧問已經寫好了一份新產品上市企劃書，他想請 AI 故意站在「挑剔的競爭對手或嚴苛投資人」立場，用力找出這份企劃書的盲點與漏洞。\n請問場景甲、乙、丙分別對應哪三句實用特殊咒語？", "option_a": "場景甲：請盡量拉長字數 ／ 場景乙：請把溫度調到 1.0 ／ 場景丙：請直接複製我的原文", "option_b": "場景甲：「請避免使用太多術語」 ／ 場景乙：「請提供引用來源」（搭配請確認事實再回答） ／ 場景丙：「請扮演唱反調的角色（並從不同角度分析）」", "option_c": "場景甲：請全部用文言文回答 ／ 場景乙：請隨機捏造三個網址 ／ 場景丙：請無條件稱讚我的企劃書", "option_d": "場景甲：請刪除所有標點符號 ／ 場景乙：請使用詞幹提取 ／ 場景丙：請執行反向傳播", "correct_option": "B", "explanation": "・📍 對應重點章節：2.2 提示工程 原則 咒語 框架提示與三大思維推理\n\n【💡 生活化範例 ／ 具體情境秒懂】\n教材 2.2 節整理的「7 大實用特殊咒語（Directive Prompts）」，每一句都是職場上立刻能用的提問神技：\n1. 算數學／解邏輯題：「請一步一步推理」（觸發思維鏈 CoT）。\n2. 嫌回答太簡略：「請解釋詳細一點」。\n3. 怕外行人看不懂行話（場景甲）：「請避免使用太多術語」（讓 AI 用白話文解釋）。\n4. 怕 AI 幻覺胡扯（場景乙）：「請確認事實再回答」 ＋ 「請提供引用來源」（逼 AI 查證並附上出處）。\n5. 怕思考太單一／想抓企劃漏洞（場景丙）：「請從不同角度分析」 ＋ 「請扮演唱反調的角色（Devil's Advocate）」（讓 AI 幫你挑毛病、做壓力測試！）。\n\n【🔑 正確選項秒殺題眼】\n・看到「讓外行人看懂、白話解釋」 ➔ 秒選 「請避免使用太多術語」\n・看到「防幻覺、要求佐證出處」 ➔ 秒選 「請確認事實再回答 ／ 請提供引用來源」\n・看到「找出企劃盲點漏洞、壓力測試」 ➔ 秒選 「請扮演唱反調的角色 ／ 請從不同角度分析」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：拉長字數違反簡潔原則，調高溫度到 1.0 反而會讓 AI 更容易胡亂編造數據！\n・✅ (B) 為什麼對：完美對應教材 2.2 節列舉的實用特殊咒語與職場應用情境。\n・❌ (C) 為什麼錯：捏造網址是嚴重的幻覺行為，無條件稱讚則無法抓出企劃書盲點。\n・❌ (D) 為什麼錯：詞幹提取與反向傳播為底層演算法術語，並非自然語言提示咒語。", "has_caveat": 0, "caveat_note": null}, {"id": 353, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某社群自媒體創作者想要建立一套高效率的「手機與雲端影音圖文工作流」，正在比較第五部分工具總覽中的幾款熱門工具：\n1. 剪輯與文字成片雙雄：其一是字節跳動旗下、在全球短影音創作者中市佔率最高，具備強大 AI 自動上字幕、智能摳圖與特效模板的剪輯神器；其二是主打免安裝軟體、打開瀏覽器就能直接用豐富商業模板與 AI 文字轉影片的「線上雲端輕量影片剪輯平台」。\n2. 圖像創意與社群行動端動效三傑：包含全球知名的行動端全方位 AI 修圖拼圖社群 App（Picsart）、主打海量 LoRA 模型與二次元插畫生成的免費社群生圖平台（SeaArt 海藝 AI），以及專攻「行動端自拍轉高動態人物舞蹈與運鏡短片」的熱門新星（Higgsfield）。\n請問第 1 點提到的「短影音剪輯霸主」與「線上雲端輕量影片生成剪輯平台」分別是哪兩個工具？", "option_a": "DALL·E 與 Perplexity", "option_b": "CapCut（剪映） 與 FlexClip", "option_c": "ZeroGPT 與 TurboScribe", "option_d": "Hadoop 與 Spark", "correct_option": "B", "explanation": "・📍 對應重點章節：3.4 影片生成流程與應用場景、5.4 影片生成 剪輯與音訊語音工具\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這題幫你鎖定短影音時代最常出現在考題選項裡的兩個「剪片與成片」代表工具：\n・CapCut（剪映海外版） ＝「TikTok / Reels 短影音創作者人手一套的剪輯霸主」：由字節跳動推出，內建超強的 AI 一鍵識別語音上字幕、AI 數位人播報、智能去背與爆款特效模板，做社群短影音廣告必選！\n・FlexClip ＝「免裝軟體的雲端網頁版傻瓜剪片王」：看到名字裡的 Clip（影片片段） 就知道它是做影片的！主打在瀏覽器上直接用 AI 腳本生影片、套用商業片頭模板與雲端剪輯（常在「何者不是影片生成工具？」的考題裡當正確的影片工具選項，用來凸顯 DALL·E 不是影片工具！）。\n\n【🔑 正確選項秒殺題眼】\n・看到「短影音特效剪輯、自動上字幕代表工具」 ➔ 秒選 「CapCut（剪映）」\n・看到「線上雲端輕量 AI 影片生成與模板剪輯平台」 ➔ 秒選 「FlexClip」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：DALL·E 是靜態生圖工具，Perplexity 是 AI 搜尋引擎，兩者皆非影片剪輯生成工具。\n・✅ (B) 為什麼對：精準對應短影音剪輯王牌 CapCut 與雲端 AI 影片剪輯生成平台 FlexClip。\n・❌ (C) 為什麼錯：ZeroGPT 是 AI 文章偵測器，TurboScribe 是語音轉文字逐字稿工具。\n・❌ (D) 為什麼錯：Hadoop 與 Spark 是大數據分散式處理框架。", "has_caveat": 0, "caveat_note": null}, {"id": 354, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "為了向初學者解釋 AI 是如何透過「向量空間（Vector Space）」來判斷兩樣東西像不像，教材第 1.4 節舉了一個經典的「2D 向量空間動物座標圖」例子：\n假設我們用兩個特徵維度——橫軸 X 代表「體型大小」、縱軸 Y 代表「耳朵大小」，把每隻動物轉換成平面上的一個向量座標點 (x, y)。現在圖上有三個點：「波斯貓」、「暹羅貓」與「大型貴賓狗」。\n請問在這個 2D 向量空間中，這三個點的「幾何距離遠近」會呈現什麼規律？而這個「向量空間距離」的概念，為什麼能成為連接「影像分類」與「自然語言翻譯（如 Seq2Seq）」的共同數學橋樑？", "option_a": "波斯貓與大型貴賓狗的距離最近，波斯貓與暹羅貓的距離最遠；因為向量空間裡同類會互相排斥", "option_b": "特徵相似的「波斯貓」與「暹羅貓」在向量空間中的座標距離會非常接近（聚在同一區），而體型與耳朵特徵差異較大的「大型貴賓狗」距離牠們則會比較遠；無論是圖片還是各國文字，只要透過編碼器映射進高維向量空間，「意思或特徵越相近的東西（如英文的 Hello 與中文的 你好），在向量空間裡的距離就越靠近」，因此能用同一套數學距離法則處理影像與語言！", "option_c": "三隻動物的座標點會完全重疊在 (0,0) 原點；因為向量空間無法區分任何特徵", "option_d": "向量空間只能用來畫 2D 卡通貓狗，絕對不能超過 2 個維度，也不能用來表示英文單字", "correct_option": "B", "explanation": "・📍 對應重點章節：1.4 VAE GAN 與 Seq2Seq\n\n【💡 生活化範例 ／ 具體情境秒懂】\n電腦不認識什麼叫「貓」、什麼叫「狗」，也不懂什麼叫「愛情」，電腦只認識「數字座標（向量 Vector）」！\n・為什麼波斯貓跟暹羅貓在圖上會當鄰居？（物以類聚，越像離越近！）：\n  ・波斯貓跟暹羅貓的「體型大小（X）」差不多、「耳朵大小（Y）」也差不多，所以把牠們畫在 (x, y) 座標紙上時，兩個點幾乎貼在一起（向量距離極近）！\n  ・反觀大型貴賓狗體型大、垂耳長，座標點自然就落在老遠的另一頭。\n・從「看貓狗」跨界到「翻英文」的魔法橋樑：\n  ・當我們把幾百種特徵（高維度向量空間）套用到語言上時，「國王」跟「女王」的詞向量距離很近，甚至英文 \"How are you?\" 轉成的語意向量 V₁，跟中文 \"你好嗎\" 在潛在向量空間裡也是住在同一個社區的好鄰居！這就是為什麼 AI 能靠「向量空間」打通視覺與語言！\n\n【🔑 正確選項秒殺題眼】\n・看到「向量空間（Vector Space）中波斯貓、暹羅貓與貴賓狗的關係」 ➔ 秒選 「特徵或語意越相似者（波斯貓與暹羅貓），在向量空間中的距離越相近；不同類者距離越遠」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：向量空間遵循「特徵越相似、距離越近」的原則，同屬貓科的波斯貓與暹羅貓距離最近，絕不會互相排斥。\n・✅ (B) 為什麼對：精準詮釋教材 1.4 節 2D 向量空間距離概念，以及其如何作為影像特徵與自然語言序列翻譯的共同基石。\n・❌ (C) 為什麼錯：不同特徵數值會映射到不同座標位置，不會全部重疊在原點。\n・❌ (D) 為什麼錯：2D 只是為了方便人類肉眼理解的簡化舉例，真實 AI 模型的潛在向量空間通常高達數百至數千個維度（高維度向量空間）。", "has_caveat": 0, "caveat_note": null}, {"id": 355, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某醫療 AI 新創公司聘請了 20 位兼職工讀生，人工幫 10 萬則病患的網路留言標註「情緒類別（正面／負面／中立）」，並準備將病患的「生理數值特徵（呈現鐘形常態分佈）」送入 SVM（支援向量機） 與 KNN 模型進行訓練。\n不料在檢查資料時發現兩個嚴重問題：\n1. 標註標準混亂：面對同一句「醫師看診很快，三分鐘就結束了」，工讀生 A 標註為「正面（效率高）」，工讀生 B 卻標註為「負面（太敷衍）」，導致模型越學越混亂！\n2. 常態分佈數值縮放：生理數值特徵呈現「常態分佈（Normal Distribution）」，且後續要交給對距離敏感的 KNN / SVM 演算法，工程師需要將資料調整為「平均值 = 0、標準差 = 1」的分佈。\n請問：\n1. 解決問題 1（多人標註看法不一）在資料清理中稱為什麼原則？\n2. 問題 2 將資料調整為「平均值 = 0、標準差 = 1」的數值轉換技巧稱為什麼？（請注意與壓縮到 0 ～ 1 的正規化區分）", "option_a": "1. 資料離散化 ／ 2. 正規化（Normalization，壓縮到 0~1）", "option_b": "1. 確保 標註一致性（Labeling Consistency，制定統一標註標準並進行交叉驗證） ／ 2. 標準化（Standardization，又稱 Z-score 標準化，調整為平均值 = 0、標準差 = 1，最適合常態分佈與 KNN/SVM）", "option_c": "1. 停用詞移除 ／ 2. 獨熱編碼（One-Hot Encoding）", "option_d": "1. 主成分分析 ／ 2. 詞形還原（Lemmatization）", "correct_option": "B", "explanation": "・📍 對應重點章節：1.12 資料基本概念 收集清理與前處理\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這題幫你把資料清理與轉換中，最容易跟隔壁鄰居搞混的兩個考點釘牢：\n・1. 多人貼標籤標準不一 ➔ 必抓 標註一致性（Labeling Consistency）：\n  ・如果 20 個老師改作文沒有統一的評分標準（SOP），同一個句子有人給高分、有人給零分，AI 學生看這份教材一定會精神錯亂！所以多人標註分類數據時，最核心的要求就是「制定統一標註標準、確保標註一致性」！\n・2. 數值縮放雙雄終極對決（正規化 0~1 vs 標準化 平均值0、標準差1）：\n  ・正規化（Normalization）：強行把所有數字壓進 0 ~ 1 的小盒子裡（適合非常態分佈、影像像素與神經網路）。\n  ・標準化（Standardization）：把資料調整成「平均值 = 0、標準差 = 1」的完美鐘形曲線（最適合原本就是常態分佈的資料，以及靠算距離分勝負的 KNN 與 SVM）！\n\n【🔑 正確選項秒殺題眼】\n・看到「多人標註分類數據避免混亂」 ➔ 秒選 「確保標註一致性（統一標註標準）」\n・看到「調整資料為平均值 = 0、標準差 = 1（適用常態分佈與 KNN/SVM）」 ➔ 秒選 「標準化（Standardization）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：資料離散化是把連續年齡轉成區間；而壓縮到 0 ～ 1 是「正規化（Normalization）」，不是平均值為 0、標準差為 1 的「標準化（Standardization）」。\n・✅ (B) 為什麼對：精準指出多人標註需維持 標註一致性，以及將資料調整為 μ=0, σ=1 為 標準化（Standardization）。\n・❌ (C) 為什麼錯：停用詞移除與獨熱編碼皆為文字/類別處理技術。\n・❌ (D) 為什麼錯：主成分分析是降維，詞形還原是英文單字還原字典原型。", "has_caveat": 0, "caveat_note": null}, {"id": 356, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "Google 在 2018 年推出的雙向語言理解模型 BERT，在送入雙向 Transformer 編碼器之前，會先把每個輸入字詞轉換成「三種嵌入向量（Embeddings）相加合成」的最終輸入向量；接著再利用「兩大預訓練任務」來學會深層的雙向閱讀理解能力。\n請問：\n1. BERT 輸入層的「三合一嵌入向量」包含哪三種？（其中包含特殊標記 [CLS] 與 [SEP]）\n2. BERT 預訓練時的「兩大猜字與猜句任務」名稱為何？", "option_a": "三種向量為 R、G、B 三原色向量；兩大任務為 正向加噪 與 反向去噪", "option_b": "三種向量為 ① Token Embeddings（詞向量，含句首分類標記 [CLS] 與分句標記 [SEP]） ＋ ② Segment Embeddings（段落/句子向量，區分句子 A 與句子 B） ＋ ③ Position Embeddings（位置向量，標示字詞順序）；兩大預訓練任務為 ① MLM（遮蔽語言模型：隨機遮住 15% 字詞玩雙向克漏字填空） 與 ② NSP（下一句預測：判斷句子 B 是不是句子 A 的真正下一句）", "option_c": "三種向量為 遺忘門、輸入門、輸出門；兩大任務為 單向文字接龍 與 圖片切塊", "option_d": "三種向量為 平均數、中位數、眾數；兩大任務為 K-Means 分群 與 PCA 降維", "correct_option": "B", "explanation": "・📍 對應重點章節：1.6 NLP BERT GPT 與 LLM 演進\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這題幫你把教材 1.6 節中，BERT 最精密的「三合一輸入密碼」與「兩大雙向苦練秘笈」一次看透：\n・BERT 讀句子前的「三合一身分證（3 種 Embedding 相加）」：\n  1. Token Embeddings（你是哪個字？）：把每個字轉成向量，而且開頭固定放一個 [CLS]（總分類長官標記），兩句話中間放一個 [SEP]（分隔島標記）。\n  2. Segment Embeddings（你是上句還是下句？）：幫第一句話全部塗上 A 隊顏色、第二句話全部塗上 B 隊顏色，讓模型分清楚上下句。\n  3. Position Embeddings（你排在第幾號座位？）：標示第 1 個字、第 2 個字的位置座標。\n・BERT 在學校苦練的「兩大預訓練遊戲（MLM + NSP）」：\n  1. MLM（Masked Language Model 遮蔽語言模型） ＝「雙向克漏字填空」：隨機用 [MASK] 遮住句子裡 15% 的字（如 我到 [MASK] 存錢），逼模型同時看前面跟看後面（雙向）猜出是「銀行」！\n  2. NSP（Next Sentence Prediction 下一句預測） ＝「上下句連連看」：給兩句話，讓模型判斷 B 句到底是不是 A 句原本接著講的下一句話。\n\n【🔑 正確選項秒殺題眼】\n・看到「BERT 輸入向量三合一合成」 ➔ 秒選 「Token Embeddings（含 [CLS]/[SEP]）＋ Segment Embeddings ＋ Position Embeddings」\n・看到「BERT 兩大預訓練任務」 ➔ 秒選 「MLM（遮蔽語言模型／克漏字）＋ NSP（下一句預測）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：RGB 與加噪去噪屬於影像擴散模型（Diffusion）。\n・✅ (B) 為什麼對：完整且精準地解析 BERT 的三種嵌入向量（Token + Segment + Position）與兩大預訓練任務（MLM + NSP）。\n・❌ (C) 為什麼錯：三門控屬於 LSTM，單向文字接龍屬於 GPT，圖片切塊屬於 ViT。\n・❌ (D) 為什麼錯：皆為傳統統計與非監督式機器學習方法，並非 BERT 架構。", "has_caveat": 0, "caveat_note": null}, {"id": 357, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某大型醫學中心收集了 100,000 張肺部 X 光片，想要訓練一套罕見肺部病變的 AI 篩檢模型。然而，要請資深放射科專科醫師逐一仔細看片並標註病灶（貼上正確答案標籤），每張成本高達數百元且極度耗時。最後醫院只請專科醫師精準標註了其中 2,000 張（少量有標籤資料），並將剩下 98,000 張未標註的 X 光片（大量無標籤資料） 一起丟進模型裡結合訓練，結果不僅省下了上千萬元的人工標註費，模型準確率還比只用 2,000 張訓練高出許多！\n請問這種「結合少量有標籤資料 ＋ 大量無標籤資料」的學習方式，屬於機器學習五大學習範式中的哪一種？", "option_a": "完全監督式學習（Fully Supervised Learning）", "option_b": "非監督式學習（Unsupervised Learning）", "option_c": "半監督式學習（Semi-Supervised Learning）", "option_d": "強化學習（Reinforcement Learning）", "correct_option": "C", "explanation": "・📍 對應重點章節：1.13 五大學習範式與經典演算法\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「老師只講解 2 題範例，讓學生自己刷 98 題類似題觸類旁通」來秒懂 半監督式學習（Semi-Supervised Learning）：\n・為什麼會有「半監督式學習」？（因為專家貼標籤太貴啦！）：\n  ・在醫療影像（要請名醫看片）或冷門語音辨識（要請語言專家聽寫）領域，「收集十萬張原始照片很容易，但要請專家幫十萬張照片全部貼上標準答案標籤，會破產！」\n・怎麼認出它？看配方比例 ＝「少量有標籤 ＋ 大量無標籤」：\n  ・全部都有人工標籤 ＝ 監督式學習。\n  ・全部都沒標籤（自己分群）＝ 非監督式學習。\n  ・沒人工標籤，自己遮住字生考題（LLM 預訓練）＝ 自監督學習。\n  ・一點點珍貴的人工標籤（2,000 張）＋ 一大堆免費的無標籤資料（98,000 張）＝ 半監督式學習（Semi-Supervised Learning）！\n\n【🔑 正確選項秒殺題眼】\n・看到「少量有標籤資料 ＋ 大量無標籤資料、節省高昂人工標註成本、醫療影像篩檢」 ➔ 秒選 「半監督式學習（Semi-Supervised Learning）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：完全監督式學習要求所有訓練資料（10萬張）都必須具備人工標註的標準答案。\n・❌ (B) 為什麼錯：非監督式學習完全不使用任何人工標籤。\n・✅ (C) 為什麼對：精準對應「少量有標籤 ＋ 大量無標籤」的 半監督式學習（Semi-Supervised Learning）。\n・❌ (D) 為什麼錯：強化學習是透過環境互動的獎懲回饋（Reward/Penalty）來學習策略，與醫療影像標註無關。", "has_caveat": 0, "caveat_note": null}, {"id": 358, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "Google 是推動現代人工智慧發展的核心巨頭之一，從早期的基礎模型到最新的多模態應用，幾乎貫穿了整份認證考試教材。某科技媒體整理了一份「Google AI 家族全明星點名表」，但其中混入了一個並非由 Google 開發的他廠產品。請問下列四項配對中，哪一個選項包含了錯誤的他廠產品？", "option_a": "基礎架構與語言理解：2017 年發表 Transformer 架構論文，並於 2018 年推出雙向編碼器語言理解模型 BERT（及輕量版 ALBERT），成為 Google 搜尋引擎核心技術", "option_b": "多模態主力模型與個人知識庫：推出主力多模態大模型 Gemini 1.5 Pro / Flash（原名 Bard），以及能將用戶上傳的 PDF/簡報轉為雙人對談 Podcast 的 NotebookLM", "option_c": "影片生成與開源文生圖底座：推出採用 Space-Time U-Net 架構的 Google Lumiere（及 Google Veo），以及全球最知名的開源免費文生圖模型 Stable Diffusion 與虛擬人播報平台 HeyGen", "option_d": "資料科學社群與日常序列應用：旗下擁有全球最大資料科學競賽與實作平台 Kaggle、早期 CNN 超現實視覺化工具 Google DeepDream，以及日常應用 Google Assistant、Google 翻譯 與 YouTube 自動字幕", "correct_option": "C", "explanation": "・📍 對應重點章節：1.7 擴散模型 (Diffusion)、2.1 大語言模型 (LLM) 原理 微調與應用模式、5.1 核心大語言模型 (LLM) 與對話平台\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這題幫你把整份教材散落在第 1～5 部分的「Google 家族成員」一次大團圓，同時抓出考場最常拿來魚目混珠的冒牌貨：\n・正宗 Google AI 家族全明星：\n  ・底層架構與 NLP：Transformer (2017)、BERT (2018)、ALBERT。\n  ・旗艦多模態與工具：Gemini 1.5（前身 Bard）、NotebookLM（語音摘要 Podcast）、Google AI Studio、Google Labs、Google Antigravity。\n  ・影像與影片：Google DeepDream（早期 CNN 迷幻風）、Google Lumiere（Space-Time U-Net 影片生成）、Google Veo。\n  ・社群與日常應用：Kaggle（資料科學競賽平台）、Google Assistant、Google 翻譯、YouTube 自動字幕、Google TTS。\n・選項 (C) 混進來的兩個他廠產品是誰家的？：\n  ・Stable Diffusion 是由 Stability AI 開發的開源生圖模型（絕對不是 Google 或 OpenAI！）。\n  ・HeyGen 是獨立新創公司開發的 AI 數位人對嘴播報平台。\n\n【🔑 正確選項秒殺題眼】\n・看到「Stable Diffusion 的開發商」 ➔ 秒選 「Stability AI（絕非 Google 或 OpenAI！）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Transformer、BERT 與 ALBERT 確實皆由 Google 團隊發表與推出。\n・❌ (B) 為什麼錯：Gemini（原 Bard）與 NotebookLM 皆為 Google 官方主力產品。\n・✅ (C) 為什麼對：雖然 Google Lumiere / Veo 屬於 Google，但後半段的 Stable Diffusion 屬於 Stability AI、HeyGen 亦非 Google 產品，因此 (C) 包含了錯誤的他廠產品，為本題正解。\n・❌ (D) 為什麼錯：Kaggle（2017 年被 Google 收購）、DeepDream、Google Assistant、Google 翻譯與 YouTube 皆屬於 Google 生態系。", "has_caveat": 0, "caveat_note": null}, {"id": 359, "source": "題庫09", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "【全冊總驗收綜合情境題】某大型金控與醫療集團啟動了「2026 生成式 AI 全方位數位轉型計畫」，從資料準備、模型選型微調、知識強化、評估驗收到合規治理共分為五個階段。請檢查下列五個階段的技術決策，哪一個選項的全流程配置 100% 完全正確且合規？", "option_a": "階段一（資料治理）：直接將未去識別化的病患真實姓名與身分證字號傳上公開免費網站 ➔ 階段二（模型微調）：用單層感知器畫直線 ➔ 階段三（知識強化）：調高溫度到 0.9 解決幻覺 ➔ 階段四（評估指標）：用盒鬚圖評估機器翻譯品質 ➔ 階段五（合規治理）：宣稱 AI 治理只要交給 IT 部門負責，上線後即可解散團隊", "option_b": "階段一（資料治理）：對病患與客戶資料嚴格執行「去識別化」與「資料加密」，缺失的類別資料（如血型）用「平均數」填補 ➔ 階段二（模型微調）：選用雙向鑑別式模型 BERT 來生成 60 秒連貫宣傳影片 ➔ 階段三（知識強化）：使用 Zapier 進行深層語意理解 ➔ 階段四（評估指標）：用 R-square (R²) 評估盜刷分類 ➔ 階段五（合規治理）：將純 AI 自動生成的海報向政府申請人類著作權保護", "option_c": "階段一（資料治理）：落實「資料去識別化、存取控制、加密與數據最小化」，類別型缺失值以「眾數」填補 ➔ 階段二（模型選型與微調）：引進開源的 Meta LLaMA 3 與 Stable Diffusion 於內網本地部署，並透過 LoRA（在關鍵樓層安裝活動式隔間）進行低成本個性化微調、搭配 RLHF 讓模型說得更好 ➔ 階段三（知識強化）：結合 RAG（檢索增強生成） 外接最新金管會法規庫以降低幻覺 ➔ 階段四（評估驗收）：在極度不平衡的盜刷分類採用 F1-score（調和平均數）、在翻譯與客服機器人採用 BLEU 指標、在房貸金額預測採用 R-square (R²) ➔ 階段五（合規治理）：依循 ISO 42001 與《歐盟 AI 法案》將醫療診斷與求職篩選列為「高風險」嚴格管控，結合 SHAP（整體特徵貢獻）與 LIME（單筆局部解釋）打破黑箱，並配置 Rollback（版本還原） 與 Kill Switch（人工緊急介入開關） 落實跨部門全生命週期治理", "option_d": "階段一（資料治理）：直接刪除漏填達 1/3 的重要客戶資料 ➔ 階段二（模型微調）：使用 LDA 作為神經網路最佳化器更新權重 ➔ 階段三（知識強化）：在 Prompt 中盡量塞滿無意義的抽象長句 ➔ 階段四（評估指標）：拿測試集（Test Set）邊訓練邊修改權重 ➔ 階段五（合規治理）：建立社會信用評分系統監控全體員工", "correct_option": "C", "explanation": "・📍 對應重點章節：第一部分～第五部分 全冊核心觀念總整合\n\n【💡 生活化範例 ／ 具體情境秒懂】\n恭喜你完成最後第 100 題總驗收！這道壓軸題把整份重點整理從第一部分到第五部分的「黃金正解鏈」與「十大必考陷阱」做了一次最完整的總巡禮：\n・階段一（資料與隱私）：遵守四大隱私策略（去識別化、存取控制、加密、數據最小化）；切記漏填達 1/3 不可直接刪，且文字類別型資料（血型/職業）只能用「眾數」補！\n・階段二（開源模型與微調）：文字開源首選 Meta LLaMA 3、生圖開源首選 Stability AI Stable Diffusion；輕量微調用 LoRA（活動式隔間）、行為對齊與風格優化用 RLHF（說得更好）。\n・階段三（知識防幻覺）：外接最新內部法規知識庫必選 RAG（檢索增強生成）。\n・階段四（三大評估指標）：不平衡分類看 F1-score（調和平均數）、翻譯與聊天機器人看 BLEU、連續數值迴歸看 R-square (R²)。\n・階段五（XAI 與合規治理）：遵循 ISO 42001、跨部門全生命週期治理（設計➔部署➔使用➔維護）、醫療與求職屬歐盟「高風險」、用 SHAP（全局）+ LIME（單筆局部）提供可解釋性，並備妥 Rollback 與 Kill Switch 緊急煞車機制！\n\n【🔑 正確選項秒殺題眼】\n・全冊五大階段無懈可擊的標準配置 ➔ 秒選 (C)\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：違反個資去識別化、單層感知器無法做複雜任務、調高溫度 0.9 反而增加幻覺、盒鬚圖是抓異常值而非評估翻譯、且 AI 治理絕非僅由 IT 部門負責或上線即結束。\n・❌ (B) 為什麼錯：類別資料（血型）算不出平均數（應用眾數）、BERT 是雙向鑑別式模型不會生影片、Zapier 無法完整理解語意、R² 不能評估分類、且純 AI 生成物不享有人類著作權保護。\n・✅ (C) 為什麼對：從資料清理、隱私保護、開源本地部署、LoRA+RLHF+RAG 進階強化、三大評估指標到 XAI 與歐盟高風險合規治理，每一個環節皆 100% 符合認證考試標準正解！\n・❌ (D) 為什麼錯：漏填達 1/3 不可直接刪除、LDA 不是神經網路最佳化器、抽象冗長違反提示工程簡潔精準原則、測試集（期末考）絕不可拿來調參訓練、且社會信用評分系統屬於歐盟完全禁止的不可接受風險。", "has_caveat": 0, "caveat_note": null}, {"id": 360, "source": "題庫10", "
