任 AI 全生命週期治理準則，下列哪一項敘述完全正確？", "option_a": "AI 治理僅存在於模型的演算法設計階段，部署上線後即可完全放任無須監控", "option_b": "AI 治理必須涵蓋「設計、部署、使用到後續維護」的全生命週期持續管控，且必須由 IT、法務、業務與決策層跨部門全員參與", "option_c": "AI 治理屬於純粹的伺服器硬體散熱工程，僅由機房水電工單獨負責", "option_d": "只要企業繳納會員費，即可免受任何 AI 治理法規的約束", "correct_option": "B", "explanation": "看到「AI 治理生命週期原則、責任人員分工」 ➔ 秒選 「涵蓋設計/部署/使用/維護全生命週期，且需跨部門全員參與」\n\nAI 治理的兩大黃金鐵則（防考題陷阱！）：\n鐵則一：全生命週期持續管控（絕非上線就結束！）：\n\n  - AI 不是電風扇插了電就不用管。從「① 設計 ➔ ② 部署 ➔ ③ 使用 ➔ ④ 維護」，全流程都要持續監控有沒有概念漂移（Concept Drift）或偏見歧視！\n鐵則二：跨部門全員參與（絕非 IT 資訊部門單打獨鬥！）：\n\n  - 技術工程師管演算法、法務管個資法合規、業務部門管用戶體驗、高層主管管風險審查。跨部門協同治理才是健全企業治理的唯一正解！\n\n❌ (A) 為什麼錯：上線部署後隨真實環境變化極易發生模型退化或風險洩露，治理必須持續監控。\n✅ (B) 為什麼對：NIST AI RMF 與 ISO 42001 國際標準皆明訂 AI 治理貫穿全生命週期，且強調跨領域跨部門的多方利害關係人協同參與。\n❌ (C) 為什麼錯：AI 治理涉及演算法倫理、資料安全與法規合規，非單純硬體水電。\n❌ (D) 為什麼錯：法定合規義務不可透過繳納會費豁免。", "has_caveat": 0, "caveat_note": null}, {"id": 641, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在提示工程（Prompt Engineering）的實務教學與知識架構中，除了最常見的 3W 與 COSEED 框架外，業界針對不同工作情境還總結出了許多縮寫記憶口訣框架（例如：TAG、CARE、TRACE、RTF 與 ICIO 等）。某教育訓練講師在向學員介紹這類結構化框架時指出：這些不同英文字母縮寫雖然表面結構略有不同，但其核心本質皆是為了達成同一個目的。請問採用這些結構化提示框架的最核心目標為何？", "option_a": "降低輸入文字的字數以縮減網路頻寬", "option_b": "引導使用者全面涵蓋任務角色、情境脈絡、具體指示與輸出格式，避免提問過於空泛導致模型生成低品質回答", "option_c": "強制大語言模型在推論時將所有回答全數轉換為古代文言文", "option_d": "將使用者的電腦本機防火牆自動關閉", "correct_option": "B", "explanation": "看到「結構化提問框架（TAG/CARE/RTF 等）核心目的」 ➔ 秒選 「全面涵蓋角色、背景、指示與格式，避免空泛提問」\n\n結構化提示框架（如 TAG, CARE, RTF）的本質意義：\n如果只用一句話隨便問（空泛輸入）：\n\n  - 「請寫一篇行銷文」，AI 根本不知道你是賣給誰、語氣要正式還是搞笑、要多長。\n\n  - 結果只能吐出千篇一律的八股廢話（垃圾進，垃圾出）。\n套用結構化公式（如 Role-Task-Format, RTF 等）：\n\n  - 強迫發問者像填表格一樣，把「① 你是誰（Role）、② 做什麼（Task）、③ 輸出什麼排版（Format）」一次交代清楚！\n\n  - 大模型得到充分明確的邊界指令，產出的內容才能直切核心、高質量交付！\n\n❌ (A) 為什麼錯：結構化提示通常會豐富上下文，字數略有增加，並非為了極限壓縮頻寬。\n✅ (B) 為什麼對：結構化框架旨在透過模組化要素（角色、情境、任務、格式、限制）消除語意模糊，最大化模型輸出的精準度與可用性。\n❌ (C) 為什麼錯：框架提示支援各種語言與語體，非強制文言文。\n❌ (D) 為什麼錯：提示工程與本機作業系統防火牆安全設定無關。", "has_caveat": 0, "caveat_note": null}, {"id": 642, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在探討 Google 近年發布的影片生成前沿模型「Lumiere」時，電腦視覺科學家高度讚揚其採用的「時空 U-Net 架構（Space-Time U-Net）」。在傳統影片生成管線中，系統常因為「先生成關鍵幀圖片、再嘗試在幀與幀之間填補動作」而產生難以克服的時序閃爍與物理形變。請問 Lumiere 的 Space-Time U-Net 究竟是透過何種突破性的空間與時間去噪方式，成功實現了整段 5 秒高畫質影片的自然流暢與邏輯一致性？", "option_a": "在單一的前向去噪過程中，同時在空間維度（圖片長寬）與時間維度（整段時序影格）上進行全局的多維降採樣與去噪重建", "option_b": "完全略過影像去噪過程，僅依靠將純文字翻譯為音訊來驅動影片", "option_c": "僅在第一幀使用神經網路，其餘所有幀皆使用複製貼上", "option_d": "將整段影片直接發送給人類動畫師進行逐格手繪補幀", "correct_option": "A", "explanation": "看到「Lumiere Space-Time U-Net 去噪突破、如何確保時空連貫」 ➔ 秒選 「在單一過程中同時在空間維度與時間維度上進行全局去噪生成」\n\n我們用「傳統手翻書補畫 vs 4D 黏土一體成型」來理解 Lumiere：\n傳統影片生成 ＝「先畫第 1 頁、再畫第 10 頁，中間插畫手抖跳格」：\n\n  - 影格之間缺乏全局時空關聯，走兩步路衣服花紋可能突然換掉。\nLumiere 的 Space-Time U-Net（本題核心）＝「把時間當成第 3 維度，整塊 4D 時空一次雕刻」：\n\n  - 在 U-Net 的每一層卷積中，同時對「長、寬、時間秒數」一起下採樣與去噪！\n\n  - 一下子直接生出整段 5 秒完整的時空區塊，確保「物體在空間中的位置」與「在時間中的移動軌跡」天衣無縫，徹底消弭跳幀！\n\n✅ (A) 為什麼對：Space-Time U-Net 的核心精髓即為打破分離式幀間生成，在時間與空間全維度直接進行端到端的多維擴散去噪。\n❌ (B) 為什麼錯：Lumiere 處理複雜的高維視覺特徵張量，非純文字轉音訊。\n❌ (C) 為什麼錯：複製貼上無法產生連續逼真的動態物理交互。\n❌ (D) 為什麼錯：Lumiere 是純 AI 端到端模型，不涉及人工逐格繪製。", "has_caveat": 0, "caveat_note": null}, {"id": 643, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國零售連鎖集團的總經理室幕僚團隊，每週一固定使用生成式 AI 工具自動產出發送給董事會的「每週各門市營運績效報告簡報（PPT）」。在實施兩個月後，主管發現簡報存在兩大痛點：一是內容逐漸千篇一律、缺乏當週的新鮮趨勢洞察；二是偶爾會出現未經核實的銷售數字幻覺。在職場 AI 簡報生成實務與認證考試的標準解答中，請問該團隊最應該採取下列哪兩項關鍵改進做法？", "option_a": "定期更新底層動態數據源（保持資料新鮮）＋ 使用自動校對與事實查核工具（確保數據準確）", "option_b": "禁止在簡報中使用任何數字，全數改為漫畫插圖", "option_c": "將所有簡報頁數強制縮減為只有半頁", "option_d": "將簡報字體全數設定為白色透明以隱藏文字", "correct_option": "A", "explanation": "看到「AI 簡報避免內容重複（定期更新數據源）＋ 確保內容數據準確（使用自動校對工具）」 ➔ 秒選 「定期更新數據源 ＋ 使用自動校對工具」\n\n企業週期性 AI 簡報兩大常考解法：\n痛點一：內容重複、千篇一律？ ➔ 「定期更新數據源（Data Source）」！\n\n  - AI 是根據你餵給它的草料排版的。只要每次串接最新一週的 ERP 銷售數據庫，AI 產出的洞察分析自然週週不同！\n痛點二：如何確保簡報文字與數據準確？ ➔ 「使用自動校對工具與交叉驗證」！\n\n  - 透過自動化數值比對腳本與查核工具，確保生成的 PPT 數字與原始資料庫 100% 吻合！\n\n✅ (A) 為什麼對：官方重點與最佳實踐明確指出：克服簡報千篇一律首重定期刷新資料來源，防範內容錯誤需結合自動校對與事實稽核機制。\n❌ (B) 為什麼錯：商業高階簡報必須依賴量化數據支撐，不能以純漫畫取代。\n❌ (C) 為什麼錯：過度縮減篇幅無法傳遞完整的經營分析。\n❌ (D) 為什麼錯：透明字體為惡意或破版行為。", "has_caveat": 0, "caveat_note": null}, {"id": 644, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國投信公司的量化基金經理人正在利用深度強化學習演算法進行高頻套利交易。該深度神經網路內部包含多達 80 層的非線性特徵轉換與複雜的自注意力權重。在一次極端市場黑天鵝事件中，模型突然發出大量異常拋售指令導致鉅額虧損。事後金管會要求該公司交代「模型究竟是根據市場中的哪一項具體指標做出了全盤拋售的決定」，但資深工程師在檢查程式碼後坦言：由於深度網路具備高度複雜的非線性嵌套矩陣，人類根本無法直觀看懂內部中間神經元是如何做出該決策的。請問這反映了現代深度神經網路在系統層面固有的哪一項重大缺陷？", "option_a": "可解釋性與透明度嚴重不足（Lack of Interpretability and Transparency）", "option_b": "缺乏浮點數乘法運算能力", "option_c": "只能在黑白終端機上運行", "option_d": "模型內部未配置任何權重", "correct_option": "A", "explanation": "看到「深度網路內部神經元複雜非線性、人類無法得知決策因果、黑箱問題」 ➔ 秒選 「可解釋性與透明度不足（Lack of Interpretability）」\n\n深度學習的黑箱本質（Black-box Problem）：\n傳統決策樹 ＝「透明的心理測驗流程圖」：如果年齡大於 30 且收入大於 50 萬就核准，決策原因清清楚楚。\n深層神經網路 ＝「封閉的直覺黑箱」：\n\n  - 輸入市場數據，經過幾千萬個浮點數權重乘加扭曲，直接吐出「賣出」指令。\n\n  - 你問它「為什麼賣？」，它拿不出像人類一樣的邏輯推導因果鏈，這正是可解釋性與透明度不足帶來的金融法規與系統性風險！\n\n✅ (A) 為什麼對：深度神經網路的高維度非線性映射使其成為黑箱模型（Black-box），難以直接提供人類可理解的因果決策邏輯。\n❌ (B) 為什麼錯：GPU 的核心專長正是高速執行數萬億次浮點數矩陣乘法。\n❌ (C) 為什麼錯：模型運行於圖形介面或雲端服務，無終端機顯示限制。\n❌ (D) 為什麼錯：深度學習模型內部包含數千萬至數千億個參數權重。", "has_caveat": 0, "caveat_note": null}, {"id": 645, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在深度神經網路的最佳化訓練實務中，「梯度消失（Vanishing Gradient）」曾長期困擾著試圖增加網路層數的研究人員。當反向傳播的誤差訊號傳到最前面幾層時衰減為趨近於零，導致淺層特徵萃取器完全學不到東西。在長期的深度學習理論突破中，科學家總結出了「五大經典的訓練穩定與防梯度消失技巧」。在認證考試關於這五大技巧的綜合考核中，請問下列哪一項「**不屬於**」解決梯度消失的五大核心技巧之一？", "option_a": "隱藏層改用線性整流活化函數（ReLU）取代 Sigmoid 函數", "option_b": "引入跳接結構的殘差網路（ResNet）", "option_c": "在層與層之間導入批次正規化（Batch Normalization）", "option_d": "線性判別分析（LDA）降維技術", "correct_option": "D", "explanation": "看到「解決梯度消失五大訓練穩定技巧、下列何者『不是』」 ➔ 秒選 「線性判別分析（LDA）」\n\n克制「梯度消失」的五大穩定降魔神器名單：\n1. 啟動函數：從 Sigmoid 改用 `ReLU`（正區間斜率恆為 1，信號不縮水）。\n2. 殘差網路：`ResNet` 跳接結構（直達高速電梯無損回傳梯度）。\n3. 批次正規化：`Batch Normalization (BN)`（把每批數據數值拉回穩定範圍）。\n4. 適當的權重初始化：如 He / Xavier 初始化（打破對稱、穩健信號）。\n5. 先進最佳化器：如 `Adam / RMSprop` 自適應調整步長。\n高頻排它陷阱：`LDA（線性判別分析）` 又是它！LDA 是傳統機器學習降維投影分類技術，根本不是解決深度神經網路梯度消失的訓練技巧！\n\n❌ (A) 為什麼錯：ReLU 在正區間導數為 1，是解決梯度消失的基石。\n❌ (B) 為什麼錯：ResNet 的 Skip Connection 允許梯度直通淺層，是經典解決方案。\n❌ (C) 為什麼錯：BN 穩定層間輸入分佈，有效緩解梯度消失與爆炸。\n✅ (D) 為什麼對：LDA（Linear Discriminant Analysis）是傳統統計降維演算法，與深度神經網路反向傳播的梯度消失解法毫無關聯。", "has_caveat": 0, "caveat_note": null}, {"id": 646, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國智庫的研究團隊需要快速研讀一份長達 20 萬字的全球氣候變遷綜合評估白皮書，並需要針對報告中的第 14 章與第 3 章進行跨章節的精確數據比對。在亞洲新興的大語言模型家族中，由月之暗面（Moonshot AI）所開發的大語言模型，從推出初期即以專精於「突破百萬字超長文本無損上下文閱讀、長篇 PDF 深度理解與精準查核」為其最鮮明的標誌性核心能力。在國際認證考試關於全球熱門大模型定位的評量中，請問這款主打超長文本對話的代表性大模型名稱為何？", "option_a": "月之暗面長文本模型（Kimi）", "option_b": "圖片去背編輯工具（Remove.bg）", "option_c": "影片動態生成工具（Lumiere）", "option_d": "線上簡報生成軟體（Beautiful.ai）", "correct_option": "A", "explanation": "看到「月之暗面（Moonshot AI）、Kimi、主打超長文本無損閱讀」 ➔ 秒選 「Kimi」\n\n亞洲長文本閱讀的先行者：\nKimi（月之暗面 Moonshot AI 出品，本題核心）＝「超長篇小說文獻吞吐巨獸」：\n\n  - 最早引爆市場的就是它支援高達「20 萬字甚至 200 萬字」超長文本無損輸入！\n\n  - 你可以把整部《三體》或長達幾百頁的財報 PDF 一口氣丟給它，問它裡面極為冷門的一句對話或微小數據，它能「大海撈針」100% 精準找到並總結，是以超長上下文無損理解著稱的標竿模型！\n\n✅ (A) 為什麼對：Kimi 由月之暗面（Moonshot AI）研發，以領先業界的超長上下文視窗處理與長文本檢索理解能力聞名。\n❌ (B) 為什麼錯：Remove.bg 是商品影像自動去背工具。\n❌ (C) 為什麼錯：Lumiere 是 Google 的影片生成架構。\n❌ (D) 為什麼錯：Beautiful.ai 是圖表簡報製作工具。", "has_caveat": 0, "caveat_note": null}, {"id": 647, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "由科技企業家伊隆·馬斯克（Elon Musk）創立的 AI 研究公司 xAI，發表了其代表性的大語言模型「Grok」。在與 OpenAI ChatGPT、Anthropic Claude 等主流模型的生態系競爭與個性化風格比較中，Grok 展現了獨特的差異化特點。請問下列哪一項敘述精準概括了 Grok 在產品定位與資訊來源上的標誌性特色？", "option_a": "深度整合社群平台 X（前 Twitter）的全球即時資訊串流，強調言論自由、回應風格風趣幽默且敢於回答爭議性話題", "option_b": "僅支援以古希臘文在羊皮紙上進行書寫輸出", "option_c": "完全不具備任何程式碼生成能力，僅能處理純音樂音訊", "option_d": "必須由政府機構每天進行人工逐字審查才能對外發布", "correct_option": "A", "explanation": "看到「xAI、Elon Musk、Grok、結合 X 社群即時資訊、風格幽默辛辣」 ➔ 秒選 「結合 X 社群即時資訊、強調言論自由與幽默風趣風格」\n\n馬斯克旗下 Grok 的叛逆個性定位：\nGrok（xAI 出品，本題核心）＝「連網 X 社群、說話幽默辛辣的即時通」：\n\n  - 即時情報：直接外掛社群平台 X（推特）的即時發文資料庫，世界上剛發生 1 秒鐘的突發新聞，它立刻知道！\n\n  - 風格叛逆幽默：馬斯克不喜歡其他大模型過於小心翼翼、政治正確的「公關腔」，將 Grok 調教成自帶一點叛逆嘲諷（Sarcastic）、風趣幽默、敢於直言的獨特個性！\n\n✅ (A) 為什麼對：xAI 的 Grok 以即時存取 X 平台數據獲取最新世界動態、具備幽默詼諧的回答口吻以及強調對抗傳統審查為核心標籤。\n❌ (B) 為什麼錯：古希臘文為荒謬干擾項。\n❌ (C) 為什麼錯：Grok 具備優秀的程式碼編程與數學邏輯能力。\n❌ (D) 為什麼錯：Grok 為雲端自主即時推論模型，無政府逐字預先審核機制。", "has_caveat": 0, "caveat_note": null}, {"id": 648, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在開源文生圖模型領域中，英國新創公司 Stability AI 扮演了舉足輕重的推手角色。在企業部署與個人使用時，許多初學者經常混淆 Stability AI 旗下的兩大產品定位：\n* 產品甲：基於潛在擴散模型（LDM）架構，將龐大的神經網路權重檔案完全公開開源，允許全球開發者與企業免費下載並在本機 GPU 伺服器上自由微調部署。\n* 產品乙：由官方建立的簡化商業網頁介面平台，使用者免安裝任何 Python 環境或頂級顯卡，直接透過瀏覽器購買點數即可進行高品質圖像生成。", "option_a": "穩定擴散模型（Stable Diffusion）與 夢想工作室網頁平台（DreamStudio）", "option_b": "夢想工作室網頁平台（DreamStudio）與 穩定擴散模型（Stable Diffusion）", "option_c": "商業安全圖庫平台（Adobe Firefly）與 藝術插畫平台（Midjourney）", "option_d": "向量圖形設計工具（Figma）與 簡報排版工具（Gamma）", "correct_option": "A", "explanation": "看到「Stability AI 雙工具區分：開源模型底座（Stable Diffusion）vs 官方網頁版（DreamStudio）」 ➔ 秒選 「Stable Diffusion 與 DreamStudio」\n\nStability AI 旗下雙胞胎產品的分工：\nStable Diffusion（本體模型權重，產品甲）＝「開源免費的跑車引擎底盤」：\n\n  - 程式碼和權重全部開源免費下載！工程師可以裝在自家電腦，隨意換零件、掛 LoRA、裝 ControlNet，自由度極高。\nDreamStudio（官方網頁版，產品乙）＝「官方開的開箱即用出租店」：\n\n  - 給不想搞懂 Python、電腦顯卡不夠好的一般人用的！\n\n  - 打開瀏覽器網頁，註冊帳號直接按按鈕生圖，簡單方便！\n\n✅ (A) 為什麼對：Stable Diffusion 是 Stability AI 發布的開源模型權重本體，DreamStudio 則是官方提供的線上收費 Web 介面服務。\n❌ (B) 為什麼錯：兩者產品名稱順序顛倒。\n❌ (C) 為什麼錯：Adobe Firefly 與 Midjourney 為其他獨立公司的生圖產品。\n❌ (D) 為什麼錯：Figma 與 Gamma 非圖像擴散模型家族。", "has_caveat": 0, "caveat_note": null}, {"id": 649, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國運動用品製造商的潮牌服飾設計團隊，正在製作一系列印有醒目英文字標的「復古潮 T 恤設計圖」。設計師要求 AI 生成的圖片中，必須在模特兒穿著的黑色 T 恤胸口正前方，以清晰、優雅且 100% 拼字正確的排版英文字體呈現出「`RUN FAST, LIVE FREE`」這組字樣。在過往測試中，其他主流繪圖模型經常把文字畫成殘缺不全的偽符號。在認證考試關於圖片生成工具強項定位的考題中，請問設計團隊應優先選用哪一款專精於「精準文字排版與 Typography 渲染」的生圖平台？", "option_a": "精準文字排版生圖平台（Ideogram）", "option_b": "雲端大數據運算框架（Apache Hadoop）", "option_c": "團隊專案看板管理工具（Jira）", "option_d": "線上語音降噪消除外掛（Krisp）", "correct_option": "A", "explanation": "看到「在圖片中精準生成排版英文字（Typography）、T恤/海報嵌字」 ➔ 秒選 「Ideogram」\n\n圖中嵌字的無冕之王：\nIdeogram（本題核心）＝「專治生圖錯別字的神醫」：\n\n  - 早期的生圖平台畫背景很強，但只要遇到要在圖裡寫字（如店面招牌、衣服胸口字、海報標題），常常字母缺一撇、或者多吐出兩個無意義字母。\n\n  - Ideogram 在架構中深度強化了文字排版（Typography）訓練！只要你在引號裡打什麼英文，它就能端端正正、漂漂亮亮地印在衣服或海報上，是商業 Logo 與潮牌字標的首選！\n\n✅ (A) 為什麼對：Ideogram AI 從發布即以極高的英文字體排版（Typography）準確度著稱，最適合需在圖中呈現精準文字的設計任務。\n❌ (B) 為什麼錯：Apache Hadoop 是海量大數據分散式運算系統。\n❌ (C) 為什麼錯：Jira 是軟體開發專案追蹤管理平台。\n❌ (D) 為什麼錯：Krisp 是音訊即時降噪工具。", "has_caveat": 0, "caveat_note": null}, {"id": 650, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在大型雲端資料中心的機密資料儲存與傳輸設計中，資安架構師需要同時平衡「運算效能」與「金鑰傳輸安全性」。在實務上，企業常採用「混合加密機制（Hybrid Encryption）」：利用非對稱加密來安全傳遞一把臨時會話密鑰，隨後真正大量儲存於硬碟中的數百萬筆客戶交易紀錄，則全數交由對稱加密演算法進行高速加密。請問架構師之所以在大量資料的加密儲存上堅持選用「對稱加密演算法」的核心考量為何？", "option_a": "對稱加密演算法的加解密數學運算速度極快、計算開銷遠低於非對稱加密，最適合海量資料的吞吐處理", "option_b": "對稱加密完全不需要依賴任何金鑰即可完成加解密", "option_c": "對稱加密在數學上是單向不可逆的，任何人皆無法解密還原", "option_d": "對稱加密產生的密文檔案體積會自動縮小至原本的千萬分之一", "correct_option": "A", "explanation": "看到「海量資料加密儲存為何選對稱加密、核心優勢」 ➔ 秒選 「運算速度極快、計算開銷低，最適合大量資料處理」\n\n密碼學雙雄的優缺點互補：\n非對稱加密（公私鑰雙金鑰，如 RSA）：安全極佳（密鑰不用在網路上裸奔），但計算複雜、速度極慢！拿它來加密幾十個 GB 的大資料庫，CPU 會直接燒到當機。\n對稱加密（單一相同金鑰，如 AES，本題核心）：\n\n  - 速度飛快、硬體運算極輕量！\n\n  - 因此最佳拍檔是：用非對稱加密傳送小小的金鑰紙條，真正的海量大數據全部交給對稱加密以光速完成加解密！\n\n✅ (A) 為什麼對：對稱加密（如 AES）基於代換與置換網絡，運算效率遠高於依賴大數分解的非對稱加密，是大量靜態資料儲存加密的標準配置。\n❌ (B) 為什麼錯：對稱加密必須使用單一私密密鑰進行運算。\n❌ (C) 為什麼錯：不可逆的是單向雜湊函數（Hash），對稱加密持有正確金鑰時完全可逆解密。\n❌ (D) 為什麼錯：加密演算法主要是提供機密性防護，非具備極限壓縮資料功能。", "has_caveat": 0, "caveat_note": null}, {"id": 651, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國自駕車晶片製造商的高級軟體架構師，在為車載主機挑選即時影像辨識演算法時指出：在 GPU 專用硬體上，卷積神經網路（CNN）的「平行處理能力（Parallel Processing Capability）」極其優秀，能夠在毫秒級時間內完成高畫質相機畫面的全區域特徵萃取；而傳統的循環神經網路（RNN）在平行化上卻存在嚴重的架構硬傷。請問導致傳統 RNN 幾乎無法進行大規模 GPU 平行加速的核心結構特徵為何？", "option_a": "RNN 具備時間先後的循序依賴性（Sequential Dependency），當前時間步的隱藏狀態必須等待前一時刻計算完成才能開始", "option_b": "RNN 內部僅包含二維矩陣，而 GPU 只能加速三維張量", "option_c": "RNN 只能在紙本穿孔卡片上運算", "option_d": "RNN 完全不存在任何權重參數", "correct_option": "A", "explanation": "看到「RNN 為何平行運算能力極差、無法善用 GPU 加速」 ➔ 秒選 「具備時間序列依賴性（Sequential Dependency），必須依序排隊計算」\n\n我們用「千人同時切牛排 vs 逐個排隊傳話」來理解平行運算瓶頸：\nCNN 空間獨立（極高平行化）：一張照片的左上角和右下角互不相干，GPU 裡面的 5,000 個小核心可以同時動手算，1 秒處理完畢！\nRNN 時序依賴（極差平行化，本題核心）：\n\n  - 公式：$h_t = f(W x_t + U h_{t-1})$。\n\n  - 算現在這一秒（$t$），必須苦苦等待上一秒（$t-1$）的結果出來！\n\n  - 就算你有 1 萬張頂級顯卡，其他 9,999 張顯卡也只能閒著排隊乾等，這是循序依賴（Sequential Dependency）帶來的硬傷！\n\n✅ (A) 為什麼對：RNN 的遞迴特性要求隱藏狀態隨時間步循序更新（$h_t$ 依賴 $h_{t-1}$），前後相扣的數據流摧毀了 GPU 的平行運算優勢。\n❌ (B) 為什麼錯：GPU 對任意維度的張量（包括二維矩陣）皆具備極高的平行乘法能力。\n❌ (C) 為什麼錯：穿孔卡片為早期電腦古董技術。\n❌ (D) 為什麼錯：RNN 包含輸入權重與循環隱藏權重等多組參數矩陣。", "has_caveat": 0, "caveat_note": null}, {"id": 652, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國會計師事務所為了協助稽核人員隨時查詢最新修訂的國際財務報導準則（IFRS）與臺灣在地稅法細則，需要為其 AI 稽核助手建構一套可靠的技術架構。已知每年全球會計公報與各國稅法條文都會頻繁改版修訂。在評估「檢索增強生成（RAG）」與「模型全量微調（Fine-Tuning）」時，架構師最終拍板採用 RAG 架構。請問從知識更新頻率與系統維運成本來看，RAG 架構勝過模型微調的最核心優勢為何？", "option_a": "當法規修訂時，只需更新外部知識庫中的文字向量文件，完全不需要重新訓練或改動大語言模型的底層權重，維運成本極低且資訊零延遲", "option_b": "RAG 會自動將使用者的電腦作業系統升級為超級電腦", "option_c": "RAG 能確保模型在推論時完全不消耗任何電量", "option_d": "RAG 只能使用在沒有網路連線的離線單機硬體上", "correct_option": "A", "explanation": "看到「法規頻繁修訂、RAG 勝過微調的核心優勢」 ➔ 秒選 「資料更新僅需替換知識庫文件，無需重新訓練改動模型權重」\n\nRAG 外掛知識庫的「活頁夾」哲學：\n模型微調（Fine-Tuning）＝「每次修法都要把律師送去特訓補習班動腦部手術」：\n\n  - 稅法每週都在改，難道每週都要砸幾十萬 GPU 算力重新微調大模型？成本太重且容易遺忘舊知識。\nRAG（開書考，本題核心）＝「在律師桌上放一個隨時抽換最新公報的活頁資料夾」：\n\n  - 大模型本身權重「一個位元都不改」！\n\n  - 稅法修訂時，工程師只要花 1 秒鐘，把最新 PDF 轉成向量丟進資料庫資料夾。AI 回答時先翻資料夾，既掌握最新法條、又能標註出處，維運成本幾乎為零！\n\n✅ (A) 為什麼對：RAG 解耦了「參數化知識」與「外部知識庫」，動態即時性極高，大幅降低了因知識頻繁過期而反覆微調模型的算力成本。\n❌ (B) 為什麼錯：RAG 是軟體架構，無法改變終端硬體物理規格。\n❌ (C) 為什麼錯：推論運算必然消耗正常電力。\n❌ (D) 為什麼錯：RAG 可靈活部署於雲端或混合環境，非僅限單機。", "has_caveat": 0, "caveat_note": null}, {"id": 653, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在 Google 提出的 BERT 雙向 Transformer 編碼架構中，當一個句子被切分成 Token 輸入模型時，底層並非直接使用單純的字詞編碼，而是由三個不同維度的嵌入向量（Embedding）相加融合而成。這三個不可或缺的嵌入層分別為：\n* 向量甲：代表詞彙本身身份的編碼，並包含句首分類標記 `[CLS]` 與句尾分隔標記 `[SEP]`。\n* 向量乙：用於區分輸入文本中是來自「句子 A」還是來自「句子 B」（解決問答與配對任務）。\n* 向量丙：為每個字詞貼上流水號號碼牌，用以彌補 Transformer 天生平行運算而缺乏前後順序感的缺陷。", "option_a": "標記嵌入（Token Embedding）、分句嵌入（Segment Embedding）、位置嵌入（Position Embedding）", "option_b": "位置嵌入（Position Embedding）、分句嵌入（Segment Embedding）、標記嵌入（Token Embedding）", "option_c": "均方誤差嵌入（MSE）、決定係數嵌入（$R^2$）、雙語替補嵌入（BLEU）", "option_d": "卷積嵌入（CNN）、循環嵌入（RNN）、對抗嵌入（GAN）", "correct_option": "A", "explanation": "看到「BERT 輸入向量三合一組成」 ➔ 秒選 「標記嵌入（Token）＋ 分句嵌入（Segment）＋ 位置嵌入（Position）」\n\nBERT 輸入向量三合一組合拳（必考！）：\n$\\text{BERT Input} = \\text{Token} + \\text{Segment} + \\text{Position}$：\n\n  - Token Embedding（你是誰？）：查字典找出單字的專屬向量，並在最前面加上 `[CLS]`（用來做整句分類）、句子中間加 `[SEP]`（分開兩句話）。\n\n  - Segment Embedding（你屬於哪一句？）：標記這個詞是上半句（Sentence A）還是下半句（Sentence B）。\n\n  - Position Embedding（你排在第幾個位置？）：貼上順序號碼牌（第 1 個字、第 2 個字），讓平行運算的模型分得清誰在前誰在後！三個向量加在一起送進模型！\n\n✅ (A) 為什麼對：精準對應 BERT 官方架構：Token Embedding 承載單詞語意與特殊標記、Segment Embedding 區隔句子對、Position Embedding 補齊時序位置資訊。\n❌ (B) 為什麼錯：各嵌入向量順序錯置。\n❌ (C) 為什麼錯：MSE、$R^2$、BLEU 為演算法評估指標，非輸入嵌入層。\n❌ (D) 為什麼錯：CNN、RNN、GAN 為神經網路架構名詞。", "has_caveat": 0, "caveat_note": null}, {"id": 654, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在推動企業內部私有化大模型落地的過程中，晶片巨頭 NVIDIA 不僅提供實體顯卡硬體，更推出了名為「NIMs（NVIDIA Inference Microservices，推論微服務）」的企業級軟體平台。某跨國銀行的資訊架構師在評估引進 NIMs 時指出：以往在企業內部自行部署開源模型（如 LLaMA 3）時，需要耗費數週配置 CUDA 驅動、最佳化 TensorRT-LLM 引擎並包裝成 Docker 容器，過程極其繁瑣。請問 NVIDIA NIMs 帶給企業最核心的架構效益為何？", "option_a": "將預先經過極致推論效能最佳化的大模型包裝為符合標準化 API 的即開即用微服務容器，大幅縮短企業落地部署時間", "option_b": "強制限制企業只能使用黑白點矩陣印表機印出結果", "option_c": "將所有企業機密資料無條件公開上傳至公共社群網路", "option_d": "永久性地關閉伺服器內所有的快取記憶體", "correct_option": "A", "explanation": "看到「NVIDIA NIMs (Inference Microservices)、企業部署效益」 ➔ 秒選 「預先最佳化封裝為標準微服務容器，大幅加速企業私有化部署」\n\nNVIDIA 的企業大模型「料理預製菜真空包」：\n以前在公司部署大模型 ＝「從買菜、洗菜、切菜到生火做飯（耗時數週）」：\n\n  - 要自己調校底層顯卡驅動、寫 API、調優記憶體，常遇到環境衝突跑不動。\nNVIDIA NIMs（本題核心）＝「名廚預先調配好的頂級微服務料理包」：\n\n  - NVIDIA 官方把 LLaMA、Mistral 等開源模型，用他們最強的 TensorRT-LLM 最佳化到極致，直接封裝成乾淨標準的 Docker 微服務容器！\n\n  - 企業下載後一行指令直接跑起來，提供標準 API 接口，讓企業在自家 GPU 上數分鐘內高速上線！\n\n✅ (A) 為什麼對：NIMs 提供經過性能調優、具備標準化 API 的微服務容器，能無縫整合至企業私有雲與資料中心，大幅降低部署複雜度並提升吞吐量。\n❌ (B) 為什麼錯：輸出為現代標準 API 協定，非點陣印表機。\n❌ (C) 為什麼錯：NIMs 專為保護企業私有化內部資料而生，絕不強制公開資料。\n❌ (D) 為什麼錯：NIMs 充分利用高階快取技術提升推論速度。", "has_caveat": 0, "caveat_note": null}, {"id": 655, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國跨境電商賣家在亞馬遜平台上有數萬件商品，涵蓋戶外登山、寵物用品與智慧家電等多個領域。以往撰寫商品文案時，人工撰寫一篇需要 30 分鐘，且容易流於乏味的規格清單列舉（例如僅列出長寬高與重量），無法激起消費者的購買衝動。團隊導入了生成式 AI 輔助文案系統。在電商實務應用中，請問電商平台運用生成式 AI 大規模生成「商品描述（Product Description）」的最核心商業價值為何？", "option_a": "能夠在幾秒鐘內將枯燥的硬體規格轉化為生動、引人注目且能切中消費者痛點的專屬特點文案，顯著提升點擊與下單轉換率", "option_b": "強制要求所有消費者在結帳時必須閱讀完一萬字的小說", "option_c": "自動向消費者發送大量垃圾廣告以癱瘓其手機通訊", "option_d": "將所有商品售價全數強制自動改寫為零元", "correct_option": "A", "explanation": "看到「電商運用 AI 生成產品描述（Product Description）的最大優勢」 ➔ 秒選 「快速撰寫引人注目的產品特點、提升消費者購買轉換率」\n\n電商商品描述（Product Description）的點金術：\n傳統規格表（死板冰冷）：「重量 300 克，鋁合金材質，容量 500ml」。顧客看了毫無感覺。\n生成式 AI 的商業魔力（引人注目的特點，提升轉換率，本題核心）：\n\n  - 輸入硬體規格，AI 瞬間產出富有感染力的吸睛文案：「輕如羽翼的航太級鋁合金，讓您在攀登雪山之巔時，隨時啜飲一口冒著熱氣的溫暖，專為無畏冒險者打造！」\n\n  - 迅速捕捉顧客目光、突顯產品核心亮點、直接拉動銷售轉換率！\n\n✅ (A) 為什麼對：官方重點與電商實踐皆指出：AI 撰寫產品描述的核心價值在於高效率產出具備吸引力與說服力的產品特點，驅動行銷轉化。\n❌ (B) 為什麼錯：強制閱讀長文會增加結帳摩擦力，破壞顧客體驗。\n❌ (C) 為什麼錯：惡意垃圾廣告損害品牌聲譽。\n❌ (D) 為什麼錯：修改售價屬於定價策略或系統故障，非商品描述文案生成的功能。", "has_caveat": 0, "caveat_note": null}, {"id": 656, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在各國推動人工智慧法規與發展綱領的倫理共識中，國際社會普遍確立了引領 AI 健康發展的「AI 倫理五大核心原則」（包括：以人為本、可信任、透明性、問責制、避免歧視）。當某個由政府機構採購並用於輔助審查低收入戶急難救助金發放的 AI 系統，因演算法錯誤將數千名符合資格的弱勢家庭誤判剃除時，社會大眾要求政府部門必須有人出來承擔責任並建立監督稽核機制。請問在 AI 倫理五大原則中，這項「當系統出錯或造成侵害時，必須有明確的責任歸屬主體與監管審查機制」的原則被稱作下列何者？", "option_a": "問責制原則（Accountability Principle）", "option_b": "浮點數最大化原則（Floating-point Principle）", "option_c": "局部特徵池化原則（Pooling Principle）", "option_d": "自回歸解碼原則（Autoregressive Principle）", "correct_option": "A", "explanation": "看到「AI 倫理原則、出事誰負責、問責機制、政府設立監管審查」 ➔ 秒選 「問責制（Accountability）」\n\nAI 倫理之「出事了誰負責？」：\n不能推卸責任給機器：\n\n  - 當公部門的 AI 系統審查出錯、害民眾補助被取消時，官員不能雙手一攤說「這都是電腦算的，不關我們的事」！\n問責制（Accountability，本題核心）＝「必須有人負責與建立監管機制」：\n\n  - 明確規範：背後的政府採購單位、開發商與審查主管，誰負法律責任？\n\n  - 體現為「政府機構設立專責生成式 AI 監管審查機制」與可追溯稽核管道，絕不能讓責任真空！\n\n✅ (A) 為什麼對：問責制（Accountability）強調 AI 系統的設計、部署與決策後果必須具備明確的法律與倫理責任主體，並配套監管機制。\n❌ (B) 為什麼錯：浮點數為硬體運算精度概念。\n❌ (C) 為什麼錯：池化是 CNN 降維卷積技術。\n❌ (D) 為什麼錯：自回歸是語言模型逐字解碼機制，非倫理原則。", "has_caveat": 0, "caveat_note": null}, {"id": 657, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國自駕車軟體研發中心的資深科學家，在對實習生進行機器學習實作紀律教育時，特別強調了「資料集切分的三大嚴格鐵律」：平時使用訓練集（Training Set）進行反向傳播更新權重；使用驗證集（Validation Set）進行超參數微調與模型選型；而「測試集（Test Set）」在整個漫長的研發訓練循環中必須嚴格封存，直到模型即將交付驗收的最後一刻，才能拿出來進行「最終期末考驗收」。請問資深科學家之所以將「嚴禁在訓練過程中拿測試集參與調參」列為不可逾越的紅線，最根本的原因為何？", "option_a": "為了避免產生嚴重的資料洩漏（Data Leakage）與作弊過擬合，確保能夠客觀真實地評估模型對未見過全新場景的泛化能力", "option_b": "因為測試集的檔案會隨時間自動腐蝕損毀", "option_c": "因為測試集僅能使用打孔紙帶進行讀取", "option_d": "為了防止伺服器電線走火", "correct_option": "A", "explanation": "看到「測試集（Test Set）嚴禁參與調參、資料洩漏（Data Leakage）、客觀泛化力」 ➔ 秒選 「防資料洩漏與作弊過擬合，客觀評估未見真實場景之泛化能力」\n\n三大資料集的考場防作弊鐵則：\n訓練集 ＝ 平時上課課本。\n驗證集 ＝ 平時模擬考卷（可以邊考邊檢討調整讀書方法）。\n測試集（Test Set，本題核心）＝「嚴格密封在保險箱的期末考卷」：\n\n  - 如果工程師為了追求高分，邊訓練邊偷看測試集來調參數，就是嚴重的「資料洩漏（Data Leakage）」！\n\n  - 就算拿了 100 分也是虛假的作弊成績，一旦把自駕車開上真實馬路，遇到沒看過的路況就會釀成嚴重車禍！必須保留這份未曾曝光的考卷做最客觀的泛化驗收！\n\n✅ (A) 為什麼對：測試集若在訓練階段被模型或工程師用於調校參數，會喪失獨立性並造成資訊洩漏（Data Leakage），破壞評估模型真實泛化能力的客觀性。\n❌ (B) 為什麼錯：數位檔案具備完整備份與持久性，無自然腐蝕問題。\n❌ (C) 為什麼錯：測試集為現代標準二進位或文字格式資料。\n❌ (D) 為什麼錯：調參不會引發實體電線走火。", "has_caveat": 0, "caveat_note": null}, {"id": 658, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國通訊社的科技新聞調查記者在撰寫深度調查報導時，經常利用大語言模型協助整理跨國專利訴訟與學術研究歷史。記者深知大語言模型在回答歷史人物事蹟或冷門科學發明時，存在「一本正經胡說八道（幻覺）」的潛在風險。為了迫使模型在產出答案時採取最嚴格的事實自我檢驗，記者在每一次提問結尾都會附上一句關鍵的引導性咒語（Directive Prompt）：\n> 「**請在給出每一個論點與事實結論時，必須同時提供具體的引用來源、學術論文標題或官方機構可查證之出處，若無法確認真實性請直接回答不知道**。」", "option_a": "顯著約束模型的隨機捏造傾向，提升回答的事實可驗證性與可靠度", "option_b": "將輸入文字自動加密為防火牆無法辨識的代碼", "option_c": "讓伺服器強制切換至純聲音輸出模式", "option_d": "使模型在回答時自動略過所有名詞", "correct_option": "A", "explanation": "看到「提示詞要求：提供引用來源、出處查證、不知道請直說」 ➔ 秒選 「約束隨機捏造與幻覺，提升事實可靠性與可驗證性」\n\n治癒大模型幻覺的「呈堂證供」咒語：\n如果只問「某某人發明了什麼？」：\n\n  - AI 為了當個討喜的助手，就算資料庫裡沒有，也會憑著語言統計機率胡謅一個看起來很像真的假故事（幻覺）。\n加上「請提供具體引用來源與出處，不知道請直說」：\n\n  - 像法官在法庭上要求證人：「你講的每一句話，都必須拿出白紙黑字的物證！」。\n\n  - 逼模型在自回歸預測時，將注意力集中在那些具備明確文獻引用依據的高可靠性語意路徑上，大幅壓制隨意編造的念頭，提高資訊的真實度！\n\n✅ (A) 為什麼對：要求提供具體引用來源（Citation Prompting）促使模型對齊可查證的事實路徑，並觸發「拒絕回答未確定資訊」的安全防護機制，有效抑制幻覺。\n❌ (B) 為什麼錯：提示詞無法加密文字以繞過防火牆。\n❌ (C) 為什麼錯：純文字提示不會強制伺服器切換為純聲音模式。\n❌ (D) 為什麼錯：模型輸出仍保持完整自然語言結構。", "has_caveat": 0, "caveat_note": null}, {"id": 659, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某金控數位創新部在規劃企業內部 AI 轉型藍圖時，回顧了人工智慧近數十年來的技術演化歷史，指出 2014 年是從傳統 AI 邁向生成式 AI 的重要歷史分水嶺。2014 年前以 AlexNet、CNN、RNN 等模型為代表，而 2014 年後則誕生了 GAN、VAE、Seq2Seq 等突破性架構。請問在技術演進的分界上，2014 年前傳統 AI 與 2014 年後生成式 AI 的最核心本質差異為何？", "option_a": "前者專注於連續數值預測，後者專注於二元邏輯運算", "option_b": "前者專注於硬體晶片設計，後者專注於雲端網路傳輸", "option_c": "前者專注於特徵分類與模式辨識，後者專注於全新數據樣本生成", "option_d": "前者專注於人工規則編寫，後者專注於物理感測器控制", "correct_option": "C", "explanation": "看到「2014 年分水嶺、傳統 AI vs 生成式 AI 本質差異」 ➔ 秒選 「前者專注於特徵分類辨識，後者專注於全新數據樣本生成」\n\nAI 演進的「鑑賞家」與「創作家」之別：\n2014 年前的傳統 AI（鑑別式 AI）：\n\n  - 像是一位眼光毒辣的「藝術鑑定專家」。\n\n  - 給它一張貓的照片，它能辨識出這是一隻貓；給它一封電子郵件，它能判斷是垃圾信還是正常信；它擅長「看懂、理解、分類、辨識」，但自己無法憑空畫出一隻貓。\n2014 年後的現代 AI（生成式 AI）：\n\n  - 誕生了 GAN、VAE 以及後續的 Diffusion 與 Transformer，躍升為「專業藝術畫家」。\n\n  - 能夠學習真實世界的機率分佈，進而無中生有地創造出世界上從未存在過的新文字、逼真圖像、音樂與影片。\n\n❌ (A) 為什麼錯：兩者皆可處理連續與離散數值運算，非本質分水嶺。\n❌ (B) 為什麼錯：晶片設計與雲端傳輸屬於底層基礎設施，非 AI 模型任務屬性。\n✅ (C) 為什麼對：2014 年前傳統 AI 以鑑別式（Discriminative）為主，專注分類與預測；2014 年後生成式（Generative）大爆發，專注創造全新的資料樣本。\n❌ (D) 為什麼錯：符號邏輯規則編寫屬於 1950~1980 年代早期專家系統特徵。", "has_caveat": 0, "caveat_note": null}, {"id": 660, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國連鎖零售集團引進一套具備自適應學習能力的 AI 人才招募系統，用於自動篩選全球數萬份應徵者履歷並給出錄取建議排序。依據歐盟《人工智慧法案 (EU AI Act)》的風險分級金字塔框架，這類直接影響個人工作權與生計重大權益的 AI 招聘篩選系統，屬於法案中的哪一個風險等級？", "option_a": "不可接受的風險（Prohibited Risk）", "option_b": "高度風險（High Risk）", "option_c": "有限風險（Limited Risk）", "option_d": "最低風險（Minimal Risk）", "correct_option": "B", "explanation": "看到「歐盟 AI 法案、招聘篩選、履歷審查、就業影響」 ➔ 秒選 「高度風險（High Risk）」\n\n歐盟 AI 法案的「安檢通道」四級制：\n不可接受的風險（全面禁止）：\n\n  - 例如社會信用評分、公眾場所無差別即時遠端生物辨識。\n高風險（嚴格審查後方可上線）：\n\n  - 攸關民眾身家安全、升學就業與重大權利，例如「醫療診斷 AI」與「求職履歷篩選/員工績效評估系統」。\n\n  - 系統必須保證資料無歧視偏誤、具備高度透明性、保留完整稽核日誌並有人工隨時監督。\n有限風險（透明度義務）：\n\n  - 例如客服 Chatbot、Deepfake 偽造影音（必須明確標註是 AI 生成）。\n最低風險（自由運作）：\n\n  - 例如遊戲 NPC 自動對話、影片推薦演算法、垃圾郵件過濾。\n\n❌ (A) 為什麼錯：不可接受的風險僅針對侵犯基本人權的極端應用（如社會信用評分），招聘系統只要符合嚴格合規審查仍允許使用。\n✅ (B) 為什麼對：求職招聘與升學評估直接決定個人生涯與公平性，在歐盟法案中被明確歸類為第二級「高風險（High Risk）」。\n❌ (C) 為什麼錯：有限風險主要適用於一般客服 Chatbot 等僅需告知義務的系統。\n❌ (D) 為什麼錯：最低風險為電玩遊戲或垃圾郵件過濾，招聘系統絕不可能免受法規監管。", "has_caveat": 0, "caveat_note": null}, {"id": 661, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某企業顧問在訓練新進分析師運用大語言模型撰寫產業研究報告時，強調結構化提問「3W 架構」（Who、Where、What）。分析師在 Prompt 中詳細列出：「本報告受眾為製造業中小企業主，工廠面臨少子化缺工與電價上漲雙重成本壓力，目前僅有基礎數位儀表板但無雲端整合經驗」。請問上述內容屬於 3W 架構中的哪一個要素？", "option_a": "角色設定（Who）", "option_b": "輸出格式（Output）", "option_c": "核心任務（What）", "option_d": "情境背景（Where）", "correct_option": "D", "explanation": "看到「企業現況限制、面臨痛點挑戰、業務背景資訊」 ➔ 秒選 「情境背景（Where）」\n\n3W 結構化提問的「看診三問」：\nWho（誰生病／醫生身分）：\n\n  - 定義角色。例如「你是一位資深的智慧製造數位轉型顧問」。\nWhere（在哪個環境／具體病況背景）：\n\n  - 提供具體的情境、現況限制與面臨的挑戰。例如「工廠面臨缺工、電費上漲、只有本機儀表板且無雲端經驗」。\n\n  - 提供了詳細背景，AI 就不會給出空洞的大企業天價方案，而能對症下藥！\nWhat（做什麼／處方任務）：\n\n  - 明確的具體行動。例如「請提出一份為期三個月、預算在 50 萬以內的節能改善排程規劃」。\n\n❌ (A) 為什麼錯：Who 負責指定模型或受眾的角色身分設定。\n❌ (B) 為什麼錯：Output 屬於 COSEED 架構中的輸出格式要素（如表格、JSON）。\n❌ (C) 為什麼錯：What 是要求模型具體執行的核心工作任務。\n✅ (D) 為什麼對：描述工廠面臨缺工、電價與技術現狀等業務脈絡，屬於提供具體業務上下文的「情境背景（Where）」。", "has_caveat": 0, "caveat_note": null}, {"id": 662, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某手遊美術團隊訓練一套生成對抗網路（GAN）來自動生成奇幻怪物角色造型。經過數百次訓練迭代後，工程師發現生成器輸出的所有怪物幾乎都長得一模一樣，完全喪失了原訓練集中豐富的多樣性與造型變化。請問此現象在 GAN 的訓練缺陷中稱作什麼？", "option_a": "模式崩潰（Mode Collapse）", "option_b": "梯度消失（Vanishing Gradient）", "option_c": "過度擬合（Overfitting）", "option_d": "語意漂移（Semantic Drift）", "correct_option": "A", "explanation": "看到「GAN、生成器只產出同一種樣本、喪失多樣性」 ➔ 秒選 「模式崩潰（Mode Collapse）」\n\n造假集團的「投機取巧偷懶症」：\nGAN 的博弈機制：\n\n  - 生成器（假鈔集團）要想辦法騙過判別器（警察）。\n模式崩潰（Mode Collapse）的發生：\n\n  - 生成器突然發現：「咦？我只要印特定某一款特定面額的假鈔，警察每次都看不出來！」。\n\n  - 於是生成器為了拿高分，乾脆不再嘗試印製百元、千元或不同年份的鈔票，全部只瘋狂印製同一款假鈔！\n\n  - 結果就是生成器輸出單一化，完全喪失多樣性，這就是 GAN 最惡名昭彰的致命缺陷。\n\n✅ (A) 為什麼對：模式崩潰（Mode Collapse）是 GAN 訓練失衡時的典型瓶頸，生成器僅生成少數或單一特定樣本以欺騙判別器。\n❌ (B) 為什麼錯：梯度消失主要指深層神經網路反向傳播時數值衰減無法更新前端權重。\n❌ (C) 為什麼錯：過度擬合是模型過度記憶訓練集雜訊，在驗證集表現不佳，而非 GAN 生成單一模式。\n❌ (D) 為什麼錯：語意漂移指對話模型隨著互動拉長偏離主題，非圖像生成多樣性崩潰。", "has_caveat": 0, "caveat_note": null}, {"id": 663, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某行銷總監要求團隊在兩小時內產出一份高水準的年度提案簡報。團隊採用了當前職場推崇的高效「三段式 AI 簡報工作流程」：先由 ChatGPT 產出結構化企劃大綱，接著將大綱匯入能自動生成投影片版面與卡片結構的工具快速建立雛形，最後在視覺設計平台套用企業專屬色彩與精緻美化。請問負責「自動建立投影片版面結構」的中間工具最常採用下列何者？", "option_a": "Notion（筆記與團隊協作平台）", "option_b": "Whisper（語音辨識與轉錄模型）", "option_c": "Gamma（簡報自動生成與編排工具）", "option_d": "Perplexity（聯網對話式搜尋引擎）", "correct_option": "C", "explanation": "看到「職場三段式簡報流、大綱轉卡片結構與自動排版」 ➔ 秒選 「Gamma」\n\n職場簡報神速三部曲：\n第一步：文案腦（ChatGPT）：\n\n  - 負責產出清晰邏輯、有故事性的純文字提案大綱。\n第二步：骨架手（Gamma）：\n\n  - 輸入純文字大綱，Gamma 在一分鐘內自動拆解為投影片卡片、安排標題與版面版型。\n第三步：化妝師（Canva）：\n\n  - 將初稿匯入 Canva 套用企業品牌專屬標準字體、品牌色票與高品質商業插圖。\n\n❌ (A) 為什麼錯：Notion 專注於團隊筆記、文件管理與專案協作知識庫。\n❌ (B) 為什麼錯：Whisper 是 OpenAI 開源的語音辨識（ASR）模型。\n✅ (C) 為什麼對：Gamma 是專門將文字結構轉換為網頁化、卡片式簡報排版的自動生成工具，與 ChatGPT 及 Canva 構成經典三段式工作流。\n❌ (D) 為什麼錯：Perplexity 是結合網路檢索的對話式搜尋引擎。", "has_caveat": 0, "caveat_note": null}, {"id": 664, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "由臺灣國家科學及技術委員會（國科會）主導推動的本土大型語言模型專案「TAIDE（可信任生成式 AI 對話引擎）」，旨在打造融入臺灣在地文化、生活經驗與法規語境的語言底座。請問在計算機科學的技術層次上，TAIDE 最核心的底層技術本質屬於下列何者？", "option_a": "區塊鏈合約（Blockchain）", "option_b": "機器學習（Machine Learning, ML）", "option_c": "虛擬實境（Virtual Reality, VR）", "option_d": "量子計算（Quantum Computing）", "correct_option": "B", "explanation": "看到「臺灣 TAIDE 計畫、核心技術本質」 ➔ 秒選 「機器學習（Machine Learning, ML）」\n\n臺灣專屬大腦的「基因血統」：\nTAIDE 的研發背景：\n\n  - 許多國外大模型講中文會帶有對岸用語（如「公交車」、「正能量」）或不熟悉臺灣法律與文化。\n\n  - 國科會推動 TAIDE 計畫，以開源模型（如 Meta LLaMA 系列）為基礎，灌入臺灣中央社新聞、政府公報、在地文學等高品質繁體中文語料。\n技術血統歸屬：\n\n  - 它的本質是不折不扣的「深度學習」與「機器學習（Machine Learning, ML）」大型語言模型，絕非區塊鏈或虛擬實境。\n\n❌ (A) 為什麼錯：區塊鏈屬於分散式帳本與密碼學技術，與大語言模型無關。\n✅ (B) 為什麼對：TAIDE 是基於深度神經網路與大量語料訓練的生成式大語言模型，技術本質完全屬於「機器學習（ML）」。\n❌ (C) 為什麼錯：虛擬實境屬於 3D 視覺沉浸顯示技術。\n❌ (D) 為什麼錯：量子計算為前沿物理運算硬體，目前大語言模型皆運行於經典 GPU 叢集上。", "has_caveat": 0, "caveat_note": null}, {"id": 665, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某演算法工程師在訓練深度類神經網路時，發現模型在訓練資料集上表現接近完美，但在未見過的測試資料集上誤差卻大幅攀升（發生嚴重的過擬合現象）。工程師決定在損失函數中加入針對模型權重大小的懲罰項（如 L1 或 L2 正則化），以約束權重數值並抑制模型過度複雜。請問這類在損失函數中加入懲罰機制的技術統稱作什麼？", "option_a": "正則化（Regularization）", "option_b": "離散化（Discretization）", "option_c": "蒸餾化（Distillation）", "option_d": "向量化（Vectorization）", "correct_option": "A", "explanation": "看到「損失函數加懲罰項、限制權重大小、L1/L2、防止過擬合」 ➔ 秒選 「正則化（Regularization）」\n\n避免模型「死背死鑽牛角尖」的超速罰單：\n神經網路的過擬合通病：\n\n  - 為了把平時作業（訓練集）寫到 100 分，神經網路會把某些權重數值調得巨大無比，死記硬背每一個極端特例。\n正則化（Regularization）開罰單：\n\n  - 在損失函數算分數時加上條款：「只要你任何一個參數權重數值過大，我就額外扣你分（L1/L2 懲罰項）！」。\n\n  - 逼迫模型將權重分散、壓低參數數值，學會更平滑、通用的真實規律，從而防範過擬合與梯度爆炸！\n\n✅ (A) 為什麼對：正則化（Regularization，包含 L1/L2）透過在損失函數中增加權重懲罰項來限制模型複雜度，是防治過擬合的核心技術。\n❌ (B) 為什麼錯：離散化是將連續數值變為區間類別的前處理技巧（如年齡轉年齡層）。\n❌ (C) 為什麼錯：模型蒸餾是讓小模型學習大模型輸出的模型壓縮技術。\n❌ (D) 為什麼錯：向量化是將文字或陣列轉換為數學向量或平行運算的操作。", "has_caveat": 0, "caveat_note": null}, {"id": 666, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國軟體架構師在評估企業欲採購的商業大語言模型與開源模型能力時，希望參考目前國際公認最具公信力、依據真實使用者匿名雙盲（Double-blind）隨機對話評比、並透過西洋棋等級分系統（Elo rating）實時排名的「大模型對決天梯」排行榜。請問該權威評測社群平台為何者？", "option_a": "Kaggle（Google 旗下平台）", "option_b": "Hugging Face（開源模型社群）", "option_c": "GitHub（微軟旗下開源代碼庫）", "option_d": "LMSYS Chatbot Arena（加州大學柏克萊分校等聯合團隊）", "correct_option": "D", "explanation": "看到「大模型天梯、雙盲隨機投票、Elo 等級分評測」 ➔ 秒選 「LMSYS Chatbot Arena」\n\n全球 AI 大擂台的「雙盲蒙面歌王」：\n傳統基準測試（Benchmarks）的盲點：\n\n  - 很多廠商會針對固定題庫（如 MMLU、GSM8K）刷榜作弊。\nLMSYS Chatbot Arena 的盲測機制：\n\n  - 使用者輸入一個問題，由兩個匿名的模型（Model A vs Model B）同時作答。\n\n  - 使用者看完兩份回答後投票選出「誰回答得更好」，系統隨後才揭曉勝負雙方是哪兩家模型。\n\n  - 結合西洋棋的 Elo 積分演算法計算天梯排行榜，是全球公認最真實、防作弊的模型能力風向標！\n\n❌ (A) 為什麼錯：Kaggle 是全球資料科學競賽與開源 Notebook 學習社群。\n❌ (B) 為什麼錯：Hugging Face 是開源模型權重與資料集的託管共用樞紐。\n❌ (C) 為什麼錯：GitHub 是原始程式碼版本控制與代碼託管平台。\n✅ (D) 為什麼對：LMSYS Chatbot Arena 採用開源社群群眾外包雙盲對決機制，建立全球大模型真實體驗 Elo 排名。", "has_caveat": 0, "caveat_note": null}, {"id": 667, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在當前全球科技巨頭的生成式 AI 戰略佈局中，許多企業選擇閉源並透過付費 API 提供專有服務。然而，有一家科技巨頭反其道而行，堅持開源推廣路線，將其研發的旗艦大型語言模型權重（LLaMA 系列）公開授權全球社群與企業研究微調，成為開源 AI 生態系最重要的標竿底座。請問這家科技巨頭是下列何者？", "option_a": "Apple（Apple Intelligence）", "option_b": "Amazon（Amazon Bedrock）", "option_c": "Meta（LLaMA 系列模型）", "option_d": "xAI（Grok 模型）", "correct_option": "C", "explanation": "看到「科技巨頭、堅持開源路線、LLaMA 系列模型權重」 ➔ 秒選 「Meta」\n\n科技巨頭的 AI 生態路線圖：\n閉源城堡派：\n\n  - OpenAI（GPT-4o）、Google（Gemini）、Anthropic（Claude）將最強大腦深鎖在雲端，只賣 API。\n開源大善人派（Meta）：\n\n  - 祖克柏主導 Meta 釋出 LLaMA 1、2、3 系列模型權重，全世界的高校、初創公司與企業都能免費下載，並在自己的伺服器上私有化部署與微調（如臺灣 TAIDE 即基於 LLaMA 打造）。\n\n❌ (A) 為什麼錯：Apple 主打終端裝置離線運算與高度隱私保護（Apple Intelligence）。\n❌ (B) 為什麼錯：Amazon AWS 專攻 B2B 雲端託管服務與企業級應用平台（Bedrock）。\n✅ (C) 為什麼對：Meta 開源 LLaMA（Large Language Model Meta AI）系列，是推動全球開源大模型繁榮的最核心科技巨頭。\n❌ (D) 為什麼錯：xAI 是馬斯克創立的 AI 公司，旗艦模型為 Grok，主打整合 X 平台即時資訊。", "has_caveat": 0, "caveat_note": null}, {"id": 668, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某智慧城市顧問在盤點市政專案時，需要向市府官員澄清「人工智慧生成內容（AIGC）」與「傳統辨識型人工智慧」的本質邊界。請問下列哪一項專案屬於傳統的「辨識與特徵萃取型應用」，而非屬於 AIGC 的生成式應用？", "option_a": "文生影片導覽系統（Diffusion 與時序控場）", "option_b": "停車場高速車牌光學辨識系統（卷積神經網路與 OCR）", "option_c": "觀光宣傳海報自動生成系統（潛在擴散模型作畫）", "option_d": "多國語言旅遊導覽語音合成系統（神經文字轉語音）", "correct_option": "B", "explanation": "看到「非 AIGC 生成應用、車牌辨識、OCR、特徵識別」 ➔ 秒選 「停車場車牌辨識系統（CNN 與 OCR）」\n\n「驗鈔機」vs「印鈔機」的觀念陷阱：\n傳統辨識型 AI（如車牌 OCR、門禁臉部辨識）：\n\n  - 像「驗鈔機」。\n\n  - 只是對既有的實體事物進行掃描、特徵萃取與文字辨識（輸入圖片 ➔ 輸出已有車牌字號）。它並沒有無中生有創造出任何新的藝術或內容，屬於鑑別式 AI。\nAIGC 生成式 AI（如生影片、生畫作、語音合成）：\n\n  - 像「印鈔機」。\n\n  - 根據提示詞輸入，憑空生成出世界上原本不存在的高畫質影片、海報或擬真自然語音。\n\n❌ (A) 為什麼錯：文生影片系統憑空產生動態畫面，屬於標準 AIGC 影片生成。\n✅ (B) 為什麼對：車牌 OCR 辨識技術僅是將圖片中已有的文字轉換為數位標籤，屬於鑑別識別技術，絕非 AIGC 生成式應用。\n❌ (C) 為什麼錯：AI 繪製宣傳海報屬於標準 AIGC 圖像生成。\n❌ (D) 為什麼錯：神經語音合成憑空產生自然波形聲音，屬於標準 AIGC 音訊生成。", "has_caveat": 0, "caveat_note": null}, {"id": 669, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某互動式劇本遊戲工作室正在開發具備豐富情感的 NPC 語音對話系統，希望 AI 角色在表現憤怒、悲傷、驚恐或欣喜時，語調與氣息能夠自然逼真，而非機械式平淡無奇。在訓練情感語音合成（Emotional TTS）模型的過程中，下列哪一項是決定模型能否精準詮釋情緒最關鍵的成功要素？", "option_a": "情緒標註語音資料（提供不同情感聲學標籤）", "option_b": "統一平緩語速控制（維持對話音節均勻輸出）", "option_c": "音量固定平衡演算法（消除語音動態範圍差異）", "option_d": "音高變頻移位技術（單純提高音訊震動頻率）", "correct_option": "A", "explanation": "看到「情感語音合成、Emotional TTS、最關鍵成功要素」 ➔ 秒選 「情緒標註語音資料（Emotionally Annotated Data）」\n\n專業配音員的「情緒劇本手稿」：\n為什麼一般的 TTS 聽起來像機械語音客服？：\n\n  - 因為平時訓練模型的錄音檔都是平鋪直敘、沒有情感波動的播音員朗讀。\n情感語音合成的秘密武器：\n\n  - 必須餵給模型帶有「喜怒哀樂明確情感標籤」的高品質語音資料（Emotionally Annotated Speech Data）。\n\n  - 模型才能學會：當標註為「悲傷」時，聲調要低沉顫抖、帶有嘆息；標註為「興奮」時，音頻攀升且節奏加快！\n\n✅ (A) 為什麼對：情感標註語音資料集讓模型學會在不同情緒下的聲學特徵與語調起伏，是情感 TTS 的核心依託。\n❌ (B) 為什麼錯：維持統一平緩語速會讓聲音更加呆板機械化，完全扼殺情緒變化。\n❌ (C) 為什麼錯：音量固定化消除了激動大喊或悲傷呢喃的動態差異。\n❌ (D) 為什麼錯：單純音高移位（Pitch Shifting）只是變聲效果（如花栗鼠聲音），無法傳達真實情感層次。", "has_caveat": 0, "caveat_note": null}, {"id": 670, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某國國家通訊傳播委員會在舉辦資安與科技倫理公聽會時，針對「深度偽造（Deepfake）」技術日益逼真的擬真影音合成帶來的負面衝擊提出預警。請問 Deepfake 技術在目前社會層面上引發最嚴重的實質危害不包含下列何者？", "option_a": "金融安全領域（偽造高層影音進行電話詐騙與資產轉移）", "option_b": "公共輿論領域（捏造假新聞與不實事件誤導公眾認知）", "option_c": "基礎設施領域（直接摧毀實體海底光纖電纜與變電所）", "option_d": "政治民主領域（在選舉前夕偽造候選人不當言論破壞公平）", "correct_option": "C", "explanation": "看到「Deepfake 社會危害不包含、實體破壞」 ➔ 秒選 「直接摧毀實體基礎設施與電纜」\n\n虛擬欺詐與物理破壞的界限：\nDeepfake 的危害本質（軟體與資訊層面欺騙）：\n\n  - 偽造身分詐騙：視訊會議中冒充跨國公司財務長要求轉帳數千萬。\n\n  - 假新聞與謠言：偽造災難現場或名人發言破壞社會安定。\n\n  - 選舉政治操弄：大選前幾小時釋出候選人退選假錄音干擾投票。\n物理實體破壞：\n\n  - 深度偽造演算法無法像炸藥或怪手那樣直接實體切斷海底電纜或炸毀實體變電站設施。\n\n❌ (A) 為什麼錯：偽造高管聲紋與面孔進行跨國金融詐騙是目前 Deepfake 嚴重的真實犯罪態樣。\n❌ (B) 為什麼錯：散布虛假新聞與假影片造成輿論混亂是典型的 Deepfake 社會危害。\n✅ (C) 為什麼對：Deepfake 屬於生成式影音合成技術，其風險集中於身分欺詐、虛假訊息傳播與政治操弄，不具備直接實體物理破壞光纖設施之能力。\n❌ (D) 為什麼錯：在關鍵大選前夕偽造政治人物極端言論破壞民主公信力是全球各國防範重點。", "has_caveat": 0, "caveat_note": null}, {"id": 671, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某房地產科技公司訓練一套神經網路模型來預測各區域的中古屋實價登錄成交金額。在設定模型學習方向時，工程師選擇了一種專門用於連續數值迴歸預測的損失函數：將模型預測房價與真實成交價的差值進行平方後取平均，使得預測偏差越大的極端錯誤受到指數級的嚴重懲罰。請問此損失函數為何者？", "option_a": "交叉熵損失（Cross-Entropy Loss）", "option_b": "餘弦相似度損失（Cosine Proximity Loss）", "option_c": "絕對值平滑損失（Huber Loss）", "option_d": "均方誤差損失（Mean Squared Error, MSE）", "correct_option": "D", "explanation": "看到「數值預測、誤差平方取平均、大錯重罰、迴歸損失」 ➔ 秒選 「均方誤差損失（Mean Squared Error, MSE）」\n\n估價師的「重罰大錯」計分尺：\n連續數值迴歸任務（猜價格、猜溫度、猜用電量）：\n\n  - 真實房價 2,000 萬，模型如果猜 2,001 萬（差 1 萬），平方後懲罰很小（$1^2 = 1$）。\n\n  - 但如果模型糊塗猜成 3,000 萬（差 1,000 萬），平方後懲罰飆升到 100 萬（$1000^2$）！\n均方誤差（MSE）的特性：\n\n  - 差值平方取平均，數值越小代表越精準，專門用於處罰估價離譜的大錯。\n\n❌ (A) 為什麼錯：交叉熵損失專門用於分類任務（算機率分佈差距），非連續數值迴歸。\n❌ (B) 為什麼錯：餘弦相似度損失用於衡量向量方向夾角，非數值估價。\n❌ (C) 為什麼錯：Huber Loss 在大誤差時呈線性成長，非純粹的平方均值。\n✅ (D) 為什麼對：均方誤差（MSE）是迴歸任務最經典的損失函數，透過誤差平方重罰大偏差。", "has_caveat": 0, "caveat_note": null}, {"id": 672, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某高中數理資優班老師引導學生使用大語言模型解題時，發現直接詢問競賽難題時模型經常猜錯。老師依據 Google DeepMind 2023 年發表的研究論文，指導學生在問題最後加入一句著名的引導咒語：「請深呼吸，並一步一步思考解決這個問題（Take a deep breath and work on this problem step by step）」，模型答題準確率隨即呈現爆發性成長。請問該提示詞之所以能大幅提升解題表現的根本技術原因為何？", "option_a": "觸發硬體降溫機制（降低伺服器中央處理器運作溫度）", "option_b": "引導自回歸推理路徑（促使模型產出完整的思維鏈步驟）", "option_c": "強制建立即時外聯（自動連線至外部數值計算引擎）", "option_d": "清空對話記憶快取（使上下文長度重置為零開始計算）", "correct_option": "B", "explanation": "看到「Take a deep breath and work on this problem step by step、提升準確率技術原因」 ➔ 秒選 「引導自回歸推理路徑，促使產出思維鏈」\n\n深呼吸咒語激發「慢思考神經元」：\n如果不加咒語（零樣本直球對決）：\n\n  - 模型試圖在第一個 Token 就直接給出最終答案，這就像要求學生心算微積分題目，極容易脫口胡猜。\n加上「深呼吸，一步一步做」：\n\n  - 在預訓練資料中，這句話通常出現在高水準專家導師的詳細解題教程開頭。\n\n  - 它成功喚醒模型內部的「思維鏈（Chain of Thought）」自回歸推理路徑，強迫模型把中間推理步驟逐一寫在上下文（Scratchpad）中，進而大幅提升最後結論的正確性！\n\n❌ (A) 為什麼錯：文字提示詞無法改變機房硬體風扇或物理溫度。\n✅ (B) 為什麼對：該指令激發了模型在預訓練與對齊階段學到的解題邏輯模式，引導其透過自回歸逐步推論（思維鏈），降低跳躍猜測的錯誤率。\n❌ (C) 為什麼錯：純文字提示不會自動建立外部 API 外聯。\n❌ (D) 為什麼錯：該指令不會重置或清空對話歷史。", "has_caveat": 0, "caveat_note": null}, {"id": 673, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在 OpenAI Sora 等當代頂尖 AI 影片生成系統的底層架構中，普遍採用了擴散模型（Diffusion Model）與 Transformer 互相結合的黃金拍檔設計。請問在影片生成的協同分工中，Transformer 模組最主要承擔的角色職責為何？", "option_a": "時序控場導演（引導語意順序與維持跨幀動態一致性）", "option_b": "像素繪圖工人（負責逐一去除隨機高斯雜訊生成細節）", "option_c": "音訊合成助手（即時生成與畫面動作同步的環境音效）", "option_d": "影片串流編碼器（將生成的像素壓縮為高清晰度檔案）", "correct_option": "A", "explanation": "看到「影片生成黃金拍檔、Transformer 角色分工」 ➔ 秒選 「時序控場導演、維持跨幀動態一致性」\n\n電影劇組的「總導演」與「特效美工」：\nDiffusion 是「畫圖工人」：\n\n  - 專門負責在每一張單幀畫面上，從純雜訊中一筆筆去噪，雕琢出超高畫質的細節紋理。\nTransformer 是「控場總導演」：\n\n  - 負責站在旁邊看著劇本（文字提示詞），指揮前後 60 秒的每一幀畫面在時間維度上保持連貫，確保第 1 秒的人走到第 5 秒衣服不會變色、鏡頭運鏡不會瘋狂閃爍跳幀！\n\n✅ (A) 為什麼對：在現代影片架構中，Transformer 扮演引導模組與時序控制器，負責跨幀的語意對齊與時間前後一致性。\n❌ (B) 為什麼錯：負責逐幀去噪畫圖的像素工人是擴散模型（Diffusion），非 Transformer。\n❌ (C) 為什麼錯：影片生成核心模型不直接生成伴奏音效。\n❌ (D) 為什麼錯：串流編碼屬於後端渲染編碼器格式轉換。", "has_caveat": 0, "caveat_note": null}, {"id": 674, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "2025 年初在全球人工智慧社群掀起巨大轟動的開源黑馬模型「DeepSeek-R1」（由深度求索 DeepSeek 研發），憑藉創新的大規模強化學習與開源架構，在程式設計、高難度數學競賽與深度推理任務上展現出足以媲美頂級閉源推理模型的實力，同時大幅降低了企業本地私有化部署的成本門檻。請問 DeepSeek-R1 之所以具備卓越推理能力的核心特色為何？", "option_a": "結合光學字元辨識（專精處理古籍文獻掃描檔案）", "option_b": "採用純卷積神經網路（在手機端達成毫秒級離線推理）", "option_c": "內建硬體光線追蹤核心（加速三維虛擬場景實時渲染）", "option_d": "大規模強化學習與長思維鏈（自主反思與深度演繹推理）", "correct_option": "D", "explanation": "看到「DeepSeek-R1、卓越推理能力、核心特色」 ➔ 秒選 「大規模強化學習與長思維鏈（自我反思推演）」\n\n開源推理解題王「深度反思的解題大師」：\n普通對話模型：\n\n  - 像個搶答選手，看到題目馬上接話，遇到複雜邏輯題很容易中途翻車。\nDeepSeek-R1 的特色：\n\n  - 引入純強化學習（RL）驅動的深度推理機制。\n\n  - 在輸出最終答案前，會在內心進行長達數千字的长思維鏈（Long CoT）演繹，自主審視：「等等，我剛才這個公式好像代錯了，讓我重算一次...」，具備強大的自我反思與逐步推演能力！\n\n❌ (A) 為什麼錯：古籍文字掃描辨識屬於傳統 OCR 鑑別領域。\n❌ (B) 為什麼錯：DeepSeek-R1 是基於 Transformer 與 MoE 架構的大型模型，非純 CNN。\n❌ (C) 為什麼錯：光線追蹤屬於 GPU 圖形渲染硬體架構技術。\n✅ (D) 為什麼對：DeepSeek-R1 核心競爭力在於透過大規模強化學習激發模型的深度長思維鏈推理與自主反思驗證機制。", "has_caveat": 0, "caveat_note": null}, {"id": 675, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國運動品牌的全球行銷設計團隊希望引進生成式 AI 輔助製作年度廣告視覺海報與產品包裝，但法務部門嚴格規定：所使用的 AI 生圖工具在模型訓練階段所使用的資料集，必須具備完全合法的版權授權，絕不可使用未授權的網路抓取圖片，以確保產出素材商用無法律訴訟爭議。在此嚴苛的商業合規要求下，設計團隊首選的圖像生成平台為何者？", "option_a": "Midjourney（Midjourney 獨立實驗室）", "option_b": "Adobe Firefly（Adobe 公司）", "option_c": "Leonardo.Ai（Leonardo 互動公司）", "option_d": "Stable Diffusion 1.5（Stability AI 開源社群）", "correct_option": "B", "explanation": "看到「合法版權授權訓練集、商業商用安全無爭議」 ➔ 秒選 「Adobe Firefly」\n\n商業設計師的「免死金牌」生圖庫：\n一般開源或網路生圖工具的版權隱患：\n\n  - 許多生圖模型抓取了網路上數億張未經授權的攝影作品或插畫，企業如果直接印在商品上販售，隨時可能吃上侵害著作權的集體訴訟。\nAdobe Firefly 的商業保證：\n\n  - Adobe 承諾所有訓練資料 100% 來自合法授權的 Adobe Stock 圖庫以及版權已過期的公有領域素材。\n\n  - 甚至向企業用戶提供版權侵權賠償擔保，是跨國企業商用設計最安心的選擇！\n\n❌ (A) 為什麼錯：Midjourney 畫面極美，但因抓取網路公開圖片訓練，正面臨多起藝術家集體版權訴訟。\n✅ (B) 為什麼對：Adobe Firefly 主打商業版權安全，專門使用合法授權的 Adobe Stock 素材進行訓練，免除商用侵權疑慮。\n❌ (C) 為什麼錯：Leonardo.Ai 擅長遊戲美術微調，但基礎模型來源多樣。\n❌ (D) 為什麼錯：早期 Stable Diffusion 訓練自 LAION 網路抓取資料集，存在版權爭議。", "has_caveat": 0, "caveat_note": null}, {"id": 676, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某金控公司在準備將數百萬筆過往客服對話紀錄提供給內部大語言模型進行專業領域微調訓練前，資安與法務長要求執行一項標準資安防護作業：利用演算法自動偵測並將所有對話中的客戶姓名、身分證字號、信用卡卡號及聯絡地址全部遮蔽替換為隨機代碼或通用標籤（例如將「王大明」替換為「[客戶 A]」）。請問這項確保個人資料無法直接關聯至特定自然人的隱私保護措施稱作什麼？", "option_a": "零信任架構（動態驗證每位員工權限）", "option_b": "雙因素驗證（結合密碼與簡訊驗證碼）", "option_c": "資料去識別化（匿名化或假名化遮蔽個人特徵）", "option_d": "社交工程防禦（防範釣魚郵件誘騙帳號）", "correct_option": "C", "explanation": "看到「遮蔽姓名身分證、替換代碼、防止關聯至特定自然人」 ➔ 秒選 「資料去識別化（匿名化 / 假名化）」\n\n個資保密的「塗黑戴面具」魔法：\n敏感資料的洩密危機：\n\n  - 如果把包含真實姓名、身分證與病歷的原始資料直接拿去訓練 AI，模型在被提問時很可能會「說溜嘴」，直接吐出某人的隱私資料。\n去識別化（De-identification）措施：\n\n  - 在資料進爐訓練前，先把所有可辨識出「這具體是誰」的特徵欄位塗黑（匿名化）或換上假名牌代號（假名化）。\n\n  - 既保留了對話中的語意文法資訊供 AI 學習，又徹底斬斷了與特定個人的身分連結！\n\n❌ (A) 為什麼錯：零信任架構是「永不信任、始終驗證」的網路存取控制模型。\n❌ (B) 為什麼錯：雙因素驗證是登入帳號時的雙重身分認證手段。\n✅ (C) 為什麼對：資料去識別化（De-identification）涵蓋匿名化與假名化，是隱私保護的核心技術。\n❌ (D) 為什麼錯：社交工程防禦旨在防範釣魚信件等欺詐攻擊。", "has_caveat": 0, "caveat_note": null}, {"id": 677, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某自然語言處理團隊在建置英文醫學文獻檢索系統的前處理流水線時，針對單字標準化（Word Normalization）方案進行技術評估。資深工程師指出：方案甲透過啟發式規則直接切除單字後綴字尾（例如將 `meeting` 截斷為 `meet`，但可能將 `studies` 粗暴截斷為非字典單字的 `studi`）；方案乙則結合詞性標註與語彙字典，精確地將單字還原為正規的原始詞典原型（例如將 `went` 還原為 `go`、將 `better` 還原為 `good`）。請問方案乙所採用的技術名稱為何？", "option_a": "詞形還原（Lemmatization）", "option_b": "詞幹提取（Stemming）", "option_c": "斷詞標記（Tokenization）", "option_d": "停用詞移除（Stop Words Removal）", "correct_option": "A", "explanation": "看到「查字典還原原型、考慮詞性、went 變 go、非暴力截斷」 ➔ 秒選 「詞形還原（Lemmatization）」\n\n單字減肥的「菜刀切尾」vs「字典查本尊」：\n方案甲：詞幹提取（Stemming）：\n\n  - 像拿一把菜刀，看到 `ing`、`ed`、`ies` 就照死板規則一刀砍掉。\n\n  - 速度很快，但容易把 `studies` 剁成四不像的 `studi`，不符合文法。\n方案乙：詞形還原（Lemmatization）：\n\n  - 像一位戴著眼鏡的專業英文老師，認真翻閱字典並看前後文詞性。\n\n  - 看到 `went` 會查出本尊是 `go`，看到 `better` 會查出本尊是 `good`，還原成最道地的詞典原型！\n\n✅ (A) 為什麼對：詞形還原（Lemmatization）依據字典與詞性分析將單字還原為真正的字典原型（Lemma）。\n❌ (B) 為什麼錯：詞幹提取（Stemming）是方案甲採用的直接硬砍字尾演算法（如 Porter Stemmer）。\n❌ (C) 為什麼錯：斷詞標記（Tokenization）是將長句子拆切成單字標記。\n❌ (D) 為什麼錯：停用詞移除是過濾 a, an, the, is 等高頻虛詞。", "has_caveat": 0, "caveat_note": null}, {"id": 678, "source": "題庫13", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在深度學習與大語言模型（LLM）的學術與實務發展歷程中，研究人員與評測專家發現，要真正顯著提升生成式 AI 在複雜語境下的生成品質、邏輯表達流暢度與應對跨領域任務的綜合表現，其最核心、最決定性的改進關鍵在於下列何者？", "option_a": "大幅刪減訓練語料（僅保留特定單一領域之純文字資料）", "option_b": "固定模型解碼溫度（將所有隨機採樣參數永久鎖定為零）", "option_c": "僅追求神經網路層數（無限制堆疊參數量忽視資料品質）", "option_d": "擴展多樣化語言模式（在訓練中吸收豐富的句構與語義表達）", "correct_option": "D", "explanation": "看到「LLM 改善生成品質真正關鍵、提升多樣性」 ➔ 秒選 「擴展多樣化的語言模式和結構」\n\n大文豪修煉的「讀萬卷書」心法：\n死背與偏科的代價：\n\n  - 如果一個人只看同一份八股公文，就算記憶力再強，寫出來的文章也千篇一律、僵硬無比。\n模型蛻變的真正關鍵：\n\n  - 要想讓大語言模型出口成章、兼具邏輯推演與跨領域創意，關鍵在於讓它在預訓練中吸收「多樣化的語言模式與知識結構」（涵蓋代碼、散文、哲學、跨語言與數學論述）。\n\n  - 廣泛而優質的語言結構是模型舉一反三、產生湧現（Emergence）能力的核心養分！\n\n❌ (A) 為什麼錯：大幅刪減語料會使模型視野狹隘，喪失通用跨領域理解力。\n❌ (B) 為什麼錯：將溫度固定為零會扼殺生成內容的豐富度與多樣性。\n❌ (C) 為什麼錯：單純盲目堆疊參數量而忽視資料結構，無法本質提升邏輯泛化能力。\n✅ (D) 為什麼對：擴展多樣化的語言模式和結構，使模型能夠學習豐富的語義組合與推論模式，是提升生成品質與能力的真正決定性關鍵。", "has_caveat": 0, "caveat_note": null}];

const currentIdEl = document.getElementById('currentId');
const questionTextEl = document.getElementById('questionText');
const optionsBoxEl = document.getElementById('optionsBox');
const resultBoxEl = document.getElementById('resultBox');
const resultBannerEl = document.getElementById('resultBanner');
const explanationTextEl = document.getElementById('explanationText');
const caveatTextEl = document.getElementById('caveatText');
const nextBtn = document.getElementById('nextBtn');
const backToSetupBtn = document.getElementById('backToSetupBtn');

const summaryAccuracyEl = document.getElementById('summaryAccuracy');
const summaryTotalEl = document.getElementById('summaryTotal');
const summaryCorrectEl = document.getElementById('summaryCorrect');
const summaryWrongEl = document.getElementById('summaryWrong');
const restartSameBtn = document.getElementById('restartSameBtn');
const backSetupFromSummaryBtn = document.getElementById('backSetupFromSummaryBtn');
const reviewListEl = document.getElementById('reviewList');

let queue = [];
let qIndex = 0;
let answered = 0;
let correctCount = 0;
let currentQ = null;
let currentShuffledOptions = null; // [{letter, text, isCorrect}]
let wrongList = [];
const DISPLAY_LETTERS = ['A', 'B', 'C', 'D']; // [{source, topic, id, question, yourAnswer, correctLetter, correctText, explanation, has_caveat, caveat_note}]

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildSourceCheckboxes() {
  const sources = [...new Set(QUESTIONS.map(q => q.source))].sort();
  sourceGridEl.innerHTML = sources.map(s => {
    const count = QUESTIONS.filter(q => q.source === s).length;
    const topics = [...new Set(QUESTIONS.filter(q => q.source === s).map(q => q.topic))].join('、');
    return `<label class="chk">
      <input type="checkbox" class="srcChk" value="${s}">
      ${s}（${count}題・${topics}）
    </label>`;
  }).join('');
  sourceGridEl.querySelectorAll('.srcChk').forEach(cb => cb.addEventListener('change', updatePoolCount));
}

function getSelectedSources() {
  return [...sourceGridEl.querySelectorAll('.srcChk:checked')].map(cb => cb.value);
}

function currentFilteredSet() {
  const selected = getSelectedSources();
  const excludeCaveat = excludeCaveatEl.checked;
  return QUESTIONS.filter(q => {
    if (!selected.includes(q.source)) return false;
    if (excludeCaveat && q.has_caveat) return false;
    return true;
  });
}

function getEffectiveCount(poolSize) {
  if (!limitEnabledEl.checked) return poolSize;
  const n = parseInt(limitCountEl.value, 10);
  if (!n || n < 1) return poolSize;
  return Math.min(n, poolSize);
}

function updatePoolCount() {
  const size = currentFilteredSet().length;
  poolCountEl.textContent = size;
  limitCountEl.max = size || 1;
  effectiveCountEl.textContent = getEffectiveCount(size);
  startBtn.disabled = size === 0;
}

function startQuiz() {
  const pool = currentFilteredSet();
  if (pool.length === 0) {
    alert('目前設定下沒有題目，請至少選一個來源。');
    return;
  }
  const effectiveCount = getEffectiveCount(pool.length);
  queue = shuffleArray(pool).slice(0, effectiveCount);
  qIndex = 0;
  answered = 0;
  correctCount = 0;
  wrongList = [];
  setupScreen.classList.add('hidden');
  summaryScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  showQuestion();
}

function updateProgressUI() {
  progressText.textContent = (qIndex) + ' / ' + queue.length;
  progressBar.style.width = (queue.length ? (qIndex / queue.length * 100) : 0) + '%';
  correctCountEl.textContent = correctCount;
  accuracyEl.textContent = answered ? Math.round(correctCount / answered * 100) + '%' : '0%';
}

function showQuestion() {
  if (qIndex >= queue.length) {
    showSummary();
    return;
  }
  window.scrollTo(0, 0);
  resultBoxEl.classList.add('hidden');
  nextBtn.disabled = true;
  currentQ = queue[qIndex];
  updateProgressUI();

  currentSourceEl.textContent = currentQ.source;
  currentTopicEl.textContent = currentQ.topic;
  currentIdEl.textContent = '第 ' + currentQ.id + ' 題';
  questionTextEl.textContent = currentQ.question;

  const rawOptions = [
    { letter: 'A', text: currentQ.option_a, isCorrect: currentQ.correct_option === 'A' },
    { letter: 'B', text: currentQ.option_b, isCorrect: currentQ.correct_option === 'B' },
    { letter: 'C', text: currentQ.option_c, isCorrect: currentQ.correct_option === 'C' },
    { letter: 'D', text: currentQ.option_d, isCorrect: currentQ.correct_option === 'D' },
  ];
  currentShuffledOptions = randomizeOptionsEl.checked ? shuffleArray(rawOptions) : rawOptions;

  optionsBoxEl.innerHTML = '';
  currentShuffledOptions.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="letter">${DISPLAY_LETTERS[i]}</span><span>${opt.text}</span>`;
    btn.addEventListener('click', () => selectAnswer(i, btn));
    optionsBoxEl.appendChild(btn);
  });
}

function selectAnswer(pickedIndex, btnEl) {
  const allBtns = optionsBoxEl.querySelectorAll('.option');
  allBtns.forEach(b => b.disabled = true);

  const picked = currentShuffledOptions[pickedIndex];
  const isCorrect = picked.isCorrect;
  const correctIndex = currentShuffledOptions.findIndex(o => o.isCorrect);
  const correctDisplayLetter = DISPLAY_LETTERS[correctIndex];
  answered++;
  if (isCorrect) {
    correctCount++;
  } else {
    const correctOpt = currentShuffledOptions[correctIndex];
    wrongList.push({
      source: currentQ.source,
      topic: currentQ.topic,
      id: currentQ.id,
      question: currentQ.question,
      yourAnswer: picked.text,
      correctLetter: correctDisplayLetter,
      correctText: correctOpt.text,
      explanation: currentQ.explanation,
      has_caveat: currentQ.has_caveat,
      caveat_note: currentQ.caveat_note,
    });
  }

  allBtns.forEach((b, i) => {
    if (currentShuffledOptions[i].isCorrect) b.classList.add('correct');
    else if (i === pickedIndex) b.classList.add('wrong');
  });

  resultBannerEl.textContent = isCorrect ? '✓ 答對了！' : ('✗ 答錯了，正確答案是 ' + correctDisplayLetter);
  resultBannerEl.className = 'result-banner ' + (isCorrect ? 'correct' : 'wrong');
  explanationTextEl.textContent = '解析：' + currentQ.explanation;

  if (currentQ.has_caveat && currentQ.caveat_note) {
    caveatTextEl.classList.remove('hidden');
    caveatTextEl.textContent = '⚠️ 爭議備註：' + currentQ.caveat_note;
  } else {
    caveatTextEl.classList.add('hidden');
  }

  resultBoxEl.classList.remove('hidden');
  nextBtn.disabled = false;
  qIndex++;
  updateProgressUI();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderReviewList() {
  if (wrongList.length === 0) {
    reviewListEl.innerHTML = '<div class="no-wrong">太厲害了，這次沒有答錯的題目！</div>';
    return;
  }
  reviewListEl.innerHTML = wrongList.map(w => `
    <div class="review-item">
      <div class="meta">
        <span class="tag">${escapeHtml(w.source)}</span>
        <span class="tag">${escapeHtml(w.topic)}</span>
        <span>第 ${w.id} 題</span>
      </div>
      <div class="question">${escapeHtml(w.question)}</div>
      <div class="review-line">你的答案：<span class="your-ans">${escapeHtml(w.yourAnswer)}</span></div>
      <div class="review-line">正確答案：<span class="correct-ans">${w.correctLetter}. ${escapeHtml(w.correctText)}</span></div>
      <div class="review-explanation">解析：${escapeHtml(w.explanation)}</div>
      ${w.has_caveat && w.caveat_note ? `<div class="caveat" style="margin-top:8px;">⚠️ 爭議備註：${escapeHtml(w.caveat_note)}</div>` : ''}
    </div>
  `).join('');
}

function showSummary() {
  quizScreen.classList.add('hidden');
  summaryScreen.classList.remove('hidden');
  summaryTotalEl.textContent = answered;
  summaryCorrectEl.textContent = correctCount;
  summaryWrongEl.textContent = answered - correctCount;
  summaryAccuracyEl.textContent = answered ? Math.round(correctCount / answered * 100) + '%' : '0%';
  renderReviewList();
}

nextBtn.addEventListener('click', showQuestion);
startBtn.addEventListener('click', startQuiz);
backToSetupBtn.addEventListener('click', showSummary);
restartSameBtn.addEventListener('click', startQuiz);
backSetupFromSummaryBtn.addEventListener('click', () => {
  summaryScreen.classList.add('hidden');
  setupScreen.classList.remove('hidden');
  updatePoolCount();
});
excludeCaveatEl.addEventListener('change', updatePoolCount);
limitEnabledEl.addEventListener('change', () => {
  limitCountEl.disabled = !limitEnabledEl.checked;
  updatePoolCount();
});
limitCountEl.addEventListener('input', updatePoolCount);

// 字體大小調整：以 rem 為基準縮放整頁文字，設定記在瀏覽器本機
const FONT_STEPS = [85, 100, 115, 130, 150, 175];
const FONT_KEY = 'quizFontScale';
const fontValEl = document.getElementById('fontVal');
const fontDownBtn = document.getElementById('fontDownBtn');
const fontUpBtn = document.getElementById('fontUpBtn');
let fontStep = 1;
try {
  const saved = FONT_STEPS.indexOf(parseInt(localStorage.getItem(FONT_KEY), 10));
  if (saved >= 0) fontStep = saved;
} catch (e) {}
function applyFont() {
  const pct = FONT_STEPS[fontStep];
  document.documentElement.style.fontSize = (16 * pct / 100) + 'px';
  fontValEl.textContent = pct + '%';
  fontDownBtn.disabled = fontStep === 0;
  fontUpBtn.disabled = fontStep === FONT_STEPS.length - 1;
  try { localStorage.setItem(FONT_KEY, pct); } catch (e) {}
}
fontDownBtn.addEventListener('click', () => { if (fontStep > 0) { fontStep--; applyFont(); } });
fontUpBtn.addEventListener('click', () => { if (fontStep < FONT_STEPS.length - 1) { fontStep++; applyFont(); } });
applyFont();

totalAllEl.textContent = QUESTIONS.length;
buildSourceCheckboxes();
updatePoolCount();
</script>
</body>
</html>
