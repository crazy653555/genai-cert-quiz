隱藏訓練方式", "option_c": "排除使用者回饋", "option_d": "避免開源模型", "correct_option": "A", "explanation": "可解釋性強調讓使用者理解模型如何得出結論。", "has_caveat": 0, "caveat_note": null}, {"id": 146, "source": "題庫06", "topic": "倫理與法律", "question": "AI產出內容的法律歸屬爭議主要涉及？", "option_a": "財產稅問題", "option_b": "圖像處理技術", "option_c": "智慧財產權", "option_d": "生態永續", "correct_option": "C", "explanation": "AI產出內容涉及著作權歸屬，是IP法的重要爭議之一。", "has_caveat": 0, "caveat_note": null}, {"id": 147, "source": "題庫07", "topic": "綜合", "question": "生成式對抗網路 (Generative Adversarial Network, GAN) 的局限性為何？", "option_a": "生成器和鑑別器的訓練不穩定", "option_b": "需要大量的訓練資料", "option_c": "生成的資料缺乏多樣性", "option_d": "無法生成高品質的資料", "correct_option": "A", "explanation": "GAN 由生成器與鑑別器對抗訓練，兩者需達到平衡，訓練過程容易不穩定（如模式崩潰），是其公認的主要局限性。", "has_caveat": 0, "caveat_note": null}, {"id": 148, "source": "題庫07", "topic": "綜合", "question": "以下哪一種做法不利於提高AI生成內容的透明度？", "option_a": "公開模型架構", "option_b": "展示訓練資料", "option_c": "隱藏模型決策", "option_d": "解釋模型輸出", "correct_option": "C", "explanation": "透明度要求公開模型架構、訓練資料來源與決策邏輯，隱藏決策過程與透明度原則相違背。", "has_caveat": 0, "caveat_note": null}, {"id": 149, "source": "題庫07", "topic": "綜合", "question": "資料品質低落所造成的影響，何者為非？", "option_a": "降低資料分析產生的價值", "option_b": "可能引導決策者做出錯誤的判斷", "option_c": "造成大量且重複的作業", "option_d": "產出品質穩定的內容", "correct_option": "D", "explanation": "資料品質低落會降低分析價值、導致錯誤判斷、增加重工，不會產出品質穩定的內容，故此選項為非。", "has_caveat": 0, "caveat_note": null}, {"id": 150, "source": "題庫07", "topic": "綜合", "question": "ChatGPT-4o是OpenAI最新推出的什麼類型的AI模型？", "option_a": "文字生成模型", "option_b": "多模態模型 (文字、音訊、影片)", "option_c": "圖片生成模型", "option_d": "語音模型", "correct_option": "B", "explanation": "GPT-4o 為 OpenAI 的旗艦多模態模型，可整合文字、語音、影像輸入輸出。", "has_caveat": 1, "caveat_note": "GPT-4o 的 \"o\" 意指 omni，可同時處理文字、語音、影像（含視覺），選項描述方向正確但未列出「圖像」，屬於四選項中最貼切者。"}, {"id": 151, "source": "題庫07", "topic": "綜合", "question": "試圖理解所提供的資料結構和特徵，創造新資料，請問是指哪種人工智慧的技術？", "option_a": "監督式學習", "option_b": "圖形辨識", "option_c": "決策AI", "option_d": "生成式對抗網路 (Generative Adversarial Network, GAN)", "correct_option": "D", "explanation": "GAN 透過生成器學習資料分布特徵並生成近似真實資料的新樣本。", "has_caveat": 1, "caveat_note": "題幹描述（理解資料結構特徵、創造新資料）較泛指生成式模型／深度生成技術的共通特性，並非 GAN 獨有；但四個選項中僅 GAN 符合「生成新資料」此一核心特徵，故列為正確答案。"}, {"id": 152, "source": "題庫07", "topic": "綜合", "question": "以下哪一個不是Prompt技術的一種？", "option_a": "思維樹 (Tree of Thoughts, ToT)", "option_b": "思路鏈提示 (Chain-of-Thought Prompting)", "option_c": "檢索增強生成 (Retrieval-Augmented Generation, RAG)", "option_d": "物聯網 (Internet of Things, IoT)", "correct_option": "D", "explanation": "IoT 是硬體裝置連網技術，與 Prompt（提示）工程技術無關；其餘三者皆為提示技巧/生成強化方法。", "has_caveat": 0, "caveat_note": null}, {"id": 153, "source": "題庫07", "topic": "綜合", "question": "AI文字生成工具在學術寫作領域有以下何項道德上的隱憂？", "option_a": "AI工具觸及更多元學習者的潛力", "option_b": "無意中抄襲現有學術作品的風險", "option_c": "行政工作自動化並減少工作量", "option_d": "提供使用者個人化的學習體驗", "correct_option": "B", "explanation": "AI生成文字可能與既有文獻高度相似卻未標註來源，構成學術倫理上的抄襲風險。", "has_caveat": 0, "caveat_note": null}, {"id": 154, "source": "題庫07", "topic": "綜合", "question": "在教育領域中，AI可以透過分析學生的行為和表現來做什麼？", "option_a": "提供個人化的學習建議", "option_b": "判斷學生的品德特質", "option_c": "預測學生未來職業", "option_d": "代替教師進行課程教學", "correct_option": "A", "explanation": "AI分析學習數據可針對個別學生弱點與進度提供客製化建議，其餘選項超出現行技術合理應用範圍。", "has_caveat": 0, "caveat_note": null}, {"id": 155, "source": "題庫07", "topic": "綜合", "question": "下列何者是生成式人工智慧音樂創作的網站或服務？", "option_a": "Gamma", "option_b": "Canva", "option_c": "Leonardo AI", "option_d": "Suno AI", "correct_option": "D", "explanation": "Suno AI 為生成式AI音樂創作服務；Gamma為簡報生成、Canva為設計工具、Leonardo AI為圖像生成工具。", "has_caveat": 0, "caveat_note": null}, {"id": 156, "source": "題庫07", "topic": "綜合", "question": "優化Prompt的原則之一為「重點性」，請問何為「重點性」？", "option_a": "高階或特定領域用詞", "option_b": "寬泛且複合多種概念的提問", "option_c": "盡量使用英文縮寫", "option_d": "具備明確的目的", "correct_option": "D", "explanation": "依標示答案，重點性指提問時應具備明確目的，避免模糊發散的描述。", "has_caveat": 1, "caveat_note": "「重點性」一般定義較偏向「聚焦單一具體重點、避免模糊寬泛」，與選項B（寬泛且複合多種概念）互為反義更直接對應；「具備明確的目的」語意上較接近另一項常見原則（目的性/清晰性）。此處依畫面標示答案存檔，但答案與題意的對應關係較弱。"}, {"id": 157, "source": "題庫07", "topic": "綜合", "question": "AI生成內容對企業商業模式可提供的服務是什麼？", "option_a": "提高辦公室物理安全性", "option_b": "自動化精準財務審計", "option_c": "產出市場行銷文案", "option_d": "減少產品的物理缺陷", "correct_option": "C", "explanation": "生成式AI常見企業應用之一即為自動化產出行銷文案等內容，其餘選項非其核心能力。", "has_caveat": 0, "caveat_note": null}, {"id": 158, "source": "題庫07", "topic": "綜合", "question": "下列者是生成式AI在市場行銷的應用？", "option_a": "進行醫學研究", "option_b": "自動生成廣告文案", "option_c": "分析天氣資料", "option_d": "設計建築結構", "correct_option": "B", "explanation": "生成式AI於行銷領域常用於自動產製廣告文案、素材等內容。", "has_caveat": 0, "caveat_note": null}, {"id": 159, "source": "題庫07", "topic": "綜合", "question": "循環神經網路 (RNN) 的英文全名是什麼？", "option_a": "Recursive Neural Network", "option_b": "Recurrent Neural Network", "option_c": "Resourceful Neural Network", "option_d": "Reinvent Neural Network", "correct_option": "B", "explanation": "RNN 全名為 Recurrent Neural Network，為處理序列資料的神經網路架構。", "has_caveat": 0, "caveat_note": null}, {"id": 160, "source": "題庫07", "topic": "綜合", "question": "圖片生成中的「overfitting」是指什麼？", "option_a": "模型在訓練資料上表現良好，但在測試資料上表現差", "option_b": "反覆調整模型在測試資料上表現良好，但在訓練資料上表現差", "option_c": "模型對所有資料表現良好", "option_d": "模型無法收斂", "correct_option": "A", "explanation": "Overfitting（過擬合）標準定義為模型過度擬合訓練資料的細節與雜訊，導致在未見過的測試資料上泛化能力差。", "has_caveat": 0, "caveat_note": null}, {"id": 161, "source": "題庫07", "topic": "綜合", "question": "AI生成內容會面臨的道德問題是？", "option_a": "潛在的偏見和歧視", "option_b": "資料大量增加問題", "option_c": "演算法選擇和優化問題", "option_d": "硬體需求和能源消耗問題", "correct_option": "A", "explanation": "訓練資料中的偏見可能被AI模型放大並反映在生成內容中，是最核心的道德爭議之一；其餘選項屬技術/工程問題而非道德問題。", "has_caveat": 0, "caveat_note": null}, {"id": 162, "source": "題庫07", "topic": "綜合", "question": "在 Tree-of-Thought 方法中，哪一項不是其特點？", "option_a": "有助於分解複雜問題", "option_b": "促進逐步思考", "option_c": "僅依賴單一步驟解答", "option_d": "提高解決問題的準確性", "correct_option": "C", "explanation": "Tree-of-Thought 的核心特點是探索多條推理路徑並逐步展開，而非僅依賴單一步驟解答。", "has_caveat": 0, "caveat_note": null}, {"id": 163, "source": "題庫07", "topic": "綜合", "question": "根據歐盟《一般資料保護條例》(General Data Protection Regulation, GDPR)，如果AI生成內容涉及大規模監控和處理個人資料，哪一項是資料控制者應該遵循的最佳做法？", "option_a": "完全依賴AI進行自動化決策", "option_b": "僅在使用者提出異議時進行人工干預", "option_c": "進行資料保護影響評估 (Data Protection Impact Assessments, DPIA) 並採取必要的保護措施", "option_d": "僅在監管機構要求時進行資料審查", "correct_option": "C", "explanation": "GDPR 規定高風險處理（如大規模監控）應事先進行DPIA並採取相應保護措施，屬於主動合規義務，非被動等待異議或監管要求。", "has_caveat": 0, "caveat_note": null}, {"id": 164, "source": "題庫07", "topic": "綜合", "question": "調整參數在圖像生成中的作用是什麼？", "option_a": "添加文字到圖像之中", "option_b": "確保生成圖像符合特定風格或效果", "option_c": "更改工具的介面", "option_d": "提高生成圖像的分辨率", "correct_option": "B", "explanation": "圖像生成模型的參數（如引導強度、取樣步數等）主要用於控制生成結果的風格與效果，而非直接決定介面或單純提高解析度。", "has_caveat": 0, "caveat_note": null}, {"id": 165, "source": "題庫07", "topic": "綜合", "question": "哪一項是人工智慧倫理的重要目標？", "option_a": "增加企業利潤", "option_b": "提升使用者黏性", "option_c": "減輕社會不平等", "option_d": "優化技術性能", "correct_option": "C", "explanation": "AI倫理核心關注公平性與社會影響，減輕社會不平等是其重要目標；其餘選項屬商業或技術目標，非倫理目標。", "has_caveat": 0, "caveat_note": null}, {"id": 166, "source": "題庫07", "topic": "綜合", "question": "根據歐盟《一般資料保護規範》(General Data Protection Regulation, GDPR)，個人資料在處理過程中應該具備哪項特性？", "option_a": "透明度和可追溯性", "option_b": "任意性和自由共享", "option_c": "單一性和集中存儲", "option_d": "完全公開和無限制", "correct_option": "A", "explanation": "GDPR 要求個人資料處理具備透明度並可追溯其處理歷程，以保障當事人權益。", "has_caveat": 0, "caveat_note": null}, {"id": 167, "source": "題庫07", "topic": "綜合", "question": "在商業領域中運用AI生成內容提供即時的線上客戶服務，使得企業能夠更好地滿足客戶的需求，此背後訓練基礎為大型語言模型 (Large Language Model, LLM)，請問下列何為大型語言模型的特性？", "option_a": "專門用於視覺辨識和影像處理", "option_b": "能同時處理語言數據及視覺辨識", "option_c": "需要人工指導才能完成訓練", "option_d": "能夠處理龐大的語言數據並生成自然流暢的文本", "correct_option": "D", "explanation": "LLM 的核心特性是透過大規模語言數據訓練，生成自然流暢的文本。", "has_caveat": 0, "caveat_note": null}, {"id": 168, "source": "題庫07", "topic": "綜合", "question": "在Prompt中使用自然語言指令比直接代碼指令有何優勢？", "option_a": "增加生成的創造性", "option_b": "提高生成文字的長度", "option_c": "減少生成運算時間", "option_d": "更易於理解和調整", "correct_option": "D", "explanation": "自然語言指令對使用者而言更直觀，便於理解與反覆調整，不需具備程式撰寫能力。", "has_caveat": 0, "caveat_note": null}, {"id": 169, "source": "題庫07", "topic": "綜合", "question": "在使用AI生成內容工具生成內容之前，哪一項是資料前處理的關鍵步驟？", "option_a": "部署生成器", "option_b": "訓練機器學習模型", "option_c": "發布生成內容", "option_d": "收集高品質的原始資料", "correct_option": "D", "explanation": "資料前處理的起點是收集高品質原始資料，其品質直接影響後續模型訓練與生成結果。", "has_caveat": 0, "caveat_note": null}, {"id": 170, "source": "題庫07", "topic": "綜合", "question": "企業使用數據分析可以提前預測哪些變化？", "option_a": "技術變化", "option_b": "市場變化", "option_c": "自然變化", "option_d": "文化變化", "correct_option": "B", "explanation": "數據分析常用於預測市場趨勢與需求變化，協助企業提前因應。", "has_caveat": 0, "caveat_note": null}, {"id": 171, "source": "題庫07", "topic": "綜合", "question": "下列何者不屬於AI生成內容倫理問題的可能風險？", "option_a": "資訊安全疑慮", "option_b": "就業市場大規模擾動", "option_c": "資料隱私侵犯", "option_d": "管理架構日益完善", "correct_option": "D", "explanation": "管理架構完善屬正面治理成果，而非倫理風險；其餘三項皆為AI生成內容常被提及的倫理疑慮。", "has_caveat": 0, "caveat_note": null}, {"id": 172, "source": "題庫07", "topic": "綜合", "question": "在AI生成內容中，當一個模型在訓練資料上表現良好，但在測試資料上表現不佳時，往往是由於過度擬合 (Overfitting) 造成的。在模型的學習完成狀態下，且不提前終止訓練的情況下，以下哪個方法最能幫助降低模型的過度擬合？", "option_a": "減少模型的學習率", "option_b": "增加解決適定性問題或過適的技術", "option_c": "減少訓練資料的數據量", "option_d": "增加模型的複雜度", "correct_option": "B", "explanation": "抑制過擬合常見作法包含正則化、增加訓練資料、簡化模型等；減少資料量與增加複雜度皆會使過擬合惡化。", "has_caveat": 1, "caveat_note": "選項B文字疑似螢幕截圖重建時翻譯/斷句不順（原意應接近「增加正則化（regularization）等抑制過擬合的技術」），文字本身較拗口，但方向正確：減少資料量與增加模型複雜度皆會惡化過擬合，故可排除；此為四選項中唯一正確方向。"}, {"id": 173, "source": "題庫07", "topic": "綜合", "question": "使用AI生成資料視覺化，並根據反饋和新技術，應該怎麼做？", "option_a": "增加圖表顏色", "option_b": "持續改進視覺化工具和方法", "option_c": "避免使用者反饋", "option_d": "增加資料來源", "correct_option": "B", "explanation": "應依據使用者反饋與新技術持續迭代改進視覺化工具與方法，而非單純增加顏色或資料來源。", "has_caveat": 0, "caveat_note": null}, {"id": 174, "source": "題庫07", "topic": "綜合", "question": "聊天機器人的數據傳輸過程中使用什麼技術保護安全？", "option_a": "簡單傳輸", "option_b": "數據加密", "option_c": "開放訪問", "option_d": "簡單備份", "correct_option": "B", "explanation": "數據加密是保護傳輸過程中資料安全的標準技術，防止數據被竊取或竄改。", "has_caveat": 0, "caveat_note": null}, {"id": 175, "source": "題庫07", "topic": "綜合", "question": "在AI生成內容的過程中，為了防止資料洩露，企業應該實施哪一種安全策略？", "option_a": "定期進行安全審計和漏洞掃描", "option_b": "僅在問題發生後修補漏洞", "option_c": "完全依賴第三方安全公司", "option_d": "忽視安全更新", "correct_option": "A", "explanation": "主動定期進行安全審計與漏洞掃描屬於預防性資安策略，優於被動修補或忽視安全更新。", "has_caveat": 0, "caveat_note": null}, {"id": 176, "source": "題庫07", "topic": "綜合", "question": "在生成式AI聲音生成技術中，哪一個步驟將文本分解成語音單位？", "option_a": "語音波形生成", "option_b": "語音合成", "option_c": "聲音波形生成", "option_d": "文本分析", "correct_option": "D", "explanation": "文本分析（含文本正規化、音素切分）是語音合成流程的前置步驟，負責將文本分解成語音單位，再交由後續步驟合成波形。", "has_caveat": 0, "caveat_note": null}, {"id": 177, "source": "題庫07", "topic": "綜合", "question": "當AI模型生成錯誤或不相關的內容時，應該怎麼做？", "option_a": "增加生成內容的長度", "option_b": "增加Prompt的長度", "option_c": "調整Prompt使其更具體和清晰", "option_d": "使用高溫度參數 (Temperature) 設置", "correct_option": "C", "explanation": "將Prompt調整得更具體清晰可降低模型生成錯誤或離題內容的機率；提高溫度參數反而會增加隨機性與離題風險。", "has_caveat": 0, "caveat_note": null}, {"id": 178, "source": "題庫07", "topic": "綜合", "question": "關於使用ChatGPT時，「Prompt」指的為下列何者？", "option_a": "ChatGPT介面的顏色方案", "option_b": "給ChatGPT的命令，以開始對話", "option_c": "一種會員付費制度", "option_d": "請求翻譯語言", "correct_option": "B", "explanation": "Prompt 即使用者輸入給模型、用以引導對話或生成內容的指令文字。", "has_caveat": 0, "caveat_note": null}, {"id": 179, "source": "題庫07", "topic": "綜合", "question": "利用生成式AI撰寫自家產品描述時，最能幫助下列哪一項工作？", "option_a": "生成精確的技術規格", "option_b": "撰寫引人注目的產品特點", "option_c": "確保產品描述符合所有法律規範", "option_d": "直接與客戶進行互動", "correct_option": "B", "explanation": "生成式AI擅長產出具吸引力的行銷文字，但無法保證技術規格精確性或法律合規性，也不能直接與客戶互動。", "has_caveat": 0, "caveat_note": null}, {"id": 180, "source": "題庫07", "topic": "綜合", "question": "AI生成內容的運作過程中，模型架構的選擇對什麼有影響？", "option_a": "影響生成內容的品質及速度", "option_b": "影響模型的訓練資料", "option_c": "影響模型的超參數調整", "option_d": "影響模型的優化器選擇", "correct_option": "A", "explanation": "模型架構直接決定生成內容的品質表現與推論速度，是選擇架構時最直接的考量。", "has_caveat": 0, "caveat_note": null}, {"id": 181, "source": "題庫07", "topic": "綜合", "question": "在AI生成內容的最新應用中，哪個領域正在快速發展以生成逼真的語音和聲音內容？", "option_a": "區塊鏈", "option_b": "語音合成技術", "option_c": "電腦視覺", "option_d": "資料壓縮", "correct_option": "B", "explanation": "語音合成（含文字轉語音、聲音克隆）為近年生成式AI快速發展、用以生成逼真語音內容的領域。", "has_caveat": 0, "caveat_note": null}, {"id": 182, "source": "題庫07", "topic": "綜合", "question": "哪一種AI生成內容工具可以用來自動生成測驗和練習題來評估學生的學習進度？", "option_a": "音樂播放器", "option_b": "語音辨識軟體", "option_c": "自動測驗生成器", "option_d": "社群媒體平臺", "correct_option": "C", "explanation": "自動測驗生成器可依課程內容自動產生測驗與練習題，用於評估學習進度。", "has_caveat": 0, "caveat_note": null}, {"id": 183, "source": "題庫07", "topic": "綜合", "question": "下列何者是生成高品質文字著稱的語言模型？", "option_a": "GPT", "option_b": "Notion AI", "option_c": "Python", "option_d": "Sora", "correct_option": "A", "explanation": "GPT 是以生成高品質自然語言文字著稱的語言模型；Notion AI 為應用層產品、Python 為程式語言、Sora 為影片生成模型。", "has_caveat": 0, "caveat_note": null}, {"id": 187, "source": "題庫07", "topic": "綜合", "question": "優化Prompt的技巧之一是提供「視覺化輔助」，請問何者非「視覺化輔助」？", "option_a": "流程圖", "option_b": "長條圖", "option_c": "階層圖", "option_d": "樞紐分析", "correct_option": "D", "explanation": "流程圖、長條圖、階層圖皆為視覺化呈現形式；樞紐分析是資料整理/分析方法，不屬於視覺化輔助本身。", "has_caveat": 0, "caveat_note": null}, {"id": 189, "source": "題庫07", "topic": "綜合", "question": "在生成式AI領域中，常用於處理歌聲合成或音樂序列生成，且具備處理「長期依賴關係」能力的深度學習模型是？", "option_a": "光學字元識別 (Optical Character Recognition, OCR)", "option_b": "深度信念網路 (Deep Belief Network, DBN)", "option_c": "長短期記憶模型 (Long Short-Term Memory, LSTM)", "option_d": "卷積神經網路 (CNN)", "correct_option": "C", "explanation": "LSTM 是RNN的改良架構，能有效處理序列資料中的長期依賴關係，常用於歌聲合成、音樂序列生成等任務。", "has_caveat": 0, "caveat_note": null}, {"id": 190, "source": "題庫07", "topic": "綜合", "question": "哪種自主學習方法利用AI生成內容技術來自動生成個人化學習計劃？", "option_a": "傳統教學法", "option_b": "標準化測試", "option_c": "自適應學習系統", "option_d": "訓練營", "correct_option": "C", "explanation": "自適應學習系統會根據學習者表現動態調整內容與進度，可結合AI生成技術產出個人化學習計劃。", "has_caveat": 0, "caveat_note": null}, {"id": 192, "source": "題庫07", "topic": "綜合", "question": "若要使用AI技術協助批改學生的作業和考試，可以使用下列哪一項技術？", "option_a": "製作機器人", "option_b": "文字辨識與分類", "option_c": "雷達掃描", "option_d": "聲紋辨識", "correct_option": "B", "explanation": "批改文字作業與試卷需仰賴文字辨識（OCR）與內容分類技術判斷作答內容與正確性。", "has_caveat": 0, "caveat_note": null}, {"id": 193, "source": "題庫07", "topic": "綜合", "question": "ChatGPT系列模型由下列哪個機構開發？", "option_a": "Google", "option_b": "Meta", "option_c": "Microsoft", "option_d": "OpenAI", "correct_option": "D", "explanation": "ChatGPT 系列模型由 OpenAI 開發。", "has_caveat": 0, "caveat_note": null}, {"id": 194, "source": "題庫07", "topic": "綜合", "question": "在AI生成內容領域，使用生成式對抗網路 (Generative Adversarial Network, GAN) 生成新圖片時，鑑別器的主要功能是？", "option_a": "增加圖片亮度", "option_b": "調整圖片風格", "option_c": "辨識生成的圖片是否逼真", "option_d": "增強圖片解析度", "correct_option": "C", "explanation": "鑑別器負責判斷生成器產出的圖片是真實資料還是生成資料，驅動生成器持續改進逼真度。", "has_caveat": 1, "caveat_note": "與第203題同樣考「GAN鑑別器的主要功能」，選項組與情境描述不同（本題限定於圖片生成情境），經使用者確認兩題皆保留為獨立題目。"}, {"id": 195, "source": "題庫07", "topic": "綜合", "question": "AI生成內容在簡報生成中的最大挑戰之一是？", "option_a": "資料安全", "option_b": "生成速度", "option_c": "頁面美觀性", "option_d": "內容準確性", "correct_option": "D", "explanation": "AI生成簡報內容時，確保資訊正確無誤是最大挑戰之一，避免產出錯誤或過時的資訊。", "has_caveat": 0, "caveat_note": null}, {"id": 196, "source": "題庫07", "topic": "綜合", "question": "資料治理 (Data Governance) 的主要目的，以下何者正確？", "option_a": "保證資料的可靠性、品質、完整度與安全性等", "option_b": "增加資料的數量與規模", "option_c": "限制人們對於資料的使用與分析", "option_d": "降低資料的公開性與透明性", "correct_option": "A", "explanation": "資料治理的核心目的是確保資料在生命週期中可靠、優質、完整且安全，而非單純增加資料量或限制存取。", "has_caveat": 0, "caveat_note": null}, {"id": 197, "source": "題庫07", "topic": "綜合", "question": "在利用人工智慧生成內容時，必須遵守相關國際法規，以美國《健康保險可攜性和責任法案》(Health Insurance Portability and Accountability Act, HIPAA) 為例，該法案對於健康資料的處理有特定要求，在處理健康相關資料時，應該採取哪些關鍵措施？", "option_a": "未經授權將患者資料公開", "option_b": "使用加密技術保護患者資料", "option_c": "將所有資料保存於紙質檔案", "option_d": "僅在非商業用途時保護資料", "correct_option": "B", "explanation": "HIPAA 要求對受保護健康資訊（PHI）採取適當的技術性保護措施，加密是常見且關鍵的作法。", "has_caveat": 0, "caveat_note": null}, {"id": 198, "source": "題庫07", "topic": "綜合", "question": "大語言模型 (Large Language Model, LLM) 在確定性技術路徑中，表現改進的關鍵是什麼？", "option_a": "增加模型參數", "option_b": "提高運算能力", "option_c": "擴展多樣化的語言模式和結構", "option_d": "減少訓練資料量", "correct_option": "C", "explanation": "依標示答案，LLM 表現改進的關鍵在於擴展多樣化的語言模式與結構，而非單純堆疊參數或運算力。", "has_caveat": 0, "caveat_note": null}, {"id": 199, "source": "題庫07", "topic": "綜合", "question": "以下何者不是AI生成內容可能對藝術創作產生的影響？", "option_a": "創作自動化", "option_b": "模糊原創界線", "option_c": "促進跨界創新", "option_d": "提高創作利潤", "correct_option": "D", "explanation": "創作自動化、模糊原創界線、促進跨界創新都是AI生成內容對藝術創作常被討論的實際影響；提高創作利潤並非其直接或必然的影響。", "has_caveat": 0, "caveat_note": null}, {"id": 200, "source": "題庫07", "topic": "綜合", "question": "以下哪個是生成式AI的常見應用，並受益於提示工程 (Prompt Engineering)？", "option_a": "試算表計算", "option_b": "郵件管理", "option_c": "內容生成", "option_d": "硬體故障排除", "correct_option": "C", "explanation": "內容生成是生成式AI的核心應用場景，透過提示工程可有效引導生成結果的品質與方向。", "has_caveat": 0, "caveat_note": null}, {"id": 201, "source": "題庫07", "topic": "綜合", "question": "當使用生成式AI進行文字生成時，哪種操作有助於提升內容的相關性？", "option_a": "使用具體的關鍵詞", "option_b": "使用隨機數據", "option_c": "分享影音連結", "option_d": "減少輸入內容", "correct_option": "A", "explanation": "提供具體明確的關鍵詞能讓模型更精準掌握需求，提升生成內容與主題的相關性。", "has_caveat": 0, "caveat_note": null}, {"id": 202, "source": "題庫07", "topic": "綜合", "question": "生成式AI繪圖的「向量化」過程指的是？", "option_a": "將生成的圖片轉換為向量圖形", "option_b": "將文字轉換為向量模型以生成圖片", "option_c": "使用向量運算加速運算過程", "option_d": "將文字轉換為圖片像素直接生成圖片", "correct_option": "B", "explanation": "文字生圖流程中，文字會先被編碼（向量化）為語意向量，再透過模型依此向量生成對應圖片。", "has_caveat": 0, "caveat_note": null}, {"id": 203, "source": "題庫07", "topic": "綜合", "question": "請問在生成式對抗網路 (Generative Adversarial Network, GAN) 中，鑑別器 (Discriminator) 的主要功能為下列何者？", "option_a": "判斷資料的真偽", "option_b": "生成新的資料", "option_c": "訓練鑑別器", "option_d": "儲存樣本資料", "correct_option": "A", "explanation": "鑑別器的核心任務是判斷輸入資料是真實樣本還是生成器產出的假資料。", "has_caveat": 1, "caveat_note": "與第194題同樣考「GAN鑑別器的主要功能」，選項組與題幹情境不同，經使用者確認兩題皆保留為獨立題目。"}, {"id": 204, "source": "題庫07", "topic": "綜合", "question": "在使用AI文字生成工具進行教材製作時，應該注意的事項不包含下列何者？", "option_a": "內容是否符合目前時空背景", "option_b": "翻譯自不同國家教材的文化脈絡", "option_c": "教材來源是否有著作權問題", "option_d": "印製教材的成本花費", "correct_option": "D", "explanation": "印製成本屬於行政/預算考量，與AI生成教材內容的品質、時效性、文化脈絡、著作權等議題無直接關係。", "has_caveat": 0, "caveat_note": null}, {"id": 205, "source": "題庫07", "topic": "綜合", "question": "以下何者不屬於AI生成內容可能面臨的倫理道德挑戰？", "option_a": "資料隱私", "option_b": "公平正義", "option_c": "責任歸因", "option_d": "食品安全", "correct_option": "D", "explanation": "食品安全與AI生成內容的倫理道德議題無直接關聯；資料隱私、公平正義、責任歸因皆為常見AI倫理議題。", "has_caveat": 0, "caveat_note": null}, {"id": 206, "source": "題庫07", "topic": "綜合", "question": "假設你開了一家飲料店，數據分析能幫助你做什麼？", "option_a": "增加員工數量", "option_b": "分析飲料銷售數據", "option_c": "縮小店面面積", "option_d": "變更店名", "correct_option": "B", "explanation": "數據分析可協助店家掌握銷售趨勢、熱門品項等資訊，進而輔助經營決策；其餘選項與數據分析的直接效益無關。", "has_caveat": 1, "caveat_note": "選項C、D原始畫面文字排版重疊、斷句不清，依合理推測重建為「縮小店面面積」「變更店名」兩個獨立選項，不影響正確答案判斷。"}, {"id": 207, "source": "題庫07", "topic": "綜合", "question": "下列何者非金融領域應用生成式AI能獲得的效果？", "option_a": "生成個人化分析報告", "option_b": "更快速進行市場分析與預測", "option_c": "針對個人需求提供投資研究與建議", "option_d": "提供無風險但高報酬的投資建議", "correct_option": "D", "explanation": "投資必然伴隨風險，「無風險但高報酬」並不存在，屬不切實際的描述，非生成式AI應用金融領域可實際獲得的效果。", "has_caveat": 1, "caveat_note": "原始題幹「下列**何時**非...」疑似打字或辨識錯誤，已校正為「下列**何者**非...」。"}, {"id": 208, "source": "題庫07", "topic": "綜合", "question": "AI生成內容在簡報生成中的應用，可以幫助使用者實現什麼？", "option_a": "快速數據分析", "option_b": "自動內容審核", "option_c": "高效的內容生成", "option_d": "網路安全保障", "correct_option": "C", "explanation": "AI生成內容應用於簡報生成，核心價值在於提升內容產出的效率。", "has_caveat": 0, "caveat_note": null}, {"id": 209, "source": "題庫07", "topic": "綜合", "question": "為什麼在使用Prompt時需要確保其合理性？", "option_a": "增加生成的正確性", "option_b": "減少生成時間", "option_c": "提高硬體性能", "option_d": "降低耗能", "correct_option": "A", "explanation": "合理且清晰的Prompt能引導模型產出更符合需求、更正確的結果。", "has_caveat": 0, "caveat_note": null}, {"id": 211, "source": "題庫07", "topic": "綜合", "question": "下列哪一項不是生成式AI在數據分析中的挑戰？", "option_a": "資料隱私和安全問題", "option_b": "高度的運算資源需求", "option_c": "自動化資料清洗", "option_d": "模型的可解釋性", "correct_option": "C", "explanation": "自動化資料清洗屬於生成式AI可協助達成的效益/工具能力，而非其在數據分析中面臨的挑戰；其餘三項皆為常見挑戰。", "has_caveat": 0, "caveat_note": null}, {"id": 212, "source": "題庫07", "topic": "綜合", "question": "以下何者不是AI生成內容可能對教育產生的衝擊？", "option_a": "改變教學模式", "option_b": "促進個人化學習", "option_c": "提高師生比例", "option_d": "降低學習成本", "correct_option": "C", "explanation": "提高師生比例與AI生成內容的教育應用無直接因果關係；改變教學模式、促進個人化學習、降低學習成本皆為常被討論的實際衝擊。", "has_caveat": 0, "caveat_note": null}, {"id": 213, "source": "題庫07", "topic": "綜合", "question": "在學習生成式AI模型在文字生成方面常見的「幻覺」現象是指什麼？", "option_a": "生成虛構的資訊", "option_b": "無法生成連貫的文字", "option_c": "訓練過程中斷", "option_d": "無法理解多語言", "correct_option": "A", "explanation": "「幻覺」(Hallucination) 指模型生成看似合理但實際上虛構、不實或無根據的資訊。", "has_caveat": 0, "caveat_note": null}, {"id": 214, "source": "題庫07", "topic": "綜合", "question": "相較於傳統的判別式AI，生成式AI在追求更高層次的創意生成與邏輯推演時，面臨的主要資料挑戰為何？", "option_a": "資料特徵選擇過多", "option_b": "模型容易產生過度擬合", "option_c": "缺乏具備豐富邏輯性與準確性的標記數據", "option_d": "資料標籤的二元分類不夠精確", "correct_option": "C", "explanation": "生成式AI要產出具創意與邏輯性的內容，高度仰賴具備豐富邏輯性與準確性的標記資料，這類資料相對稀缺，是主要挑戰之一。", "has_caveat": 0, "caveat_note": null}, {"id": 216, "source": "題庫07", "topic": "綜合", "question": "當使用AI生成內容涉及到人物肖像時，以下哪一項是合法且合適的做法？", "option_a": "獲得肖像權人的同意", "option_b": "任意使用網路上找到的照片", "option_c": "只要不盈利就可自由使用", "option_d": "在使用後通知肖像權人", "correct_option": "A", "explanation": "使用他人肖像須事先取得當事人同意，未經同意任意使用、以不盈利為由自由使用、或事後才通知，皆不符合肖像權保護的基本原則。", "has_caveat": 0, "caveat_note": null}, {"id": 217, "source": "題庫07", "topic": "綜合", "question": "下列何者非生成式AI基本核心技術？", "option_a": "自然語言處理 (Natural Language Processing, NLP)", "option_b": "機器學習 (Machine Learning, ML)", "option_c": "深度學習 (Deep Learning)", "option_d": "擴增實境 (Augmented Reality, AR)", "correct_option": "D", "explanation": "AR為沉浸式顯示技術，與生成式AI的核心技術（NLP、ML、深度學習）性質不同。", "has_caveat": 0, "caveat_note": null}, {"id": 218, "source": "題庫07", "topic": "綜合", "question": "使用AI生成簡報時，應該採取甚麼措施確保其符合視覺設計原則？", "option_a": "使用固定模板", "option_b": "使用隨機配色", "option_c": "合理運用字體、顏色和佈局", "option_d": "自動生成文字", "correct_option": "C", "explanation": "視覺設計原則的核心在於字體、顏色與佈局的合理搭配，而非固定模板或隨機配色。", "has_caveat": 0, "caveat_note": null}, {"id": 219, "source": "題庫07", "topic": "綜合", "question": "下列哪一項不是提升Prompt的方法？", "option_a": "提供具體清晰的指示", "option_b": "使用範例進行迭代", "option_c": "聘請專業的Prompt工程師", "option_d": "訓練更大的AI模型", "correct_option": "D", "explanation": "訓練更大的模型屬於模型本身的改進，不屬於Prompt撰寫/優化的方法；其餘三項皆為提升Prompt品質的常見做法。", "has_caveat": 0, "caveat_note": null}, {"id": 220, "source": "題庫07", "topic": "綜合", "question": "使用AI生成為了確保視覺化過程的透明度，應該公開哪個方面？", "option_a": "圖表的大小", "option_b": "資料來源和方法", "option_c": "圖表的顏色", "option_d": "圖表的格式", "correct_option": "B", "explanation": "視覺化透明度的核心在於讓使用者能理解資料從何而來、如何處理，而非圖表的外觀呈現細節。", "has_caveat": 0, "caveat_note": null}, {"id": 221, "source": "題庫07", "topic": "綜合", "question": "下列何者為生成式對抗網路 (Generative Adversarial Network, GAN) 的核心概念？", "option_a": "兩個網路互相競爭", "option_b": "多個網路協同工作", "option_c": "單個網路自我學習", "option_d": "網路與人類互動學習", "correct_option": "A", "explanation": "GAN 的核心概念即生成器與鑑別器兩個網路互相對抗競爭，驅動生成品質不斷提升。", "has_caveat": 0, "caveat_note": null}, {"id": 222, "source": "題庫07", "topic": "綜合", "question": "為了確保AI模型的準確性和可靠性，應該怎麼做？", "option_a": "使用隨機訓練資料", "option_b": "使用高品質的訓練資料", "option_c": "使用固定訓練資料", "option_d": "使用單一訓練資料源", "correct_option": "B", "explanation": "訓練資料的品質直接影響模型表現，高品質資料是確保模型準確性與可靠性的基礎。", "has_caveat": 0, "caveat_note": null}, {"id": 223, "source": "題庫07", "topic": "綜合", "question": "為降低AI生成內容系統對社會的風險，下列哪一項措施最不重要？", "option_a": "提高系統的運算能力", "option_b": "完善相關的法律法規", "option_c": "加強對系統開發者的培訓", "option_d": "限制系統在關鍵領域的應用", "correct_option": "A", "explanation": "提高運算能力屬於效能面向，與降低社會風險（法規、培訓、應用限制）無直接關聯，故為最不重要的措施。", "has_caveat": 0, "caveat_note": null}, {"id": 224, "source": "題庫07", "topic": "綜合", "question": "生成式AI中，文字生成技術的核心原理是什麼？", "option_a": "機器學習", "option_b": "自然語言處理", "option_c": "自回歸分析", "option_d": "深度學習", "correct_option": "B", "explanation": "依標示答案，文字生成技術的核心原理歸類於自然語言處理領域。", "has_caveat": 0, "caveat_note": null}, {"id": 225, "source": "題庫07", "topic": "綜合", "question": "在商業應用中，AI生成內容生成的簡報主要用於實現以下哪一項目標？", "option_a": "執行複雜的科學實驗", "option_b": "生成可操作的商業洞察和決策支持的圖表展示", "option_c": "控制機器人的運動行為", "option_d": "提供即時客戶服務", "correct_option": "B", "explanation": "商業應用中AI生成簡報的核心價值在於協助呈現可操作的商業洞察與決策支持資訊。", "has_caveat": 0, "caveat_note": null}, {"id": 226, "source": "題庫07", "topic": "綜合", "question": "AI生成內容除了用於創作內容之外，還可以用於什麼任務？", "option_a": "精準預測股市", "option_b": "自動駕駛飛機", "option_c": "代替醫生做手術", "option_d": "自動回答問題和提供訊息", "correct_option": "D", "explanation": "自動回答問題與提供訊息（如客服、問答系統）是AI生成內容除創作外的常見應用；精準預測股市、自動駕駛飛機、代替醫生做手術皆超出其合理應用範圍。", "has_caveat": 0, "caveat_note": null}, {"id": 228, "source": "題庫07", "topic": "綜合", "question": "生成式AI的應用範圍不包括以下何者？", "option_a": "學術研究", "option_b": "商業行銷", "option_c": "真實情感體驗", "option_d": "醫療保健", "correct_option": "C", "explanation": "AI生成內容可應用於學術研究、商業行銷、醫療保健等領域，但AI不具備真實情感，無法提供「真實情感體驗」。", "has_caveat": 0, "caveat_note": null}, {"id": 229, "source": "題庫07", "topic": "綜合", "question": "以下選項中，何者為可能為AI影片生成技術的商業潛力？", "option_a": "辦公室自動化", "option_b": "遊戲開發", "option_c": "智能合約", "option_d": "數據分析", "correct_option": "B", "explanation": "AI影片生成技術可用於遊戲開發中的動畫、過場畫面等內容產製，為較直接相關的商業應用方向。", "has_caveat": 0, "caveat_note": null}, {"id": 231, "source": "題庫07", "topic": "綜合", "question": "Canva的哪個功能可以幫助簡報排版更優美？", "option_a": "配色工具", "option_b": "套用智慧模板", "option_c": "字體樣式選擇", "option_d": "圖像編輯工具", "correct_option": "B", "explanation": "Canva 的智慧模板功能可快速套用經過設計的排版，幫助簡報整體更美觀一致。", "has_caveat": 0, "caveat_note": null}, {"id": 233, "source": "題庫07", "topic": "綜合", "question": "使用AI生成簡報時，哪種技術可幫助自動摘要文字？", "option_a": "強化學習 (Reinforcement learning, RL)", "option_b": "自然語言處理 (Natural Language Processing, NLP)", "option_c": "圖片辨識", "option_d": "語音辨識", "correct_option": "B", "explanation": "自動摘要文字需理解語意並萃取重點，屬於自然語言處理的核心任務。", "has_caveat": 0, "caveat_note": null}, {"id": 234, "source": "題庫07", "topic": "綜合", "question": "在使用生成式AI製作簡報時，最能確保內容的正確性的方法是？", "option_a": "相信AI生成的所有內容", "option_b": "只使用AI生成的內容而不做任何修改", "option_c": "使用多個來源交叉檢驗資訊", "option_d": "依賴AI內建的資料庫和知識庫", "correct_option": "C", "explanation": "AI生成內容可能含有錯誤或過時資訊，透過多來源交叉查證是確保正確性的有效方法。", "has_caveat": 0, "caveat_note": null}, {"id": 235, "source": "題庫07", "topic": "綜合", "question": "下列哪個是用於處理自然語言的AI生成內容模型？", "option_a": "ResNet (Residual Neural Network)", "option_b": "ChatGPT-4", "option_c": "VGG-16", "option_d": "YOLO (You only live once)", "correct_option": "B", "explanation": "ResNet、VGG-16、YOLO 皆為電腦視覺（影像辨識/偵測）模型；ChatGPT-4 為處理自然語言的生成式模型。", "has_caveat": 0, "caveat_note": null}, {"id": 236, "source": "題庫07", "topic": "綜合", "question": "下列哪一項最恰當地描述生成式AI繪圖工具的工作原理？", "option_a": "使用大型語言模型從圖片資料庫中學習，將文字轉為向量繪圖", "option_b": "使用深度學習技術直接根據文字生成圖片像素", "option_c": "透過人工智慧模擬人類的手動繪圖過程", "option_d": "直接從現有圖片進行風格轉移生成新圖片", "correct_option": "B", "explanation": "生成式AI繪圖工具（如Diffusion模型）透過深度學習技術，依文字描述逐步生成對應的圖片內容。", "has_caveat": 0, "caveat_note": null}, {"id": 237, "source": "題庫07", "topic": "綜合", "question": "在生成特定風格的文字(如詩歌)時，最適合使用哪種技術？", "option_a": "卷積神經網路 (Convolutional Neural Network, CNN)", "option_b": "生成式對抗網路 (Generative Adversarial Network, GAN)", "option_c": "循環神經網路 (Recurrent neural network, RNN)", "option_d": "支援向量機 (Support Vector Machine, SVM)", "correct_option": "C", "explanation": "RNN 擅長處理序列資料，適合用於具有韻律、順序結構的文字生成（如詩歌）；CNN多用於影像、SVM為傳統分類器，皆非文字序列生成的典型選擇。", "has_caveat": 0, "caveat_note": null}, {"id": 239, "source": "題庫07", "topic": "綜合", "question": "歐盟《可信任AI倫理準則》的三大核心要素中，以下哪一項不包含在內？", "option_a": "合法性", "option_b": "倫理性", "option_c": "穩健性", "option_d": "實用性", "correct_option": "D", "explanation": "歐盟《可信任AI倫理準則》的三大核心要素為合法性、倫理性、穩健性；實用性不在其中。", "has_caveat": 0, "caveat_note": null}, {"id": 241, "source": "題庫07", "topic": "綜合", "question": "以下哪一項措施有助於防止AI生成內容中的資料洩露？", "option_a": "使用開放網路傳輸資料", "option_b": "定期更新和修補安全漏洞", "option_c": "允許所有員工存取所有資料", "option_d": "忽略安全警告", "correct_option": "B", "explanation": "定期更新系統並修補已知安全漏洞，是防止資料被入侵竊取的基本且關鍵的資安措施。", "has_caveat": 1, "caveat_note": "與第175題同樣考「防止資料洩露的安全策略」，選項組不同（本題聚焦「定期更新修補漏洞」，第175題聚焦「定期安全審計掃描」），經使用者確認兩題皆保留為獨立題目。"}, {"id": 242, "source": "題庫07", "topic": "綜合", "question": "下列何種框架不常用於深度學習圖片生成？", "option_a": "TensorFlow", "option_b": "PyTorch", "option_c": "Keras", "option_d": "Excel", "correct_option": "D", "explanation": "TensorFlow、PyTorch、Keras 皆為深度學習框架；Excel為試算表軟體，不具備深度學習模型訓練能力。", "has_caveat": 0, "caveat_note": null}, {"id": 243, "source": "題庫07", "topic": "綜合", "question": "生成式AI能夠模仿特定人的聲音，應用於語音導航、電子書朗讀等場合，並且在法律合規的前提下，用於數位繼承和娛樂產業。請問上述是指下列何者？", "option_a": "音樂生成", "option_b": "語音翻譯", "option_c": "語音助手", "option_d": "語音克隆", "correct_option": "D", "explanation": "語音克隆技術可模仿特定人聲音並應用於朗讀、數位繼承、娛樂產業等場景，與語音助手（通用語音互動）、語音翻譯（跨語言轉換）性質不同。", "has_caveat": 0, "caveat_note": null}, {"id": 244, "source": "題庫07", "topic": "綜合", "question": "哪個AI生成內容工具可以用來自動生成多語言學習資料以促進語言學習？", "option_a": "翻譯軟體", "option_b": "圖片處理軟體", "option_c": "網頁瀏覽器", "option_d": "音樂播放器", "correct_option": "A", "explanation": "翻譯軟體可將學習資料轉換為多種語言版本，直接促進多語言學習。", "has_caveat": 0, "caveat_note": null}, {"id": 245, "source": "題庫07", "topic": "綜合", "question": "資料分類和標籤貼附以區分不同類型，這是哪種人工智慧技術？", "option_a": "決策式AI", "option_b": "生成式AI", "option_c": "決策式BI", "option_d": "生成式BI", "correct_option": "A", "explanation": "資料分類與標籤貼附屬於判斷/分類任務，對應決策式AI（Discriminative AI）；生成式AI的核心任務是產生新內容，而非分類既有資料。", "has_caveat": 0, "caveat_note": null}, {"id": 246, "source": "題庫07", "topic": "綜合", "question": "何者是無效的Prompt？", "option_a": "你還記得三天前我跟你提到的問題嗎？", "option_b": "上次我問了一個關於健康減肥的問題，關於這個問題我還想進一步了解", "option_c": "我想了解牛頓萬有引力定律的基本原理", "option_d": "你能解釋一下達爾文的理論基礎嗎？", "correct_option": "A", "explanation": "多數對話式AI模型不具跨對話/跨session的長期記憶，直接要求模型「記得三天前的問題」卻未提供具體內容，屬於無效、無法被正確執行的Prompt。", "has_caveat": 0, "caveat_note": null}, {"id": 247, "source": "題庫08", "topic": "綜合", "question": "AI生成內容可能涉及的法律風險包括以下哪一項？", "option_a": "用電量大", "option_b": "系統過載", "option_c": "誹謗與中傷", "option_d": "硬碟空間不足", "correct_option": "C", "explanation": "AI生成內容可能捏造不實陳述損及他人名譽，構成誹謗與中傷等法律風險；其餘選項屬技術或資源問題，非法律風險。", "has_caveat": 0, "caveat_note": null}, {"id": 248, "source": "題庫08", "topic": "綜合", "question": "在使用AI生成內容進行資料視覺化時，哪個步驟可以確保資料乾淨、無錯誤？", "option_a": "資料傳輸", "option_b": "資料清洗", "option_c": "資料存儲", "option_d": "資料備份", "correct_option": "B", "explanation": "資料清洗負責處理缺漏值、重複值、格式錯誤與異常值，是確保資料乾淨無誤的步驟。", "has_caveat": 0, "caveat_note": null}, {"id": 249, "source": "題庫08", "topic": "綜合", "question": "AI圖片生成工具在醫療圖片上有何應用？", "option_a": "透過AI所生成的醫療圖片提高診斷準確性", "option_b": "基於患者資料發展個人化治療計畫", "option_c": "利用量子運算加速圖片處理速度", "option_d": "自動化醫療機構的行政作業", "correct_option": "A", "explanation": "AI圖片生成可產生合成醫療影像以補足稀有病例資料，訓練出更準確的診斷模型；B屬資料分析、C與圖片生成無關、D屬行政自動化。", "has_caveat": 1, "caveat_note": "實務上AI生成的醫療影像主要用於擴增訓練資料（合成資料），間接提升診斷模型的準確性，而非直接以生成圖片做診斷；但四選項中僅A與「圖片生成」相關，故為最佳答案。"}, {"id": 250, "source": "題庫08", "topic": "綜合", "question": "下列何者是生成式AI的特色？", "option_a": "無法客製化", "option_b": "多領域應用", "option_c": "不斷退步", "option_d": "無法提供創意和靈感", "correct_option": "B", "explanation": "生成式AI可應用於文字、圖像、音訊、程式碼等多種領域；其餘選項皆與其特性相反。", "has_caveat": 0, "caveat_note": null}, {"id": 251, "source": "題庫08", "topic": "綜合", "question": "當生成式 AI 的結果不符合預期時，應採取何種策略來改進？", "option_a": "更換AI模型", "option_b": "修改或優化Prompt", "option_c": "增加硬體設備", "option_d": "改變作業系統", "correct_option": "B", "explanation": "結果不符預期時，最直接有效的做法是調整Prompt使指令更明確具體；硬體與作業系統不影響生成內容品質。", "has_caveat": 0, "caveat_note": null}, {"id": 252, "source": "題庫08", "topic": "綜合", "question": "根據歐盟可信賴人工智慧倫理準則，下列何者最能體現「公平性」的要求？", "option_a": "一個AI系統對所有群體的決策結果都存在偏差", "option_b": "一款AI系統的決策過程充分考慮了不同群體的利益", "option_c": "一項AI法規對特定群體的權益保護做出規範", "option_d": "一家公司在AI系統開發中歧視了某些少數群體", "correct_option": "B", "explanation": "公平性要求AI系統避免偏見與歧視，決策時平等考量不同群體的利益；A、D違反公平性，C僅針對特定群體且屬法規層面。", "has_caveat": 0, "caveat_note": null}, {"id": 253, "source": "題庫08", "topic": "綜合", "question": "在圖片生成中，StyleGAN最初由哪家公司開發？", "option_a": "Meta", "option_b": "NVIDIA", "option_c": "Apple", "option_d": "OpenAI", "correct_option": "B", "explanation": "StyleGAN 由 NVIDIA 研究團隊於2018年提出，以生成高擬真人臉圖像聞名。", "has_caveat": 0, "caveat_note": null}, {"id": 254, "source": "題庫08", "topic": "綜合", "question": "若要創建一個網頁版的踩地雷遊戲，應選擇哪個Prompt？", "option_a": "請幫我解釋一下這段程式碼", "option_b": "請幫我撰寫一個網頁版的踩地雷遊戲", "option_c": "請幫我優化這段程式碼", "option_d": "請幫我翻譯這段程式碼", "correct_option": "B", "explanation": "目標是「創建」新遊戲，Prompt應明確要求撰寫程式；其餘選項皆針對既有程式碼進行解釋、優化或翻譯。", "has_caveat": 0, "caveat_note": null}, {"id": 255, "source": "題庫08", "topic": "綜合", "question": "在涉及未成年人資料的AI生成內容時，各國法律都有相關規範，根據美國《兒童線上隱私保護法》(Children's Online Privacy Protection Act, COPPA)，企業應做什麼以遵守法律？", "option_a": "完全禁止收集未成年人資料", "option_b": "獲得家長的明確同意並提供刪除資料的選擇", "option_c": "僅在非營利專案中使用未成年人資料", "option_d": "向政府報備未成年人資料的使用情況", "correct_option": "B", "explanation": "COPPA 規定收集13歲以下兒童個人資料前須取得家長可驗證的同意，並讓家長可查閱、刪除其子女資料。", "has_caveat": 0, "caveat_note": null}, {"id": 256, "source": "題庫08", "topic": "綜合", "question": "在生成式AI生成文本時，什麼是「多模態學習」？", "option_a": "使用多個語言模型", "option_b": "結合多種數據類型進行學習", "option_c": "增加文本長度", "option_d": "減少生成時間", "correct_option": "B", "explanation": "多模態學習指同時結合文字、圖像、音訊等多種類型（模態）的資料進行學習，而非使用多個語言模型。", "has_caveat": 0, "caveat_note": null}, {"id": 257, "source": "題庫08", "topic": "綜合", "question": "請問不同的大語言模型 (Large Language Model, LLM) 是如何影響AI生成內容技術？", "option_a": "提供更多的訓練資料", "option_b": "提升生成內容的多樣性和品質", "option_c": "減少運算資源的需求", "option_d": "加速模型訓練速度", "correct_option": "B", "explanation": "不同LLM各有架構與訓練特色，推動生成內容在多樣性與品質上的提升；LLM本身不「提供」訓練資料，且通常需要更多運算資源。", "has_caveat": 0, "caveat_note": null}, {"id": 258, "source": "題庫08", "topic": "綜合", "question": "AI圖片生成工具的應用，不包含下列何者？", "option_a": "服裝設計", "option_b": "石油和天然氣勘探", "option_c": "協助醫療診斷", "option_d": "分析資料生成趨勢預測圖", "correct_option": "B", "explanation": "服裝設計、醫療影像輔助、圖表生成皆可運用AI圖片生成；石油和天然氣勘探屬地質探測領域，非圖片生成工具的應用。", "has_caveat": 1, "caveat_note": "選項D「分析資料生成趨勢預測圖」較偏向資料分析/視覺化，嚴格而言也不算典型的圖片生成工具應用；但石油和天然氣勘探與圖片生成的關聯最遠，依題目標示答案存檔。"}, {"id": 259, "source": "題庫08", "topic": "綜合", "question": "何者是良好且有相關的Prompt？", "option_a": "告訴我有關宇宙的所有事情", "option_b": "我想要知道月蝕的最新消息", "option_c": "請解釋什麼是月蝕，以及他們如何形成", "option_d": "請示意什麼是月蝕，以及會影響的事情", "correct_option": "C", "explanation": "C的指令明確（解釋）、主題聚焦（月蝕的定義與成因）；A過於廣泛，B要求最新消息超出模型知識範圍，D用詞「示意」模糊且範圍發散。", "has_caveat": 0, "caveat_note": null}];

const resultBoxEl = document.getElementById('resultBox');
const resultBannerEl = document.getElementById('resultBanner');
const explanationTextEl = document.getElementById('explanationText');
const caveatTextEl = document.getElementById('caveatText');
const nextBtn = document.getElementById('nextBtn');
const backToSetupBtn = document.getElementById('backToSetupBtn');

const summaryAccuracyEl = document.getElementById('summaryAccuracy');
const summaryTotalEl = document.getElementById('summaryTotal');
const summaryCorrectEl = document.getElementById('summaryCorrect');
const summaryWrongEl = document.getElementById('summaryWrong');
const restartSameBtn = document.getElementById('restartSameBtn');
const backSetupFromSummaryBtn = document.getElementById('backSetupFromSummaryBtn');
const reviewListEl = document.getElementById('reviewList');

let queue = [];
let qIndex = 0;
let answered = 0;
let correctCount = 0;
let currentQ = null;
let currentShuffledOptions = null; // [{letter, text, isCorrect}]
let wrongList = [];
const DISPLAY_LETTERS = ['A', 'B', 'C', 'D']; // [{source, topic, id, question, yourAnswer, correctLetter, correctText, explanation, has_caveat, caveat_note}]

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildSourceCheckboxes() {
  const sources = [...new Set(QUESTIONS.map(q => q.source))].sort();
  sourceGridEl.innerHTML = sources.map(s => {
    const count = QUESTIONS.filter(q => q.source === s).length;
    const topics = [...new Set(QUESTIONS.filter(q => q.source === s).map(q => q.topic))].join('、');
    return `<label class="chk">
      <input type="checkbox" class="srcChk" value="${s}" checked>
      ${s}（${count}題・${topics}）
    </label>`;
  }).join('');
  sourceGridEl.querySelectorAll('.srcChk').forEach(cb => cb.addEventListener('change', updatePoolCount));
}

function getSelectedSources() {
  return [...sourceGridEl.querySelectorAll('.srcChk:checked')].map(cb => cb.value);
}

function currentFilteredSet() {
  const selected = getSelectedSources();
  const excludeCaveat = excludeCaveatEl.checked;
  return QUESTIONS.filter(q => {
    if (!selected.includes(q.source)) return false;
    if (excludeCaveat && q.has_caveat) return false;
    return true;
  });
}

function getEffectiveCount(poolSize) {
  if (!limitEnabledEl.checked) return poolSize;
  const n = parseInt(limitCountEl.value, 10);
  if (!n || n < 1) return poolSize;
  return Math.min(n, poolSize);
}

function updatePoolCount() {
  const size = currentFilteredSet().length;
  poolCountEl.textContent = size;
  limitCountEl.max = size || 1;
  effectiveCountEl.textContent = getEffectiveCount(size);
}

function startQuiz() {
  const pool = currentFilteredSet();
  if (pool.length === 0) {
    alert('目前設定下沒有題目，請至少選一個來源。');
    return;
  }
  const effectiveCount = getEffectiveCount(pool.length);
  queue = shuffleArray(pool).slice(0, effectiveCount);
  qIndex = 0;
  answered = 0;
  correctCount = 0;
  wrongList = [];
  setupScreen.classList.add('hidden');
  summaryScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  showQuestion();
}

function updateProgressUI() {
  progressText.textContent = (qIndex) + ' / ' + queue.length;
  progressBar.style.width = (queue.length ? (qIndex / queue.length * 100) : 0) + '%';
  correctCountEl.textContent = correctCount;
  accuracyEl.textContent = answered ? Math.round(correctCount / answered * 100) + '%' : '0%';
}

function showQuestion() {
  if (qIndex >= queue.length) {
    showSummary();
    return;
  }
  resultBoxEl.classList.add('hidden');
  nextBtn.disabled = true;
  currentQ = queue[qIndex];
  updateProgressUI();

  currentSourceEl.textContent = currentQ.source;
  currentTopicEl.textContent = currentQ.topic;
  currentIdEl.textContent = '第 ' + currentQ.id + ' 題';
  questionTextEl.textContent = currentQ.question;

  const rawOptions = [
    { letter: 'A', text: currentQ.option_a, isCorrect: currentQ.correct_option === 'A' },
    { letter: 'B', text: currentQ.option_b, isCorrect: currentQ.correct_option === 'B' },
    { letter: 'C', text: currentQ.option_c, isCorrect: currentQ.correct_option === 'C' },
    { letter: 'D', text: currentQ.option_d, isCorrect: currentQ.correct_option === 'D' },
  ];
  currentShuffledOptions = randomizeOptionsEl.checked ? shuffleArray(rawOptions) : rawOptions;

  optionsBoxEl.innerHTML = '';
  currentShuffledOptions.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="letter">${DISPLAY_LETTERS[i]}</span><span>${opt.text}</span>`;
    btn.addEventListener('click', () => selectAnswer(i, btn));
    optionsBoxEl.appendChild(btn);
  });
}

function selectAnswer(pickedIndex, btnEl) {
  const allBtns = optionsBoxEl.querySelectorAll('.option');
  allBtns.forEach(b => b.disabled = true);

  const picked = currentShuffledOptions[pickedIndex];
  const isCorrect = picked.isCorrect;
  const correctIndex = currentShuffledOptions.findIndex(o => o.isCorrect);
  const correctDisplayLetter = DISPLAY_LETTERS[correctIndex];
  answered++;
  if (isCorrect) {
    correctCount++;
  } else {
    const correctOpt = currentShuffledOptions[correctIndex];
    wrongList.push({
      source: currentQ.source,
      topic: currentQ.topic,
      id: currentQ.id,
      question: currentQ.question,
      yourAnswer: picked.text,
      correctLetter: correctDisplayLetter,
      correctText: correctOpt.text,
      explanation: currentQ.explanation,
      has_caveat: currentQ.has_caveat,
      caveat_note: currentQ.caveat_note,
    });
  }

  allBtns.forEach((b, i) => {
    if (currentShuffledOptions[i].isCorrect) b.classList.add('correct');
    else if (i === pickedIndex) b.classList.add('wrong');
  });

  resultBannerEl.textContent = isCorrect ? '✓ 答對了！' : ('✗ 答錯了，正確答案是 ' + correctDisplayLetter);
  resultBannerEl.className = 'result-banner ' + (isCorrect ? 'correct' : 'wrong');
  explanationTextEl.textContent = '解析：' + currentQ.explanation;

  if (currentQ.has_caveat && currentQ.caveat_note) {
    caveatTextEl.classList.remove('hidden');
    caveatTextEl.textContent = '⚠️ 爭議備註：' + currentQ.caveat_note;
  } else {
    caveatTextEl.classList.add('hidden');
  }

  resultBoxEl.classList.remove('hidden');
  nextBtn.disabled = false;
  qIndex++;
  updateProgressUI();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderReviewList() {
  if (wrongList.length === 0) {
    reviewListEl.innerHTML = '<div class="no-wrong">太厲害了，這次沒有答錯的題目！</div>';
    return;
  }
  reviewListEl.innerHTML = wrongList.map(w => `
    <div class="review-item">
      <div class="meta">
        <span class="tag">${escapeHtml(w.source)}</span>
        <span class="tag">${escapeHtml(w.topic)}</span>
        <span>第 ${w.id} 題</span>
      </div>
      <div class="question">${escapeHtml(w.question)}</div>
      <div class="review-line">你的答案：<span class="your-ans">${escapeHtml(w.yourAnswer)}</span></div>
      <div class="review-line">正確答案：<span class="correct-ans">${w.correctLetter}. ${escapeHtml(w.correctText)}</span></div>
      <div class="review-explanation">解析：${escapeHtml(w.explanation)}</div>
      ${w.has_caveat && w.caveat_note ? `<div class="caveat" style="margin-top:8px;">⚠️ 爭議備註：${escapeHtml(w.caveat_note)}</div>` : ''}
    </div>
  `).join('');
}

function showSummary() {
  quizScreen.classList.add('hidden');
  summaryScreen.classList.remove('hidden');
  summaryTotalEl.textContent = answered;
  summaryCorrectEl.textContent = correctCount;
  summaryWrongEl.textContent = answered - correctCount;
  summaryAccuracyEl.textContent = answered ? Math.round(correctCount / answered * 100) + '%' : '0%';
  renderReviewList();
}

nextBtn.addEventListener('click', showQuestion);
startBtn.addEventListener('click', startQuiz);
backToSetupBtn.addEventListener('click', showSummary);
restartSameBtn.addEventListener('click', startQuiz);
backSetupFromSummaryBtn.addEventListener('click', () => {
  summaryScreen.classList.add('hidden');
  setupScreen.classList.remove('hidden');
  updatePoolCount();
});
excludeCaveatEl.addEventListener('change', updatePoolCount);
limitEnabledEl.addEventListener('change', () => {
  limitCountEl.disabled = !limitEnabledEl.checked;
  updatePoolCount();
});
limitCountEl.addEventListener('input', updatePoolCount);

totalAllEl.textContent = QUESTIONS.length;
buildSourceCheckboxes();
updatePoolCount();
</script>
</body>
</html>
