」：\n  ・它的深度模型強化了文字渲染能力！無論是 T-Shirt 上的標語、Logo 上的店名、還是復古海報上的宣傳標題，它都能一字不差、字體優美地把英文字嵌進圖案裡！做海報、商標首選！\n\n【🔑 正確選項秒殺題眼】\n・看到「在圖片中精準生成排版文字（Typography）、海報標語與店名嵌字」 ➔ 秒選 「Ideogram AI」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Suno 是 AI 音樂歌曲生成平台。\n・✅ (B) 為什麼對：精準命中教材 3.2 節 Ideogram AI 在「圖像排版文字（Typography）」領域的招牌獨家定位。\n・❌ (C) 為什麼錯：AlphaCode 是專攻程式設計競賽的系統。\n・❌ (D) 為什麼錯：ZeroGPT 是 AI 文章偵測器。", "has_caveat": 1, "caveat_note": "Ideogram AI 首版實際於2023年8月推出（題幹稱2023年底），不影響答案。"}, {"id": 424, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在深度生成式 AI 的「模型預訓練（Pre-training）6 大步驟」中，整個學習生命週期依序經歷了：\nStep 1 資料收集與處理 ➔ Step 2 選擇適當模型 ➔ Step 3 決定損失函數 ➔ Step 4 參數最佳化 ➔ Step 5 生成、評估與反覆運算 ➔ Step 6 結果轉成文字。\n請問關於預訓練流程中模型「何時才會真正對外輸出生成結果」的時機辨析，下列敘述何者完全正確？", "option_a": "模型在 Step 1 收集資料時就已經在對外生成回覆給全球用戶", "option_b": "在 Step 1 至 Step 5 期間，模型都處於封閉受訓與校內模擬考階段（Step 5 的內部生成僅用於計算損失與調校超參數，絕對不會對外輸出給使用者）；唯有當模型完成所有預訓練步驟、正式部署上線進入『Step 6：結果轉成文字』後，模型才會真正根據使用者的 Prompt 對外輸出回應結果！", "option_c": "模型在 Step 4 參數最佳化時就已經完成對外輸出，Step 6 是負責刪除所有權重", "option_d": "整個預訓練 6 大步驟永遠不會生成任何文字，只有 CNN 才能輸出文字", "correct_option": "B", "explanation": "・📍 對應重點章節：1.9 模型預訓練 從無到有的知識建立\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「廚師在廚房研發菜色 vs 開門營業端上桌」來理解預訓練 6 步驟的對外時機：\n・Step 1～5 ＝「廚師在後廚閉關試菜（內部閉環，絕不能端給客人！）」：\n  ・在 Step 5 時，廚師自己煎了一塊牛排嚐味道（內部生成），看看鹹淡如何（算損失），然後微調火候與調味料（調參數）。這時候的半成品絕對不能拿給外面的客人吃（不對外輸出）！\n・Step 6 ＝「正式開門營業（結果轉成文字，對外端菜！）」：\n  ・菜色研發完畢（模型預訓練畢業上線），客人點了「我要七分熟菲力（Prompt）」，主廚依照點單正式做出料理並端給客人（對外輸出文字），這就是 Step 6！\n\n【🔑 正確選項秒殺題眼】\n・看到「預訓練何時才真正對外輸出生成文字」 ➔ 秒選 「Step 6 結果轉成文字（正式上線後，Step 5 僅為內部模擬評估不對外輸出）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Step 1 只是資料收集清洗，模型連架構都還沒建立。\n・✅ (B) 為什麼對：精闢點出 Step 5 內部生成與 Step 6 正式上線對外輸出的關鍵界線，破除考場高頻迷思。\n・❌ (C) 為什麼錯：Step 4 是更新權重，Step 6 絕對不會刪除模型權重。\n・❌ (D) 為什麼錯：大語言模型預訓練的最終成果就是生成語言文字。", "has_caveat": 0, "caveat_note": null}, {"id": 425, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國餐飲外送平台的 App 在進行系統升級時，產品經理提議：「為了提升 AI 推薦餐點的精準度，我們應該在使用者註冊時，強制要求使用者填寫『宗教信仰、病史紀錄、血型與指紋生物特徵』，並上傳身分證正反面影本，以便後續餵進生成式 AI 進行口味喜好分析。」\n公司法務長看到這份企劃書後立刻否決，並嚴厲指出該提議嚴重違反了全球個資法規（如 GDPR 及我國個資法）最核心的哪一項隱私保護原則？", "option_a": "算力最大化原則", "option_b": "數據最小化原則（Data Minimization，只收集達成業務目的所必需的最少資料量，不得過度收集）", "option_c": "溫度參數極限原則", "option_d": "圖片超解析放大原則", "correct_option": "B", "explanation": "・📍 對應重點章節：4.4 資料治理 隱私保護技術與全球個資法規\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這是個人資料保護法規中最具常識性、但也最常考的黃金原則：\n・什麼叫「數據最小化（Data Minimization）」？（不貪心、夠用就好！）：\n  ・點個炸雞外送，只需要知道「外送地址」跟「聯絡電話」就足夠完成服務了！\n  ・顧客信什麼教、什麼血型、身分證號碼是多少，跟送披薩完全沒有正當合理關聯！\n  ・「數據最小化原則」明確規定：企業在收集與處理資料時，必須嚴格限制在「達成特定業務目的所必需的最低限度之內」，嚴格禁止假借 AI 分析之名行過度收集之實！\n\n【🔑 正確選項秒殺題眼】\n・看到「只收集達成業務目的所必需的最少資料、禁止過度收集」 ➔ 秒選 「數據最小化（Data Minimization）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：算力最大化是硬體追求，非個資法律合規原則。\n・✅ (B) 為什麼對：精準對應教材 4.4 節隱私保護四大策略中的 數據最小化（Data Minimization）。\n・❌ (C) 為什麼錯：溫度參數是模型採樣指標，與法律原則無關。\n・❌ (D) 為什麼錯：超解析為影像處理技術。", "has_caveat": 0, "caveat_note": null}, {"id": 426, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在人工智慧研究領域，研究人員在觀察大語言模型（LLM）的規模擴展法則（Scaling Laws）時發現了一個震撼的現象：\n當神經網路的參數量較小（例如數千萬或數億參數）時，模型對於「多步驟跨領域邏輯推演、成語雙關語理解、三段論證明」的答題準確率幾乎等於隨機亂猜（接近 0%）；然而，當模型參數量與訓練資料量突破了某個臨界規模門檻（例如達到百億至千億級參數，如 GPT-3 / GPT-4）時，模型彷彿突然「開竅了」一樣，解題準確率呈現陡峭的跳躍式暴增，瞬間展現出驚人的複雜思考與推理能力！\n請問在 AI 領域中，這種「小模型看不到、只有在模型規模突破特定門檻後才會突然爆發出來的強大能力」，稱為什麼？", "option_a": "梯度消失現象", "option_b": "湧現能力（Emergent Abilities）", "option_c": "模式崩潰現象", "option_d": "欠擬合現象", "correct_option": "B", "explanation": "・📍 對應重點章節：2.1 大語言模型 (LLM) 原理 微調與應用模式\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「水結成冰」或「螞蟻群的築巢智慧」來理解什麼叫 湧現（Emergence）：\n・量變引起質變的奇蹟 ＝ 湧現能力（Emergent Abilities）：\n  ・單獨一隻螞蟻非常笨，只會到處爬；但當 100 萬隻螞蟻聚集在一起時，蟻群突然展現出建造複雜通風地下城堡的集體智慧！\n  ・大語言模型也是如此！在 1 億參數時，它連基本的加減乘除都不會；但當參數量堆疊到 1000 億、讀了全人類幾萬億字的文章後，各個神經層的交互作用突破臨界點，模型突然無師自通學會了幽默感、反諷、寫代碼與複雜推理！這就是引爆全球 LLM 革命的「湧現能力」！\n\n【🔑 正確選項秒殺題眼】\n・看到「模型參數量突破臨界規模門檻後突然爆發出的強大推理能力」 ➔ 秒選 「湧現能力（Emergent Abilities）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：梯度消失是訓練訊號衰減的缺陷，非正面強大能力。\n・✅ (B) 為什麼對：精準命中大語言模型規模擴展時最具代表性的標誌性特徵：湧現能力（Emergent Abilities）。\n・❌ (C) 為什麼錯：模式崩潰是 GAN 生成圖像單調重複的病態問題。\n・❌ (D) 為什麼錯：欠擬合是指模型過於簡單無法學會規律。", "has_caveat": 0, "caveat_note": null}, {"id": 427, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在機器學習的經典演算法家族中，邏輯迴歸（Logistic Regression） 是一個名字常常誤導考生的經典代表。初學者常常因為看到其英文名字中有「Regression（迴歸）」，就誤以為它是用來預測房價或股票指數等連續數值的演算法。\n請問關於邏輯迴歸的本質與實際應用，下列說明何者完全正確？", "option_a": "邏輯迴歸只能用來做連續數值預測（如預測二手車價格），絕對不能用來做分類", "option_b": "邏輯迴歸名字雖然帶有「迴歸」，但本質上是專門用來解決「二元分類（Binary Classification，如垃圾郵件判定、患者是否罹病等是非題）」的演算法；它透過 Sigmoid 函數將線性加權結果壓縮到 (0, 1) 機率區間，以判斷屬於正類的機率", "option_c": "邏輯迴歸是由生成器與判別器組成的對抗網絡，專門生成高解析度短影片", "option_d": "邏輯迴歸屬於非監督式分群演算法，不需要任何帶有標籤的訓練資料", "correct_option": "B", "explanation": "・📍 對應重點章節：1.13 五大學習範式與經典演算法\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這是機器學習考試中最著名的「掛羊頭賣狗肉」名詞陷阱：\n・名字叫「迴歸」，骨子裡卻是「是非題分類裁判！」：\n  ・線性迴歸（Linear Regression）算出的是一個沒有邊界的連續數字（如 z = wx + b 可以算到 500 萬）；\n  ・但邏輯迴歸在最後面套上了一個 Sigmoid 濾鏡！硬生生把這個數字壓進了 0 ～ 1 的機率區間（例如算出 0.85 ＝ 85% 是垃圾信）！\n  ・接著只要劃一條標準線（通常是 0.5）：大於 0.5 判「是垃圾信（1）」、小於 0.5 判「正常信（0）」，所以它百分之百是用來做「二元分類是非題」的！千萬別被名字騙了！\n\n【🔑 正確選項秒殺題眼】\n・看到「邏輯迴歸（Logistic Regression）的本質任務」 ➔ 秒選 「二元分類任務（是非題判斷、輸出 0~1 機率，非數值迴歸！）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：正好踩中命題老師設計的名詞陷阱，邏輯迴歸是用於分類而非數值預測。\n・✅ (B) 為什麼對：精闢點破邏輯迴歸本質為二元分類演算法，並解釋其透過 Sigmoid 映射機率的運作原理。\n・❌ (C) 為什麼錯：生成器與判別器是 GAN 的結構。\n・❌ (D) 為什麼錯：邏輯迴歸是標準的「監督式學習」，需要人工標籤。", "has_caveat": 0, "caveat_note": null}, {"id": 428, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國軟體公司的資訊部門正在制定「AI 輔助編程工具使用規範」。在教材第 3.6 節列舉的程式生成工具 4 大核心功能（① 產出註解、② 解釋與翻譯、③ 改善跟重構、④ 測試及補全）中，技術長要求工程師嚴格區分「功能 ①：產出註解」與「功能 ②：解釋與翻譯」的應用場景：\n・場景甲：資深工程師寫完了一段演算法，希望 AI 在程式碼內部每個函數上方，自動補齊符合 PEP 257 規範的標準參數說明文檔（Docstring），並在關鍵代碼行尾加上簡明扼要的行內中文說明。\n・場景乙：工程師接手了一套十年前遺留下來、毫無說明的古老 COBOL 批次處理代碼，他需要 AI 將這段代碼「轉成人話、用通俗白話文向完全不懂程式的業務主管解釋其背後的商業邏輯」，並順便將這段 COBOL 轉換改寫為現代的 Python 語言。\n請問場景甲與場景乙分別對應了 AI 程式工具的哪一項核心功能？", "option_a": "場景甲對應「解釋與翻譯」；場景乙對應「產出註解」", "option_b": "場景甲對應「功能 ①：產出註解（Code Documentation）」；場景乙對應「功能 ②：解釋與翻譯（Code Explanation & Cross-language Translation）」", "option_c": "兩者皆對應「測試及補全」", "option_d": "兩者皆對應「改善跟重構」", "correct_option": "B", "explanation": "・📍 對應重點章節：3.6 程式生成應用與開發工具\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這題幫你把程式生成助手最容易混淆的兩個功能界線劃得清清楚楚：\n・場景甲：產出註解（Code Documentation） ＝「在代碼旁邊貼說明書標籤」：\n  ・目標讀者是工程師自己或未來的接盤工程師！\n  ・AI 自動在程式碼裡面加上 # 這裡是在算折扣、加上 Docstring 函數規格說明，代碼本身完全沒變，只是多了說明文字。\n・場景乙：解釋與翻譯（Explanation & Translation） ＝「跨界翻譯官！」：\n  ・解釋 ＝ 轉成人話：把艱澀的天書程式碼白話翻譯給業務經理聽（「這段是在算每個月如果存款不足要扣 10 元手續費」）。\n  ・翻譯 ＝ 跨語言轉換：把舊的 Java / COBOL 自動翻譯成新的 Python / Go！\n\n【🔑 正確選項秒殺題眼】\n・看到「自動在代碼內補上函數說明、Docstring」 ➔ 秒選 「產出註解」\n・看到「代碼轉成人話白話解釋、或從語言 A 翻譯成語言 B」 ➔ 秒選 「解釋與翻譯」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：把「產出註解」與「解釋與翻譯」的場景完全配反了。\n・✅ (B) 為什麼對：精準對應教材 3.6 節關於「產出註解」與「解釋與翻譯」的專業情境分工。\n・❌ (C) 為什麼錯：測試及補全是指自動撰寫單元測試與程式接龍補全。\n・❌ (D) 為什麼錯：改善跟重構是指抓 Bug 與優化演算法結構。", "has_caveat": 0, "caveat_note": null}, {"id": 429, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "2014 年由 Ian Goodfellow 提出的生成對抗網路（GAN），被譽為生成式 AI 發展史上最精妙的博弈模型架構之一。\n在 GAN 的對抗博弈中，系統由兩個深度神經網路組成：\n・角色甲（生成器 Generator）：目標是從隨機雜訊中盡可能生成出逼真的仿冒資料，努力「騙過」角色乙。\n・角色乙（判別器 Discriminator）：目標是拿到資料後，努力拿放大鏡檢驗，精準挑出破綻「識破」假資料。\n請問在博弈論（Game Theory）的數學模型中，GAN 的訓練過程屬於下列哪一種賽局型態？其最終追求的理想平衡狀態稱為什麼？", "option_a": "合作賽局；最終追求局部微擾狀態", "option_b": "零和博弈（Zero-Sum Game / 最小最大博弈 Minimax Game）；最終追求達成「納許均衡（Nash Equilibrium，判別器完全無法分辨真假，預測機率剛好為 50% 只能隨機猜）」", "option_c": "非監督降維賽局；最終追求主成分方差最大化", "option_d": "正則化賽局；最終追求所有權重變為 0", "correct_option": "B", "explanation": "・📍 對應重點章節：1.4 VAE GAN 與 Seq2Seq\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「假鈔集團 vs 驗鈔警察」來理解 GAN 的終極對決：\n・這是一場你死我活的「零和博弈（Zero-Sum Game）」：\n  ・生成器的得分就是判別器的失分，雙方利益完全對立，互相逼迫對方升級技術！\n・終極大結局 ＝「納許均衡（Nash Equilibrium）」：\n  ・當假鈔集團的技術練到極致時，印出來的鈔票連紙質、浮水印都跟真鈔 100% 一模一樣！\n  ・這時候全世界最厲害的警察拿放大鏡看，也完全挑不出任何破綻，警察猜這張是假鈔的機率剛好等於 0.5（50% 丟銅板盲猜）！這就是 GAN 訓練成功的完美平衡點！\n\n【🔑 正確選項秒殺題眼】\n・看到「GAN 的博弈型態與最終理想平衡狀態」 ➔ 秒選 「零和博弈（Minimax）➔ 達成納許均衡（Nash Equilibrium / 判別器準確率 50%）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：GAN 是對抗對立賽局，並非目標一致的合作賽局。\n・✅ (B) 為什麼對：精闢點出 GAN 底層為最小最大零和博弈（Minimax Game）並以達成納許均衡為目標的博弈論本質。\n・❌ (C) 為什麼錯：方差最大化是 PCA 主成分分析的目標。\n・❌ (D) 為什麼錯：權重變為 0 是 L1 正則化的特性。", "has_caveat": 0, "caveat_note": null}, {"id": 430, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在建立企業級 AI 倫理審查機制時，「避免歧視與確保公平（Fairness）」是可信任 AI 的五大核心原則之一。\n當某金控集團建立了一套「AI 房屋貸款審批與利率預測系統」時，合規稽核委員會要求該模型必須同時通過以下三項公平性維度的檢驗：\n1. 維度一（群體公平性）：無論是男性、女性、還是原住民族群，在信用條件相同的情況下，整體的房貸核准率必須大致相當，不得對特定受保護群體產生系統性壓迫。\n2. 維度二（個體公平性）：兩位年收入、負債比與工作年資極度相似的申請人，系統給予的信用評分與貸款成數必須高度一致，不能因住址所在區域等隱形代理變數而給予懸殊待遇。\n3. 維度三（程序公平性）：貸款審核流程與特徵權重評估標準必須公開透明，且當申請人遭到拒絕時，必須有明確的人工申訴與複核管道。\n請問如果這套房貸審核 AI 因為過去十年的男性高核貸率歷史資料影響，導致女性申請人在信用評分相近時普遍被自動壓低貸款成數，直接造成女性族群權益受損，這最直接違反了上述哪一個公平性維度？", "option_a": "僅違反了資料壓縮維度", "option_b": "直接違反了「群體公平性（Group Fairness）」維度（對受保護之特定性別族群產生系統性不利影響）", "option_c": "僅違反了顯卡散熱安全維度", "option_d": "違反了量子糾纏平衡維度", "correct_option": "B", "explanation": "・📍 對應重點章節：4.1 AI 治理核心原則 歐盟 AI 法案與治理制度、4.2 AI 倫理五大原則與各國治理規範\n\n【💡 生活化範例 ／ 具體情境秒懂】\n演算法公平性（Algorithmic Fairness）在法規實務上最核心的戰場就是「群體公平性」：\n・什麼是「群體公平性（Group Fairness）」？（不同族群間的平等待遇）：\n  ・法律上受保護的族群（性別、種族、宗教、年齡、身心障礙等）。\n  ・如果模型從歷史資料中學到了偏見，導致女性族群或特定少數族裔整體的過件率系統性偏低，即使個別申請人資質優異也被拖累，這在統計與法律上就是最典型的違反「群體公平性（Group Fairness）」！\n\n【🔑 正確選項秒殺題眼】\n・看到「特定受保護族群（如女性/少數民族）因模型偏誤蒙受系統性不利」 ➔ 秒選 「違反群體公平性（Group Fairness）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：資料壓縮是前處理技術，與社會公平倫理無關。\n・✅ (B) 為什麼對：精確命中 AI 倫理中針對特定人口統計受保護群體權益受損的 群體公平性 違規面向。\n・❌ (C) 為什麼錯：散熱安全為硬體運作指標。\n・❌ (D) 為什麼錯：量子糾纏屬於物理學名詞，與當前 AI 倫理規範無關。", "has_caveat": 0, "caveat_note": null}, {"id": 431, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在結構化提問公式 3W (Who, Where, What) 中，「Where（情境與背景脈絡 Context）」經常被初學者忽略。\n假設某國小自然科學老師想請 AI 寫一段「光合作用」的教學文案。老師做了兩次對比測試：\n・測試一（未提供 Where）：只輸入 「你是生物學老師（Who），請說明光合作用的原理（What）。」 結果 AI 回覆了一大堆深奧的大學生物化學反應式（如葉綠體類囊體膜、三磷酸腺苷 ATP、卡爾文循環 Calvin Cycle 等），國小學生完全看不懂。\n・測試二（補齊 Where）：老師加上了背景情境設定：「...面對的受眾是國小三年級（9歲）的小朋友，請在課堂情境中透過生活化的擬人故事與比喻來呈現（Where）。」 結果 AI 立刻將葉綠體比喻為「綠色小廚房」、陽光比喻為「烤箱電源」，教學效果極佳！\n請問這個對比實驗最有力地證明了在提問中提供 Where（背景情境） 的核心價值是什麼？", "option_a": "能自動將電腦螢幕的解析度提高到 4K", "option_b": "能幫助 AI 精準鎖定目標受眾（Target Audience）的認知層次、心理情境與溝通場景，使回答的語言難易度、舉例風格與專業深度能完美貼合當下的實際應用環境，避免生成答非所問或晦澀難懂的內容", "option_c": "能強制將模型的反向傳播梯度清零", "option_d": "能將文字自動轉換為 16×16 拼圖網格", "correct_option": "B", "explanation": "・📍 對應重點章節：2.2 提示工程 原則 咒語 框架提示與三大思維推理\n\n【💡 生活化範例 ／ 具體情境秒懂】\nWhere 在提示工程中不是單純問「你在哪間房間」，而是「這場對話發生在什麼樣的時空背景與受眾面前（Context）！」：\n・如果不給 Where，AI 預設會用維基百科的大學術語跟妳說話（生硬無比）；\n・一旦給了 Where（「對象是 9 歲國小生」、「對象是董事會跨國高管」、「對象是情緒焦慮的門診病人」），AI 的自注意力機制會立刻調用符合該情境的語料庫，把艱深術語降維轉成「聽得懂的生活比喻」，這就是 Where（情境背景） 的巨大威力！\n\n【🔑 正確選項秒殺題眼】\n・看到「提問中加入 Where（背景情境）的核心價值」 ➔ 秒選 「鎖定目標受眾認知層次、精準調整語言深度與風格舉例」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：提示詞無法改變實體螢幕硬體解析度。\n・✅ (B) 為什麼對：精闢切中結構化提問 3W 中 Where 透過情境與受眾脈絡賦能 AI 調整表達深度的核心精髓。\n・❌ (C) 為什麼錯：梯度清零是模型訓練優化器操作，非提問階段。\n・❌ (D) 為什麼錯：16×16 切塊是 ViT 讀取靜態圖片的步驟。", "has_caveat": 0, "caveat_note": null}, {"id": 432, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在深度神經網路訓練初期，所有神經元之間的權重矩陣必須進行「權重初始化（Weight Initialization）」。\n實習生小王在寫訓練代碼時，靈機一動：「既然一開始大家都不知道最佳權重是多少，那我就貪圖方便，把神經網路裡所有層的所有權重（Weight w）全部初始化設定為 0 好了！」\n資深演算法工程師看到後當場喝止，指出這是一個絕對致命的低級錯誤。\n請問如果把神經網路的所有權重全部初始化為 0，會對訓練造成什麼毀滅性的後果？", "option_a": "會導致電腦顯示卡風扇反轉吹風", "option_b": "會導致神經網路陷入「完全對稱性（Symmetry Problem）」無法打破：在正向傳播時同層的所有神經元輸出完全相同，在反向傳播時所有神經元接收到的梯度也完全一模一樣，導致所有神經元在每一步更新時永遠學出一模一樣的數值，整個多層深層網路當場退化為等同於單一神經元的能力！", "option_c": "會導致資料庫被自動備份到 GitHub 上", "option_d": "會導致資料離散化為盒鬚圖", "correct_option": "B", "explanation": "・📍 對應重點章節：1.10 模型最佳化 訓練技巧與過擬合\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「全班 100 個人全變成複製人」來秒懂為什麼權重絕對不能全設為 0：\n・神經網路的強大在於「分工合作」：\n  ・第 1 個神經元看橫線、第 2 個看直線、第 3 個看圓形。\n・如果全部初始化為 0 ＝「鏡像複製人悲劇（對稱性問題）」：\n  ・輸入進來乘上 0，大家都輸出 0；改考卷往回算，大家分到的責任梯度一模一樣！\n  ・既然大家都一模一樣，更新完後大家都變成 0.05；再更新大家又一起變成 0.12！\n  ・就算你堆了 100 層、10 萬個神經元，全班永遠做出複製人動作，神經網路的複雜表徵能力徹底歸零！\n  ・所以必須用隨機初始化（如 Xavier / He 初始化）隨機撒一些微小數字打破對稱！\n\n【🔑 正確選項秒殺題眼】\n・看到「為什麼神經網路權重不能全部初始化為 0」 ➔ 秒選 「無法打破對稱性（Symmetry）、所有神經元學出一模一樣的特徵」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：純屬硬體風扇的搞笑誘答項。\n・✅ (B) 為什麼對：精準命中深度學習「權重初始化」必須打破對稱性（Breaking Symmetry）的經典數學原理。\n・❌ (C) 為什麼錯：代碼訓練與程式碼雲端備份無直接因果。\n・❌ (D) 為什麼錯：盒鬚圖為異常值統計工具。", "has_caveat": 0, "caveat_note": null}, {"id": 433, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某多媒體影音工作室正在評估兩款著名的 AI 音樂生成工具：\n・工具甲（AIVA）：成立較早，專精於古典交響樂、影視史詩配樂與遊戲背景音樂（BGM）的音符創作；在認證考試教材中，「常與 GPT 結合（由 GPT 負責寫出押韻歌詞，再由它負責譜曲與編排樂器）」。\n・工具乙（Suno）：在 2024 年震撼全球，使用者只要輸入文字提示詞或歌詞，AI 即可「一鍵直接生成包含高擬真真人歌唱人聲（Vocal）與完整伴奏配器編曲」的完整流行歌曲。\n請問下列關於這兩款音樂 AI 工具的特性配對，何者完全正確？", "option_a": "AIVA 只能生成 3D 影片；Suno 只能進行文字斷詞", "option_b": "AIVA 專精於古典與影視配樂自動作曲（常與 GPT 寫歌詞搭配使用）；Suno 則擅長一鍵生成包含真人歌聲演唱與完整伴奏的各類流行歌曲", "option_c": "兩者都只能生成黑白靜態海報", "option_d": "兩者都是歐盟完全禁止的第一級不可接受風險工具", "correct_option": "B", "explanation": "・📍 對應重點章節：3.3 聲音 (TTS) 與音樂生成應用\n\n【💡 生活化範例 ／ 具體情境秒懂】\n音樂生成雙雄在教材 3.3 節的定位考點非常清晰：\n・AIVA ＝「古典與影視配樂的作曲家」：\n  ・最常考的考題配對：「常與 GPT 結合使用來創作歌曲的 AI 音樂工具是誰？」必選 AIVA！（GPT 當作詞人寫歌詞、AIVA 當作曲家寫譜編配樂）！\n・Suno ＝「全能流行歌手 ＋ 完整樂團」：\n  ・只要給它一段歌詞，它連主唱（搖滾嘶吼、甜美女聲、爵士男中音）、電吉他、爵士鼓一次性全包生出來，一鍵產出廣播級流行單曲！\n\n【🔑 正確選項秒殺題眼】\n・看到「常與 GPT（負責歌詞）結合使用的音樂作曲工具」 ➔ 秒選 「AIVA」\n・看到「一鍵生成逼真人聲演唱 ＋ 完整流行歌曲編曲」 ➔ 秒選 「Suno」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：AIVA 與 Suno 皆為音訊音樂工具，不生成 3D 影片或純文字斷詞。\n・✅ (B) 為什麼對：精準對應教材 3.3 節 AIVA 專攻古典配樂（搭 GPT 寫詞）與 Suno 生成完整流行歌曲的定位。\n・❌ (C) 為什麼錯：兩者皆為音樂生成工具，非靜態海報。\n・❌ (D) 為什麼錯：AI 音樂創作屬於最低風險範疇，完全合法受鼓勵。", "has_caveat": 0, "caveat_note": null}, {"id": 434, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在機器翻譯與聊天機器人品質評估中，BLEU（雙語評估替補指標） 透過計算機器生成的句子與人類專家參考答案之間的「N-gram 詞彙重疊精確率」來打分。\n然而，早期的單純 N-gram 精確率存在一個巨大的作弊漏洞：\n假設人類參考翻譯是：\"The cat sat on the mat\"（共 6 個字）。如果一個極度偷懶的笨模型只翻譯了短短一個字：\"The\"，因為單字 \"The\" 確實完美出現在參考答案中，該模型的 1-gram 精度竟然會高達 100% 滿分！\n請問 BLEU 演算法是透過引入哪一項關鍵機制，成功杜絕了模型靠「只生極短句子」來騙取高精確率的作弊行為？", "option_a": "批次正規化因子", "option_b": "簡短懲罰（Brevity Penalty, BP）：當模型生成的句子長度短於人類參考答案長度時，給予指數級嚴厲扣分，長度越偷懶分數被砍得越重！", "option_c": "學習率衰減因子", "option_d": "盒鬚圖極端值剔除法", "correct_option": "B", "explanation": "・📍 對應重點章節：1.14 模型評估指標 F1-score R-squared 與 BLEU\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這是 BLEU 演算法最精妙的雙重把關機制（N-gram 精度 ＋ 簡短懲罰）：\n・作弊學生的漏洞（只答一個字拿滿分）：\n  ・原文長達 50 個字，AI 只翻譯了 \"Yes\" 一個字。因為 \"Yes\" 確實出現在標準答案裡，算命中率是 100% 滿分！\n・考官的防作弊神器 ＝ 簡短懲罰（Brevity Penalty, BP）：\n  ・BLEU 算法規定：只要你生成的句子長度 c 比參考答案長度 r 還短，立刻啟動懲罰公式：\n    BP = exp(1 - r/c)\n  ・如果原句 6 個字你只翻 1 個字，BP 懲罰因子會直接把總分砍成將近 0 分！逼模型不僅要翻譯得準，而且長度必須完整充分！\n\n【🔑 正確選項秒殺題眼】\n・看到「BLEU 評估指標防止生成過短句子作弊的機制」 ➔ 秒選 「簡短懲罰（Brevity Penalty, BP）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：批次正規化是深度神經網路訓練技巧，非文字評估指標。\n・✅ (B) 為什麼對：精準點出 BLEU 算法中 簡短懲罰（Brevity Penalty） 用於平衡長度與精確率的核心角色。\n・❌ (C) 為什麼錯：學習率衰減是最佳化器調參手法。\n・❌ (D) 為什麼錯：盒鬚圖為數值異常值過濾。", "has_caveat": 0, "caveat_note": null}, {"id": 435, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某企業的 AI 研發小組在 Hugging Face 開源平台上尋找預訓練模型時，看到某個模型標註採用了創用 CC 的 CC BY-NC-ND 授權協議。\n研發工程師小張打算直接把這個模型下載回公司，進行二次微調後包裝成企業專屬的「付費商業客服雲端 API」向客戶收費。\n公司的智財權法務人員看到後立即叫停，指出小張的行為嚴重違反了該開源授權協議。\n請問在創用 CC 授權中，NC 與 ND 這兩個核心標籤分別代表什麼法律限制？", "option_a": "NC 代表禁止在電腦上運行；ND 代表必須使用英文", "option_b": "NC（Non-Commercial） 代表「非商業性使用」，禁止任何商業營利用途；ND（No-Derivatives） 代表「禁止改作」，禁止對原始模型或作品進行任何形式的修改、二次衍生創作或微調改編", "option_c": "NC 代表必須聯網；ND 代表必須公開原始碼", "option_d": "NC 代表由 NVIDIA 開發；ND 代表由 DeepSeek 開發", "correct_option": "B", "explanation": "・📍 對應重點章節：4.5 可解釋 AI (XAI) 與開源數據授權平台\n\n【💡 生活化範例 ／ 具體情境秒懂】\n開源社群（如 Hugging Face 與 Kaggle）的創用 CC 授權是企業合規必考的四大基本積木：\n・BY（Attribution 姓名標示）：不管怎麼用，都必須標明原作者出處！\n・NC（Non-Commercial 非商業性） ＝「免費可以，想賣錢免談！」：禁止拿去包裝成付費軟體或營利用途。\n・ND（No-Derivatives 禁止改作） ＝「原汁原味，不准改動！」：只能原封不動使用與分享，禁止手動修改、禁止微調（Fine-tuning）魔改！\n・SA（Share-Alike 相同方式分享）：如果改了，改完後的新作品必須用同一套協議免費公開。\n・小張既要拿去「收費賣錢（違背 NC）」，又要拿去「微調改編（違背 ND）」，一次踩了兩顆法律大地雷！\n\n【🔑 正確選項秒殺題眼】\n・看到「CC 授權中 NC 與 ND 的法律限制」 ➔ 秒選 「NC = 非商業性（禁營利）、ND = 禁止改作（禁修改微調）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：NC 與 ND 是智財權授權條件，非電腦運行限制。\n・✅ (B) 為什麼對：精準解析創用 CC 中 NC（Non-Commercial） 與 ND（No-Derivatives） 的法定禁止條款。\n・❌ (C) 為什麼錯：開源協議不規範硬體連網狀態。\n・❌ (D) 為什麼錯：純屬拿硬體廠商與模型名稱隨機拼湊的荒謬選項。", "has_caveat": 0, "caveat_note": null}, {"id": 436, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在搭建企業級檢索增強生成（RAG）架構時，專門用來存放海量文件向量的「向量資料庫（Vector Database，如 Pinecone、Milvus、Chroma 等）」扮演了記憶中樞的角色。\n當使用者提出一個問題時，系統首先將問題轉換為一個高維向量 q。\n請問向量資料庫是如何在毫秒級的時間內，從數百萬筆文件區塊向量中，挑選出與問題語意最相關的 Top-K 個內容？其最常採用的幾何相似度度量演算法是哪一項？", "option_a": "畢氏定理算三角形周長", "option_b": "計算向量之間的「餘弦相似度（Cosine Similarity）」或歐氏距離（L2 Distance）：透過衡量問題向量與文件向量在高維空間中的夾角大小，夾角越小代表餘弦值越接近 1、語意越高度相似", "option_c": "隨機丟硬幣抽籤", "option_d": "使用盒鬚圖過濾掉大於 3 個標準差的數值", "correct_option": "B", "explanation": "・📍 對應重點章節：1.4 VAE GAN 與 Seq2Seq、2.3 生成式 AI 進階強化 RAG RLHF LoRA 與語法分析器\n\n【💡 生活化範例 ／ 具體情境秒懂】\n向量資料庫就像「用指南針量箭頭方向」：\n・每個文件跟問題都是高維空間的一支「箭頭（向量）」：\n・為什麼首選 餘弦相似度（Cosine Similarity）？：\n  ・餘弦算的是兩個箭頭之間的「夾角 θ」！\n  ・如果問題箭頭跟某篇文件箭頭指著完全相同的方向（夾角 θ = 0°），cos(0°) = 1，代表兩者在討論同一件事，語意 100% 吻合！\n  ・如果兩支箭頭垂直（θ = 90°），cos(90°) = 0，代表八竿子打不著！\n  ・向量資料庫透過高效的近似最近鄰（ANN）索引技術，能在千分之一秒內算出誰的餘弦值最接近 1，撈出最精準的參考資料給 LLM！\n\n【🔑 正確選項秒殺題眼】\n・看到「向量資料庫衡量語意相關度最常採用的相似度演算法」 ➔ 秒選 「餘弦相似度（Cosine Similarity，衡量向量夾角）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：周長無法衡量方向與相關度。\n・✅ (B) 為什麼對：精準闡述向量資料庫利用高維空間 餘弦相似度（Cosine Similarity） 夾角度量語意相似性的核心演算法原理。\n・❌ (C) 為什麼錯：向量檢索是嚴格的數學幾何計算，非隨機抽籤。\n・❌ (D) 為什麼錯：盒鬚圖是抓異常值統計圖表。", "has_caveat": 0, "caveat_note": null}, {"id": 437, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在卷積神經網路（CNN）中，「卷積層（Convolutional Layer）」的核心計算方式是利用一個小型的矩陣（稱為「卷積核 Kernel」或「濾波器 Filter」，例如 3 × 3 大小），在輸入的圖片特徵圖上以固定的步伐一格一格滑動進行計算。\n請問：\n1. 卷積核在滑動視窗過程中，是透過哪一種基本的數學運算將局部像素轉化為單一特徵數值的？\n2. 在 CNN 超參數設定中，用來控制卷積核「每次在圖片上往右或往下移動幾格像素」的參數名稱是什麼？", "option_a": "1. 為除法運算 ／ 2. 為學習率（Learning Rate）", "option_b": "1. 為卷積核權重與局部像素之間的「元素逐項相乘並求和（Element-wise Product and Sum / 點積）」 ； 2. 控制移動步伐大小的參數名稱為「步幅（Stride）」", "option_c": "1. 為隨機抽籤 ／ 2. 為批次大小（Batch Size）", "option_d": "1. 為文字接龍 ／ 2. 為因果掩碼（Causal Mask）", "correct_option": "B", "explanation": "・📍 對應重點章節：1.2 CNN vs RNN\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「拿著小放大鏡掃描整張報紙」來理解 CNN 的卷積計算：\n・1. 卷積計算 ＝「套上去對齊相乘，全部加總！」：\n  ・拿一個 3 × 3 的透光濾鏡（卷積核）蓋在圖片的左上角；\n  ・濾鏡裡的 9 個數字跟底下的 9 個像素「一對一相乘」，再把乘出來的 9 個結果「全部加在一起」，算出一個特徵數字！這就是點積求和！\n・2. 步幅（Stride） ＝「放大鏡每次往前移幾步」：\n  ・如果 Stride = 1：每次往右移 1 格像素，看得很細密；\n  ・如果 Stride = 2：每次大跨步跳躍 2 格像素，特徵圖尺寸會縮小一半！\n\n【🔑 正確選項秒殺題眼】\n・看到「CNN 卷積核計算方式與移動步伐參數」 ➔ 秒選 「元素相乘求和（點積） ＋ 步幅（Stride）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：卷積計算是相乘求和，且移動步伐參數是 Stride 而非學習率。\n・✅ (B) 為什麼對：精準對應 CNN 卷積核在局部空間進行點積加權運算，以及 步幅（Stride） 控制滑動步長的核心定義。\n・❌ (C) 為什麼錯：卷積是確定性矩陣運算，Batch Size 是每次訓練的樣本批次量。\n・❌ (D) 為什麼錯：文字接龍與因果掩碼屬於 GPT 語言模型概念。", "has_caveat": 0, "caveat_note": null}, {"id": 438, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨平台自動化工程師在為行銷團隊搭建工作流程自動化管線時，導入了知名的 No-Code 自動化工具 Zapier。\nZapier 能夠設定「當有新客戶在 Google 表單填單時（觸發條件 Trigger），自動將資料存入 Airtable，並在公司 Slack 頻道發送歡迎通知（執行動作 Action）」。\n然而，在認證考試教材第 3.7 節中，特別強調了 Zapier 這類基於規則的自動化工具與大語言模型（LLM）相比，存在一個最致命的本質限制。\n請問在考題中，Zapier 被明確指出「無法完成下列何項任務」？", "option_a": "無法自動傳送通知", "option_b": "無法自動儲存檔案", "option_c": "無法「完整理解語意」（因為 Zapier 本質上是基於固定規則觸發的串接管線，本身不具備大語言模型深層理解人類語意的能力）", "option_d": "無法在不同表格之間同步數據", "correct_option": "C", "explanation": "・📍 對應重點章節：3.7 數據分析 視覺化與自動化工具\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這是教材 3.7 節專門為 Zapier 設計的高頻陷阱辨析題：\n・Zapier 的超強三板斧（它能做的事）：\n  ・① 傳送通知（寄信、Slack 發訊息）✅\n  ・② 儲存檔案（把信件附件存進 Google Drive）✅\n  ・③ 同步表格（把 Typeform 的資料寫進 Notion）✅\n・Zapier 的致命死穴（它絕對做不到的事）：\n  ・❌「完整理解語意！」\n  ・Zapier 就像一條機械水管，水來了就往水桶流（死板規則）。如果信件裡寫了一句冷嘲熱諷的抱怨，Zapier 自己根本看不懂那是高興還是生氣（除非你另外掛上 ChatGPT 模組）！因此題目問「Zapier 無法完成何項任務」時，秒選「完整理解語意」！\n\n【🔑 正確選項秒殺題眼】\n・看到「Zapier 無法完成下列何項任務」 ➔ 秒選 「完整理解語意（排除傳送通知、儲存檔案、同步表格）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：自動傳送通知正是 Zapier 最擅長的三大功能之一。\n・❌ (B) 為什麼錯：自動儲存檔案也是 Zapier 的核心拿手好戲。\n・✅ (C) 為什麼對：精確命中教材 3.7 節考點：Zapier 本身缺乏自然語言深層語意理解能力。\n・❌ (D) 為什麼錯：跨表格數據同步也是 Zapier 的標準強項。", "has_caveat": 0, "caveat_note": null}, {"id": 439, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某中學生在課堂上詢問老師：「當我對著一個『未聯網』的離線版大語言模型提問：『請問明天台北會不會下雨？』，而 AI 順暢地回答出：『明天台北天氣晴朗，降雨機率很低。』時，AI 到底是在做什麼？它是真的能感應天氣，還是事先把整句標準答案背下來了？」\n依據教材第 1.11 節模型推理（Inference）本質觀念，老師給出的下列哪一個科學解釋完全正確？", "option_a": "AI 雖然沒連網，但它能透過天線接收衛星氣象雲圖訊號", "option_b": "這只是一個語言模型的統計預測現象：未聯網的純語言模型既無法查詢即時天氣，也沒有事先在資料庫裡背好整句答案；它只是根據海量預訓練資料學到的語言規律與機率分佈，在給定輸入 Token 後，依統計機率逐字預測出最合理通順的下一個字（純文字接龍），其回答並不具備即時事實真偽性！", "option_c": "AI 的資料庫裡儲存了未來一百年每天的精確標準天氣答案，它只是剛好搜尋出來", "option_d": "這是因為模型發生了嚴重的梯度消失故障", "correct_option": "B", "explanation": "・📍 對應重點章節：1.11 模型的運作 (推理) AI 怎麼看懂輸入與生出結果\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這是教材 1.11 節結尾特別叮嚀考生的「兩大高頻觀念闢謠」：\n・闢謠一：AI 是不是偷偷去查了氣象局？ ❌ 絕不是！沒連網的純模型根本看不到今天的窗外！\n・闢謠二：AI 是不是事先背好整句答案從資料庫吐出來？ ❌ 絕不是！\n・真相揭秘 ＝「無情的統計文字接話王！」：\n  ・當它看到「明天台北會不會下雨？」，它腦袋裡的幾十億矩陣開始算機率：「明天」後面接「台北」機率大，接著接「可能」機率大，再接「會下雨」...\n  ・它是一個字一個字依機率拼出來的（自迴歸解碼）！它說得頭頭是道只是因為語法通順，不代表它真的知道明天會不會下雨，若需要真實天氣必須結合連網搜尋工具！\n\n【🔑 正確選項秒殺題眼】\n・看到「未連網語言模型回答明天天氣的背後本質」 ➔ 秒選 「根據預訓練統計機率逐字預測接龍、非查氣象局、非背好整句答案」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：語言模型純為軟體矩陣計算，無衛星天線硬體感應能力。\n・✅ (B) 為什麼對：精確命中教材 1.11 節核心觀念：純語言模型依據統計語言機率逐字解碼推理，非檢索預存答案或感應現實。\n・❌ (C) 為什麼錯：模型絕非死板檢索預存未來答案。\n・❌ (D) 為什麼錯：這是模型正常的自迴歸推論運作，非梯度消失故障。", "has_caveat": 0, "caveat_note": null}, {"id": 440, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某保險金控的資料分析團隊正在清洗一份包含 10 萬筆歷史理賠紀錄的資料庫。在檢查欄位時，工程師發現了兩個嚴重的缺失值（Missing Values）問題：\n1. 問題甲（數值欄位漏填）：在「理賠金額」欄位中，有少數幾筆漏填，且該數值分佈受到極少數千萬巨額理賠的影響，呈現嚴重的右偏態分佈（帶有極端值）。\n2. 問題乙（類別欄位漏填）：在「投保人血型（A/B/O/AB）」與「性別（男/女）」等文字類別型欄位中，也出現了缺失值。\n請問依據資料清理的標準統計準則，針對問題甲（有極端偏態的數值）與問題乙（文字類別資料），工程師分別應該採用哪一種統計量來進行缺失值填補（Imputation）？另外，若某個重要特徵欄位缺失比例達到 1/3 時，工程師是否可以直接把該欄位整欄刪除？", "option_a": "問題甲用「平均數」；問題乙用「平均數」；且只要缺失達 1/3 就必須立刻刪除", "option_b": "問題甲（有極端值偏態數值）應使用「中位數（Median）」填補；問題乙（文字類別資料）只能使用「眾數（Mode）」填補；且若欄位缺失達 1/3「絕對不可直接整欄刪除」，否則會遺失大量寶貴資訊，應透過填補或演算法處理", "option_c": "問題甲用「眾數」；問題乙用「中位數」；且必須將所有缺失值全部填為 0", "option_d": "問題甲與問題乙皆使用「BLEU」分數填補", "correct_option": "B", "explanation": "・📍 對應重點章節：1.12 資料基本概念 收集清理與前處理\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這是資料清理章節最必考的「缺失值三大填補原則與一不原則」：\n・數值有極端值（如郭台銘跟我們平均薪水）➔ 用 中位數（Median）：\n  ・當資料有少數超級富豪或極端巨額理賠時，平均數會被嚴重拉偏拉高，這時只有排在正中間的中位數最客觀！\n・文字類別資料（如血型、性別、職業）➔ 只能用 眾數（Mode）：\n  ・你算不出「A型跟B型的平均值是什麼」！類別資料只能看哪一個出現次數最多（眾數）來填補！\n・鐵則口訣 ＝「缺失達 1/3 絕不可直接刪除！」：\n  ・如果每 3 個人就有 1 個人沒填，直接把整欄或整行刪掉，相當於丟掉了 33% 的珍貴數據資產，會嚴重扭曲模型分佈！\n\n【🔑 正確選項秒殺題眼】\n・看到「缺失值填補：有極端值用中位數、類別資料用眾數」 ➔ 秒選 (B)\n・看到「缺失達 1/3 能否直接刪除」 ➔ 秒選 「不可直接刪除」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：極端值會扭曲平均數，類別資料（血型）算不出平均數，且缺失 1/3 不得直接刪除。\n・✅ (B) 為什麼對：精準命中教材 1.12 節中位數抗偏態、類別用眾數，以及缺失達 1/3 禁刪的核心規範。\n・❌ (C) 為什麼錯：類別資料不能用中位數（無法排序），且全填 0 會破壞統計分佈。\n・❌ (D) 為什麼錯：BLEU 是翻譯評估指標，與資料填補無關。", "has_caveat": 0, "caveat_note": null}, {"id": 441, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在結構化提示工程的常用縮寫框架中，TAG 框架以其高度聚焦任務推進而著稱。\n假設某數位行銷主管在對 AI 下達指令時寫道：\n・「請為我們新上市的降噪耳機撰寫 3 篇社群宣傳文案（模組一）；」\n・「請分析該耳機相較於市面競品的主動降噪分貝數優勢，並融入生活化場景（模組二）；」\n・「希望能藉此提升產品預購頁面的點擊轉換率，吸引 25~35 歲的通勤上班族購買（模組三）。」\n請問在 TAG 提示框架中，上述模組一、二、三分別對應了哪三大核心要素？", "option_a": "T (Temperature 溫度)、A (Accuracy 準確率)、G (Gradient 梯度)", "option_b": "T (Task 核心任務)、A (Action 具體行動與分析重點)、G (Goal 最終商業目標)", "option_c": "T (Token 標記)、A (Attention 注意力)、G (Generative 生成式)", "option_d": "T (Training 訓練)、A (Algorithm 演算法)、G (Governance 治理)", "correct_option": "B", "explanation": "・📍 對應重點章節：2.2 提示工程 原則 咒語 框架提示與三大思維推理\n\n【💡 生活化範例 ／ 具體情境秒懂】\nTAG 是最適合專案管理與商業目標推進的提問公式：\n・T - Task（任務） ＝「指派什麼工作？」：例如寫 3 篇耳機文案。\n・A - Action（行動） ＝「採取什麼具體動作或切入點？」：例如分析降噪分貝數據、融入捷運通勤場景。\n・G - Goal（目標） ＝「為了達到什麼最終商業目的？」：例如提升預購轉換率、打動年輕上班族。有任務、有行動、有明確目標，AI 的輸出自然命中靶心！\n\n【🔑 正確選項秒殺題眼】\n・看到「提示框架 TAG 縮寫涵義」 ➔ 秒選 「Task（任務）、Action（行動）、Goal（目標）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：溫度、準確率與梯度是演算法名詞，非 TAG 提示框架。\n・✅ (B) 為什麼對：完全符合教材 2.2 節常見框架 TAG 的字首定義（Task, Action, Goal）。\n・❌ (C) 為什麼錯：Token 與 Attention 是 Transformer 模組名詞。\n・❌ (D) 為什麼錯：訓練與治理是機器學習生命週期術語。", "has_caveat": 0, "caveat_note": null}, {"id": 442, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "歐盟《人工智慧法案（EU AI Act）》將所有 AI 系統劃分為四級風險金字塔。其中金字塔最頂端的「第一級：不可接受的風險（Prohibited Risk）」明文列出在歐盟境內「完全嚴格禁止部署與使用」的違法行為。\n除了眾所皆知的「政府社會信用評分系統（Social Scoring）」之外，下列哪一項行為也明確屬於歐盟法案中完全禁止（Prohibited）的嚴重違規 AI 應用？", "option_a": "於電玩遊戲中設計會主動向玩家打招呼的虛擬村民 NPC", "option_b": "利用潛意識技術（Subliminal Techniques）操縱人類認知、或是故意利用年齡與身心障礙等特定弱點進行心理扭曲剝削，進而造成該人或他人實質生理或心理損害的 AI 系統", "option_c": "於電子郵件軟體中使用關鍵字過濾垃圾廣告信", "option_d": "使用 AI 協助醫師進行骨折 X 光片診斷", "correct_option": "B", "explanation": "・📍 對應重點章節：4.1 AI 治理核心原則 歐盟 AI 法案與治理制度\n\n【💡 生活化範例 ／ 具體情境秒懂】\n歐盟對「第一級不可接受風險（完全禁止）」畫出的絕對紅線，在於「踐踏人性尊嚴與洗腦操縱」：\n・兩大絕對禁止的天條：\n  1. 政府全面監控打分數：如社會信用評分系統（Social Scoring）。\n  2. 認知洗腦與弱點剝削（Subliminal Manipulation）：例如在兒童卡通中偷偷嵌入人眼察覺不到的潛意識閃爍訊息，誘導弱勢兒童做出危險自殘行為或強迫購買！這種利用潛意識操控人類自由意志、傷害身心的邪惡應用，歐盟直接「全面禁止（Prohibited）」！\n\n【🔑 正確選項秒殺題眼】\n・看到「歐盟第一級不可接受風險（完全禁止）的範疇」 ➔ 秒選 「社會信用評分系統 ＋ 潛意識認知操縱與剝削弱點傷害身心之系統」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：電玩 NPC 屬於第四級「最低風險」，免受規範。\n・✅ (B) 為什麼對：精準命中 EU AI Act 第 5 條明文禁止的潛意識認知操縱與弱點剝削行為。\n・❌ (C) 為什麼錯：垃圾信過濾屬於第四級「最低風險」。\n・❌ (D) 為什麼錯：醫療診斷屬於第二級「高風險（需嚴格審查）」，但並未完全禁止。", "has_caveat": 0, "caveat_note": null}, {"id": 443, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某創意設計團隊在進行新產品概念發想時，面臨腦袋一片空白的創作瓶頸。設計主管引進了教材第 3.1 節推薦的「曼陀羅思考法（Mandala Chart / 九宮格思考法）」：\n在九宮格的正中央寫下核心主題（例如：「智慧環保咖啡杯」），接著在四周的 8 個格子裡分別發散出二級維度（如材質、保溫、便攜、智能監測、回收、價格、清潔、外觀），再以這 8 個維度向外擴展，最終提煉出數十組精準的提示詞（Prompt）輸入給 AI 進行概念圖與文案生成。\n請問曼陀羅思考法在生成式 AI 創作流程中，最主要的作用是什麼？", "option_a": "專門用來計算均方誤差（MSE）以更新神經網路權重", "option_b": "協助創作者擺脫思維定勢，透過「由核心向外結構化發散」的思維架構，有條理地打造創作靈感、擴展多維度關鍵字並產出結構化 Prompt", "option_c": "將圖片強制壓縮為 16×16 拼圖網格", "option_d": "自動將繁體中文翻譯成日文", "correct_option": "B", "explanation": "・📍 對應重點章節：3.1 文字與商業文案生成應用\n\n【💡 生活化範例 ／ 具體情境秒懂】\n大谷翔平高中時用來規劃人生目標的「九宮格」，在 AI 提示詞發想上同樣是神器：\n・大腦卡死時的靈感推進器 ＝ 曼陀羅思考法（九宮格）：\n  ・當你只對 AI 說「設計咖啡杯」，AI 只會生出最平庸的杯子；\n  ・但當你畫出九宮格，從「材質、清洗、便攜」向四周輻射發散，你就能一口氣提取出「奈米疏水塗層、可折疊矽膠手把、太陽能自加熱」等超棒的關鍵詞，組合成精準高階的 Prompt，這就是教材 3.1 節曼陀羅思考法的精髓！\n\n【🔑 正確選項秒殺題眼】\n・看到「曼陀羅思考法（Mandala Chart 九宮格）於 AI 的應用」 ➔ 秒選 「發散思考、打造靈感、擴展提煉多維度提示詞（Prompt）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：MSE 是演算法損失函數，與人類思考框架無關。\n・✅ (B) 為什麼對：精準對應教材 3.1 節利用曼陀羅思考法打造創作靈感與擴展提示詞的定位。\n・❌ (C) 為什麼錯：16×16 切塊是 ViT 圖像前處理。\n・❌ (D) 為什麼錯：九宮格是思考發想工具，非機器翻譯軟體。", "has_caveat": 0, "caveat_note": null}, {"id": 444, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在大語言模型文字生成的採樣參數中，相較於名額固定死板的「Top-K 取樣」，許多資深工程師更偏好使用「Top-P 取樣（又稱核取樣 Nucleus Sampling）」。\n請問 Top-P 取樣在演算法機制上，相比於 Top-K 展現的最大動態優勢是什麼？", "option_a": "Top-P 永遠只挑選第一個字母大寫的單字", "option_b": "Top-P 不是固定死板的入圍人數（K 個），而是從機率最高的字開始「累加機率直到達到閾值 P%（如 0.8 / 80%）」；當語境非常確定時（機率集中），入圍字數會自動縮減為少數 1~2 個；當語境充滿多種可能性時（機率平坦），入圍字數會自動擴展，動態適應語境！", "option_c": "Top-P 會自動將輸出文字翻譯成俄文", "option_d": "Top-P 能夠將顯卡記憶體瞬間擴充十倍", "correct_option": "B", "explanation": "・📍 對應重點章節：1.5 Transformer 自注意力與解碼參數\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「固定錄取名額 vs 達到門檻全錄取」來秒懂 Top-K 與 Top-P：\n・Top-K ＝「永遠死板錄取前 5 名」：\n  ・如果今天考題是「台灣最高的山是...」，第 1 名「玉山」機率高達 99%，後面第 2~5 名全是陪榜的雜訊詞（如阿里山、富士山、香蕉）。但因為你設了 K=5，這些爛答案依然會被迫入圍，容易讓 AI 發神經講錯！\n・Top-P（核取樣） ＝「累積考分達到 80% 就拉封鎖線！」：\n  ・在上面「玉山（99%）」的例子裡，玉山一個字就超過 80% 了，候選名單立刻縮減為只有玉山 1 個，後面雜訊全不看！\n  ・但如果遇到開放問題（「休閒時你喜歡...」），「看書(30%)、聽歌(30%)、運動(25%)」，名單會動態擴展為 3 個字！這種能伸縮的彈性就是 Top-P 的絕對優勢！\n\n【🔑 正確選項秒殺題眼】\n・看到「Top-P（核取樣）相比 Top-K 的核心優勢」 ➔ 秒選 「累加機率達到 P%、能依語境動態伸縮候選詞數量」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Top-P 是數學機率累積，與大小寫無關。\n・✅ (B) 為什麼對：精闢剖析 Top-P 根據機率分佈動態伸縮候選池（Nucleus Sampling）以兼顧精準與多樣性的核心機制。\n・❌ (C) 為什麼錯：採樣參數不控制語言翻譯。\n・❌ (D) 為什麼錯：軟體解碼算法無法擴充物理顯存容量。", "has_caveat": 0, "caveat_note": null}, {"id": 445, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "2023 年全球音樂界爆發了著名的「AI 假 Drake 風波」：匿名創作者 Ghostwriter 利用 AI 聲音克隆技術，偽造了饒舌天王 Drake 與 The Weeknd 的招牌聲線、語調與演唱風格，生成了一首爆紅歌曲《Heart on My Sleeve》，並上架至 Spotify 與 Apple Music 等各大平台，迅速獲得數百萬次播放，隨後被環球音樂集團（UMG）強烈抗議並全面下架。\n請問在這起指標性事件中，著作權與智慧財產權法專家指出，雖然 AI 創作的「詞曲旋律」可能為原創，但這項未經授權的聲音克隆行為，最直接侵害了藝人的哪一項重大法律權利？", "option_a": "侵害了藝人的專利發明權", "option_b": "侵害了藝人的「聲音公開權（Right of Publicity / 形象權）」與人格權；法律明確保護名人的姓名、聲音、肖像等個人特徵免於遭他人未經授權商業利用", "option_c": "侵害了藝人的商標註冊權", "option_d": "違反了歐盟能源效率標準", "correct_option": "B", "explanation": "・📍 對應重點章節：4.3 智慧財產權 深度偽造與 AI 系統四大風險\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這是生成式 AI 音樂與聲音克隆領域最具歷史意義的里程碑案件：\n・為什麼詞曲自己寫的還會違法？：\n  ・創作者辯稱：「詞是我寫的、曲是我編的，我沒有抄襲 Drake 的任何一首歌！」\n・法律的致命一擊 ＝「聲音是名人的人格資產（公開權 Right of Publicity）！」：\n  ・Drake 花了幾十年打造出的獨特嗓音、唱腔與發音習慣，是他的個人商業形象（Right of Publicity / 肖像與聲音公開權）！\n  ・未經本人授權，偷取他的聲音特徵來吸引眼球賺取流量，直接侵害了藝人的姓名、肖像與聲音人格權益，成為全球推動 AI 聲音版權法規的催化劑！\n\n【🔑 正確選項秒殺題眼】\n・看到「AI 假 Drake 事件、聲音克隆爭議」 ➔ 秒選 「侵害藝人之聲音公開權（Right of Publicity）與人格權」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：人的聲音不能申請專利。\n・✅ (B) 為什麼對：精準對應教材 4.3 節關於 AI 克隆名人聲音侵害形象公開權（Right of Publicity）的核心法理。\n・❌ (C) 為什麼錯：本案核心在於聲音複製，非商標侵權。\n・❌ (D) 為什麼錯：與能源標準無關。", "has_caveat": 0, "caveat_note": null}, {"id": 446, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某軟體工程團隊在評測大語言模型生成 Python 代碼時發現一個奇特現象：\n純大語言模型寫出來的程式碼，乍看之下結構很漂亮，但直接執行時常會因為少了一個閉合右括號、縮排不對齊、或是變數名稱呼叫未定義而直接引發 SyntaxError 語法崩潰。\n為了讓 AI 編程工具能真正具備理解「程式碼上下文邏輯、函數作用域與語法正確性」的能力，現代 IDE 輔助助手必須在底層結合哪一項關鍵技術，將原始代碼轉化為結構嚴密的「抽象語法樹（AST）」？", "option_a": "語音識別聲碼器", "option_b": "語法分析器（Parser）", "option_c": "盒鬚圖常態分佈器", "option_d": "圖片超解析放大器", "correct_option": "B", "explanation": "・📍 對應重點章節：2.3 生成式 AI 進階強化 RAG RLHF LoRA 與語法分析器\n\n【💡 生活化範例 ／ 具體情境秒懂】\n大語言模型只是個「文字接龍天才」，它根本不懂什麼叫編譯器：\n・為什麼要有 語法分析器（Parser） 當守門員？：\n  ・LLM 猜代碼就像用英文寫詩，偶爾括號忘記關（print(\"hello\" 沒加右括號）。\n  ・引入 語法分析器（Parser） 後，它會像嚴謹的文法老師，把代碼拆解成抽象語法樹（AST），檢查每一根樹枝（變數、迴圈、括號）有沒有對齊！是強化 AI 理解程式上下文邏輯的唯一正解（排除 GNN、語意轉換器、語音模型）！\n\n【🔑 正確選項秒殺題眼】\n・看到「強化 AI 理解程式上下文邏輯、轉換為抽象語法樹（AST）」 ➔ 秒選 「語法分析器（Parser）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：聲碼器是聲音波形合成工具。\n・✅ (B) 為什麼對：完全符合教材 2.3 節語法分析器（Parser）將代碼轉為 AST 以強化邏輯的核心考點。\n・❌ (C) 為什麼錯：盒鬚圖是統計圖表。\n・❌ (D) 為什麼錯：超解析是圖像放大技術。", "has_caveat": 0, "caveat_note": null}, {"id": 447, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在 1980 年代類神經網路的演進史中，受限波爾茲曼機（RBM, Restricted Boltzmann Machine） 佔據了極具啟發性的地位。它是一種基於能量模型（Energy-based Model）的雙層隨機生成神經網絡，由一個可見層（Visible Layer）與一個隱藏層（Hidden Layer）組成。\n請問 RBM 在早期深度學習發展中最著名的歷史貢獻是什麼？", "option_a": "它是全世界第一個發明 Transformer 注意力機制的模型", "option_b": "它能在完全不需要標準答案標籤的情況下，透過對比散度（CD）自動摸索資料特徵的無向機率分佈，在 2006 年被 Geoffrey Hinton 等人成功用於深層置信網絡（DBN）的「逐層無監督預訓練（Pre-training）」，為現代深度學習破冰！", "option_c": "它是專為 TikTok 生成 15 秒直式短影音設計的工具", "option_d": "它徹底解決了歐盟 AI 法案對高風險系統的所有管制", "correct_option": "B", "explanation": "・📍 對應重點章節：1.0 AI 技術發展時間軸與地圖、1.1 神經網路基礎 感知器與反向傳播\n\n【💡 生活化範例 ／ 具體情境秒懂】\n在深度學習還被視為天方夜譚的黑暗時代，RBM 就像是「神經網路的熱身教練」：\n・為什麼早期深層網路訓練不起來？：\n  ・因為層數一多，隨機給初始權重會導致反向傳播訊號直接消失，根本學不會。\n・RBM 的歷史破冰貢獻 ＝「先一層一層無監督熱身預訓練！」：\n  ・RBM 不需要人工標籤，自己看著資料就能把最核心的特徵規律抓出來！\n  ・2006 年深度學習教父 Hinton 拿 RBM 像堆積木一樣，一層一層先幫深層網路預熱訓練好，再用反向傳播微調，成功救活了沉寂多年的深度學習！\n\n【🔑 正確選項秒殺題眼】\n・看到「受限波爾茲曼機（RBM）的定位」 ➔ 秒選 「隨機生成式雙層能量網路、無標籤學習機率分佈、幫深層網路暖身預訓練」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Transformer 誕生於 2017 年，RBM 誕生於 1980 年代。\n・✅ (B) 為什麼對：精準對應教材 1.1 節關於 RBM 基於能量的隨機生成神經網路、無標籤摸索分佈與早期預訓練的定義。\n・❌ (C) 為什麼錯：短影音生成屬於現代多模態擴散模型範疇。\n・❌ (D) 為什麼錯：早期演算法與現代法律管轄體系無關。", "has_caveat": 0, "caveat_note": null}, {"id": 448, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國金融顧問團隊每週需要利用 AI 簡報工具，為董事會自動產製「每週全球金融市場動態簡報」。在營運半年後，團隊建立了兩大品管守則：\n・守則一（防止內容千篇一律）：董事長反應簡報讀起來千篇一律，為了讓每週簡報能緊跟即時市場、動態變化不重複，團隊採取了關鍵措施。\n・守則二（防止數據算錯出醜）：為確保簡報中的通膨率數字與財務估值完全正確無誤，團隊建立了一道關鍵防線。\n請問依據教材第 3.5 節的實務規範，守則一與守則二標準推薦的解決手段分別為何？", "option_a": "守則一：刪除所有歷史範本 ； 守則二：將字體全部放大", "option_b": "守則一（避免簡報內容重複）：定期更新數據源 ； 守則二（確保文字與數據準確性）：使用自動校對工具（並輔以人工審查修改）", "option_c": "守則一：把溫度設為 0 ； 守則二：關閉伺服器電源", "option_d": "守則一：減少提示詞長度 ； 守則二：使用黑白點陣圖", "correct_option": "B", "explanation": "・📍 對應重點章節：3.5 簡報生成流程與工具組合\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這是教材 3.5 節針對 AI 簡報產製的兩大標準作業規範（SOP）：\n・為什麼每週簡報會千篇一律？（水庫沒換水！）：\n  ・如果背景資料庫永遠是舊的，AI 怎麼生當然都一樣！所以避免重複唯一解法 ＝ 定期更新數據源！\n・怎麼保證簡報數據 100% 準確？（請校對儀器把關！）：\n  ・人類眼睛看久了會眼花，必須 使用自動校對工具 進行數據交叉核對，最後再由專人審查確認！\n\n【🔑 正確選項秒殺題眼】\n・看到「如何避免 AI 簡報內容重複」 ➔ 秒選 「定期更新數據源」\n・看到「如何確保 AI 簡報內容與數據準確」 ➔ 秒選 「使用自動校對工具」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：刪除範本與放大字體無法解決數據陳舊與算錯問題。\n・✅ (B) 為什麼對：完全吻合教材 3.5 節高頻考點：定期更新數據源防重複 ＋ 自動校對工具保準確。\n・❌ (C) 為什麼錯：溫度設為 0 反而會讓輸出更加固定死板。\n・❌ (D) 為什麼錯：減少提示詞或改點陣圖背離商務簡報目標。", "has_caveat": 0, "caveat_note": null}, {"id": 449, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在機器學習的體系地圖中，學習範式（Learning Paradigms）決定了模型「靠什麼方式吸收知識」。\n請比對以下五種經典場景，哪一項配對完全符合機器學習的五大學習範式？", "option_a": "監督式學習：全無標籤，模型自己擲骰子分群", "option_b": "自監督學習（Self-Supervised Learning）：資料本身沒有人工標籤，模型自己將文本遮蔽（克漏字）或遮蔽下一字，自己生出考題自己練，是現代大語言模型（LLM）海量預訓練的核心基石！", "option_c": "半監督式學習：要求所有資料都必須經過三位專家逐字打勾標註", "option_d": "強化學習（RL）：只能用來處理 Excel 表格中的純數值相加", "correct_option": "B", "explanation": "・📍 對應重點章節：1.13 五大學習範式與經典演算法\n\n【💡 生活化範例 ／ 具體情境秒懂】\n五大學習範式的本質區分全在「標籤從哪來」：\n・1. 監督式學習：全有人工標籤（老師手把手改作業）。\n・2. 非監督式學習：全無標籤（自己找鄰居抱團分群，如 K-Means）。\n・3. 自監督學習（Self-Supervised） ＝「自己出克漏字考自己！」：\n  ・沒人有空幫 5 兆個單字標答案！LLM 自己把句子最後一個字遮起來（文字接龍），自己當考官自己考，這是 GPT 與 BERT 預訓練的絕對核心！\n・4. 半監督式學習：少量有標籤 ＋ 大量無標籤（節省標註費）。\n・5. 強化學習：無標籤，靠環境獎懲加扣分摸索打遊戲！\n\n【🔑 正確選項秒殺題眼】\n・看到「自監督學習（Self-Supervised Learning）核心本質」 ➔ 秒選 「無人工標籤、資料自己生出題與答案、LLM 預訓練核心」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：監督式學習必須全部具備人工標註的標準答案標籤。\n・✅ (B) 為什麼對：精闢點出自監督學習依靠克漏字填空與文字接龍成為 LLM 預訓練基石的核心事實。\n・❌ (C) 為什麼錯：半監督式學習特徵為「少量標籤 ＋ 大量無標籤」，非全標註。\n・❌ (D) 為什麼錯：強化學習廣泛應用於機器人控制、下棋與對齊（RLHF），非純數值相加。", "has_caveat": 0, "caveat_note": null}, {"id": 450, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在個人資料去識別化（De-identification）技術中，為了兼顧資料隱私與大數據分析價值，資安長向團隊解釋了「假名化（Pseudonymization）」與「匿名化（Anonymization）」的關鍵法律邊界：\n・手法甲：將病患的姓名身分證號替換成一串代號（如 ID_9527），但在資安長的保險箱裡，留有一張「代號對照密鑰表」，若有醫療緊急需求，憑密鑰仍能反向還原出原始病患身分。\n・手法乙：透過泛化、雜訊擾動等不可逆技術，徹底且永久切斷資料與自然人之間的任何關聯，即使拿到全世界所有資料庫也永遠「無法復原反查」身分。\n請問依據歐盟 GDPR 與各國個人資料保護法規，上述手法甲與手法乙分別稱為什麼？哪一種處理後的資料「不再屬於個人資料、不受個資法嚴格監管」？", "option_a": "手法甲是匿名化；手法乙是假名化；手法甲不受監管", "option_b": "手法甲為「假名化（Pseudonymization，具備可逆性，仍受個資法嚴格監管）」；手法乙為「匿名化（Anonymization，永久不可逆，不再被視為個人資料，不受個資法限制）」", "option_c": "兩者皆是資料離散化，且皆不受任何法律約束", "option_d": "兩者皆屬於歐盟完全禁止的第一級不可接受風險", "correct_option": "B", "explanation": "・📍 對應重點章節：4.4 資料治理 隱私保護技術與全球個資法規\n\n【💡 生活化範例 ／ 具體情境秒懂】\n去識別化的兩大門派，差別在於「手裡有沒有握著解密鑰匙」：\n・手法甲：假名化（Pseudonymization） ＝「戴面具（手裡有鑰匙可以脫面具）」：\n  ・把王大明改成代號 9527。雖然外人一眼看不出是誰，但因為你留著對照表（可逆），駭客如果偷到對照表依然能破解！所以法律規定：假名化後的資料「依然算是個人資料」，仍然受個資法管轄！\n・手法乙：匿名化（Anonymization） ＝「直接把面具熔成鐵水（永遠不可逆！）」：\n  ・徹底切斷連結，神仙也查不出是誰！因為已經不再關聯到特定個人，所以「不再被視為個人資料」，不受個資法限制！\n\n【🔑 正確選項秒殺題眼】\n・看到「假名化 vs 匿名化區別」 ➔ 秒選 「假名化可逆仍屬個資受管；匿名化永久不可逆不再屬個資不受限」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：把可逆的假名化與不可逆的匿名化顛倒了。\n・✅ (B) 為什麼對：精準命中 GDPR 第 4 條與第 26 條關於假名化仍屬個資、匿名化排除個資適用的法定標準。\n・❌ (C) 為什麼錯：假名化仍受嚴格個資法約束。\n・❌ (D) 為什麼錯：去識別化是合規保護技術，非禁止風險。", "has_caveat": 0, "caveat_note": null}, {"id": 451, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "大語言模型（LLM）在日常商業辦公中展現出強大的通用性。教材第 2.1 節將其所有日常文字任務高度抽象歸納為「三大基本應用模式」：\n1. 縮減（Reduction）\n2. 轉換（Transform）\n3. 擴展（Expansion）\n請檢查以下三個同仁的任務安排：\n・任務一：將 50 頁的勞資爭議調解會議紀錄，提煉出 3 點爭點結論。\n・任務二：將工程師寫的 Python 代碼自動轉寫為 Java 代碼，並將中文規格書翻譯為西班牙文。\n・任務三：僅給予一句宣傳主題「夏日清涼氣泡水」，讓 AI 自動擴寫出包含 500 字的故事腳本與三封行銷促銷信。\n請問任務一、二、三分別精確對應了哪一項 LLM 應用模式？", "option_a": "任務一：擴展 ／ 任務二：縮減 ／ 任務三：轉換", "option_b": "任務一對應「縮減（多 ➔ 少）」；任務二對應「轉換（形式/語言切換）」；任務三對應「擴展（少 ➔ 多）」", "option_c": "任務一：轉換 ／ 任務二：擴展 ／ 任務三：縮減", "option_d": "三者皆屬於預訓練", "correct_option": "B", "explanation": "・📍 對應重點章節：2.1 大語言模型 (LLM) 原理 微調與應用模式\n\n【💡 生活化範例 ／ 具體情境秒懂】\n看資訊量的進出變化秒判斷三大應用模式：\n・任務一（多 ➔ 少）＝ 縮減（Reduction）：50 頁長篇大論 ➔ 變成 3 點精煉摘要。\n・任務二（A 換成 B）＝ 轉換（Transform）：Python 轉 Java、中文翻西文、口語轉公文，資訊量差不多，但外衣換了！\n・任務三（少 ➔ 多）＝ 擴展（Expansion）：給一句話主題 ➔ 膨脹成長篇企劃與 3 封長信！\n\n【🔑 正確選項秒殺題眼】\n・看到「會議摘要（縮減）、代碼語言翻譯（轉換）、一句主題寫長文（擴展）」 ➔ 秒選 (B)\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：把縮減、轉換、擴展的對應順序全部打亂了。\n・✅ (B) 為什麼對：精確命中教材 2.1 節關於大語言模型三大基本應用模式的分類。\n・❌ (C) 為什麼錯：對應順序顛倒。\n・❌ (D) 為什麼錯：三者皆為推論應用任務，非預訓練。", "has_caveat": 0, "caveat_note": null}, {"id": 452, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某歷史博物館正在對一批清末民初的老照片進行數位修復與展示。修復團隊評估了兩種不同的 AI 影像增強技術：\n・技術甲（黑白轉彩色 Colorization）：利用深度學習判斷老照片中的物體屬性，為灰階老照片合理塗上天空藍色、皮膚肉色與衣服顏色。\n・技術乙（超解析重建 Super-Resolution, SR）：針對原始解析度極低（例如只有 320 × 240）、模糊成馬賽克的老照片，利用 AI 推理並補齊遺失的細節邊緣與毛孔紋理，生成銳利高清的 4K 大圖。\n請問在認證考試教材第 1.7 節中，如果考題問：「下列哪一種技術是唯一能『使圖片細節更清晰、提升解析度』的正確手段？」，應該選擇哪一個？為什麼不能選技術甲？", "option_a": "應選技術甲；因為塗上彩色之後解析度就會自動提升十倍", "option_b": "應選「技術乙：超解析重建（SR）」；因為技術甲（黑白轉彩色）只是替灰階像素填補色彩通道，圖片原本模糊的解析度與像素細節完全沒有增加，唯有「超解析重建」才能真正補齊遺失細節、大幅提升影像清晰度！", "option_c": "兩者都無法提升清晰度，唯有降低解析度才能提升清晰度", "option_d": "應選單層感知器", "correct_option": "B", "explanation": "・📍 對應重點章節：1.7 擴散模型 (Diffusion)\n\n【💡 生活化範例 ／ 具體情境秒懂】\n這是教材 1.7 節專門設計的「影像處理干擾項大破解」：\n・塗顏色不等於變清楚（黑白轉彩色 ❌）：\n  ・一張模糊的黑白貓咪照片，塗上橘色後，只是一隻「模糊的橘貓」！馬賽克還是馬賽克！\n・真正的畫質翻倍神器 ＝ 超解析重建（Super-Resolution, SR） ✅：\n  ・AI 腦補出毛髮的纖細線條、眼睛的反光，把低解析度小圖重建為高清大圖，是「使圖片細節更清晰」的唯一正解！\n\n【🔑 正確選項秒殺題眼】\n・看到「使圖片細節更清晰、提升解析度」 ➔ 秒選 「超解析重建（SR, Super-Resolution）」（排除黑白轉彩色、模糊處理、降低解析度）\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：彩色填色無法增加空間幾何解析度。\n・✅ (B) 為什麼對：精準點破「黑白轉彩色」僅塗顏色不增細節，而「超解析重建（SR）」才是提升清晰度正解的核心考點。\n・❌ (C) 為什麼錯：降低解析度只會讓圖片變成馬賽克。\n・❌ (D) 為什麼錯：感知器無影像超解析重建能力。", "has_caveat": 0, "caveat_note": null}, {"id": 453, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "依據教材第 3.4 節「影片生成流程與應用場景」，從創作者腦中的一個點子到最終輸出一段精彩的 AI 影片，標準的工作流依序包含「5 大實作步驟」。\n請問下列哪一個選項正確排列了這 5 大步驟的標準順序？", "option_a": "選擇風格 ➔ 預覽輸出 ➔ 輸入提示詞 ➔ 加入字幕 ➔ 設定片長", "option_b": "標準 5 大步驟為：① 輸入提示詞 ➔ ② 選擇影片風格（如動畫、電影感、像素等） ➔ ③ 設定片長跟比例（4~5秒，16:9 橫式或 9:16 直式） ➔ ④ 加入字幕與語音 ➔ ⑤ 預覽與輸出影片", "option_c": "單元測試 ➔ 盒鬚圖 ➔ 均方誤差 ➔ 獨熱編碼 ➔ 結束", "option_d": "反向傳播 ➔ 梯度下降 ➔ 池化層 ➔ 卷積層 ➔ 輸出", "correct_option": "B", "explanation": "・📍 對應重點章節：3.4 影片生成流程與應用場景\n\n【💡 生活化範例 ／ 具體情境秒懂】\n製作一段 AI 影片就像「點餐到出餐的 5 步驟」：\n・步驟 ① 輸入提示詞：寫好劇本分鏡提示（Prompt）。\n・步驟 ② 選擇風格：選電影寫實風、動漫風還是水墨風。\n・步驟 ③ 設定片長與比例：設定片長（通常 4~5 秒）與比例（YouTube 16:9 或 Reels 9:16）。\n・步驟 ④ 加入字幕與語音：配上 TTS 旁白與自動字幕。\n・步驟 ⑤ 預覽與輸出：最後檢查無誤點擊匯出下載！\n\n【🔑 正確選項秒殺題眼】\n・看到「AI 影片生成 5 大實作步驟順序」 ➔ 秒選 「輸入提示詞 ➔ 選風格 ➔ 設片長比例 ➔ 加字幕語音 ➔ 預覽輸出」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：未輸入提示詞不可能先選擇輸出，順序混亂。\n・✅ (B) 為什麼對：完全符合教材 3.4 節明確列出的影片生成 5 大實作步驟標準順序。\n・❌ (C) 為什麼錯：此為軟體測試與統計名詞混雜。\n・❌ (D) 為什麼錯：此為神經網路訓練底層技術。", "has_caveat": 0, "caveat_note": null}, {"id": 454, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "傳統循環神經網路（RNN）在處理長文本時，有一個致命的數學弱點——「梯度消失（Vanishing Gradient）」。\n請問當我們把傳統 RNN 沿著時間軸（Time Steps t = 1, 2, ... T）一路展開時，為什麼在反向傳播計算開頭第 1 個字詞的梯度時，訊號會發生毀滅性的衰減？其數學本質是什麼？", "option_a": "因為所有的字詞全部自動變成了大寫", "option_b": "因為在長時序反向傳播時，誤差梯度必須連續跨越時間步乘上權重矩陣 Wᵀ；若矩陣特徵值小於 1，梯度訊號將以「指數級速度（Exponential Decay）迅速衰減趨近於 0」，導致模型完全記不住長距離以前的主詞資訊！", "option_c": "因為顯示卡晶片被強行降頻", "option_d": "因為輸入資料包含了太多布林值", "correct_option": "B", "explanation": "・📍 對應重點章節：1.2 CNN vs RNN\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「把一個小於 1 的小數連續乘 100 次」來秒懂 RNN 的梯度消失：\n・跨越時間步的指數衰減悲劇：\n  ・假設每次傳遞衰減為 0.9。跨過 50 個單字後：0.9⁵⁰ ≈ 0.005！\n  ・跨過 100 個字後，訊號變成 0.9¹⁰⁰ ≈ 0.00002（指數級衰減！）！\n  ・當反向傳播傳到第 1 個字時，梯度早就歸零了，神經網路根本不知道開頭的主詞是誰，這也是後來催生 LSTM 傳送帶門控 與 Transformer 自注意力 的根本動機！\n\n【🔑 正確選項秒殺題眼】\n・看到「傳統 RNN 梯度消失的數學本質」 ➔ 秒選 「沿時序反向傳播時矩陣連乘導致梯度呈指數級衰減（Exponential Decay）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：文字大小寫與反向傳播梯度矩陣連乘無關。\n・✅ (B) 為什麼對：精準揭示 RNN 因長時序展開導致梯度連乘呈指數級衰減的數學本質。\n・❌ (C) 為什麼錯：硬體時脈降頻與演算法數學本質無關。\n・❌ (D) 為什麼錯：布林值與長時序梯度衰減無因果關係。", "has_caveat": 0, "caveat_note": null}, {"id": 455, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在各國政府與監管機構應對生成式 AI 的治理政策中，英國、日本等國家大力提倡「敏捷治理（Agile Governance）」與建立「監管沙盒（Regulatory Sandbox）」機制。\n請問「監管沙盒（Regulatory Sandbox）」在 AI 治理領域中的具體運作意義為何？", "option_a": "在海灘上建立實體沙堡來放置超級電腦", "option_b": "在特定受控、風險可控且有監管機構密切輔導的真實市場環境中，允許創新 AI 企業在一定期限內「暫時豁免部分嚴格法規限制」進行新技術測試，讓監管機構邊看邊學、在不扼殺創新的前提下摸索適當的法規邊界", "option_c": "強制所有 AI 公司必須將原始碼全數銷毀", "option_d": "將所有模型訓練資料永久加密禁止讀取", "correct_option": "B", "explanation": "・📍 對應重點章節：4.2 AI 倫理五大原則與各國治理規範\n\n【💡 生活化範例 ／ 具體情境秒懂】\n「監管沙盒（Regulatory Sandbox）」就像小孩子在公園沙坑裡玩耍：\n・在沙坑裡摔倒不會受傷（安全試驗田！）：\n  ・AI 新科技跑得太快，舊法律根本跟不上；如果一開始就拿舊法律重罰，沒人敢創新。\n  ・監管沙盒的妙處：圈出一塊小操場，讓新創公司在有裁判（金管會／監管機構）盯著的情況下，暫時不受部分舊法規束縛放膽測試新 AI 應用！既能保護消費者安全，又能讓國家科技快速起飛！\n\n【🔑 正確選項秒殺題眼】\n・看到「監管沙盒（Regulatory Sandbox）運作意義」 ➔ 秒選 「在受控安全環境中暫時豁免部分法規、邊測試邊摸索合規邊界、兼顧創新」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：純屬望文生義的荒謬誘答項。\n・✅ (B) 為什麼對：精確闡述金融與 AI 治理中監管沙盒兼顧創新活力與風險防控的核心制度設計。\n・❌ (C) 為什麼錯：銷毀代碼違反軟體開發常理。\n・❌ (D) 為什麼錯：永久禁止讀取無法進行任何 AI 訓練。", "has_caveat": 0, "caveat_note": null}, {"id": 456, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某企管顧問在向董事會提出跨國併購策略提案前，希望對提案內容進行高強度的壓力測試（Stress Testing）。顧問在給大語言模型的提示詞末尾加上了一句特殊的指導性咒語（Directive Prompt）：\n「請扮演一位極度挑剔、保守且專門唱反調的投資委員會委員，從法規障礙、現金流斷裂、文化衝突等各個苛刻角度，全力挑出這份併購企劃書的漏洞與致命缺陷！」\n請問在提示工程中，這種主動要求 AI 「扮演反對者、唱反調的角色（Devil's Advocate）」 的特殊咒語，最能帶來什麼實務價值？", "option_a": "能讓 AI 直接黑入被併購公司的資料庫", "option_b": "打破人類決策者的「確認偏誤（Confirmation Bias）」與思維盲區，進行紅隊演練（Red Teaming），在正式提案前提前暴露潛在風險並強化方案穩健性", "option_c": "能強制將模型的輸出字數減少至 1 個字", "option_d": "能將文字自動轉換為 3D 列印模型", "correct_option": "B", "explanation": "・📍 對應重點章節：2.2 提示工程 原則 咒語 框架提示與三大思維推理\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「在拳擊比賽前找魔鬼陪練員」來理解這句咒語：\n・人類容易盲目樂觀（確認偏誤）：自己寫的企劃案，怎麼看都覺得天衣無縫。\n・咒語「請扮演唱反調的角色（Devil's Advocate）」＝「請全世界最刁鑽的毒舌評審挑毛病！」：\n  ・AI 不會跟你客氣，它會從各個陰暗刁鑽的角度狠狠批鬥你的提案。\n  ・這樣在正式見到大客戶或老闆之前，你早就把所有弱點修補好了，這就是「紅隊演練與風險壓力測試」的最大價值！\n\n【🔑 正確選項秒殺題眼】\n・看到「咒語：請扮演唱反調的角色（Devil's Advocate）」 ➔ 秒選 「打破思維盲區與確認偏誤、進行紅隊壓力測試、提前暴露風險」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：提示詞無法進行非法駭客入侵。\n・✅ (B) 為什麼對：精準對應教材 2.2 節實用特殊咒語中「扮演唱反調角色」在決策壓力測試中的核心功能。\n・❌ (C) 為什麼錯：該咒語旨在提供批判性長篇分析，非強制縮至單字。\n・❌ (D) 為什麼錯：文字提示與 3D 列印模型無關。", "has_caveat": 0, "caveat_note": null}, {"id": 457, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在 Google 發表 BERT 之後，全球 NLP 社群為了解決其參數量大、運算慢或任務設計的不足，推出了多款經典變體。\n請比對以下三款著名 BERT 變體的設計哲學：\n1. 變體甲（DistilBERT）：由 Hugging Face 推出，利用大模型當老師教小學生的「知識蒸餾」技術，成功減輕 40% 體積、提速 60%。\n2. 變體乙（RoBERTa）：由 Meta 推出，發現 NSP 任務太簡單沒用而果斷「拿掉 NSP 任務」，改用動態遮字並擴大資料量，大幅強化語言理解能力。\n3. 變體丙（ALBERT）：由 Google 推出，透過「跨層共用參數」與分解詞嵌入矩陣，大幅減少記憶體消耗。\n請問上述三款變體的技術特徵與開發商配對，何者完全正確？", "option_a": "變體甲是 RoBERTa；變體乙是 ALBERT；變體丙是 DistilBERT", "option_b": "變體甲為 DistilBERT（知識蒸餾輕量化） ； 變體乙為 RoBERTa（拿掉 NSP 與動態遮字強化版） ； 變體丙為 ALBERT（跨層共用參數省記憶體版）", "option_c": "三款全部都是 OpenAI 推出的純解碼器影片生成模型", "option_d": "三款全部都是用來做語音克隆的聲碼器", "correct_option": "B", "explanation": "・📍 對應重點章節：1.6 NLP BERT GPT 與 LLM 演進\n\n【💡 生活化範例 ／ 具體情境秒懂】\n記住三大 BERT 變體的專屬名片：\n・DistilBERT ＝「知識蒸餾（Distillation）瘦身版」：體積少 40%、速度快 60%。\n・RoBERTa ＝「大力士強化版（Robustly Optimized）」：拿掉 NSP、狂讀更多文章、動態遮字，實力最強。\n・ALBERT ＝「輕量省錢版（A Lite BERT）」：不同樓層共用同套家具（跨層共用參數），極致省記憶體！\n\n【🔑 正確選項秒殺題眼】\n・看到「知識蒸餾縮小 40%」選 DistilBERT\n・看到「拿掉 NSP、動態遮字強化」選 RoBERTa\n・看到「跨層共用參數省記憶體」選 ALBERT\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：三款變體的名稱順序完全搞混。\n・✅ (B) 為什麼對：精準對應教材 1.6 節三大 BERT 變體的技術革新本質。\n・❌ (C) 為什麼錯：三者皆為雙向編碼器 NLP 模型，非影片生成模型。\n・❌ (D) 為什麼錯：三者皆為文字理解模型，非語音聲碼器。", "has_caveat": 0, "caveat_note": null}, {"id": 458, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某中小型電商團隊在沒有聘請專業平面設計師的情況下，需要每週產出大量社群促銷宣傳海報。團隊採用了知名的線上整合設計平台 Canva（結合 Canva AI）。\n在製作促銷圖時，小編將一張隨手用手機拍攝的商品照上傳，利用 Canva AI 的「魔術工具箱（Magic Studio）」在 3 分鐘內完成了以下三項操作：\n1. 一鍵將照片中雜亂的客廳背景抹除乾淨（AI 去背）；\n2. 將原本狹窄的直式照片向左右兩側智慧延展填補出完整的攝影棚背景（魔術擴圖 Magic Expand）；\n3. 直接套用預設的「萬聖節限時特惠」商務排版模板，並自動置入吸睛的促銷標籤與字體。\n請問依據教材第 3.2 節，Canva AI 相比於純代碼開源模型（如 Stable Diffusion 原始代碼），在商業落地中最突出的競爭優勢是什麼？", "option_a": "能用單層感知器直接修改神經網路權重", "option_b": "將「AI 生成技術（去背、擴圖、局部重繪）」與「龐大豐富的商務平面設計模板、字型與社群排版」深度無縫整合，操作門檻極低，讓非設計專業背景的行銷人員也能極速產出高品質商用視覺資產", "option_c": "完全不需要使用任何網路連線，只靠紙筆運作", "option_d": "能自動為所有圖片向智慧財產局取得人類專利權", "correct_option": "B", "explanation": "・📍 對應重點章節：3.2 圖片生成工具與應用\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「買整套精裝樣品屋 vs 自己買水泥砌磚」來理解 Canva AI：\n・底層生圖模型（如純 SD 代碼）＝ 給你一堆磚塊與水泥：功能強大，但你得自己懂參數、自己排版字體。\n・Canva AI ＝「現成的一鍵全套裝潢大賣場！」：\n  ・把 AI 生圖、去背、擴圖直接做成按鈕，旁邊放滿了幾萬套做好的 IG 貼文、DM 海報模板！\n  ・點一下去背、拖進模板、改個字體就完成，是非設計背景小編與電商團隊的極速生產力神器！\n\n【🔑 正確選項秒殺題眼】\n・看到「Canva AI 的核心商業優勢」 ➔ 秒選 「AI 生圖工具與平面設計模板排版無縫整合、非設計背景極速上手」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Canva AI 封裝了高階模型，非手動修改感知器權重。\n・✅ (B) 為什麼對：精闢點出 Canva AI 結合 AI 功能與商用平面模板生態系的落地優勢。\n・❌ (C) 為什麼錯：Canva 是標準的雲端 SaaS 平台。\n・❌ (D) 為什麼錯：AI 生成圖片無法自動取得專利。", "has_caveat": 0, "caveat_note": null}, {"id": 459, "source": "題庫10", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "【全卷終極整合驗收題】某跨國金融控股公司正在籌劃「2026 生成式 AI 全方位轉型白皮書」。為確保全公司橫跨技術、業務、資安與法務的同仁具備一致的正確認知，集團技術長主持了一場「AI 核心觀念終極大排錯」考核。\n請檢視下列四位部門主管的總結陳述，哪一位主管的觀念從頭到尾 100% 完全正確無瑕疵？", "option_a": "人資主管：「我們公司的求職履歷篩選 AI 屬於歐盟 AI 法案的『最低風險』，可以完全免受任何法規審查；且為了保證資料多樣性，我們應該把所有求職者的身分證字號明文公開發布在 Hugging Face 開源社群上。」", "option_b": "資訊長（CIO）：「在技術底層上，單層感知器受限於線性劃分而無法解決 XOR 問題，加入隱藏層的多層感知器（MLP）才突破此限制；在訓練時，反向傳播依據鏈鎖律計算梯度，梯度下降與 Adam 等最佳化器才實際動手更新權重（LDA 絕非最佳化器）；面對不平衡的金融盜刷偵測應採用 F1-score（調和平均數），連續數值預測採用 R²，翻譯與對話採用 BLEU；在大語言模型中，透過 RAG 補齊最新內部知識防範幻覺，透過 LoRA 進行低成本外掛微調，透過 RLHF 讓模型說得更好符合人類價值；在治理上，醫療與招聘系統屬歐盟『高風險』需嚴格審查，並備妥 Kill Switch 與 Rollback 機制落實跨部門全生命週期治理。」", "option_c": "風控主管：「為了徹底防止過擬合，我們在訓練模型時應該把所有的超參數與權重一律在訓練前手動設為 0；並且當客戶資料缺失比例達到 1/3 時，最好的做法是直接把整欄資料完全刪除。」", "option_d": "行銷主管：「我們用 Midjourney 輸入一句話生成的所有行銷海報，可以直接向智財局登記享有專屬個人美術著作權；而且評估客服機器人好壞時，BLEU 指標如果沒有簡短懲罰，生成的句子越短分數就會被扣得越重。」", "correct_option": "B", "explanation": "・📍 對應重點章節：第一部分～第四部分 全冊核心知識點總整合\n\n【💡 生活化範例 ／ 具體情境秒懂】\n恭喜您完成第 2 卷全部 100 道實戰情境模擬考題！這道壓軸題把第 1～4 部分的所有黃金核心脈絡與常見陷阱做了一次最華麗的大貫通：\n・感知器與反向傳播：單層無法解 XOR、反向傳播算梯度不改權重、LDA 不是最佳化器！\n・三大評估指標：不平衡分類看 F1-score（調和平均）、數值預測看 R²、文本翻譯看 BLEU！\n・LLM 強化三劍客：RAG 補知識防幻覺、LoRA 裝活動隔間低成本微調、RLHF 說得更好符合人類價值！\n・治理與法規：求職招聘與醫療屬歐盟「高風險」、純 AI 生成無著作權、配妥 Kill Switch 與 Rollback 緊急煞車！\n\n【🔑 正確選項秒殺題眼】\n・全卷第一至四部分核心知識點 100% 精準無誤的無懈可擊選項 ➔ 秒選 (B)\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：求職履歷篩選攸關就業生存，屬歐盟「高風險」而非最低風險；公開個資嚴重違反個資法。\n・✅ (B) 為什麼對：無懈可擊！從感知器歷史、反向傳播、評估指標、RAG/LoRA/RLHF 進階強化到高風險合規治理，每一個觀念全部 100% 正確！\n・❌ (C) 為什麼錯：權重不能全部初始化為 0（對稱性問題），且缺失達 1/3 絕不可直接刪除。\n・❌ (D) 為什麼錯：純 AI 生成物無著作權保護；且若無簡短懲罰，短句子在 BLEU 會拿到作弊高分而非被扣分。", "has_caveat": 0, "caveat_note": null}, {"id": 460, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國電商平台希望為其客服系統微調專屬的行銷口吻與品牌形象。工程團隊評估後發現，若針對擁有 700 億參數的開源大語言模型進行「全參數微調（Full Fine-Tuning）」，需要採購數十張高階 GPU 且儲存多個完整模型權重檔，硬體預算嚴重超支。架構師提出一項優化方案：凍結預訓練基礎模型絕大部分的原始權重，僅在模型各層的注意力矩陣旁外掛訓練極少量的低秩分解矩陣參數。請問此架構師建議採用的微調技術屬於下列何者？", "option_a": "全量指令微調（Full Instruction Fine-Tuning）", "option_b": "低秩適應微調（LoRA）", "option_c": "提示詞微調（Prompt Tuning）", "option_d": "人類回饋強化學習（RLHF）", "correct_option": "B", "explanation": "・📍 對應重點章節：2.3 生成式 AI 進階強化 RAG RLHF LoRA 與語法分析器\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「辦公大樓裝修」來理解全量微調與 LoRA 的巨大成本差異：\n・全參數微調（Full Fine-Tuning）＝「整棟大樓重新拆除骨架大翻修」：\n  ・把 700 億個參數全部解凍重新計算梯度，耗費巨額電費與頂級顯卡算力，且每次更換任務都要保存一份高達上百 GB 的新模型檔案。\n・低秩適應微調（LoRA）＝「大樓主結構完全不動，只在關鍵走廊安裝輕量活動隔間」：\n  ・凍結原本數百億的大模型權重（完全不改），只在旁邊外掛兩個很小的低秩矩陣（A 與 B）。\n  ・訓練時只更新這不到 1% 的外掛參數，單張消費級顯卡就能跑，換風格只需抽換幾十 MB 的外掛權重檔！\n\n【🔑 正確選項秒殺題眼】\n・看到「凍結大模型主體權重、低秩分解矩陣、極少量外掛參數低成本微調」 ➔ 秒選 「低秩適應微調（LoRA）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：全量指令微調會更新模型所有層級的全部參數，硬體成本最高，與題幹節省 GPU 算力預算的需求相反。\n・✅ (B) 為什麼對：LoRA（Low-Rank Adaptation）透過將權重更新分解為低秩矩陣，以不到 1% 的訓練參數達成媲美全量微調的效果，大幅降低硬體開銷。\n・❌ (C) 為什麼錯：Prompt Tuning 是在輸入嵌入層前添加虛擬 Token 向量，並非在注意力權重矩陣旁引入低秩分解結構。\n・❌ (D) 為什麼錯：RLHF 是透過獎勵模型與強化學習調整模型行為與安全價值觀，本身訓練流程極為昂貴，無法解決參數量過大的硬體成本問題。", "has_caveat": 0, "caveat_note": null}, {"id": 461, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某自駕車視覺團隊在開發深層卷積神經網路（CNN）偵測路面障礙物時遭遇嚴重瓶頸：當網路深度從 20 層堆疊至 152 層時，訓練集上的錯誤率不降反升，反向傳播的誤差訊號在傳回最淺層特徵萃取網路前就已衰減至趨近於零（發生嚴重梯度消失）。團隊希望在不縮減網路深度與模型特徵容量的前提下解決此退化問題，請問工程師最應該引入下列哪一種核心網路結構？", "option_a": "批次正規化層（Batch Normalization）", "option_b": "殘差跳接結構（Residual Skip Connection）", "option_c": "隨機丟棄層（Dropout Layer）", "option_d": "線性判別分析（Linear Discriminant Analysis）", "correct_option": "B", "explanation": "・📍 對應重點章節：1.10 模型最佳化 訓練技巧與過擬合\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「摩天大樓傳話與逃生梯」來理解深層網路的梯度傳遞：\n・普通超深層網路（如傳統 152 層 CNN）＝「走樓梯一層一層傳話」：\n  ・從頂樓（輸出層）往下傳話到 1 樓（輸入層），經過 150 個人連續乘上小於 1 的小數，到最底層時聲音已經完全聽不見了（梯度消失）。\n・殘差網路跳接結構（ResNet Skip Connection）＝「加裝跨樓層直達高速電梯」：\n  ・在層與層之間加上一條捷徑通道 F(x) + x。\n  ・誤差訊號可以坐直達電梯「無損地」直通最底層，就算疊到上百層也能保證底層學到東西，徹底解決深層退化問題。\n\n【🔑 正確選項秒殺題眼】\n・看到「神經網路層數極深（如上百層）、梯度無法回傳前層、退化問題」 ➔ 秒選 「殘差跳接結構（Residual Skip Connection）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：批次正規化（BN）能加速收斂並穩定數值分佈，但當層數堆疊到上百層時，仍無法單獨解決深層網路的梯度衰減與退化問題。\n・✅ (B) 為什麼對：ResNet 的跳接結構（Skip Connection）讓梯度能透過恆等映射（Identity Mapping）直接無損回傳，是現代超深層神經網路的標配。\n・❌ (C) 為什麼錯：Dropout 主要是用來隨機關閉神經元以防止過擬合（Overfitting），無法改善超深網路的梯度消失。\n・❌ (D) 為什麼錯：LDA 屬於機器學習降維與特徵萃取演算法，根本不是深度神經網路的結構組件。", "has_caveat": 0, "caveat_note": null}, {"id": 462, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國人力資源科技公司開發了一套「AI 履歷智慧篩選與適任性評分系統」，用於跨國企業在招募軟體工程師時自動分析應徵者的履歷、過往專案與社群發文，並自動預先淘汰綜合評分未達前 20% 的求職者。依據歐盟最新通過的《人工智慧法案（EU AI Act）》四級風險分類體系，請問此類攸關個人就業權利與職業生涯機會的 AI 應用，屬於下列哪一風險等級？", "option_a": "不可接受的風險（Unacceptable Risk）", "option_b": "高風險（High Risk）", "option_c": "有限風險（Limited Risk）", "option_d": "最低風險（Minimal Risk）", "correct_option": "B", "explanation": "・📍 對應重點章節：4.1 AI 治理核心原則 歐盟 AI 法案與治理制度\n\n【💡 生活化範例 ／ 具體情境秒懂】\n歐盟《AI 法案》的四級風險金字塔就像「安全監管等級表」：\n・不可接受的風險（紅燈全面禁止）：像社會信用評分、認知操縱洗腦，嚴重踐踏人權，法律直接封殺。\n・高風險（黃燈強制嚴管審查，本題場景）：攸關人生重大權益！包含「醫療診斷、求職招聘篩選、升學考試評分、關鍵基礎設施運作」。這類系統並未被禁止，但必須通過嚴格的資料治理、偏誤審查與人工監督。\n・有限風險（綠燈告知揭露）：如客服聊天機器人、Deepfake 換臉，只要主動告知「您正在與 AI 互動」即可。\n・最低風險（白燈免受管制）：如電玩 NPC、垃圾郵件過濾器、影片推薦演算法。\n\n【🔑 正確選項秒殺題眼】\n・看到「招聘篩選、求職適任性評分、升學考評、醫療診斷」 ➔ 秒選 「高風險（High Risk）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：不可接受的風險僅限於對人類安全與尊嚴構成明確威脅的系統（如政府社會信用評分），招聘篩選系統並非全面禁用。\n・✅ (B) 為什麼對：求職招聘與人力資源管理系統直接影響人民生計與就業平等權，在《EU AI Act》中被明確列為需嚴格合規稽核的「高風險」系統。\n・❌ (C) 為什麼錯：有限風險主要規範聊天機器人與生成內容的透明度揭露，防範認知混淆，並非針對重大決策系統。\n・❌ (D) 為什麼錯：最低風險適用於無重大危害的娛樂或輔助工具（如電玩角色、推薦系統），就業篩選絕非最低風險。", "has_caveat": 0, "caveat_note": null}, {"id": 463, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某珠寶設計公司希望運用生成式深度學習技術，根據既有的上萬款經典戒指設計圖，自動生成全新、多樣化的概念草圖。演算法工程師比較了變分自編碼器（VAE）與傳統自編碼器（AE）的架構。請問在 VAE 的編碼器（Encoder）運作機制中，其最核心且不同於傳統 AE 的特徵為何？", "option_a": "將輸入影像壓縮為一組固定且唯一的確定性數值向量", "option_b": "將輸入影像映射為潛在空間中的平均值與變異數機率分佈", "option_c": "依靠生成器與判別器兩大子網路相互博弈以對抗學習", "option_d": "透過遮蔽輸入圖像的部分像素進行雙向克漏字還原", "correct_option": "B", "explanation": "・📍 對應重點章節：1.4 VAE GAN 與 Seq2Seq\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「調製香水配方」來理解傳統 AE 與 VAE 的差異：\n・傳統自編碼器（AE）＝「抄下死板的固定配方號碼」：\n  ・把一瓶香水壓縮成固定數值（例如：玫瑰濃度 5.2、檀香 3.1）。每次只要號碼稍微變一點點，解碼器就不知道怎麼還原，無法生成新的合理作品。\n・變分自編碼器（VAE）＝「記錄香氣的機率分佈範圍（平均值 μ 與變異數 σ²）」：\n  ・編碼器不給死板數值，而是記錄「玫瑰濃度大約在 5.0 ± 0.4 的常態分佈範圍內」。\n  ・解碼器隨後從這個潛在分佈範圍內「隨機抽樣」一個新配方，因此能不斷無中生有生出合理且多樣的全新珠寶設計！\n\n【🔑 正確選項秒殺題眼】\n・看到「VAE 編碼器核心機制、非單一固定值」 ➔ 秒選 「平均值與變異數機率分佈（Mean and Variance）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：壓縮為單一確定性數值向量是「傳統自編碼器（AE）」的做法，缺乏連續隨機抽樣的生成能力。\n・✅ (B) 為什麼對：VAE 編碼器輸出潛在變數 z 的統計分佈參數（平均值 μ 與變異數 σ），奠定了其平滑生成新資料的數學基礎。\n・❌ (C) 為什麼錯：生成器與判別器博弈對抗是「生成對抗網路（GAN）」的特徵，非 VAE。\n・❌ (D) 為什麼錯：遮蔽部分像素還原是遮蔽影像模型（如 MAE）或 BERT 語言模型的自監督訓練機制，非 VAE。", "has_caveat": 0, "caveat_note": null}, {"id": 464, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某文創品牌行銷團隊正在製作一系列包含具體英文品牌名稱與促銷標語的復古海報（例如海報正中央必須精準印出無錯字、字型優雅的英文單字「COFFEE & DREAMS」）。團隊在使用多款主流圖片生成工具時發現，許多模型雖然畫面藝術感極佳，但生成的英文字母經常殘缺變形或拼錯。請問下列哪一款生成式 AI 圖片工具，其核心技術優勢正是專攻「在生成圖片中精確呈現排版英文字體（Typography）」？", "option_a": "概念設計繪圖工具（Midjourney）", "option_b": "精準排版字體生成工具（Ideogram）", "option_c": "深度夢境神經風格工具（Google DeepDream）", "option_d": "智慧影像編輯去背工具（Remove.bg）", "correct_option": "B", "explanation": "・📍 對應重點章節：3.2 圖片生成工具與應用\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「畫師招牌繪製技能」來理解生圖工具的專長分野：\n・Midjourney ＝「藝術光影大師」：\n  ・畫風景、人物肖像光影頂尖絕美，但在早期版本要他畫招牌上的英文文字時，常常畫出鬼畫符或少一個字母。\n・Ideogram ＝「字體排版與招牌設計專家」：\n  ・特別強化了文字渲染與排版訓練（Typography），只要提示詞指定要在招牌或衣服上印什麼英文，它能精準拼出正確字母並融入風格排版，是製作 Logo、文創 T 恤與海報的首選。\n・Google DeepDream ＝「超現實幻覺畫家」：\n  ・早期視覺化神經網路特徵工具，畫面充滿狗眼或迷幻紋理，完全不適合商業排版。\n\n【🔑 正確選項秒殺題眼】\n・看到「圖片中精準生成排版文字、英文字母排版（Typography）、海報標語」 ➔ 秒選 「Ideogram」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Midjourney 主打極致的藝術氛圍與光影細節，但在精準文字排版上並非其最具標誌性的核心特色。\n・✅ (B) 為什麼對：Ideogram AI 從推出起即以極高精確度的「圖中文字生成與字體排版（Typography）」聞名於 AI 視覺領域。\n・❌ (C) 為什麼錯：Google DeepDream 專攻早期卷積神經網路的視覺化迷幻風格轉換，無法生成精確排版文字。\n・❌ (D) 為什麼錯：Remove.bg 是專門用於影像自動去背與主體分割的工具，本身不具備文生圖功能。", "has_caveat": 0, "caveat_note": null}, {"id": 465, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在評估自主決策型 AI 系統在複雜棋盤遊戲或策略路徑規劃中的表現時，演算法專家指出：傳統的「思維鏈提示（Chain-of-Thought）」僅能依單一路徑線性向前推導，一旦中間某個步驟做出次優決策便無法回頭修正。若希望引導大語言模型像人類棋手一樣，先展開多條潛在行動分支、評估各分支優劣，並在遇到死胡同或錯誤時能夠「主動回溯（Backtracking）」嘗試其他路徑，請問應採用下列哪一種進階思維推理框架？", "option_a": "思維鏈提示（Chain-of-Thought）", "option_b": "思維樹提示（Tree-of-Thoughts）", "option_c": "思維骨架提示（Skeleton-of-Thought）", "option_d": "方向性刺激提示（Directional Stimulus Prompting）", "correct_option": "B", "explanation": "・📍 對應重點章節：2.2 提示工程 原則 咒語 框架提示與三大思維推理\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「走迷宮與下棋」來理解三種思維架構：\n・思維鏈（CoT）＝「單向走迷宮一條路走到底」：\n  ・每一步都根據上一步往前推，如果第 3 步走錯叉路，後面每一步就全部跟著錯到底，無法回頭。\n・思維樹（ToT）＝「下棋思考多步棋譜 ＋ 發現死棋就悔棋重試（多路徑探索與回溯）」：\n  ・遇到複雜問題時，AI 展開多條分支（思考第 1 步的三種可能走法），評估哪條路勝率最高；如果發現走到死胡同，可以回溯（Backtrack）回到上個路口改走另一條路，解決複雜策略問題。\n・思維骨架（SoT）＝「先擬會議大綱再找人分工填寫」：\n  ・專門用於加速長文章生成（先架構骨幹後平行填肉），並無路徑搜尋與悔棋機制。\n\n【🔑 正確選項秒殺題眼】\n・看到「多路徑探索、評估分支、主動回溯（Backtracking）、複雜策略決策」 ➔ 秒選 「思維樹提示（Tree-of-Thoughts, ToT）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：思維鏈（CoT）為單向線性推進，缺乏探索不同決策分支與錯誤回溯修正的機制。\n・✅ (B) 為什麼對：思維樹（ToT）將思考過程建模為樹狀搜尋，具備探索多重推理路徑與自我回溯評估能力。\n・❌ (C) 為什麼錯：思維骨架（SoT）旨在優化長文本生成的反應延遲，不屬於樹狀搜尋或回溯推理演算法。\n・❌ (D) 為什麼錯：方向性刺激提示是透過額外提示詞引導輸出方向，並無多分支搜尋與回溯架構。", "has_caveat": 0, "caveat_note": null}, {"id": 466, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某大型銀行的資安監控中心正在訓練一套機器學習分類模型，用於偵測內部員工帳號是否存在「惡意未授權資料外洩」行為。在該銀行的歷史連線日誌中，惡意外洩連線極為罕見，僅佔總連線數的 0.1%（存在極端資料不平衡現象）。若某個基準模型採取極端偷懶策略——直接將所有連線全部預測為「正常連線」，此時模型的整體「準確率（Accuracy）」高達 99.9%，但實際上卻漏掉了全部的惡意行為。請問資安演算法主管應要求團隊採用下列哪一個評估指標，以最客觀地衡量此類嚴重不平衡資料集的分類表現？", "option_a": "決定係數（R-squared）", "option_b": "均方誤差（MSE）", "option_c": "綜合調和指標（F1-score）", "option_d": "雙語評估替補指標（BLEU）", "correct_option": "C", "explanation": "・📍 對應重點章節：1.14 模型評估指標 F1-score R-squared 與 BLEU\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「抓小偷與安檢」來理解極端不平衡資料的指標陷阱：\n・準確率（Accuracy）的騙局：\n  ・1,000 個人裡面只有 1 個人帶違禁品。如果安檢員全部放行（全猜好人），他能拿到 99.9% 的超高準確率，但唯一的壞人卻漏掉了（召回率 Recall = 0），安檢形同虛設！\n・F1-score ＝「精確率與召回率的調和平均數（抓戰犯必備）」：\n  ・調和平均數的特性是「只要有一項是 0，總分立刻被拉垮歸零」！\n  ・如果模型全猜正常、一個壞人都沒抓到，F1-score 直接變成 0 分，立即戳破 99.9% 準確率的假象，是資料不平衡分類任務的唯一照妖鏡。\n・R² 與 MSE：專門用來評估猜房價、猜營業額等「連續數字迴歸」，不能拿來做分類是非題。\n\n【🔑 正確選項秒殺題眼】\n・看到「資料極度不平衡（Class Imbalance）、避免準確率騙局、二元分類」 ➔ 秒選 「F1-score（調和平均數）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：決定係數（R²）是用來評估連續數值預測模型（如房價估算）解釋力的迴歸指標，無法用於分類問題。\n・❌ (B) 為什麼錯：均方誤差（MSE）是數值迴歸的損失函數與誤差衡量標準，非二元分類指標。\n・✅ (C) 為什麼對：F1-score 是精確率（Precision）與召回率（Recall）的調和平均數，能有效惩罰忽視少數類別的預測，是資料不平衡分類的首選指標。\n・❌ (D) 為什麼錯：BLEU 專門用於比對機器翻譯與文本生成的 N-gram 重疊度，與日誌異常分類無關。", "has_caveat": 0, "caveat_note": null}, {"id": 467, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某醫學研究所在進行罕見疾病文獻分析時，研究員希望使用一款 AI 工具，能夠將十幾篇最新發表的臨床試驗 PDF 論文上傳至系統中。系統在回答問題時，必須嚴格「僅根據使用者上傳的文獻內容」進行歸納推理，嚴禁從外部互聯網隨意抓取未經驗證的網路資訊以避免幻覺；此外，研究員還希望能將這些論文重點一鍵轉化為雙人自然對談風格的「語音音訊摘要（Audio Overview）」隨身收聽。請問下列哪一項 Google 旗下的生成式 AI 工具最精準符合上述需求？", "option_a": "雲端搜尋分析平台（Google Cloud Search）", "option_b": "筆記研究助理（NotebookLM）", "option_c": "機器學習競賽社群（Kaggle）", "option_d": "視覺風格生成工具（Google DeepDream）", "correct_option": "B", "explanation": "・📍 對應重點章節：5.1 文本與對話語言模型\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「專屬文獻研究秘書」來理解 NotebookLM 的特殊定位：\n・普通通用 ChatGPT / Gemini ＝「博學多聞但偶爾道聽塗說的顧問」：\n  ・問他問題時，他會調用龐大資料庫回答，甚至可能自己腦補不存在的論文結論。\n・Google NotebookLM ＝「恪遵筆記本內容的嚴謹書僮 ＋ Podcast 主播」：\n  ・專門讓使用者上傳自己的 PDF、Google Docs 或研討會筆記。\n  ・它的回答嚴格鎖定在使用者提供的筆記內部（私有知識庫 RAG），大幅杜絕外部幻覺，並附上精準文獻引述標記。\n  ・最吸睛的殺手級功能是支援「一鍵生成雙人對談英文 Podcast（音訊摘要）」，讓學者在開車或運動時用耳朵聽懂論文重點！\n\n【🔑 正確選項秒殺題眼】\n・看到「基於上傳 PDF/文獻專屬知識庫 RAG、生成雙人對談語音摘要（Audio Overview）」 ➔ 秒選 「NotebookLM」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Google Cloud Search 是企業內部文件搜尋引擎，不具備筆記型對話 RAG 與自動音訊摘要生成功能。\n・✅ (B) 為什麼對：Google NotebookLM（基於 Gemini 架構）專注於使用者自訂來源的文件理解、筆記整理，並以雙人對談音訊摘要聞名。\n・❌ (C) 為什麼錯：Kaggle 是資料科學競賽與開源資料集共享社群平台，非專屬文獻對話研究軟體。\n・❌ (D) 為什麼錯：Google DeepDream 屬於早期卷積神經網路圖像特徵視覺化工具，與文本研究無關。", "has_caveat": 0, "caveat_note": null}, {"id": 468, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在電影視覺特效生成技術的演進中，傳統影片生成方法常將每一幀視為獨立圖像分別生成，導致影格之間容易出現「邊緣閃爍跳幀、前後物體形變不連貫」的嚴重缺陷。Google 近年發表的影片生成模型「Lumiere」採用了一項關鍵創新架構，該架構能在單一運算過程中同時在空間維度與時間維度上進行整段影片的全域去噪生成。請問 Lumiere 所採用的核心架構為何？", "option_a": "時空超圖神經網路（Space-Time Hypergraph Network）", "option_b": "時空 U-Net 架構（Space-Time U-Net）", "option_c": "循環卷積反向傳播網路（Recurrent Backpropagation Network）", "option_d": "自回歸長短期記憶架構（Autoregressive LSTM）", "correct_option": "B", "explanation": "・📍 對應重點章節：1.8 多模態 AI 與影片生成技術\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「傳統手翻書動畫 vs 現代 3D 雕塑定格」來理解 Lumiere 的架構：\n・傳統影片生成 ＝「手翻書逐頁畫（容易手抖跳幀）」：\n  ・先畫第 1 頁、再畫第 2 頁，即便每一頁都很精美，翻動時人物衣服的紋理或臉型還是會一直輕微變形閃爍。\n・Google Lumiere 的時空 U-Net（Space-Time U-Net）＝「把整段影片當成一塊 4D 黏土一體成型雕刻」：\n  ・傳統 U-Net 只在空間 2D 降採樣去噪；Lumiere 將「空間（長寬）與時間（前後秒數）」合併，直接在多維空間中一次去噪雕琢出整段 5 秒影片，因此動作極其自然、徹底解決跳幀問題。\n\n【🔑 正確選項秒殺題眼】\n・看到「Google Lumiere、一次生成整段時空連貫影片、防止跳幀」 ➔ 秒選 「時空 U-Net 架構（Space-Time U-Net）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：超圖神經網路是用於複雜多元關係建模的圖論演算法，非 Lumiere 影像生成的基礎骨架。\n・✅ (B) 為什麼對：Google Lumiere 的核心技術正是「Space-Time U-Net」，直接在空間與時間全維度執行擴散下採樣與上採樣。\n・❌ (C) 為什麼錯：循環卷積為早期時序影像辨識結構，非現代擴散影片模型。\n・❌ (D) 為什麼錯：LSTM 為早期一維序列模型，無法直接用於現代高解析度擴散影片的時空生成。", "has_caveat": 0, "caveat_note": null}, {"id": 469, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某共享單車 App 為了提供更貼心的服務，希望在用戶註冊時透過智慧表單收集資料。專案經理原本規劃要求用戶填寫身分證字號、公司地址、血型、緊急聯絡人與月收入，藉此讓後台推薦更精準的行銷優惠。然而公司的資料保護官（DPO）指出，依據歐盟 GDPR 與臺灣《個人資料保護法》的核心隱私保護原則，系統僅能蒐集與達成租借單車與付款「直接相關且不可或缺的最少量必要資料」（如手機號碼與信用卡授權），其餘過度蒐集的欄位必須強制移除。請問此法規要求體現了下列哪一項核心原則？", "option_a": "數據去識別化原則（De-identification Principle）", "option_b": "數據最小化原則（Data Minimization Principle）", "option_c": "非對稱加密原則（Asymmetric Encryption Principle）", "option_d": "存取控制分級原則（Access Control Principle）", "correct_option": "B", "explanation": "・📍 對應重點章節：4.4 資料治理 四大隱私保護策略與隱私法規\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「超商買咖啡」來理解數據最小化原則：\n・違反最小化原則 ＝「買杯美式咖啡，店員卻要求你交出戶籍謄本與健保卡」：\n  ・明明只要付錢拿咖啡就好，店家卻藉機收集你的身家調查，屬於過度違法蒐集。\n・數據最小化原則（Data Minimization）＝「夠用就好，多要就是違法」：\n  ・租單車只需要知道你是誰（手機驗證）以及能否扣款（信用卡）；向用戶索取血型或收入與租車任務毫無必要關聯，依法必須一律刪除不予蒐集。\n\n【🔑 正確選項秒殺題眼】\n・看到「僅蒐集達成目的之最少量資料、禁止過度索取無關隱私」 ➔ 秒選 「數據最小化原則（Data Minimization）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：去識別化是指在資料蒐集後將姓名身分證匿名或假名化遮蔽，與「源頭只蒐集最少資料」的範疇不同。\n・✅ (B) 為什麼對：數據最小化（Data Minimization）強調企業在資料蒐集階段應限制在達成特定目的所必需的最低範圍之內。\n・❌ (C) 為什麼錯：非對稱加密是公鑰私鑰的安全傳輸儲存技術，並非規範資料蒐集範圍的隱私原則。\n・❌ (D) 為什麼錯：存取控制是指資料庫權限的分級防護機制（誰能讀取／修改），與前端表單欄位最小化無關。", "has_caveat": 0, "caveat_note": null}, {"id": 470, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在大型語言模型（LLM）的研發流程中，研發團隊需要讓模型吸收數兆個字詞的維基百科、電子書與公開網頁文章。在這一階段，資料集完全不需要昂貴的人工專家逐句標註標籤（無預設標籤答案），而是讓演算法透過「隨機遮蔽句子中間的詞彙，讓模型根據前後文猜測被遮住的字」，或是「預測下一個最可能出現的接續詞」。請問此種驅動現代 LLM 建立通用語言知識庫的學習模式屬於下列何者？", "option_a": "監督式學習（Supervised Learning）", "option_b": "自監督學習（Self-Supervised Learning）", "option_c": "增強式學習（Reinforcement Learning）", "option_d": "半監督式學習（Semi-Supervised Learning）", "correct_option": "B", "explanation": "・📍 對應重點章節：1.13 五大學習範式與經典演算法\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「學徒讀書方法」來區分學習範式：\n・監督式學習 ＝「做有標準答案的歷屆考題」：每一題題目旁邊都附有老師給的標準答案（人工標籤），做完對答案算分數。\n・自監督學習（Self-Supervised Learning，LLM 預訓練核心）＝「自己拿立可白塗掉字玩猜字遊戲」：\n  ・沒有老師給考卷，直接拿整本小說，自己把第 5 個字塗黑，逼自己大腦根據前 4 個字猜被塗黑的是什麼；猜完撕開立可白自己檢查。\n  ・資料本身既是考題也是答案，因此可以無窮無盡地讀海量網路文章自學，成為通才基礎模型！\n\n【🔑 正確選項秒殺題眼】\n・看到「無人工標籤、自己從資料中產生克漏字/接龍任務、LLM 海量預訓練核心」 ➔ 秒選 「自監督學習（Self-Supervised Learning）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：監督式學習需要人工標註的明確標籤（Label），而預訓練語料規模達數兆 Token，無法依賴人工全數標註。\n・✅ (B) 為什麼對：自監督學習是無監督學習的重要分支，透過資料自帶的結構生成監督訊號，是 GPT、BERT 等大模型預訓練的底層技術。\n・❌ (C) 為什麼錯：增強式學習（強化學習）依賴智慧體與環境互動獲得獎勵/懲罰訊號，非純文本預訓練的方式。\n・❌ (D) 為什麼錯：半監督式學習需要少部分已標註資料加上大量未標註資料，而自監督學習在預訓練階段完全不需要人工標籤。", "has_caveat": 0, "caveat_note": null}, {"id": 471, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某半導體晶圓廠在規劃「晶圓表面顯微瑕疵自動檢測系統」的運算叢集時，硬體工程師在評估深度學習模型架構。團隊對比了卷積神經網路（CNN）與循環神經網路（RNN）在 GPU 硬體上的推論效率。工程師指出：CNN 能夠極其高效地利用 GPU 數千個核心進行大規模平行加速，而傳統 RNN 的運算延遲卻無法藉由增加 GPU 核心數量而等比例降低。請問造成 CNN 與 RNN 在平行運算能力上存在根本巨大差異的主因為何？", "option_a": "CNN 採用注意力機制，而 RNN 缺乏數值正規化", "option_b": "CNN 處理空間網格資料各區域可獨立運算，而 RNN 具時間序列依賴性必須依序排隊計算", "option_c": "CNN 參數量遠大於 RNN，因此能主動觸發 GPU 高速快取", "option_d": "CNN 僅能執行二元分類，而 RNN 專精多類別預測", "correct_option": "B", "explanation": "・📍 對應重點章節：1.2 CNN vs RNN\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「檢查拼圖 vs 傳話遊戲」來理解平行運算：\n・CNN 處理圖像（空間網格）＝「全班 100 位同學同時檢查一張大拼圖的各個角落」：\n  ・左上角有沒有瑕疵、右下角有沒有刮痕，彼此互不影響，GPU 可以派 1,000 個小核心同時去算這張圖片的 1,000 個局部區塊，平行加速極致流暢！\n・RNN 處理時序文字（時間序列）＝「全班 100 位同學排隊傳話遊戲」：\n  ・第 2 個人必須等到第 1 個人講完才能聽；第 100 個人必須苦等前 99 個人依序講完。就算買 10 張頂級 GPU，也只能單線程排隊等待，平行運算極差！\n\n【🔑 正確選項秒殺題眼】\n・看到「CNN 平行運算極佳、RNN 平行運算差無法加速」 ➔ 秒選 「CNN 空間各區獨立可平行，RNN 時間序列依賴需排隊（Sequential Dependency）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Transformer 才是注意力機制的代表，傳統 CNN 與 RNN 皆不以自注意力為核心架構。\n・✅ (B) 為什麼對：CNN 的卷積核在影像空間各位置的滑動運算彼此獨立，可完美映射至 GPU 平行核心；而 RNN 存在嚴格的隱藏狀態時序依賴（hₜ 依賴 hₜ₋₁），無法跨時間步平行。\n・❌ (C) 為什麼錯：平行加速優勢源於計算圖無時序依賴，與參數量大小或快取無關。\n・❌ (D) 為什麼錯：兩者皆可支援二元分類與多類別預測，分類任務類型非平行運算差異的起因。", "has_caveat": 0, "caveat_note": null}, {"id": 472, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某軟體新創公司的技術長希望在開發流程中導入新一代「自主 AI 軟體工程師（Autonomous AI Software Engineer）」。這款系統與一般僅能在編輯器內提供程式碼補全的 Copilot 不同，它能夠自主瀏覽專案需求文檔、獨立在終端機內配置程式開發環境、自主撰寫並執行單元測試除錯，甚至能自行在 GitHub 上提出 Pull Request 修復開源專案真實 Bug。請問這款由 Cognition Labs 開發的全球首款自主 AI 軟體工程師系統名稱為何？", "option_a": "競賽演算法解答系統（AlphaCode）", "option_b": "自主軟體工程師系統（Devin）", "option_c": "企業雲端程式助手（CodeWhisperer）", "option_d": "線上結對編程擴充（GitHub Copilot）", "correct_option": "B", "explanation": "・📍 對應重點章節：3.6 程式生成應用與開發工具\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「副駕駛（Copilot）vs 全自主軟體外包工程師（Devin）」來理解層次分工：\n・GitHub Copilot / CodeWhisperer ＝「結對編程小副手」：\n  ・你坐在駕駛座寫程式碼，它坐在旁邊看你寫到一半時幫你猜下一行，或者幫忙寫個簡單函數。它不會自己去開終端機或自己修復專案。\n・Devin ＝「給他需求就自己搞定全套的獨立工程師」：\n  ・由 Cognition Labs 推出，號稱全球首位「自主 AI 軟體工程師」。你只要交給他一個 GitHub Issue，他自己打開瀏覽器查資料、在虛擬機裝環境、寫代碼、跑測試抓 Bug，直到全部測過後自己發 PR，具備高階 Agent 自主規劃能力！\n\n【🔑 正確選項秒殺題眼】\n・看到「Cognition Labs、全球首位自主 AI 軟體工程師、獨立規劃/寫碼/除錯/發 PR」 ➔ 秒選 「Devin」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：AlphaCode 由 Google DeepMind 開發，專門解決競賽程式設計（Competitive Programming）的演算法難題，非自主工程師 Agent。\n・✅ (B) 為什麼對：Devin 由 Cognition Labs 於 2024 年發布，定位為具備獨立規劃執行能力的自主 AI 軟體工程師。\n・❌ (C) 為什麼錯：CodeWhisperer（現整併為 Amazon Q Developer）是 AWS 推出的企業程式碼即時補全助手。\n・❌ (D) 為什麼錯：GitHub Copilot 是 Microsoft/GitHub 推出的輔助編程外掛，屬於人機協同的結對助手，非全自主獨立軟體工程師。", "has_caveat": 0, "caveat_note": null}, {"id": 473, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在大型語言模型的解碼採樣設定中，工程師正在為智慧對話系統調整取樣超參數。系統原先採用固定挑選前 50 個候選詞的 Top-K 採樣法（K=50）。演算法工程師指出：當遇到語境高度確定時（例如句子為「法國的首都是...」，候選詞只有「巴黎」機率高達 99%），Top-K 依然會固定抓取 50 個詞，導致低機率的荒謬詞彙被納入抽籤池；反之當語境發散時，50 個詞又可能不足。工程師建議改用一種「從最高機率詞開始累加，直到累計機率達到閾值 P（如 90%）即停止納入，能隨語境自動伸縮候選詞數量」的動態採樣策略。請問此技術的正式名稱為何？", "option_a": "貪婪搜尋策略（Greedy Search）", "option_b": "核取樣策略（Nucleus / Top-P Sampling）", "option_c": "溫度退火策略（Temperature Annealing）", "option_d": "束搜尋策略（Beam Search）", "correct_option": "B", "explanation": "・📍 對應重點章節：1.5 Transformer 自注意力與解碼參數\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「面試錄取名額規定」來理解 Top-K 與 Top-P（核取樣）：\n・Top-K（死板規定前 K 名）＝「不管考卷多簡單，固定錄取前 50 名」：\n  ・如果第 1 名考 99 分，第 2~50 名全考 5 分，Top-K 還是會把考 5 分的爛候選詞納入抽籤池，容易爆出離譜字眼。\n・Top-P（核取樣，累加機率動態伸縮）＝「分數累加達到全班總分 90% 的人才能入圍」：\n  ・當答案很肯定（如「法國首都是巴黎」佔 95% 機率），累計機率一瞬間就破 90%，此時入圍名單只有「巴黎」1 個詞，其他直接淘汰，極度聰明精準！\n  ・當答案很多元時，名單自動膨脹放寬，兼顧多樣性與安全性。\n\n【🔑 正確選項秒殺題眼】\n・看到「累積機率達到閾值 P、動態伸縮候選詞數量、核取樣」 ➔ 秒選 「Top-P 採樣（Nucleus Sampling）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：貪婪搜尋（Greedy Search）是每一步只選機率最高的那 1 個詞，毫無多樣性可言。\n・✅ (B) 為什麼對：Top-P 採樣（又稱核取樣 Nucleus Sampling）透過設定累積機率門檻，讓候選詞集合大小隨當前上下文的機率分佈動態伸縮。\n・❌ (C) 為什麼錯：溫度（Temperature）是縮放整個機率分佈的平坦度，並非直接依累積機率截斷詞集的方法。\n・❌ (D) 為什麼錯：束搜尋（Beam Search）是在解碼樹中同時保留多條評分最高的全局路徑，主要用於翻譯任務，並非此種隨機動態截斷機制。", "has_caveat": 0, "caveat_note": null}, {"id": 474, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國證券交易平台在建構全自動 AI 投資諮詢系統時，架構團隊採用了微服務拼裝架構：前端使用開源提示工程中介軟體、中間語意解析調用外部第三方的開源 Embedding 模型 API，最後再由雲端基礎模型生成投資報告。在上線後的資安風險全面評估中，資安長特別指出：整個系統由多個不同供應商與開源專案拼裝組合而成，一旦其中任何一個第三方元件存在訓練偏誤、資料投毒或未修補的安全性漏洞，就會引發整座系統信任鏈瓦解的連鎖崩潰反應。請問此項安全隱憂屬於下列哪一種 AI 系統固有風險？", "option_a": "提示注入風險（Prompt Injection Risk）", "option_b": "協力廠商模型不確定性風險（Third-party Component Risk）", "option_c": "訓練資料過擬合風險（Model Overfitting Risk）", "option_d": "概念漂移退化風險（Concept Drift Risk）", "correct_option": "B", "explanation": "・📍 對應重點章節：4.3 生成式 AI 著作權 深度偽造 (Deepfake) 與系統風險\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「組裝拼裝車上路」來理解供應鏈與第三方模型風險：\n・自研自製車 ＝「整台車的引擎、煞車與底盤全由自己工廠嚴格檢驗生產」：雖然研發耗時，但每一行代碼與權重皆完全受控。\n・協力廠商模型拼裝車（Third-party Uncertainty）＝「買二手引擎＋路邊不知名煞車皮組裝」：\n  ・現在許多企業 AI 應用都是拼裝車：調用 A 家的開源模型、接 B 家的雲端 API、引 C 家的外掛套件。\n  ・只要 B 家的 API 突然被駭客投毒改了權重，或者 C 外掛有漏洞，就算你的主程式寫得再好，整台車照樣在高速公路上翻車！這就是典型的協力廠商模型與供應鏈不確定性風險。\n\n【🔑 正確選項秒殺題眼】\n・看到「不同來源 API 拼裝組成、第三方開源模型/元件漏洞連帶影響整套系統」 ➔ 秒選 「協力廠商模型不確定性（Third-party Uncertainty）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：提示注入（Prompt Injection）是使用者惡意輸入提示詞繞過系統防護，並非描述系統架構採用外部拼裝元件的供應鏈風險。\n・✅ (B) 為什麼對：協力廠商模型的不確定性指企業過度依賴外部 API 或開源黑箱模組，當第三方元件品質或安全失控時，會直接連鎖波及自身系統。\n・❌ (C) 為什麼錯：過擬合是模型過度記憶特定訓練集資料的統計現象，非軟體供應鏈風險。\n・❌ (D) 為什麼錯：概念漂移（Concept Drift）是指真實世界資料分佈隨時間推移發生變化導致模型表現下降，並非第三方元件的安全性問題。", "has_caveat": 0, "caveat_note": null}, {"id": 475, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某軟體開發團隊從傳統的 Visual Studio Code 遷移至由 Anysphere 開發的原生 AI 程式碼編輯器「Cursor」。團隊工程師發現，與以往 GitHub Copilot 主要依賴當前單一開啟檔案的游標上下文字進行補全相比，Cursor 最具革命性的生產力優勢在於能夠讀取整個軟體專案代碼庫，並允許開發者透過自然語言對話，在一次指示下全局理解跨檔案架構，並同步自動修改分散在十幾個關聯檔案中的程式碼邏輯。請問這項核心優勢通常被稱作下列何者？", "option_a": "單行自動語法校對（Single-line Linting）", "option_b": "全局代碼庫跨檔案上下文理解（Codebase-wide Cross-file Context）", "option_c": "遠端伺服器容器化部署（Containerized Deployment）", "option_d": "二進位位元組碼反組譯（Bytecode Decompilation）", "correct_option": "B", "explanation": "・📍 對應重點章節：5.4 音訊、編程與自動化工具總覽\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「看一頁書 vs 讀通全套百科全書」來理解編輯器能力的進化：\n・早期 AI 補全外掛 ＝「只能偷看你正在寫的那一頁考卷」：\n  ・如果你改了資料庫結構，它不知道你其他 10 個後端檔案也要跟著改，你必須手動一個檔案一個檔案打開讓它補全。\n・Cursor 編輯器 ＝「擁有整個專案雷達地圖的資深架構師」：\n  ・支援 @Codebase，直接把整個專案的所有檔案建立向量索引。\n  ・你只需說：「把用戶身分認證從 JWT 改成 OAuth2」，它能自動跨檔案追蹤，同時修改 Controller、Service、Model 與前端 Config 等十幾個關聯檔案，這就是全局代碼庫跨檔案上下文理解的強大威力。\n\n【🔑 正確選項秒殺題眼】\n・看到「Cursor 編輯器、跨檔案全局理解、自然語言一次改動十幾個關聯檔案」 ➔ 秒選 「全局代碼庫跨檔案上下文理解（Codebase Context）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：單行語法校對是傳統 Linter（如 ESLint）的基本功能，毫無 AI 全局架構理解能力。\n・✅ (B) 為什麼對：Cursor 的標誌性能力就是透過全局索引（Codebase Indexing）實現跨檔案語意檢索與多檔案聯動修改。\n・❌ (C) 為什麼錯：容器化部署是 Docker/Kubernetes 的維運範疇，並非 Cursor 的編輯器核心特色。\n・❌ (D) 為什麼錯：二進位反組譯是逆向工程工具的功能，非高階語言 AI 結對編程編輯器的定位。", "has_caveat": 0, "caveat_note": null}, {"id": 476, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在深度學習的基礎訓練演算法中，許多初學者經常混淆「反向傳播（Backpropagation）」與「梯度下降（Gradient Descent）」的分工角色。在神經網路完成一次前向預測並計算出損失值（Loss）後，系統開始啟動反向傳播演算法。請問下列關於「反向傳播演算法」在訓練閉環中所扮演之實際角色的敘述，何者完全正確？", "option_a": "負責依據學習率直接動手修改神經網路各層的權重數值", "option_b": "僅負責利用微積分鏈式法則從後向前傳遞誤差並計算各參數的梯度方向", "option_c": "負責將非線性輸出結果轉換為介於 0 與 1 之間的機率值", "option_d": "負責在訓練前對輸入資料進行標準化縮放以消除量綱影響", "correct_option": "B", "explanation": "・📍 對應重點章節：1.1 神經網路基礎 感知器與反向傳播\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「工廠品檢抓戰犯與維修技師」來釐清兩者的嚴格分工：\n・反向傳播（Backpropagation）＝「品檢分析師（只找問題算責任，不動手改機器）」：\n  ・當最後生產出來的產品不合格（算出了 Loss），反向傳播從生產線最後一關往前查，用數學公式算出「第 3 號螺絲該往左轉多少、第 1 號馬達該調慢多少（計算各權重的梯度方向）」。\n  ・⚠️ 請特別注意：反向傳播自己絕對不動手修改螺絲權重！\n・梯度下降與最佳化器（Gradient Descent / Adam）＝「維修技師（真正動手鎖螺絲的人）」：\n  ・拿著反向傳播算出來的診斷單，順著下坡方向，真正動手把各參數的權重 w 與偏移 b 做更新調整。\n\n【🔑 正確選項秒殺題眼】\n・看到「反向傳播核心角色、是否直接改權重」 ➔ 秒選 「只計算梯度與傳遞誤差，不直接更新修改權重（更新權重是梯度下降的工作）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：直接動手更新修改權重數值是「梯度下降（Gradient Descent）」與最佳化器（如 SGD、Adam）的工作，非反向傳播。\n・✅ (B) 為什麼對：反向傳播本質是應用微積分的連鎖律（Chain Rule），由輸出端往輸入端反向計算損失函數對各層參數的偏微分（梯度）。\n・❌ (C) 為什麼錯：將數值轉為機率是 Softmax 或 Sigmoid 啟動函數的功能，非反向傳播。\n・❌ (D) 為什麼錯：輸入資料標準化屬於前處理（Data Preprocessing）步驟，非反向傳播。", "has_caveat": 0, "caveat_note": null}, {"id": 477, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某企管顧問公司的數位轉型講師在向學員培訓提示工程公式時，示範了標準的結構化提問「3W 架構」（Who、Where、What）。講師展示了以下 Prompt：\n> 「你是一家知名科技外商的資深人資副總裁（Who）。由於近期公司面臨組織扁平化與部門整併，員工普遍產生焦慮與離職潮，預算亦受到嚴格限制。請為中階主管設計一份為期 4 週的團隊士氣提振與溝通執行企劃書（What）。」\n請問題幹粗體字部分在結構化提問公式 3W 中，精準補齊了哪一個要素？", "option_a": "角色要素（Who）", "option_b": "背景情境要素（Where）", "option_c": "任務要素（What）", "option_d": "時間要素（When）", "correct_option": "B", "explanation": "・📍 對應重點章節：2.2 提示工程 原則 咒語 框架提示與三大思維推理\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「拍電影設定三部曲」來理解 3W 架構：\n・Who（角色）：你演誰？ ➔ 如「知名外商資深人資副總裁」，讓 AI 帶入專業權威視角。\n・Where（背景情境）：在什麼舞台與挑戰下演？（本題粗體字） ➔ 如「面臨組織扁平化、整併焦慮潮、預算緊縮限制」。\n  ・⚠️ 請特別注意：在提示工程中，Where 不是指物理地址（如台北市信義區），而是指業務背景、資源限制、目標受眾痛點與情境上下文（Context）！有了這層設定，AI 產出的方案才不會天馬行空給出昂貴的員工旅遊方案。\n・What（任務）：你要拍什麼戲？ ➔ 如「設計 4 週士氣提振與溝通企劃書」。\n\n【🔑 正確選項秒殺題眼】\n・看到「組織整併、預算限制、員工焦慮痛點、業務上下文脈絡」 ➔ 秒選 「背景情境要素（Where）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Who 是指「資深人資副總裁」的角色身分設定。\n・✅ (B) 為什麼對：Where 在結構化提問中代表組織背景、現實約束條件與目標環境情境。\n・❌ (C) 為什麼錯：What 是指「產出為期 4 週的士氣提振與溝通企劃書」的具體任務指示。\n・❌ (D) 為什麼錯：標準 3W 公式由 Who、Where、What 組成，When 並非 3W 的三大支柱之一。", "has_caveat": 0, "caveat_note": null}, {"id": 478, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某遊戲開發團隊正在為一款開放世界角色扮演遊戲開發 NPC（非玩家角色）語音系統。製作人要求：當遊戲角色處於「極度悲痛哭泣」或「憤怒咆哮」時，AI 合成的聲音必須能自然展現出哭腔顫抖、語速急促或聲嘶力竭的真實情感共鳴，絕不能像傳統導航語音那樣語氣平淡死板。在訓練深度學習情感語音合成（Emotional Text-to-Speech）模型時，請問下列哪一項要素是模型能否成功學會細膩情緒起伏的最核心關鍵？", "option_a": "限制語音播放時維持絕對恆定的固定語速", "option_b": "具備高品質且豐富的情緒標註語音資料集（Emotionally Annotated Data）", "option_c": "僅依賴頻率等化器（Equalizer）進行音量均衡標準化", "option_d": "在推論階段透過演算法強制移除語音中的換氣與停頓聲", "correct_option": "B", "explanation": "・📍 對應重點章節：1.8 多模態 AI 與影片生成技術\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「演員學演哭戲」來理解情感 TTS 的成功要素：\n・如果只給平淡讀課文錄音（無情緒資料）＋ 純調音量：\n  ・就如同叫學生背課本，然後用音效軟體把聲音變大聲或變尖（像唐老鴨花栗鼠變聲），完全沒有真情實感，聽起來依舊像機械人。\n・提供「高品質情緒標註語音（Emotionally Annotated Data）」：\n  ・餵給神經網路成千上萬段由專業配音員演繹「喜、怒、哀、懼」的錄音，並明確貼上標籤註記。\n  ・模型從中學會人在悲傷時會「語速變慢、音調下沉、帶呼吸抽噎顫音」，在憤怒時會「爆破音增強、音頻飆高」，從而真正學會跨情緒擬真合成。\n\n【🔑 正確選項秒殺題眼】\n・看到「情感語音合成（Emotional TTS）最關鍵成功要素」 ➔ 秒選 「情緒標註語音資料（Emotionally Annotated Data）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：保持恆定語速會讓語音變得機械呆板，反而徹底摧毀了情感表現力。\n・✅ (B) 為什麼對：情感 TTS 的核心在於訓練資料是否包含足夠且精確標註的各類情緒特徵（音高曲線、語速變化、共鳴點）。\n・❌ (C) 為什麼錯：音量均衡只是標準化響度，無法賦予聲音細膩的悲歡情感。\n・❌ (D) 為什麼錯：換氣與自然停頓是人類展現情緒的重要生理特徵，強制移除只會讓聲音更加不自然。", "has_caveat": 0, "caveat_note": null}, {"id": 479, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國連鎖健身房的數據分析師在整理新進會員的註冊資料表時，發現「喜好的健身教練性別」欄位與「會員職業類別」欄位存在約 8% 的缺失值（NaN）。分析師準備在將資料送入客戶分群演算法前進行前處理補值。已知這兩個欄位屬於純文字的「離散類別型資料（Categorical Data）」。請問依據資料前處理的標準統計準則，針對此類類別型缺失值，最適當的填補方式為何？", "option_a": "計算該欄位已有數值的算術平均數進行填補", "option_b": "計算該欄位已有數值的中位數進行填補", "option_c": "統計該欄位出現頻率最高的類別（眾數 Mode）進行填補", "option_d": "直接將所有含有缺失值的會員整筆列資料全數強制刪除", "correct_option": "C", "explanation": "・📍 對應重點章節：1.12 資料基本概念 收集清理與前處理\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「選票與統計口訣」來理解缺失值填補：\n・文字類別欄位（如性別：男/女；職業：工程師/教師/商務）＝「算不出平均值」：\n  ・你無法把「男性」加「女性」除以 2 算平均數，文字資料根本無法計算平均數或中位數！\n  ・面對文字類別，唯一合理的統計統計量就是看哪一個選項出現最多次（眾數 Mode），用最多人選的代表類別填補空缺。\n・數值連續欄位（如身高、年齡、消費金額）：\n  ・無極端值時用「平均數（Mean）」。\n  ・有極端異常值（如有人亂填年齡 150 歲）時用「中位數（Median）」避免被拉偏。\n・不可隨便整筆刪除：8% 的缺失直接刪除會大幅損失寶貴資料樣本，破壞模型泛化力。\n\n【🔑 正確選項秒殺題眼】\n・看到「文字類別型資料（Categorical Data）缺失值處理」 ➔ 秒選 「眾數（Mode）填補」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：文字類別資料（如職業名稱）非數值，無法進行加總求平均數。\n・❌ (B) 為什麼錯：中位數需要數據具備連續數值或順序大小關係，文字名目類別無法排序計算中位數。\n・✅ (C) 為什麼對：對於類別型屬性，統計該欄位出現頻率最高的眾數（Mode）進行填補是標準且最穩健的做法。\n・❌ (D) 為什麼錯：僅 8% 缺失就直接全數刪除整行資料會造成可用樣本浪費與潛在取樣偏誤。", "has_caveat": 0, "caveat_note": null}, {"id": 480, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國保險公司的客服中心正在重新規劃工單自動化處理管線。系統需要接收來自各個管道進來的投保人客訴與理賠申請郵件，並在毫秒級時間內準確判斷該郵件的「情緒傾向（憤怒/滿意/焦慮）」並自動歸類至「醫療險、車險、火險」等 12 個特定業務類別中。演算法工程師在選擇語言模型底座時指出：此任務屬於標準的「自然語言理解（NLU）與文字分類」，應優先選用具備深層雙向上下文編碼能力的模型，而非專精於無中生有寫作的自回歸生成式模型。請問下列哪一個模型架構最符合該工單分類系統的核心需求？", "option_a": "雙向編碼器表示模型（BERT）", "option_b": "生成式預訓練轉換模型（GPT）", "option_c": "潛在擴散模型（LDM）", "option_d": "變分自編碼生成模型（VAE）", "correct_option": "A", "explanation": "・📍 對應重點章節：1.6 NLP BERT GPT 與 LLM 演進\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「閱讀測驗評審 vs 命題作文作家」來理解 BERT 與 GPT 的本質分工：\n・BERT（雙向閱讀理解大師，NLU 代表）＝「閱讀測驗高分學霸」：\n  ・繼承 Transformer 的編碼器（Encoder），能夠同時「從左看到右、又從右看到左」通讀全文。\n  ・專攻：分類（判斷客訴類別）、情緒分析、關鍵字標註、搜尋引擎匹配。它是鑑別式 AI，最擅長看懂現成文字並打標籤。\n・GPT（自回歸單向生成大師，NLG 代表）＝「命題創作小說家」：\n  ・繼承 Transformer 的解碼器（Decoder），採用單向自回歸（從左到右文字接龍）。\n  ・專攻：無中生有寫故事、寫企劃、多輪對話聊天。拿它來純做分類是大材小用且成本較高。\n\n【🔑 正確選項秒殺題眼】\n・看到「自然語言理解（NLU）、雙向上下文、文字分類與情緒分析」 ➔ 秒選 「BERT」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・✅ (A) 為什麼對：BERT（Bidirectional Encoder Representations from Transformers）為雙向上下文編碼架構，是文字分類與 NLU 理解任務的經典標竿。\n・❌ (B) 為什麼錯：GPT 為單向自回歸解碼架構，專精於自然語言生成（NLG）而非純鑑別分類。\n・❌ (C) 為什麼錯：LDM（潛在擴散模型）為影像生成架構（如 Stable Diffusion），非純文字分類模型。\n・❌ (D) 為什麼錯：VAE 為資料生成模型，並非專為自然語言雙向分類設計的模型。", "has_caveat": 0, "caveat_note": null}, {"id": 481, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國商業銀行風控部門導入了一套由深度神經網路驅動的「企業信用貸款違約預測模型」。在每季度的風險審查會議上，風控長要求模型團隊不僅要提供每位客戶的核貸結果，更需要向董事會提供一份宏觀分析報告，以量化評估「全體客戶的核貸決策中，『年營業額』、『負債比率』、『產業別』等各個特徵欄位，各自佔據了整體模型多少百分比的總體貢獻度與影響權重」。請問演算法團隊應採用下列哪一種可解釋人工智慧（XAI）分析方法？", "option_a": "局部可解釋模型無關解釋法（LIME）", "option_b": "沙普利加性解釋法（SHAP）", "option_c": "主成分線性投影法（PCA）", "option_d": "隨機森林特徵雜湊法（Feature Hashing）", "correct_option": "B", "explanation": "・📍 對應重點章節：4.5 模型可解釋性 LIME vs SHAP\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「拔河比賽算功勞 vs 局部放大鏡」來分辨 SHAP 與 LIME：\n・SHAP（沙普利值 Shapley Value）＝「拔河比賽算每個隊員的全局貢獻度」：\n  ・源自合作賽局理論（Game Theory），評估「如果少了他、多了他，整體勝率差多少」。\n  ・適合宏觀分析：它能精確算出「在全體模型預測中，負債比貢獻了 40%、營業額貢獻了 35%、年資貢獻了 25%」，提供全局且具數學一致性的特徵重要度分配！\n・LIME ＝「拿放大鏡只看單一筆可疑交易」：\n  ・只在特定某一個客戶（局部 Local）的周圍稍微擾動資料，解釋「為什麼張三這筆貸款剛好被拒絕」。\n\n【🔑 正確選項秒殺題眼】\n・看到「合作賽局理論、全局特徵貢獻度分配、整體特徵重要性權重」 ➔ 秒選 「SHAP（沙普利加性解釋）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：LIME 專精於「單筆樣本的局部解釋（Local Explanation）」，無法像 SHAP 提供嚴謹數學公理支撐的全局特徵貢獻分配。\n・✅ (B) 為什麼對：SHAP（SHapley Additive exPlanations）基於合作賽局理論，能為整體模型提供具備公理性保障的全局特徵重要度分析。\n・❌ (C) 為什麼錯：PCA 是非監督式線性降維技術，無法解釋非線性神經網路特徵對預測目標的貢獻度。\n・❌ (D) 為什麼錯：特徵雜湊（Feature Hashing）為特徵工程中的維度壓縮技巧，並非模型可解釋性方法。", "has_caveat": 0, "caveat_note": null}, {"id": 482, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某科技智庫的分析師每週需要閱讀數百頁的全球半導體產業法案與外電財報。為了加速研究進度，分析師利用企業內部的大語言模型，將原本長達 80 頁的英文政策法案白皮書直接輸入系統中，並要求模型在一頁 A4 紙的篇幅內，精準提煉出「法案三大核心補貼方向、受影響之企業名單、以及關鍵實施期程表」。請問在大語言模型的三大典型應用模式（縮減、轉換、擴展）中，此項任務屬於下列哪一種模式？", "option_a": "轉換模式（Transformation Mode）", "option_b": "縮減模式（Reduction Mode）", "option_c": "擴展模式（Expansion Mode）", "option_d": "生成模式（Generation Mode）", "correct_option": "B", "explanation": "・📍 對應重點章節：2.1 大語言模型 (LLM) 原理 微調與應用模式\n\n【💡 生活化範例 ／ 具體情境秒懂】\n大語言模型在文字處理上的三大基本變形動作：\n・縮減模式（Reduction，多 ➔ 少，本題場景）：\n  ・把 80 頁長篇報告、會議錄音逐字稿、幾千條顧客評論，濃縮提煉成 1 頁精華摘要、關鍵字或待辦清單。\n・轉換模式（Transformation，A 形式 ➔ B 形式）：\n  ・長度大致不變，只是換一種表現形式！例如：英文翻譯成中文、把白話口語改寫成正式公文、自然語言需求轉換成 Python 程式碼。\n・擴展模式（Expansion，少 ➔ 多）：\n  ・給他一句靈感主題，自動發想擴寫成 3,000 字行銷企劃案或完整小說章節。\n\n【🔑 正確選項秒殺題眼】\n・看到「長篇白皮書/財報濃縮、提取重點摘要、多變少」 ➔ 秒選 「縮減模式（Reduction Mode）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：轉換模式是指語言翻譯、文體風格改寫或格式轉換（如文字轉程式碼），字數不必然減少。\n・✅ (B) 為什麼對：縮減模式（Reduction）的核心即為資訊過濾、長文摘要、會議重點濃縮（將大量原始文字精簡為少量核心資訊）。\n・❌ (C) 為什麼錯：擴展模式是給予簡短指示或主題擴寫成完整長文（由少變多）。\n・❌ (D) 為什麼錯：生成模式非標準 LLM 三大文字應用操作模式之分類。", "has_caveat": 0, "caveat_note": null}, {"id": 483, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在現代擴散模型（Diffusion Model，如 Stable Diffusion）的影像生成原理中，模型包含了兩大相反方向的隨機過程：正向過程（Forward Process）與反向過程（Reverse Process）。當終端使用者在繪圖軟體介面輸入一段文字提示詞並按下「生成圖片」按鈕時，請問模型底層實際上是透過哪一個過程來逐步畫出高解析度圖像？", "option_a": "透過正向過程，將輸入文字直接編碼為高斯雜訊並強制儲存", "option_b": "透過反向過程，從純隨機高斯雜訊出發，逐步預測雜訊並迭代去噪生成清晰影像", "option_c": "透過對抗過程，由判別器直接合成像素以供生成器驗收", "option_d": "透過遮蔽過程，隨機挖空部分圖像並使用自注意力機制填補", "correct_option": "B", "explanation": "・📍 對應重點章節：1.7 擴散模型 (Diffusion)\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「打碎雕像 vs 妙手回春雕刻」來理解擴散模型的雙過程：\n・正向過程（Forward Process）＝「把一件大理石雕像一步步砸碎成一堆沙子（加噪過程）」：\n  ・這是訓練時做的！系統把原本乾淨美麗的照片，一步一步加入高斯隨機雜訊，直到完全變成一片看不清的電視機雪花（純雜訊）。\n・反向過程（Reverse Process）＝「從一堆混亂沙子中逐步去噪雕刻出雕像（AI 作畫生成，本題場景）」：\n  ・當使用者要生新圖時，AI 走的是反向過程！它隨機抓一把純雜訊雪花，在提示詞（Prompt）的指引下，一步一步「猜出並擦掉裡面的多餘雜訊」，最終迭代出前所未見的精美傑作！\n\n【🔑 正確選項秒殺題眼】\n・看到「AI 作畫生成影像、從隨機純雜訊一步步去噪復原」 ➔ 秒選 「反向過程（Reverse Process）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：正向過程是訓練時用來將清晰原圖逐步加噪破壞為雜訊的過程，並非使用者生成圖片時的流程。\n・✅ (B) 為什麼對：生成圖片走的是反向去噪過程（Reverse Denoising Process），模型從純雜訊開始逐步去除噪點以重建出清晰圖像。\n・❌ (C) 為什麼錯：對抗過程為 GAN（生成對抗網路）的機制，非擴散模型。\n・❌ (D) 為什麼錯：遮蔽填補為自編碼遮蔽模型（MAE / BERT）的機制，非擴散模型的逐步去噪生成機制。", "has_caveat": 0, "caveat_note": null}, {"id": 484, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某企管顧問團隊在為企業高階主管進行「AI 簡報生成工作流」示範時，分享了一套在業界備受推崇的「三段式黃金工具鏈」：首先利用大語言模型進行簡報邏輯大綱的腦力激盪與講稿構思；接著將大綱導入具備 AI 卡片式自動排版與流暢網頁動畫轉場能力的簡報軟體，快速生成完整的投影片骨架；最後若需針對特定視覺插圖進行精細品牌客製，再匯入圖文設計平台微調。請問在此三段式工作流程中，負責「將文字大綱一鍵轉化為卡片式自動排版投影片」的核心工具通常為何？", "option_a": "視覺設計協作平台（Canva）", "option_b": "智慧排版簡報工具（Gamma）", "option_c": "程式碼即時生成平台（GitHub Copilot）", "option_d": "自然語言對話助手（ChatGPT）", "correct_option": "B", "explanation": "・📍 對應重點章節：3.5 簡報生成流程與工具組合\n\n【💡 生活化範例 ／ 具體情境秒懂】\n職場簡報 AI 三段式最佳拍檔工作流：\n・第 1 步：內容構思 ➔ 用 ChatGPT：\n  ・負責當大腦，幫你把龐雜的產業報告整理成「第 1 頁背景、第 2 頁痛點、第 3 頁解方」的結構化文字大綱。\n・第 2 步：卡片排版一鍵生成 ➔ 用 Gamma（本題核心）：\n  ・把 ChatGPT 的文字大綱複製貼上進 Gamma，它在 1 分鐘內自動選模板、配插圖、將文字分塊排版成極具現代感的卡片式投影片與網頁簡報！\n・第 3 步：視覺美化與品牌微調 ➔ 用 Canva：\n  ・用於最後加入企業專屬 Logo、調配品牌色票與商業海報級的精緻平面修飾。\n\n【🔑 正確選項秒殺題眼】\n・看到「輸入文字大綱、卡片式自動排版、快速生成簡報 PPT」 ➔ 秒選 「Gamma」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Canva 專長於豐富的平面設計模板、海報視覺修飾與微調，在純文字一鍵自動生成卡片投影片結構上不如 Gamma 直覺高效。\n・✅ (B) 為什麼對：Gamma 是新一代 AI 簡報工具代表，專門將文字大綱自動轉換為結構清晰、具備卡片式設計美感的投影片與網頁。\n・❌ (C) 為什麼錯：GitHub Copilot 是輔助撰寫程式碼的開發工具，無法用於商務簡報排版。\n・❌ (D) 為什麼錯：ChatGPT 主要負責第一階段的文本思考與大綱產出，無法直接輸出排版完成的視覺投影片。", "has_caveat": 0, "caveat_note": null}, {"id": 485, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在各國面對生成式 AI 爆發性成長的監管政策比較中，不同國家採取了截然不同的治理路徑。例如歐盟（EU）傾向於制定具有嚴格法律拘束力、分級審查與巨額罰則的《人工智慧法案（EU AI Act）》；然而，有部分國家擔憂過於嚴苛的法律條文會對本國新創企業造成龐大合規負擔並扼殺科技創新動能，因而明確主張採取「以非拘束性的指導原則（Guidelines）代替剛性法律」的軟性自律治理模式。請問下列哪一組國家即為採取此種以彈性指導原則引導產業自律的代表？", "option_a": "歐盟與加拿大", "option_b": "英國與日本", "option_c": "法國與德國", "option_d": "巴西與印度", "correct_option": "B", "explanation": "・📍 對應重點章節：4.2 AI 倫理五大原則 各國架構與臺灣 TAIDE 計畫\n\n【💡 生活化範例 ／ 具體情境秒懂】\n各國對 AI 的管教風格：\n・歐盟（EU）＝「嚴格的教官（剛性法律嚴罰）」：全球最早立法立規，不聽話最高罰全球營收 4%，以保護人權隱私為第一優先。\n・英國與日本 ＝「開明的教練（以指導原則代替法律，軟性自律）」：\n  ・英國脫歐後希望打造全球 AI 創新之都，不急著立專法，由既有各主管機關發布指導原則彈性監管。\n  ・日本為了克服少子化並振興科技產業，同樣主張以政府「指導原則」引導產業健康發展，避免法令把新創公司綁死。\n\n【🔑 正確選項秒殺題眼】\n・看到「以指導原則代替法律、軟性治理、避免扼殺創新」 ➔ 秒選 「英國與日本（UK and Japan）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：歐盟推行具強制力的《EU AI Act》，加拿大亦提出具明確監管規範的《人工智慧與資料法案（AIDA）》。\n・✅ (B) 為什麼對：英國與日本皆主張透過彈性的行政指導原則（Principles/Guidelines）而非嚴刑峻法來引導產業自律與創新。\n・❌ (C) 為什麼錯：法國與德國身為歐盟核心成員國，一體適用歐盟剛性的《EU AI Act》。\n・❌ (D) 為什麼錯：巴西與印度並非以指導原則代替法律之經典代表。", "has_caveat": 0, "caveat_note": null}, {"id": 486, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某量化對沖基金的機器學習工程師在訓練「高頻股價波動預測模型」時，發現模型在歷史回測資料（訓練集）上的表現接近完美，但在實盤模擬帳戶（驗證集與未見過資料）上的預測誤差卻極大，顯示模型產生了嚴重的「過擬合（Overfitting）」，過度記憶了歷史雜訊。工程師希望在模型訓練的「損失函數（Loss Function）」中主動加入對模型參數權重大小的懲罰項（如限制權重向量的 L1 範數或 L2 範數），藉此壓制過大的權重數值並迫使模型學習更平滑的泛化規律。請問這種防範過擬合的技巧被稱作下列何者？", "option_a": "批次資料正規化（Batch Normalization）", "option_b": "權重正則化（Regularization）", "option_c": "資料增強擴增法（Data Augmentation）", "option_d": "動態學習率衰減（Learning Rate Decay）", "correct_option": "B", "explanation": "・📍 對應重點章節：1.10 模型最佳化 訓練技巧與過擬合\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「考試作弊懲罰」來理解 Regularization 與 Normalization 的關鍵差異：\n・正則化（Regularization，L1/L2 正則化，本題場景）＝「在損失函數加開超速罰單」：\n  ・當模型想要把某些特徵權重衝到幾千幾萬來死背特定考古題時，損失函數裡的懲罰項立刻讓 Loss 飆高，逼模型參數保持小而精簡，不敢死背（有效壓制過擬合與梯度爆炸）。\n・批次正規化（Normalization）＝「全班身高按比例縮放成 0~1」：\n  ・是對「資料數值」做縮放平移，讓梯隊訓練更平穩，並不是在損失函數裡加懲罰項。\n\n【🔑 正確選項秒殺題眼】\n・看到「在損失函數加入權重懲罰項（L1/L2）、限制參數大小、防範過擬合」 ➔ 秒選 「正則化（Regularization）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：批次正規化（Normalization）是針對神經元輸入資料的均值與變異數進行標準化縮放，並非在損失函數中加入參數懲罰項。\n・✅ (B) 為什麼對：正則化（Regularization，如 L1 Lasso 或 L2 Ridge）正是透過在目標損失函數中引入參數範數懲罰以約束模型複雜度、抑制過擬合。\n・❌ (C) 為什麼錯：資料增強是指對輸入樣本進行旋轉、裁剪以擴大資料多樣性，不涉及損失函數的公式修改。\n・❌ (D) 為什麼錯：學習率衰減是在訓練過程中逐漸縮小步長，並非向損失函數添加權重懲罰。", "has_caveat": 0, "caveat_note": null}, {"id": 487, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某跨國電商平台擁有數百萬件服飾與鞋包商品，每天有成千上萬的賣家上傳自拍的商品照片。由於賣家拍照背景雜亂（例如在自家客廳、雜亂倉庫或床單上拍攝），導致商品瀏覽頁面視覺極不統一。平台技術團隊希望串接一套專精於「高精確度影像主體分割與一秒去背」的 AI 服務，能夠全自動識別服裝主體、乾淨剔除雜亂背景，並將商品無縫合成至統一規格的專業商業攝影棚白色背景中。請問下列哪一款生成式 AI 相關工具，其最核心的標誌性能力就是專攻此類「電商去背與主體換背景」？", "option_a": "向量繪圖協作工具（Figma）", "option_b": "智慧影像去背工具（Remove.bg）", "option_c": "團隊筆記知識庫（Notion AI）", "option_d": "線上語音逐字稿工具（TurboScribe）", "correct_option": "B", "explanation": "・📍 對應重點章節：5.2 圖像生成與編輯工具總覽\n\n【💡 生活化範例 ／ 具體情境秒懂】\n電商美編專用去背神器：\n・Remove.bg / Photoroom ＝「1 秒去背合成自動魔術師」：\n  ・專門解決電商痛點！不需要美編拿鋼筆工具花 10 分鐘慢慢描邊，上傳雜亂照片，AI 影像分割模型 1 秒精準抓出鞋子或洋裝主體，邊緣髮絲或蕾絲鏤空都能辨識，瞬間換上純白或攝影棚背景。\n・Figma：專門給 UI/UX 設計師畫 App 介面線框圖的向量設計工具。\n・Notion AI：專門寫會議記錄與文檔筆記的文字助理。\n・TurboScribe：專門把演講錄音轉成文字逐字稿的音訊工具。\n\n【🔑 正確選項秒殺題眼】\n・看到「商品照片一秒精準去背、去除雜亂背景換攝影棚、影像分割」 ➔ 秒選 「Remove.bg」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：Figma 是介面原型（UI/UX）與向量繪圖協作軟體，並非專用的自動化批次去背工具。\n・✅ (B) 為什麼對：Remove.bg（Kaleido/Canva 旗下）是全球廣泛使用的 AI 自動去背服務，專精於前景主體分割與背景替換。\n・❌ (C) 為什麼錯：Notion AI 專精於文字協作、筆記整理與知識庫問答，不具備影像去背能力。\n・❌ (D) 為什麼錯：TurboScribe 是語音轉文字（STT）的逐字稿軟體。", "has_caveat": 0, "caveat_note": null}, {"id": 488, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "在提示工程（Prompt Engineering）的最佳實踐中，工程師在編寫複雜任務的 Prompt 時，經常使用大括號 {}、三重引號 \"\"\" 或標籤 <document>...</document> 包裹特定段落，例如：\n> 「請仔細閱讀以下位於三重引號內的顧客投訴信 \"\"\"[顧客投訴信內容]\"\"\"，並依據公司規章草擬一封安撫回覆。」\n在認證考試的提示語法標準中，請問工程師在 Prompt 中使用此類標記符號（Separators）的最主要用意為何？", "option_a": "標記出可以在不同使用場景中由程式動態替換的變數內容", "option_b": "清楚區隔指示指令與待處理的參考文本內容，防止模型語意混淆", "option_c": "降低輸入文字的 Token 數量以減少 API 呼叫費用", "option_d": "強制大語言模型在回答時必須採用 JSON 格式進行結構化輸出", "correct_option": "B", "explanation": "・📍 對應重點章節：2.2 提示工程 原則 咒語 框架提示與三大思維推理\n\n【💡 生活化範例 ／ 具體情境秒懂】\n我們用「給秘書的文件便條紙與公文夾」來理解分隔符號（Separators）：\n・混在一起寫（無分隔符號）：\n  ・如果你在紙上寫：「請翻譯這段話不要生氣我只是開玩笑」，AI 可能會搞不清楚「不要生氣」究竟是你對 AI 說的指令，還是需要被翻譯的原文內容！甚至可能被惡意提示注入（Prompt Injection）欺騙。\n・善用分隔符號（如 \"\"\"、{}、---，本題核心）：\n  ・像用透明公文夾把待處理文本整齊裝起來，明確告訴 AI：「外面寫的是我要你執行的『任務命令』，夾子裡面的才是『被處理的材料』」。\n  ・⚠️ 高頻易錯陷阱：在提示工程理論中，符號最根本的核心角色是「區隔關鍵資訊（Separator）」，絕非寫程式時的變數替換標記！\n\n【🔑 正確選項秒殺題眼】\n・看到「符號 {} 或 \"\"\" 的用意、區隔資訊」 ➔ 秒選 「清楚區隔指示指令與參考文本（區隔關鍵資訊 Separator）」\n\n【🔍 各選項正誤與陷阱逐一拆解】\n・❌ (A) 為什麼錯：這是程式設計師最容易誤選的陷阱項！在提示工程的核心原則中，引號或括號主要是作為「資訊分隔符（Separator）」防止指令混淆，而非單純的模板變數。\n・✅ (B) 為什麼對：官方提示工程指南明確指出，善用引號或標籤是為了將系統指令與資料本體明確劃分邊界，避免語意混淆與提示注入。\n・❌ (C) 為什麼錯：加入額外括號或引號會稍微增加 Token 數，無法降低 Token 數量。\n・❌ (D) 為什麼錯：強制 JSON 輸出需要使用輸出格式約束指令或特定 API 參數（如 response_format），與引號分隔符無關。", "has_caveat": 0, "caveat_note": null}, {"id": 489, "source": "題庫11", "topic": "白話拆解 × 認證實戰：鑑別式與生成式 AI", "question": "某物聯網智慧手錶開發團隊正在為手錶端側（Edge Device）設計一套即時語音指令喚醒模型。該設備搭載的微處理器運算能力與電池電量皆極其有限。在序列模型選型時，團隊希望模型能夠維持長短時序的記憶能力，但認為標準長短期記憶網路（LSTM）內建的 3 道門控機制（遺忘門、輸入門、輸出門）過於笨重、參數量過多且推論延遲偏高。演算法專家建議採用一種「精簡版循環神經單元」，該單元將門控精簡為僅有「更新門（Update Gate）」與「
