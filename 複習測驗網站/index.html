<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生成式AI認證 隨機複習測驗</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card-bg: #ffffff;
    --text: #1b2430;
    --muted: #6b7686;
    --border: #e3e7ef;
    --accent: #3b5bdb;
    --accent-weak: #eef1fd;
    --correct: #2f9e44;
    --correct-weak: #ebfbee;
    --wrong: #e03131;
    --wrong-weak: #fff0f0;
    --warn: #e8590c;
    --warn-weak: #fff4e6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171f; --card-bg: #1c2029; --text: #e7eaf1; --muted: #9aa3b2;
      --border: #2b3040; --accent: #7c93ff; --accent-weak: #232a43;
      --correct: #51cf66; --correct-weak: #14301c;
      --wrong: #ff6b6b; --wrong-weak: #351414;
      --warn: #ffa94d; --warn-weak: #332107;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171f; --card-bg: #1c2029; --text: #e7eaf1; --muted: #9aa3b2;
    --border: #2b3040; --accent: #7c93ff; --accent-weak: #232a43;
    --correct: #51cf66; --correct-weak: #14301c;
    --wrong: #ff6b6b; --wrong-weak: #351414;
    --warn: #ffa94d; --warn-weak: #332107;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  @media (min-width: 900px) {
    .wrap { max-width: 760px; padding-top: 32px; }
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  h1 { font-size: 1.25rem; margin: 0; }
  h2 { font-size: 1rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.8125rem; }

  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px;
  }
  .card + .card { margin-top: 16px; }

  fieldset { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin: 0 0 16px; }
  legend { font-size: 0.8125rem; color: var(--muted); padding: 0 6px; }
  .src-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  label.chk {
    display: flex; align-items: center; gap: 8px; font-size: 0.875rem;
    padding: 8px; border-radius: 8px; cursor: pointer; min-height: 40px;
  }
  label.chk:hover { background: var(--accent-weak); }
  .toggle-row { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; margin-bottom: 10px; min-height: 32px; }
  input[type="checkbox"] { width: 18px; height: 18px; flex: none; }
  input[type="number"] { min-height: 36px; }

  button {
    font-size: 0.875rem; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--text); padding: 10px 16px; cursor: pointer;
    min-height: 44px; touch-action: manipulation;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; width: 100%; padding: 12px; font-size: 0.9375rem; }
  button.secondary { width: 100%; margin-top: 10px; }
  button:disabled { opacity: .5; cursor: default; }

  .progress-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.8125rem; color: var(--muted); margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  .progress-row b { color: var(--text); }
  .bar-track { height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; margin-bottom: 16px; }
  .bar-fill { height: 100%; background: var(--accent); transition: width .2s; }

  .meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--muted); margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
  .tag { display: inline-block; background: var(--accent-weak); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-size: 0.75rem; }
  .question { font-size: 1.0625rem; font-weight: 600; margin: 0 0 16px; white-space: pre-wrap; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex; gap: 10px; align-items: flex-start; text-align: left;
    padding: 14px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text); font-size: 0.9375rem; cursor: pointer;
    transition: border-color .15s, background .15s; width: 100%;
    min-height: 48px; touch-action: manipulation;
  }
  .option:hover:not(:disabled) { border-color: var(--accent); }
  .option .letter {
    flex: none; width: 1.6em; height: 1.6em; border-radius: 50%;
    border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
    font-size: 0.8125rem; font-weight: 700; color: var(--muted);
  }
  .option.correct { border-color: var(--correct); background: var(--correct-weak); }
  .option.correct .letter { border-color: var(--correct); color: var(--correct); }
  .option.wrong { border-color: var(--wrong); background: var(--wrong-weak); }
  .option.wrong .letter { border-color: var(--wrong); color: var(--wrong); }
  .option:disabled { cursor: default; }

  .result-box { margin-top: 16px; }
  .result-banner { font-weight: 700; font-size: 0.9375rem; margin-bottom: 8px; }
  .result-banner.correct { color: var(--correct); }
  .result-banner.wrong { color: var(--wrong); }
  .explanation {
    font-size: 0.875rem; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; white-space: pre-wrap;
  }
  .caveat {
    margin-top: 10px; font-size: 0.8125rem; color: var(--warn); background: var(--warn-weak);
    border: 1px solid var(--warn); border-radius: 10px; padding: 10px 14px; white-space: pre-wrap;
  }
  .next-row { margin-top: 18px; }

  .summary-stat { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.9375rem; }
  .summary-stat:last-child { border-bottom: none; }
  .big-accuracy { font-size: 2.5rem; font-weight: 800; color: var(--accent); text-align: center; margin: 6px 0 2px; }

  .review-item {
    border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px;
  }
  .review-item .meta { margin-bottom: 8px; }
  .review-item .question { font-size: 0.9375rem; margin-bottom: 10px; }
  .review-line { font-size: 0.875rem; margin: 4px 0; }
  .review-line .your-ans { color: var(--wrong); font-weight: 600; }
  .review-line .correct-ans { color: var(--correct); font-weight: 600; }
  .review-explanation { font-size: 0.8125rem; color: var(--muted); margin-top: 8px; white-space: pre-wrap; }
  .no-wrong { text-align: center; color: var(--muted); padding: 20px 0; }

  .font-ctrl { display: flex; align-items: center; gap: 4px; }
  .font-ctrl button { min-height: 36px; min-width: 40px; padding: 4px 10px; font-weight: 700; }
  .font-ctrl .font-val { font-size: 0.8125rem; color: var(--muted); min-width: 3em; text-align: center; }

  footer { margin-top: 24px; font-size: 0.75rem; color: var(--muted); text-align: center; }
  .hidden { display: none !important; }

  @media (max-width: 400px) {
    .card { padding: 16px; }
    .question { font-size: 1rem; }
    h1 { font-size: 1.125rem; }
    .big-accuracy { font-size: 2.125rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>生成式AI能力認證 複習測驗</h1>
      <div class="sub">題庫共 <span id="totalAll">0</span> 題</div>
    </div>
    <div class="font-ctrl" role="group" aria-label="字體大小">
      <button type="button" id="fontDownBtn" aria-label="縮小字體">A−</button>
      <span class="font-val" id="fontVal">100%</span>
      <button type="button" id="fontUpBtn" aria-label="放大字體">A＋</button>
    </div>
  </header>

  <!-- ===== Setup screen ===== -->
  <div class="card" id="setupScreen">
    <h2>開始前先設定</h2>
    <p class="sub" style="margin-top:0;">選好來源與選項設定後開始，題目會隨機排序且不重複，直到該範圍內題目全部出完。</p>

    <fieldset>
      <legend>考試來源（可複選）</legend>
      <div class="src-grid" id="sourceGrid"></div>
    </fieldset>

    <div class="toggle-row">
      <input type="checkbox" id="randomizeOptions" checked>
      <label for="randomizeOptions">選項隨機排序（關閉則維持 A/B/C/D 原始順序）</label>
    </div>
    <div class="toggle-row">
      <input type="checkbox" id="excludeCaveat">
      <label for="excludeCaveat">排除有 ⚠️ 爭議備註的題目</label>
    </div>

    <div class="toggle-row" style="flex-wrap:wrap;">
      <input type="checkbox" id="limitEnabled">
      <label for="limitEnabled">限制本次出題數（隨機抽選，不重複）：</label>
      <input type="number" id="limitCount" min="1" value="80" style="width:80px; padding:6px 8px; border-radius:8px; border:1px solid var(--border); background:var(--card-bg); color:var(--text);" disabled>
      <span class="sub">題</span>
    </div>

    <p class="sub">本次範圍共 <b id="poolCount">0</b> 題，實際出題 <b id="effectiveCount">0</b> 題</p>
    <button class="primary" id="startBtn">開始測驗</button>
  </div>

  <!-- ===== Quiz screen ===== -->
  <div id="quizScreen" class="hidden">
    <div class="progress-row">
      <span>進度：<b id="progressText">0 / 0</b></span>
      <span>答對：<b id="correctCount">0</b>　正確率：<b id="accuracy">0%</b></span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="progressBar" style="width:0%"></div></div>

    <div class="card">
      <div class="meta">
        <span class="tag" id="currentSource"></span>
        <span class="tag" id="currentTopic"></span>
        <span id="currentId"></span>
      </div>
      <p class="question" id="questionText"></p>
      <div class="options" id="optionsBox"></div>

      <div class="result-box hidden" id="resultBox">
        <div class="result-banner" id="resultBanner"></div>
        <div class="explanation" id="explanationText"></div>
        <div class="caveat hidden" id="caveatText"></div>
      </div>

      <div class="next-row">
        <button class="primary" id="nextBtn" disabled>下一題</button>
      </div>
    </div>
    <button class="secondary" id="backToSetupBtn">結束測驗並看結果</button>
  </div>

  <!-- ===== Summary screen ===== -->
  <div id="summaryScreen" class="hidden">
    <div class="card">
      <h2>測驗結束</h2>
      <div class="big-accuracy" id="summaryAccuracy">0%</div>
      <div class="summary-stat"><span>已作答</span><b id="summaryTotal">0</b></div>
      <div class="summary-stat"><span>答對</span><b id="summaryCorrect">0</b></div>
      <div class="summary-stat"><span>答錯</span><b id="summaryWrong">0</b></div>
      <button class="primary" id="restartSameBtn" style="margin-top:16px;">用同樣設定再測一次</button>
      <button class="secondary" id="backSetupFromSummaryBtn">重新選擇設定</button>
    </div>

    <div class="card" id="reviewCard">
      <h2>答錯題目重新整理</h2>
      <div id="reviewList"></div>
    </div>
  </div>

  <footer>資料來源：資策會生成式AI能力認證解題影片／AI白話拆解×認證實戰通關密笈 整理（含人工重建與勘誤備註，應試前請以官方題庫為準）</footer>
</div>

<script>
const QUESTIONS = [{"id": 1, "source": "題庫01", "topic": "綜合", "question": "在教育領域，以下哪個選項為AI聲音複製技術的實際應用？", "option_a": "模仿名師授課", "option_b": "電子書生成", "option_c": "分析課程教學成效", "option_d": "分析學生情緒", "correct_option": "A", "explanation": "利用少量名師語音樣本訓練語音模型（Voice Cloning / TTS），即可自動合成名師音色與語調進行授課。", "has_caveat": 0, "caveat_note": null}, {"id": 2, "source": "題庫01", "topic": "綜合", "question": "在AI生成內容領域中，「NLP」代表什麼？", "option_a": "Neural Linguistic Programming", "option_b": "Nested Learning Protocol", "option_c": "Natural Language Processing", "option_d": "Networked Language Processing", "correct_option": "C", "explanation": "中文為「自然語言處理」，是大型語言模型與人機文本互動的核心領域；選項A為心理學身心語言程式學，為常見陷阱項。", "has_caveat": 0, "caveat_note": null}, {"id": 3, "source": "題庫01", "topic": "綜合", "question": "AI生成內容是指基於哪個技術來生成各種形式的內容和資料？", "option_a": "模糊邏輯", "option_b": "雷達掃描", "option_c": "深度學習 (Deep Learning, DL)", "option_d": "視覺辨識", "correct_option": "C", "explanation": "生成式AI（文字、圖像、音訊等生成）均奠基於多層深度類神經網絡（如Transformer、Diffusion等）的深度學習技術。", "has_caveat": 0, "caveat_note": null}, {"id": 4, "source": "題庫01", "topic": "綜合", "question": "在生成式AI簡報生成中，提供主題推薦功能時所使用的技術是什麼？", "option_a": "深度學習 (Deep Learning, DL)", "option_b": "擴增實境 (Augmented Reality, AR)", "option_c": "協同過濾 (Collaborative Filtering)", "option_d": "自然語言處理 (Natural Language Processing, NLP)", "correct_option": "D", "explanation": "理解關鍵字語意並自動擴展相關大綱與主題推薦，屬於NLP的語意理解與自然語言生成範疇。\n\n> ⚠️ 爭議備註：題目問「主題推薦」，若是依使用者行為做推薦，業界常用「協同過濾」；但此題情境為根據輸入關鍵字/大綱語意展開主題，屬內容式推薦（Content-based），故NLP合理。建議複習時留意題目情境差異。", "has_caveat": 1, "caveat_note": "題目問「主題推薦」，若是依使用者行為做推薦，業界常用「協同過濾」；但此題情境為根據輸入關鍵字/大綱語意展開主題，屬內容式推薦（Content-based），故NLP合理。建議複習時留意題目情境差異。\n\n---"}, {"id": 5, "source": "題庫01", "topic": "綜合", "question": "在利用人工智慧生成內容時，必須遵守相關國際法規，以美國《健康保險可攜性和責任法案》(HIPAA)為例，處理健康相關資料時，應該採取哪些關鍵措施？", "option_a": "將所有資料保存於紙質檔案", "option_b": "未經授權將患者資料公開", "option_c": "使用加密技術保護患者資料", "option_d": "僅在非商業用途時保護資料", "correct_option": "C", "explanation": "HIPAA安全規範明定，受保護健康資訊（PHI）在儲存與傳輸過程中必須透過高強度加密技術與存取權限控管來確保安全性。", "has_caveat": 0, "caveat_note": null}, {"id": 6, "source": "題庫01", "topic": "綜合", "question": "大語言模型 (LLM) 在確定性技術路徑中，表現改進的關鍵是什麼？", "option_a": "減少訓練資料量", "option_b": "擴展多樣化的語言模式和結構", "option_c": "增加模型參數", "option_d": "提高運算能力", "correct_option": "B", "explanation": "模型內在表現提升的核心在於學習多樣化的語言模式、語法結構與知識表徵，增強跨領域的泛化理解能力。\n\n> ⚠️ 爭議備註：此題表述較模糊，「增加模型參數」「提高運算能力」亦是業界公認的Scaling Laws關鍵因素。官方給的答案偏向「資料/語言模式多樣性」而非參數規模，建議留意此題可能有翻譯/用詞模糊問題，複習時三個選項（B/C/D）都要理解其角色。", "has_caveat": 1, "caveat_note": "此題表述較模糊，「增加模型參數」「提高運算能力」亦是業界公認的Scaling Laws關鍵因素。官方給的答案偏向「資料/語言模式多樣性」而非參數規模，建議留意此題可能有翻譯/用詞模糊問題，複習時三個選項（B/C/D）都要理解其角色。\n\n---"}, {"id": 7, "source": "題庫01", "topic": "綜合", "question": "在處理涉及個人敏感資訊的AI生成內容時，根據歐盟《一般資料保護規範》(GDPR)，下列哪一項是必須的？", "option_a": "對資料進行匿名化處理", "option_b": "僅在本地儲存資料", "option_c": "僅使用免費的安全工具", "option_d": "將資料定期公開", "correct_option": "A", "explanation": "GDPR強調隱私保護與資料最小化原則，在處理敏感資料與AI訓練輸入時，去識別化與匿名化（Anonymization）是法定必備措施。", "has_caveat": 0, "caveat_note": null}, {"id": 8, "source": "題庫01", "topic": "綜合", "question": "在AI生成內容中，資料應如何訓練較好？", "option_a": "資料量越多越好", "option_b": "資料量多寡不影響訓練品質", "option_c": "資料量越少越好", "option_d": "資料量適中較好", "correct_option": "A", "explanation": "此題庫考點立足於「大數據（Big Data）與擴展法則（Scaling Laws）」，強調巨量資料對基礎模型學習泛化表徵的重要性。\n\n> ⚠️ 爭議備註：嚴格來說業界近年更強調「資料品質 > 資料量」（如LLaMA、Phi系列小模型高品質資料的實驗），但就此考試的出題邏輯（偏傳統Big Data觀點），標準答案為A，應試時以題庫答案為準。", "has_caveat": 1, "caveat_note": "嚴格來說業界近年更強調「資料品質 > 資料量」（如LLaMA、Phi系列小模型高品質資料的實驗），但就此考試的出題邏輯（偏傳統Big Data觀點），標準答案為A，應試時以題庫答案為準。\n\n---"}, {"id": 9, "source": "題庫01", "topic": "綜合", "question": "哪種AI生成內容技術可以幫助學生生成書面報告和研究論文？", "option_a": "圖片處理技術", "option_b": "自然語言處理", "option_c": "資料壓縮技術", "option_d": "語音辨識技術", "correct_option": "B", "explanation": "書面報告與論文屬於長篇文字產出，背後核心技術為自然語言處理（NLP / NLG）。", "has_caveat": 0, "caveat_note": null}, {"id": 10, "source": "題庫01", "topic": "綜合", "question": "提示工程在AI應用中的一個主要挑戰是什麼？", "option_a": "缺乏可用資料", "option_b": "過度擬合(Overfitting)人工智慧模型", "option_c": "設計與使用模型最匹配的輸入內容", "option_d": "確保使用者隱私", "correct_option": "C", "explanation": "提示工程不需調整模型權重，其本質挑戰在於設計合適的措辭、結構與格式，使其與特定模型的理解與推理機制相契合。", "has_caveat": 0, "caveat_note": null}, {"id": 11, "source": "題庫01", "topic": "綜合", "question": "Canva的哪個功能可以幫助簡報排版更優美？", "option_a": "配色工具", "option_b": "套用智慧模板", "option_c": "字體樣式選擇", "option_d": "圖像編輯工具", "correct_option": "B", "explanation": "智慧模板（Smart Templates）結合自動化排版與佈局結構，能一鍵完成文字層次、圖文配比與整體視覺的美化。", "has_caveat": 0, "caveat_note": null}, {"id": 12, "source": "題庫02", "topic": "倫理與法律", "question": "根據歐盟可信任AI倫理準則，何者不是四大倫理原則之一？", "option_a": "公平性", "option_b": "尊重AI決策正確性", "option_c": "避免傷害", "option_d": "可解釋性", "correct_option": "B", "explanation": "歐盟可信任AI四大倫理原則為尊重人類自主、避免傷害、公平性、可解釋性；選項B「尊重AI決策正確性」聽起來像是系統效能或準確率的要求，屬於技術或效能面的期待，而非官方倫理原則。", "has_caveat": 0, "caveat_note": null}, {"id": 13, "source": "題庫02", "topic": "倫理與法律", "question": "可信任AI倫理準則中，所強調的「透明度」是指？", "option_a": "系統性能透明", "option_b": "資金使用透明", "option_c": "開發過程和決策的可解釋性", "option_d": "市場透明", "correct_option": "C", "explanation": "在可信任AI倫理中，「透明度」是指讓人能理解AI是如何被開發出來，以及為什麼做出某個決策，重點在於可解釋性與可追溯性，不是系統性能、資金使用或市場資訊的公開。", "has_caveat": 0, "caveat_note": null}, {"id": 14, "source": "題庫02", "topic": "倫理與法律", "question": "根據歐盟可信任AI倫理準則，下列敘述何者符合問責制需求？", "option_a": "「有人負責」：AI系統要有明確責任歸屬", "option_b": "「有人監督」：需要監管、稽核或審查機制", "option_c": "「出問題可追查」：發生風險時可以追溯原因並處理", "option_d": "（畫面僅完整呈現三個選項）", "correct_option": "A", "explanation": "問責制就是AI不能沒有人管，也不能出錯後找不到人負責。政府設立AI監管機制，代表有制度來監督、檢查與追蹤責任，所以「有人負責」最符合問責制需求。", "has_caveat": 1, "caveat_note": "原始畫面僅完整顯示三個選項（有人負責／有人監督／出問題可追查），第四個選項的文字未在畫面中出現，可能是影片剪輯省略或此題選項數與其他題不同。正確答案A「有人負責」為問責制的核心定義應無疑義，但完整四選項內容無法由畫面確認，建議對照官方題庫核實題目選項總數與第4項內容。"}, {"id": 15, "source": "題庫02", "topic": "倫理與法律", "question": "國際人工智慧倫理原則發展，下列哪一個不是其原則？", "option_a": "以人為中心", "option_b": "可信任", "option_c": "問責制", "option_d": "資料共享", "correct_option": "D", "explanation": "國際人工智慧倫理原則通常著重於「以人為中心」的價值、「可信任」的系統特性，以及「問責制」所強調的責任與可追溯性。「資料共享」則較偏向治理或實務作法（如促進創新、資料開放、跨域合作等），屬於如何管理與運用資料的策略或手段，而非倫理價值本身，因此不是核心倫理原則。", "has_caveat": 0, "caveat_note": null}, {"id": 16, "source": "題庫02", "topic": "倫理與法律", "question": "下列何者是隱私保護的做法？", "option_a": "資料去識別化", "option_b": "資料加密", "option_c": "數據最小化", "option_d": "以上皆是", "correct_option": "D", "explanation": "去識別化能降低個人被辨識的機會，加密能保護資料在傳輸或儲存時不被看懂，數據最小化能避免收集太多不必要的個資，三者都能降低隱私外洩風險，因此最完整答案就是「以上皆是」。", "has_caveat": 0, "caveat_note": null}, {"id": 17, "source": "題庫02", "topic": "倫理與法律", "question": "在人工智慧/生成式AI應用前，以下何者是錯誤的評估面向？", "option_a": "使AI的應用符合法制要求與目標", "option_b": "建立資料主體對於資料利用過程之信任", "option_c": "考量運用AI時消耗之資源，對於環境造成之影響", "option_d": "無須注意生成式AI產品之利用成果與著作權歸屬問題", "correct_option": "D", "explanation": "在使用AI前，應先檢查是否合法、能否建立資料信任、是否有環境影響，這些都是重要的評估面向。只有第4項說「不用注意生成結果與著作權歸屬」是錯的，因為生成式AI可能牽涉內容使用、成果利用與著作權等問題，實際上必須特別留意。", "has_caveat": 0, "caveat_note": null}, {"id": 18, "source": "題庫02", "topic": "倫理與法律", "question": "生成式AI技術訓練和應用過程中會涉及大量個人資料，以下哪一作法可以防範？", "option_a": "資料去識別化", "option_b": "數據最大化", "option_c": "資料解密", "option_d": "存取控制開放", "correct_option": "A", "explanation": "生成式AI在訓練和應用時，可能會用到很多個人資料。重要的防護作法就是「去識別化」：把可以直接或間接識別個人的資訊移除或遮蔽（例如姓名、身分證字號、電話號碼、住址等），讓人更難辨識出特定個人，降低個資外洩的風險。「數據最大化」代表蒐集越多資料越好，反而會增加個資暴露與濫用的風險；「資料解密」是把受保護的資料打開，讓內容更容易被看，並不會讓資料更安全；「存取控制開放」表示太多人可以存取資料，越多人接觸，個資被濫用或外洩的機會就越高。", "has_caveat": 0, "caveat_note": null}, {"id": 19, "source": "題庫02", "topic": "倫理與法律", "question": "2024年4月歐盟公布《人工智慧法》（Artificial Intelligence Act）重要性為何？", "option_a": "著重在歐盟價值與基本權利、倫理、以及可信任", "option_b": "直接適用於歐盟全境，立法方式針對人工智慧進行監管的首例", "option_c": "促進自發將可信賴性納入人工智慧產品、服務及系統之設計、開發、使用與評估", "option_d": "培養公眾對人工智慧使用的信任和信心", "correct_option": "B", "explanation": "這題問的是《人工智慧法》的「重要性」，關鍵在於它是正式立法，而且可直接適用全歐盟，因此最符合的是第2項。選項1、3、4都是歐盟在生成式AI治理方向上值得重視的價值或目標，但最能代表此法「重要性」的是它作為全球首部具法律拘束力、直接適用全歐盟的AI監管立法。", "has_caveat": 0, "caveat_note": null}, {"id": 20, "source": "題庫02", "topic": "倫理與法律", "question": "臺灣已提出對於生成式AI的規範藍圖，何者非臺灣提出之規範？", "option_a": "行政院透過「行政院及所屬機關（構）使用生成式AI參考指引」", "option_b": "金融監督管理委員會公布「金融業運用人工智慧（AI）之核心原則與相關推動政策」", "option_c": "臺灣相關行政機關根據現有法制提出了可能產生風險的概要", "option_d": "專利商標局「文本和數據挖掘（text and data mining）」之合法性界線", "correct_option": "D", "explanation": "選項A～C都是臺灣在生成式AI治理方向上的具體作為：A是行政院層級的使用指引，提供各機關使用生成式AI的參考；B是金融監理機關針對金融業運用AI所訂定的原則與政策；C則是相關行政機關依現有法制，對AI可能產生風險的概要說明，屬於風險辨識與治理方向。相較之下，選項D「專利商標局『文本和數據挖掘』之合法性界線」主要是關於智慧財產權領域中，文本和數據挖掘的法律界線與合法性判斷，屬於著作權／專利等知識產權的法律議題，並非臺灣針對生成式AI所提出的規範藍圖項目。", "has_caveat": 0, "caveat_note": null}, {"id": 21, "source": "題庫03", "topic": "應用技能", "question": "下列何者可以幫助創作專業的商業文案？", "option_a": "ChatGPT", "option_b": "Hemingway Editor", "option_c": "SummarizeBot", "option_d": "DeepL", "correct_option": "A", "explanation": "ChatGPT能協助生成專業的商業文案，例如產品描述、廣告文案、標語（slogan）、促銷文案與行銷點子等。Hemingway Editor主要功能是提升可讀性與編輯品質，並非生成文案；SummarizeBot主要功能是摘要與濃縮內容；DeepL主要功能是翻譯語言，皆非生成原創文案的最佳選擇。", "has_caveat": 0, "caveat_note": null}, {"id": 22, "source": "題庫03", "topic": "應用技能", "question": "AI生成內容（GAI）中的自然語言處理技術可以用於哪種應用？", "option_a": "圖片分類", "option_b": "文字摘要", "option_c": "3D建模", "option_d": "音訊處理", "correct_option": "B", "explanation": "自然語言處理（NLP）專注在理解與處理人類語言，所以可以用來做文字相關的工作，例如摘要文章重點、擷取關鍵資訊、整理長篇內容。圖片分類屬於電腦視覺（Computer Vision）領域，與文字處理不同；3D建模著重在建立三維物體與空間結構；音訊處理主要與語音/聲音技術有關，皆非以文字為核心的NLP應用。", "has_caveat": 0, "caveat_note": null}, {"id": 23, "source": "題庫03", "topic": "應用技能", "question": "下列何者是生成式AI以生成文字為主的工具？", "option_a": "ChatGPT", "option_b": "Sora", "option_c": "MyEdit", "option_d": "Freepik", "correct_option": "A", "explanation": "ChatGPT主要是以生成文字為核心的AI工具，最常見的用途就是聊天問答、寫文案、整理重點、撰寫文章、腳本或企劃內容，所以最符合「以生成文字為主」這個描述。Sora主要偏向影片生成；MyEdit比較偏向影像、音訊或多媒體編修與AI創作；Freepik則更偏向設計素材與圖像資源平台。", "has_caveat": 0, "caveat_note": null}, {"id": 24, "source": "題庫03", "topic": "應用技能", "question": "生成式對抗網路（GAN）中「對抗性訓練」的目的是什麼？", "option_a": "減少圖片中的雜訊", "option_b": "提高模型抵禦對抗性攻擊的穩定性", "option_c": "透過網路之間的競爭產生高品質的圖片", "option_d": "壓縮大型圖片資料集", "correct_option": "C", "explanation": "GAN有兩個網路：生成器（Generator）想要生成圖片，鑑別器（Discriminator）想要判斷圖片是真還是假。它們會一直互相競爭，生成器想騙過鑑別器，鑑別器想抓出假的，這種「對抗性訓練」讓生成器越來越厲害，能產生越來越逼真、品質越來越高的圖片。減少圖片中的雜訊屬於去噪（Denoising）的任務；提高模型抵禦對抗性攻擊的穩定性是對抗樣本防禦的議題；壓縮大型圖片資料集是資料壓縮的任務，三者皆與GAN的核心目的不同。", "has_caveat": 0, "caveat_note": null}, {"id": 25, "source": "題庫03", "topic": "應用技能", "question": "下列哪一種AI技術用於填滿圖片的缺失部分？", "option_a": "圖片修復", "option_b": "圖片過濾", "option_c": "圖片剪裁", "option_d": "圖片大小調整", "correct_option": "A", "explanation": "當圖片出現刮痕、破洞、缺角或受損的區域時，會用到「圖片修復」。AI會分析周圍的像素、紋理、顏色與結構，然後智慧地填補缺失的部分，讓圖片看起來自然、完整，就像原本就沒有受損一樣。圖片過濾主要是改變圖片的外觀風格、色調或效果，並不會填補缺失的部分；圖片剪裁是把圖片中不需要的部分裁掉，只會移除內容，不會補回缺失；圖片大小調整是改變圖片的尺寸（放大或縮小），不會產生或填補新的內容。", "has_caveat": 0, "caveat_note": null}, {"id": 26, "source": "題庫03", "topic": "應用技能", "question": "哪個模型專門用於生成新圖片？", "option_a": "GAP", "option_b": "DNN", "option_c": "GAN", "option_d": "RNN", "correct_option": "C", "explanation": "GAN是生成式對抗網路，專門透過生成器與鑑別器彼此競爭，學會產生新的、看起來像真的圖片。GAP不是圖片生成模型名稱；DNN是較廣泛的深度神經網路概念，並非專門用來生成新圖片的模型；RNN主要處理序列資料，例如文字或時間序列，不是專門生成新圖片的代表模型。", "has_caveat": 0, "caveat_note": null}, {"id": 27, "source": "題庫03", "topic": "應用技能", "question": "下列哪一個生成式AI模型適合用於繪本創作？", "option_a": "Photoshop", "option_b": "Stable Diffusion", "option_c": "Excel", "option_d": "Word", "correct_option": "B", "explanation": "Stable Diffusion是生成式AI圖像模型，能根據文字提示（Prompt）自動生成插畫與圖像，非常適合繪本創作。Photoshop主要用來後製與編修圖片；Excel是試算表與資料表工具；Word則是文字文件編輯軟體，所以都不是用來生成繪本圖像的最佳選擇。", "has_caveat": 0, "caveat_note": null}, {"id": 28, "source": "題庫03", "topic": "應用技能", "question": "在生成式AI的應用中，與我們息息相關的汽車導航上應用到什麼技術？", "option_a": "文字生成", "option_b": "文字摘要", "option_c": "圖片生成文字", "option_d": "語音合成", "correct_option": "D", "explanation": "汽車導航會把路線、道路名稱、轉彎指示和預計到達時間，用「語音」念出來告訴駕駛，這就是語音合成的應用：把系統資訊轉成自然的聲音，引導我們開車。文字生成是寫出文字；文字摘要是把長文濃縮；圖片生成文字是描述或辨識圖片，都不是導航最常用、最直接讓我們感受到的「開口說話」語音指引。", "has_caveat": 0, "caveat_note": null}, {"id": 29, "source": "題庫03", "topic": "應用技能", "question": "下列各生成式工具中，哪個是聲音生成工具？", "option_a": "Sora", "option_b": "Suno", "option_c": "GitHub Copilot", "option_d": "Midjourney", "correct_option": "B", "explanation": "Suno是專注於音樂與聲音（語音/音訊）生成的生成式AI工具，使用者只要輸入文字提示，就能生成歌曲或音訊。Sora主要用於影片生成，GitHub Copilot主要用於程式碼輔助，Midjourney主要用於圖片生成，因此聲音生成工具是Suno。", "has_caveat": 1, "caveat_note": "原始畫面選項A的文字顯示為「Sroa」，對照影片解析文字「Sroa（或寫作Sora）」判斷應為「Sora」之筆誤，整理時已校正為Sora，供使用者參考核對。"}, {"id": 30, "source": "題庫03", "topic": "應用技能", "question": "請問以下哪項技術是將文字資訊轉換為人類語音？", "option_a": "自然語言處理（Natural Language Processing, NLP）", "option_b": "語音合成（Text-to-Speech, TTS）", "option_c": "語音辨識（Speech-to-Text, STT）", "option_d": "機器翻譯（Machine Translation, MT）", "correct_option": "B", "explanation": "語音合成（TTS）是把寫好的文字轉換成自然的人類語音輸出的技術，常見應用包括導航語音、朗讀文章、AI語音助理等。自然語言處理（NLP）是一個更廣泛的技術領域，著重在理解、分析與產生語言，不等同於把文字變成聲音；語音辨識（STT）是把「語音」轉換成「文字」，方向相反；機器翻譯（MT）是把一種語言的文字翻譯成另一種語言的文字，不會產生語音。", "has_caveat": 0, "caveat_note": null}, {"id": 31, "source": "題庫03", "topic": "應用技能", "question": "下列何者為AI生成內容（GAI）影片生成模型工具？", "option_a": "Akasha", "option_b": "BreeXe", "option_c": "Groq", "option_d": "Sora", "correct_option": "D", "explanation": "Sora是用來生成影片的AI工具，可以依照文字提示產生影片畫面。題目問的是「影片生成模型工具」，所以最符合的是Sora；Akasha、BreeXe、Groq皆不是本題要問的影片生成模型工具。", "has_caveat": 0, "caveat_note": null}, {"id": 32, "source": "題庫03", "topic": "應用技能", "question": "OpenAI的Sora是屬於什麼軟體？", "option_a": "文生圖：把文字變圖片", "option_b": "圖片生成：產生靜態圖片", "option_c": "文字生成影片：把文字提示變成影片", "option_d": "自然語言處理：處理文字理解與生成，非影片工具", "correct_option": "C", "explanation": "Sora的重點是根據文字提示生成影片，或動態畫面，所以符合題意的是「文字生成影片」。文生圖是把文字變圖片、圖片生成是產生靜態圖片、自然語言處理是處理文字理解與生成，三者皆非影片生成工具，與題意不符。", "has_caveat": 0, "caveat_note": null}, {"id": 33, "source": "題庫03", "topic": "應用技能", "question": "下列何者不是生成式AI影片生成工具？", "option_a": "ChatGPT", "option_b": "Flexclip", "option_c": "Sora", "option_d": "Runway ML", "correct_option": "A", "explanation": "ChatGPT是一個以文字為主的對話與內容生成工具，可以回答問題、寫文章、翻譯、整理資料等，但它不是專門用來生成影片的工具。Flexclip、Sora、Runway ML都與影片創作或AI影片生成有關，可以協助製作、編輯或自動生成影片內容，因此不是生成式AI影片工具的是選項A。", "has_caveat": 0, "caveat_note": null}, {"id": 34, "source": "題庫03", "topic": "應用技能", "question": "Sora是一個能以文字描述生成影片的人工智慧模型，其開發公司為？", "option_a": "OpenAI", "option_b": "Microsoft", "option_c": "Google", "option_d": "Apple", "correct_option": "A", "explanation": "Sora是一個能「以文字描述生成影片」的人工智慧模型，由OpenAI開發。Microsoft、Google、Apple都是很厲害的科技公司，但這一題問的是「Sora是由誰開發的」，所以答案是OpenAI。", "has_caveat": 0, "caveat_note": null}, {"id": 35, "source": "題庫03", "topic": "應用技能", "question": "AI可以幫助優化簡報的哪個方面？", "option_a": "設計排版", "option_b": "程式碼編寫", "option_c": "網頁瀏覽", "option_d": "資料庫管理", "correct_option": "A", "explanation": "AI最能幫助的，就是簡報的設計排版！它可以幫我們自動安排文字與圖片的位置，讓版面更整齊；推薦合適的配色與字體，讓簡報更美觀；調整層次與重點（例如標題、內文大小），讓內容更清楚；套用專業的版型與圖示，讓簡報更吸引人。程式碼編寫雖然AI確實能幫助寫程式，但這與優化簡報設計排版沒有直接關係；網頁瀏覽是取得資料的管道，不是簡報優化的重點；資料庫管理可協助資料處理，與簡報的版面設計無關。", "has_caveat": 0, "caveat_note": null}, {"id": 36, "source": "題庫03", "topic": "應用技能", "question": "AI生成簡報的哪個功能可以幫助提高視覺吸引力？", "option_a": "設計優化", "option_b": "語音辨識", "option_c": "自然語言處理", "option_d": "機器翻譯", "correct_option": "A", "explanation": "「設計優化」可以幫助提高簡報的視覺吸引力，因為AI能協助做到版面配置更整齊平衡、色彩搭配更協調美觀、字體選擇更清晰易讀、視覺層次重點更突出、圖示/圖片配置增強視覺效果、整體美感讓簡報更吸晴，因此能讓投影片更清楚、有重點且更吸引觀眾注意力。語音辨識是將語音轉成文字，主要用於輸入或記錄，與視覺美觀無直接關係；自然語言處理幫助理解或生成文字內容，重點在「文字」而非「視覺設計」；機器翻譯將文字翻成其他語言，幫助跨語言溝通，與視覺吸引力無直接關聯。", "has_caveat": 0, "caveat_note": null}, {"id": 37, "source": "題庫03", "topic": "應用技能", "question": "聊天機器人的上下文管理在AI生成內容（GAI）中起到什麼作用？", "option_a": "追蹤對話狀態", "option_b": "加強互動體驗", "option_c": "分析數據", "option_d": "增加運算量", "correct_option": "A", "explanation": "上下文管理的核心功能是追蹤先前的對話內容、用戶意圖與當前對話狀態，讓聊天機器人知道「已經說了什麼」與「現在在聊什麼」，從而正確理解並延續對話。加強互動體驗是可能的結果，因為機器人能更貼近情境、給出更合適的回應，但這不是它的主要角色；分析數據是資料處理或後續分析的工作，不是上下文管理的核心功能；增加運算量與上下文管理無直接關係，並非其作用所在。", "has_caveat": 1, "caveat_note": "原始畫面選項D文字顯示為「增加運算輛」，對照上下文判斷應為「增加運算量」之筆誤，整理時已校正。"}, {"id": 38, "source": "題庫03", "topic": "應用技能", "question": "使用AI生成程式碼時，以下哪個步驟通常不是必須的？", "option_a": "理解問題描述和需求", "option_b": "請AI生成初版程式碼", "option_c": "人工修改和優化程式碼（含生成單元測試程式碼）", "option_d": "手動調試和測試程式碼", "correct_option": "C", "explanation": "使用AI寫程式時，真正重要的是先把需求想清楚，再檢查AI產出的內容，最後自己測試與除錯。這三件事幾乎每次都需要，因為它們會直接影響程式是否符合需求、能不能執行，以及是否安全。單元測試也很重要，尤其在大型專案、長期維護或多人協作時特別有幫助，不過如果只是小練習、短腳本或快速驗證想法，它通常不是最先一定要做的步驟。所以題目問『通常不是必須』時，答案就是「生成單元測試程式碼」這個步驟。", "has_caveat": 1, "caveat_note": "此題畫面以「實務上的建議流程」5步驟呈現（①理解問題描述和需求→②請AI生成初版程式碼→③人工修改和優化程式碼→④手動調試和測試程式碼→⑤視需要再補上單元測試），但影片結論文字為「答案就是第3項：生成單元測試程式碼」，與流程圖第3步「人工修改和優化程式碼」的文字不完全一致，較接近流程圖第5步「視需要再補上單元測試」。選項的確切逐字文字無法從畫面百分之百確認，以上選項C依解析結論「生成單元測試程式碼」與流程圖整合重建，建議使用者對照官方題庫核實選項C的正確文字（原意應指「單元測試」此一步驟非每次必要）。"}, {"id": 39, "source": "題庫03", "topic": "應用技能", "question": "使用AI生成程式碼可能會帶來哪些潛在威脅？", "option_a": "程式碼的開發效率可能提高", "option_b": "程式碼的可讀性可能增加", "option_c": "程式碼的安全性可能降低", "option_d": "程式碼的功能可能更完整", "correct_option": "C", "explanation": "使用AI生成程式碼時，可能引入漏洞、不安全的邏輯、過時的函式庫，或隱藏風險（例如未處理的例外、權限問題、資料外洩等）。因此，使用AI生成程式碼的「主要威脅」就是：程式碼的安全性可能降低。選項A、B、D描述的是可能的好處或中性結果，並非使用AI生成程式碼的主要威脅。", "has_caveat": 0, "caveat_note": null}, {"id": 40, "source": "題庫03", "topic": "應用技能", "question": "在使用AI生成程式碼時，以下哪個技術可以幫助模型理解程式語言的語法和結構？", "option_a": "深度學習", "option_b": "遷移學習", "option_c": "強化學習", "option_d": "模型微調", "correct_option": "A", "explanation": "深度學習讓模型透過大量程式碼資料學習，能辨識語法、結構、模式、變數用法、函式關係與常見程式邏輯，因此是幫助模型理解程式語言語法與結構的關鍵技術。遷移學習是把已學會的知識轉移到新任務；強化學習著重在依獎勵優化行為；模型微調則是針對特定任務進一步調整已預訓練模型。它們雖然有幫助，但讓模型「看懂」語法與結構的核心能力，主要來自深度學習的大量學習與表示能力。", "has_caveat": 0, "caveat_note": null}, {"id": 41, "source": "題庫03", "topic": "應用技能", "question": "生成程式碼時，以下哪個技術可以幫助模型理解程式語言的語法和結構？", "option_a": "深度學習", "option_b": "遷移學習", "option_c": "強化學習", "option_d": "模型微調", "correct_option": "A", "explanation": "同第40題——深度學習讓模型透過大量程式碼資料學習，能辨識語法、結構、模式、變數用法、函式關係與常見程式邏輯，是幫助模型理解程式語言語法與結構的關鍵技術。", "has_caveat": 1, "caveat_note": "本題（影片標示Q22）與第40題（影片標示Q21）題幹幾乎相同，僅文字略有差異（「使用AI生成程式碼時」vs「生成程式碼時」），選項與答案也完全相同，可能為影片系列中之重複/近似題。建議使用者核對官方題庫，確認是否為同一題重複出現，或確為兩道獨立題目。"}, {"id": 42, "source": "題庫03", "topic": "應用技能", "question": "在使用AI生成程式碼時，以下哪項通常不是一個重要的考慮因素？", "option_a": "輸入資料的品質", "option_b": "模型的準確度", "option_c": "生成程式碼的風格和可讀性", "option_d": "使用的硬體資源", "correct_option": "D", "explanation": "使用AI生成程式碼時，真正重要的是：你的提示詞（輸入）是否清楚且高品質、模型是否夠準確、以及生成的程式碼是否易讀、好維護。相反地，硬體資源（例如CPU、GPU、記憶體）通常是由平台或服務方負責配置與管理，使用者在評估AI生成程式碼品質時，通常不需要特別考慮。因此，選項D「使用的硬體資源」通常不是一個重要的考慮因素。", "has_caveat": 0, "caveat_note": null}, {"id": 43, "source": "題庫03", "topic": "應用技能", "question": "使用AI生成式數據分析的有什麼優勢？", "option_a": "能夠處理大規模數據，自動化程度高", "option_b": "可以生成新的數據，豐富數據集", "option_c": "預測能力強，能發現隱藏模式", "option_d": "以上皆是", "correct_option": "D", "explanation": "因為選項A、B、C都是AI生成式數據分析的優勢，所以最完整、最正確的答案是「以上皆是」。A能快速處理海量資料，並自動化分析流程，提升效率、節省時間與人力；B能生成新的數據或補齊缺失資料，讓數據更完整、多元，提升分析品質；C運用深度學習與模式辨識，挖掘人眼難以發現的趨勢，並挖掘更多洞察。", "has_caveat": 0, "caveat_note": null}, {"id": 44, "source": "題庫03", "topic": "應用技能", "question": "AI生成式技術如何幫助改善傳統數據分析的流程？", "option_a": "生成更多電力", "option_b": "提高資料收集速度", "option_c": "自動化資料清洗和處理", "option_d": "增加資料冗餘", "correct_option": "C", "explanation": "AI生成式技術能協助把原本很花時間的資料整理工作自動化，例如清理重複資料、補缺漏、格式統一、初步整理與處理，讓分析流程更有效率。生成更多電力與資料分析流程無關，AI生成式技術並不會「生成更多電力」；提高資料收集速度雖然AI可以間接幫助加快工作，但本題的核心重點不是「收集速度」，而是「資料清洗和處理」；增加資料冗餘會造成儲存浪費、分析混亂，並非優點，反而會降低分析效率與準確性。", "has_caveat": 0, "caveat_note": null}, {"id": 45, "source": "題庫03", "topic": "應用技能", "question": "哪一個不是使用生成式AI的應用？", "option_a": "趨勢預測", "option_b": "規則探勘", "option_c": "高速收集資料", "option_d": "快速生成視覺化圖表", "correct_option": "C", "explanation": "「高速收集資料」是「蒐集資料的速度或工具能力」，不是AI要「生成、分析或輔助內容」的核心應用，就算不用生成式AI，用程式或爬蟲也能做到收集資料。趨勢預測是生成式AI能分析大量資料、找出模式並預測未來趨勢，屬於「分析＋生成洞察」的應用；規則探勘是生成式AI能從資料中找出關聯與規則，並用自然語言說明給我們聽，是「發現＋解釋知識」的應用；快速生成視覺化圖表是生成式AI能根據資料自動產生圖表，或把重點整理成圖表與說明，屬於「協助內容產生與呈現」。生成式AI的重點是生成、分析與輔助，不是只加快資料收集的速度。", "has_caveat": 0, "caveat_note": null}, {"id": 46, "source": "題庫03", "topic": "應用技能", "question": "在聊天機器人的應用中，什麼是互動式對話系統？", "option_a": "多次互動來完成一個任務", "option_b": "使用圖片進行對話", "option_c": "一次性提供所有資訊", "option_d": "僅適用於簡單查詢或操作", "correct_option": "A", "explanation": "互動式對話系統是指使用者與聊天機器人透過多輪來回對話，逐步收集與確認資訊，最終完成一個任務。例如：詢問需求→確認細節→完成預約或申請服務。選項B僅是用圖片對話，並非互動流程；選項C是一次性提供所有資訊，沒有來回溝通；選項D限於簡單功能，不符合「多輪互動完成任務」的核心。", "has_caveat": 0, "caveat_note": null}, {"id": 47, "source": "題庫03", "topic": "應用技能", "question": "以下哪一個格式常用於聊天機器人的訊息傳遞與處理？", "option_a": "CSV", "option_b": "XML", "option_c": "JSON", "option_d": "HTML", "correct_option": "C", "explanation": "聊天機器人系統在傳送與接收資料時，常用JSON格式，因為JSON具有清楚的鍵值（key-value）結構，程式容易讀取與處理，在API和訊息交換中非常普遍。CSV主要用於表格式資料（如試算表），不適合處理巢狀或結構化的訊息內容；XML是較早期的資料格式，標籤多、較冗長，解析與撰寫較複雜，使用率已較低；HTML主要用於網頁內容的顯示與排版，不是資料交換的格式。", "has_caveat": 1, "caveat_note": "原始畫面選項D文字顯示為「HTM」，對照說明文字與圖示（均標示為HTML）判斷應為「HTML」之簡寫或筆誤，整理時已校正為HTML，供使用者參考核對。"}, {"id": 48, "source": "題庫04", "topic": "能力強化", "question": "損失函數（Loss Function）是用來衡量模型預測結果與正確答案之間差距的指標，Loss值越小代表什麼？", "option_a": "模型預測越準確、表現越好", "option_b": "模型表現越差", "option_c": "模型尚未訓練", "option_d": "發生過度擬合", "correct_option": "A", "explanation": "Loss（損失值）可想成模型的扣分表，用來衡量模型預測結果和正確答案之間差多少。Loss值越小代表模型預測越接近正確答案、錯誤越少，因此模型表現越好。選項B方向相反，Loss小不是模型變差；選項C錯誤，因為只要有預測與比較就會產生Loss值，不限於模型尚未訓練的階段；選項D錯誤，過度擬合要看訓練集與測試集表現的差距，不能只看單一Loss值判斷。", "has_caveat": 1, "caveat_note": "此影片全程未以字卡顯示完整的原始題目與四個選項文字，僅以口語與「為什麼答案是1／選項2、3、4錯在哪裡」的推理方式呈現，確切題幹與選項原文無法由影片畫面或旁白逐字還原。以上題目與選項係依內容重建，答案方向（Loss越小代表模型越準確）應無誤，但文字非逐字稿，建議使用者對照官方題庫核實原始題目與選項文字。"}, {"id": 49, "source": "題庫04", "topic": "能力強化", "question": "在生成式AI中，微調（Fine-tuning）是指什麼？", "option_a": "對模型進行微調以適應特定任務或資料集", "option_b": "使用預訓練模型進行推理", "option_c": "將生成器網路和鑑別器網路連接起來", "option_d": "在訓練期間動態調整學習率", "correct_option": "A", "explanation": "微調就是把原本已經訓練好的模型，再拿特定任務或特定資料做進一步調整，讓它更符合某個用途，例如客服問答、醫療文本或品牌文案。這不是單純拿模型來推理，也不是把生成器和鑑別器接起來，更不是只調整學習率，所以最符合微調定義的是選項A。", "has_caveat": 0, "caveat_note": null}, {"id": 50, "source": "題庫04", "topic": "能力強化", "question": "下列何者為BERT的核心組件模型？", "option_a": "Professor", "option_b": "Generator", "option_c": "Informer", "option_d": "Transformer", "correct_option": "D", "explanation": "BERT的核心架構是Transformer，特別利用Transformer的雙向理解能力，讓模型能同時參考一句話前後文，理解詞語在語境中的意思；Professor、Generator、Informer都不是BERT核心組件模型。", "has_caveat": 0, "caveat_note": null}, {"id": 51, "source": "題庫04", "topic": "能力強化", "question": "以下哪一種訓練方式使用未標記資料？", "option_a": "監督式學習", "option_b": "非監督式學習", "option_c": "半監督式學習", "option_d": "強化學習", "correct_option": "B", "explanation": "非監督式學習就是讓AI面對沒有標準答案的資料，自己去找規律、分群或關聯，所以最符合「使用未標記資料」的意思。監督式學習要有標記答案，半監督式學習是標記與未標記混合，強化學習則靠回饋獎勵，不是本題重點。", "has_caveat": 0, "caveat_note": null}, {"id": 52, "source": "題庫04", "topic": "能力強化", "question": "多模態模型（LMM）通常是基於哪些技術開發的？", "option_a": "深度學習與大型神經網路", "option_b": "遺傳演算法和模糊邏輯", "option_c": "SVM和決策樹", "option_d": "RNN和進化演算法", "correct_option": "A", "explanation": "LMM必須同時理解文字、圖片、聲音等多種資料，並把它們整合起來進行理解與生成，這需要強大的表徵學習與融合能力。現代LMM通常是基於深度學習與大型神經網路開發，因為它們能從海量資料中學到複雜的模式，並有效整合不同模態，達成高品質的理解與生成。遺傳演算法和模糊邏輯比較偏向特定優化或規則推理，不是現代LMM主流基礎；SVM和決策樹較適合傳統機器學習任務，面對大規模多模態資料能力有限；RNN曾用於序列資料，但不是現代LMM最核心的主流架構，進化演算法也不是主要基礎。", "has_caveat": 1, "caveat_note": "畫面右側僅完整列出選項B、C、D的文字（用於說明為何不選），選項A（正確答案）文字係依左側「1分鐘白話文」說明重建為「深度學習與大型神經網路」，未見原始字卡逐字呈現，建議核對官方題庫確認選項A逐字文字。"}, {"id": 53, "source": "題庫04", "topic": "能力強化", "question": "何項技術藉由生成式模型訓練大量資料集，以生成新的內容，例如圖片、影片或聲音？", "option_a": "生成式對抗網路", "option_b": "風格轉換", "option_c": "強化學習", "option_d": "自動編碼器", "correct_option": "A", "explanation": "生成式對抗網路（GAN）是經典的生成式技術，它從大量資料中學習，學會資料特徵，再產生新內容，例如生成全新圖片、影片相關畫面或音訊等。風格轉換著重改變風格；強化學習是透過獎勵學習決策；自動編碼器可學特徵，但不是最直接的生成方法。", "has_caveat": 0, "caveat_note": null}, {"id": 54, "source": "題庫04", "topic": "能力強化", "question": "AI工具可以協助哪方面的自主學習管理呢？", "option_a": "時間管理", "option_b": "知識管理", "option_c": "任務和專案管理", "option_d": "以上皆是", "correct_option": "D", "explanation": "時間管理例如安排讀書時程、提醒截止日、規劃複習節奏；知識管理例如整理筆記、摘要重點、分類學習資料；任務和專案管理例如拆解作業步驟、追蹤進度、安排合作分工。AI工具可以在時間管理、知識管理、任務和專案管理三方面都提供很大幫助，因此最完整的答案就是選項D「以上皆是」。", "has_caveat": 0, "caveat_note": null}, {"id": 55, "source": "題庫04", "topic": "能力強化", "question": "AI時間管理工具無法協助達成以下哪個功能呢？", "option_a": "自動安排和調整日程，以最佳化時間利用", "option_b": "分析工作效率並提供改進建議", "option_c": "提醒用戶即將到來的會議和截止日期", "option_d": "完全替代人類的決策過程，根據個人喜好自動完成所有任務", "correct_option": "D", "explanation": "AI時間管理工具可以幫你排程，自動安排和調整日程，讓時間用得更有效率；它也能提醒你會議和截止日期，避免錯過重要事項；還能分析你的工作效率，提供改進建議，幫助你做得更好。但AI是輔助工具，不可能完全取代人的判斷，也不會依個人喜好自動完成所有任務，因此第4項是做不到的功能。", "has_caveat": 0, "caveat_note": null}, {"id": 56, "source": "題庫04", "topic": "能力強化", "question": "在AI生成內容（GAI）領域，BERT是一種什麼類型的模型？", "option_a": "迴歸模型", "option_b": "圖片模型", "option_c": "語言模型", "option_d": "分類模型", "correct_option": "C", "explanation": "BERT（Bidirectional Encoder Representations from Transformers）是一種語言模型，主要用來理解和處理文字。它能從句子中同時考慮左右兩邊的語境，幫助電腦更好地理解字詞在不同脈絡下的意思，常用於問答、文字理解、搜尋、摘要等任務。迴歸模型主要用來預測連續數值（如房價、溫度），BERT的主要目標是理解文字，不是數值預測；圖片模型（如CNN）專門用來處理影像資料，BERT主要處理的是文字，不是影像；雖然BERT可以拿來做分類任務（例如情感分析），但模型的本質與核心能力是「理解語言」，因此它的類型仍屬於語言模型。", "has_caveat": 0, "caveat_note": null}, {"id": 57, "source": "題庫04", "topic": "能力強化", "question": "“Garbage in, garbage out.”這個說法在生成式AI的哪個方面尤為重要？", "option_a": "運算資源的使用", "option_b": "訓練時間的長短", "option_c": "模型參數的多少", "option_d": "訓練資料的品質", "correct_option": "D", "explanation": "“Garbage in, garbage out.”的意思是：如果輸入（這裡指訓練資料）是垃圾，輸出（AI生成的結果）也會是垃圾。運算資源、訓練時間、模型參數的多寡，確實會影響模型表現（例如更快、更大、可能更強），但它們不是這句話的核心含義。即使資源再多、時間再長、參數再多，如果資料品質差，AI的結果仍然會差，因此這個說法在「訓練資料的品質」上尤為重要。", "has_caveat": 0, "caveat_note": null}, {"id": 58, "source": "題庫04", "topic": "能力強化", "question": "GAI裡的Prompt是什麼？", "option_a": "用來評估人工智慧生成內容品質的標準", "option_b": "用於訓練人工智慧模型的大量數據集", "option_c": "用於提供給AI的文字提示", "option_d": "用來測試人工智慧模型性能的基準數據", "correct_option": "C", "explanation": "Prompt就是使用者給AI的文字指令或提示，告訴AI想做什麼，例如寫文案、摘要文章、生成圖片描述等。選項A是評估標準：指用來判斷AI生成內容好壞的規則或指標，所以不是Prompt；選項B是訓練數據：指用來訓練AI模型的大量資料，讓AI學習，所以不是Prompt；選項D是基準數據：指用來測試與比較模型表現的標準資料集，所以不是Prompt。", "has_caveat": 0, "caveat_note": null}, {"id": 59, "source": "題庫04", "topic": "能力強化", "question": "GAI裡的Prompt也可以稱之為何？", "option_a": "文字指令", "option_b": "詠唱", "option_c": "咒語", "option_d": "以上皆是", "correct_option": "D", "explanation": "在GAI（生成式AI）裡，Prompt指的就是你輸入給AI的文字，用來告訴AI要做什麼或如何回答。在實際教學或創作者社群中，大家常常會口語地稱呼它為「文字指令」、「詠唱」或「咒語」。因為選項A、B、C都是同一件事的不同說法，所以最完整、最正確的答案是選項D「以上皆是」。", "has_caveat": 0, "caveat_note": null}, {"id": 60, "source": "題庫04", "topic": "能力強化", "question": "Prompt的好壞主要影響有哪些？下列何者為誤？", "option_a": "精確性", "option_b": "生成檔案的大小", "option_c": "可控性", "option_d": "風格和語氣", "correct_option": "B", "explanation": "Prompt的品質會明顯影響AI產出的精確性、可控性，還有整體風格與語氣。也就是說，你的提示詞越清楚，AI越容易照你的要求產生正確、穩定、符合風格的內容。但「生成檔案的大小」通常不是由Prompt的好壞直接決定，而比較常和解析度、輸出格式、壓縮方式有關。所以這題問「何者為誤」，最不符合Prompt主要影響的就是第B項。", "has_caveat": 0, "caveat_note": null}, {"id": 61, "source": "題庫04", "topic": "能力強化", "question": "Prompt的好壞會直接影響生成結果的品質，下列哪個元素無法生成精確的成果？", "option_a": "清晰描述", "option_b": "簡易說明", "option_c": "具體定義", "option_d": "上下文連貫", "correct_option": "B", "explanation": "如果Prompt只有簡單或模糊的說明，AI可能無法完全理解你需要的細節，產生的結果就會不夠精確。清晰描述能讓AI知道重點；具體定義提供明確標準；上下文連貫讓AI掌握脈絡，都能幫助AI生成更準確的結果，所以本題答案是B「簡易說明」。", "has_caveat": 0, "caveat_note": null}, {"id": 62, "source": "題庫04", "topic": "能力強化", "question": "下列哪一項不是進階提示詞工程的特點？", "option_a": "需要精確語言與上下文資訊，才能減少誤解", "option_b": "會根據任務目標調整提示內容，讓輸出更符合需求", "option_c": "使用大量特殊技術術語讓AI更懂你的需求", "option_d": "給予明確的目標、背景、限制、格式、語氣與範例，讓輸出更貼近期待", "correct_option": "C", "explanation": "進階提示詞工程的核心是把任務說清楚，讓AI更懂你要什麼，需要精確語言與上下文資訊，才能減少誤解；會根據任務目標調整提示內容，讓輸出更符合需求。如果只是使用大量特殊技術術語，反而不一定讓AI更懂，可能讓輸出變得混亂，因此這是錯誤選項。生活例子：煮一鍋湯，你要說清楚食材、份量、步驟、時間，湯才會好喝；只說專業術語堆疊的指令，反而會讓人（或AI）一頭霧水。", "has_caveat": 1, "caveat_note": "畫面未以A-D編號列出四個完整選項文字，僅點列「進階提示詞工程的核心」六項特質（目標、背景、限制、格式、語氣、範例）並說明「第3項是錯誤選項」，指該錯誤選項與「使用大量特殊技術術語」有關，確切四個選項原文無法逐字還原，以上為依內容重建，建議使用者核對官方題庫確認原始選項文字。"}, {"id": 63, "source": "題庫04", "topic": "能力強化", "question": "下列何者不是Prompt使用提示語的情境設置策略和技巧？", "option_a": "使用艱澀冷門的專用術語", "option_b": "描述明確目標", "option_c": "給予特定角色", "option_d": "指定產出格式", "correct_option": "A", "explanation": "Prompt情境設置技巧重點是幫AI更清楚理解任務，例如先說明要達成的目標、指定它扮演什麼角色，或要求用特定格式輸出，這些做法都能讓結果更穩定、更接近需求。相反地，使用艱澀又冷門的專用術語，並不會自動讓Prompt變高級，反而可能讓指令變得難懂，增加誤解風險。所以第A項不是有效的情境設置策略。", "has_caveat": 1, "caveat_note": "畫面僅完整顯示選項B、C、D的文字（描述明確目標、給予特定角色、指定產出格式），選項A（正確答案，即錯誤策略）文字依解析說明「使用艱澀冷門的專用術語」重建，非逐字字卡文字，建議核對官方題庫。"}, {"id": 64, "source": "題庫04", "topic": "能力強化", "question": "為什麼需要追求Prompt的合理性？", "option_a": "增加生成的正確性", "option_b": "加快AI的運算速度", "option_c": "節省電力與成本", "option_d": "讓AI更有創意", "correct_option": "A", "explanation": "Prompt像給AI的任務說明書，說明越合理，AI越不容易誤解，輸出越接近需求。合理Prompt不是為了讓電腦變快或省電，而是讓內容更準，所以正確答案是增加生成的正確性。", "has_caveat": 0, "caveat_note": null}, {"id": 65, "source": "題庫04", "topic": "能力強化", "question": "在ChatGPT中如輸入資訊後所生成的答案，並非你所要的，後續又該如何處理才能提高ChatGPT答題的準確度？下列何者為非？", "option_a": "原句重新再問一次", "option_b": "描述明確目標", "option_c": "分析問題", "option_d": "拆解問題", "correct_option": "A", "explanation": "不滿意答案時的有效做法是：補充目標（描述明確目標，讓AI知道要完成什麼）、指出問題（分析問題的重點是什麼、缺少哪些資訊）、拆解步驟（分成小步驟，逐一釐清）。單純把原句重新再問一次，資訊沒有增加，答案可能一樣不準，所以何者為非的答案是選項A。", "has_caveat": 0, "caveat_note": null}, {"id": 66, "source": "題庫04", "topic": "能力強化", "question": "使用ChatGPT來撰寫計畫，需要哪些關鍵元素才能生成較精確的文件？", "option_a": "明確目標", "option_b": "特定角色", "option_c": "足夠上下文", "option_d": "以上皆是", "correct_option": "D", "explanation": "想要AI幫你寫出更精準的計畫，不能只問「幫我寫一份計畫」這種太籠統的問法。你需要說清楚：想要AI扮演什麼角色、讓它用專業角度回答，還要提供背景條件，這樣它才知道怎麼寫，結果才會好用——也就是明確目標、特定角色、足夠上下文三者兼具，結果會內容聚焦、結構完整、可直接使用。", "has_caveat": 1, "caveat_note": "畫面以「錯誤問法 vs 較好問法」對比呈現，未列出A-D編號選項文字，正確答案「4／D」對應之具體選項文字無法由畫面直接確認，以上依內容重建為「明確目標、特定角色、足夠上下文、以上皆是」，建議使用者核對官方題庫確認選項原文。"}, {"id": 67, "source": "題庫04", "topic": "能力強化", "question": "將問題分階段提問有什麼好處？", "option_a": "減少對硬體的依賴", "option_b": "得到更詳細、更精確的回覆", "option_c": "加快AI的運算速度", "option_d": "提高生成文本的創意性", "correct_option": "B", "explanation": "把大問題拆成多個小步驟來問，能讓AI先了解目標，再掌握條件，接著補充細節需求，最後產出符合期待的結果。這樣回答才會更完整、準確、符合期待。選項A「減少對硬體的依賴」：分階段提問的重點不在硬體需求；選項C「加快AI的運算速度」：速度不是由提問方式決定；選項D「提高生成文本的創意性」：創意不是主要目的，是附加效果。", "has_caveat": 1, "caveat_note": "畫面中選項B（正確答案）文字被講師人像部分遮擋，僅能辨識片段「分階段提...」、「是讓回...」，完整文字依題目脈絡（分階段提問：結果更詳細、更精確）重建為「得到更詳細、更精確的回覆」，選項A、C、D文字依畫面「為什麼1、3、4不是主要答案」欄位列出，建議核對官方題庫確認逐字文字。"}, {"id": 68, "source": "題庫04", "topic": "能力強化", "question": "為什麼資料治理對生成式AI模型至關重要？", "option_a": "減少數據存儲成本", "option_b": "提高數據品質和安全", "option_c": "增加數據多樣性", "option_d": "優化數據格式", "correct_option": "B", "explanation": "資料治理能確保資料在整個生命週期中被妥善管理，提升資料的品質、準確性、完整性，並保障隱私、權限與安全。這樣可讓生成式AI模型學習到更可靠的資料，產生更準確、一致的回應，並降低錯誤、偏見、資料外洩等風險，建立使用者信任與合規性。減少數據存儲成本雖然重要，但不是核心目標，重點是資料「好不好、安不安全」；增加數據多樣性有助於模型表現，但若資料品質差或有偏見，反而有害；優化數據格式可提升處理效率，但若資料不準確或不安全，仍會導致問題。", "has_caveat": 0, "caveat_note": null}, {"id": 69, "source": "題庫04", "topic": "能力強化", "question": "開源數據共享概念強調數據的哪些特性？", "option_a": "私密性和不可訪問性", "option_b": "可獲取性和可再使用性", "option_c": "商業性和高利潤性", "option_d": "獨佔性和排他性", "correct_option": "B", "explanation": "開源數據共享的重點，是讓更多人能夠容易取得（可獲取）並且再次使用（可再使用）這些數據。因此，數據應該要開放、可取得、可再利用，這樣可以幫助學習、研究、創新以及公共服務，讓社會整體更進步。選項A錯：強調私密與不可訪問，與「開放」的精神相反，開源數據不是要把數據藏起來；選項C錯：開源數據不是為了賺錢或追求高利潤，重點在於公共利益與共享價值；選項D錯：開源數據不是獨佔或排他，而是讓更多人一起使用與受益。", "has_caveat": 0, "caveat_note": null}, {"id": 70, "source": "題庫04", "topic": "能力強化", "question": "在生成式AI的開源數據共享中，哪些因素是高品質數據集收集的關鍵？", "option_a": "數據的格式多樣性", "option_b": "數據的來源可靠性", "option_c": "數據的訓練速度", "option_d": "數據的收集成本", "correct_option": "B", "explanation": "高品質數據集的關鍵，首先在於來源可靠。因為如果來源本身就錯誤、帶有偏見、過時或不清楚，AI就可能學到錯誤的資訊，進而產生不可靠的結果。可靠的來源能提升數據的準確性、一致性與可信度，讓AI學得更好、用得更安心。選項A數據的格式多樣性：雖然多樣的格式有助於應用，但並非決定數據品質的核心；選項C數據的訓練速度：訓練速度影響模型效率，但不是收集高品質數據集的關鍵；選項D數據的收集成本：成本涉及資源配置，但高或低成本並不能直接決定數據品質。", "has_caveat": 0, "caveat_note": null}, {"id": 71, "source": "題庫04", "topic": "能力強化", "question": "資料探勘的第一步是什麼？", "option_a": "資料清理", "option_b": "資料標註", "option_c": "資料收集", "option_d": "資料轉換", "correct_option": "C", "explanation": "資料探勘的第一步是「資料收集」。在清理、標註或轉換之前，我們一定要先把原始資料蒐集起來，例如：從資料庫、網站、感測器、問卷等來源取得資料。沒有資料，後面的步驟就無法開始。選項A資料清理：清理是把錯誤、重複或不完整的資料整理乾淨，但前提是要先有資料才能清理；選項B資料標註：標註是替資料加上標籤或說明，必須先有資料才能標註；選項D資料轉換：轉換是把資料變成另一種格式或結構，同樣需要先有資料才能轉換。", "has_caveat": 0, "caveat_note": null}, {"id": 72, "source": "題庫04", "topic": "能力強化", "question": "在資料清理過程中，下列哪一項不是主要目標？", "option_a": "去除重複的數據", "option_b": "填補或移除缺失的數據", "option_c": "增加資料集的大小", "option_d": "過濾無關或錯誤的訊息", "correct_option": "C", "explanation": "資料清理的重點是把資料整理乾淨、修正問題、提高品質，例如去除重複資料、處理缺失值、過濾錯誤或無關資訊。第3項「增加資料集的大小」不是資料清理的主要目標，這比較像資料蒐集、資料擴增或資料增補的工作，不是清理流程本身。", "has_caveat": 0, "caveat_note": null}, {"id": 73, "source": "題庫04", "topic": "能力強化", "question": "在生成式AI模型訓練中，資料標註的重要性體現在哪裡？", "option_a": "增加數據集的規模", "option_b": "確保數據的一致性", "option_c": "提高模型的泛化能力", "option_d": "為數據添加具體標籤，如情感或物體類別", "correct_option": "D", "explanation": "資料標註就是「為資料貼上明確標籤」，例如標記正向/負向情感、貓/狗類別，或是物體名稱，讓AI知道每筆資料代表什麼，才能學習正確。標註本身就是「加標籤」的行為，因此選項D是最直接、最正確的描述。選項A、B、C可能是標註帶來的效果或好處，但不是資料標註的核心定義。", "has_caveat": 0, "caveat_note": null}, {"id": 74, "source": "題庫04", "topic": "能力強化", "question": "為什麼資料清理對生成式AI模型很重要？", "option_a": "提高模型訓練速度", "option_b": "增加數據多樣性", "option_c": "減少數據存儲成本", "option_d": "確保數據集清潔、無噪音", "correct_option": "D", "explanation": "資料清理的核心，是把錯誤、重複、缺漏、雜訊或無關資料整理掉，讓資料集更乾淨、更可靠。生成式AI會從資料中學習，如果資料很亂、很多噪音，模型就可能學錯、答錯，產出不穩定的內容。所以資料清理最重要的目的，是確保數據集清潔、無噪音；選項A、B、C可能是附帶影響，但不是這題最核心的答案。", "has_caveat": 0, "caveat_note": null}, {"id": 75, "source": "題庫04", "topic": "能力強化", "question": "下列哪一項不屬於生成式AI資料治理的最佳實踐？", "option_a": "建立清晰的政策和程序", "option_b": "資料管理者和AI倫理委員會的角色", "option_c": "確保資料的複雜性和混亂度", "option_d": "透明度與可解釋性", "correct_option": "C", "explanation": "好的資料治理，就是讓資料有秩序、可理解、可追溯、可負責、值得信任。因此，清楚的政策、明確的角色與透明度都能幫助治理；而讓資料更複雜、混亂，只會增加混淆與風險，完全背離資料治理的目標。", "has_caveat": 0, "caveat_note": null}, {"id": 76, "source": "題庫04", "topic": "能力強化", "question": "資料預處理的主要目的之一是什麼？", "option_a": "增加數據量", "option_b": "減少模型複雜性", "option_c": "使資料適合於模型訓練", "option_d": "優化數據存儲", "correct_option": "C", "explanation": "資料預處理不是單純讓資料變多，也不是直接簡化模型，而是把資料整理成適合模型學習的樣子。像缺失值、重複資料、格式不同、尺度差異等，都要先處理，模型訓練才會比較穩定、準確。選項A增加數據量：這是資料擴增或收集，不是預處理核心目的；選項B減少模型複雜性：比較偏模型設計，不是資料預處理主要目的；選項D優化數據存儲：偏資料庫管理，不是模型訓練前處理的核心。", "has_caveat": 0, "caveat_note": null}, {"id": 77, "source": "題庫04", "topic": "能力強化", "question": "開源數據共享概念的目的為何？", "option_a": "促進生成式AI的發展", "option_b": "促進監督式AI的發展", "option_c": "促進強化學習AI的發展", "option_d": "促進非監督式AI的發展", "correct_option": "A", "explanation": "開源數據共享的目的是讓更多人能合法取得與再利用資料，讓AI研究者與開發者獲得更多訓練資源，加速實驗與創新，特別是支持生成式AI更廣泛地發展。選項B、C、D都是特定的學習方式（監督式、強化學習、非監督式），範圍較窄；而開源數據共享是更廣泛的概念，本題重點在於「促進生成式AI發展」。", "has_caveat": 0, "caveat_note": null}, {"id": 78, "source": "題庫05", "topic": "基礎知識", "question": "生成式AI的主要特點為何？", "option_a": "生成式AI無法生成新的內容，只能回答特定問題", "option_b": "生成式AI可以理解和生成自然語言，並能創造出新的內容", "option_c": "生成式AI在特定領域中工作，無法跨領域生成內容", "option_d": "生成式AI不能理解影像或視覺內容", "correct_option": "B", "explanation": "生成式AI的最大特色不只是回答問題，而是能先理解人類輸入的文字、圖片或需求，再依照指令創造出新的內容，例如文章、圖片、表格、腳本等，甚至可以跨主題協助發想。選項A說它不能生成新內容，這是錯的；選項C說它只能在特定領域中工作，無法跨領域生成內容，也不正確；選項D說它不能理解影像或視覺內容，也不符合現在的AI能力，現在很多生成式AI已經能處理圖片與視覺資訊。", "has_caveat": 1, "caveat_note": "畫面中選項C、D的開頭文字被講師人像部分遮擋（開頭字樣被遮住），完整文字依右側解析（選項C「只能在單一領域工作」、選項D「不能理解影像」）重建，核心語意應無誤，但非逐字字卡文字。"}, {"id": 79, "source": "題庫05", "topic": "基礎知識", "question": "何謂AI生成內容（GAI）？", "option_a": "一種利用人工智慧技術生成文字、圖片或音訊的過程", "option_b": "一種用於分析大數據的技術", "option_c": "一種用於機器學習的演算法", "option_d": "一種用於擴增實境（AR）的工具", "correct_option": "A", "explanation": "AI生成內容，重點在「生成」。也就是讓人工智慧依照你的指令，產生新的文字、圖片、音訊等內容。它不是單純分析資料，也不是某一個演算法，更不是AR工具，所以第A項最符合GAI的意思。", "has_caveat": 0, "caveat_note": null}, {"id": 80, "source": "題庫05", "topic": "基礎知識", "question": "目前AI生成內容（GAI）在內容創作中的一個重要趨勢是什麼？", "option_a": "自動化生成", "option_b": "手動編輯", "option_c": "印刷出版", "option_d": "手寫文字", "correct_option": "A", "explanation": "這題在問，目前GAI在內容創作最重要的發展方向是什麼。GAI的核心特色，就是能依照需求快速產出新的內容，例如文章、圖片、腳本、旁白等。這種讓AI幫忙先做出內容、提升速度與效率的方式，就叫做「自動化生成」，所以第1項最符合題意。", "has_caveat": 0, "caveat_note": null}, {"id": 81, "source": "題庫05", "topic": "基礎知識", "question": "下列哪段描述最符合生成式AI的發展趨勢？", "option_a": "生成式AI的內容生成能力將不斷提升", "option_b": "生成式AI的應用將限於特定領域", "option_c": "生成式AI模型將變得更加複雜和難以使用", "option_d": "生成式AI的道德和倫理問題將不受到重視", "correct_option": "A", "explanation": "目前的發展趨勢顯示，生成式AI越來越聰明、速度更快、準確度更高，能創作文字、圖片、音訊，甚至跨模態內容，內容生成能力會持續提升。選項B太過侷限，生成式AI正在拓展到教育、醫療、設計、行銷、娛樂等各領域；選項C與趨勢相反，AI工具正朝著更簡單、更直覺、更多人都能輕鬆使用的方向發展；選項D完全錯誤，全球對AI的倫理與安全議題關注度越來越高，相關規範也持續加強。", "has_caveat": 0, "caveat_note": null}, {"id": 82, "source": "題庫05", "topic": "基礎知識", "question": "生成式AI（Generative AI）與決策式AI（Discriminative AI）之間的主要區別為何？", "option_a": "生成式AI專注於對現有資料進行分類和辨識，而決策式AI專注於生成新的資料", "option_b": "生成式AI專注於生成新的資料，而決策式AI專注於對現有資料進行分類和辨識", "option_c": "生成式AI和決策式AI之間沒有區別", "option_d": "生成式AI和決策式AI都專注於優化問題解決的過程", "correct_option": "B", "explanation": "生成式AI就像一位創作者，能產生新的文字、圖片、聲音等各種內容；而決策式AI就像一位判別員，會看現有的資料，判斷它是什麼、屬於哪一類。因此，選項B才是正確答案。", "has_caveat": 0, "caveat_note": null}, {"id": 83, "source": "題庫05", "topic": "基礎知識", "question": "哪項技術被認為是改進AI生成內容（GAI）真實性和可信度的重要方法？", "option_a": "卷積神經網路", "option_b": "自迴歸模型", "option_c": "生成式對抗網路", "option_d": "強化學習", "correct_option": "C", "explanation": "當題目強調提升GAI內容的真實性和可信度，最常被提到的方法之一就是生成式對抗網路。它像兩個AI互相較勁：一個負責生成內容，另一個負責檢查真假，生成器會越做越逼真，所以第C項最符合題意。", "has_caveat": 0, "caveat_note": null}, {"id": 84, "source": "題庫05", "topic": "基礎知識", "question": "生成式AI可應用於哪些領域？", "option_a": "客服機器人", "option_b": "撰寫文案", "option_c": "設計圖像", "option_d": "以上皆是", "correct_option": "D", "explanation": "生成式AI的應用非常廣，不只可以拿來做客服機器人，還能協助撰寫文案、產生標題、貼文、腳本，也能生成圖片、海報、插畫等視覺內容。所以題目中的第1、2、3項其實都是生成式AI常見的應用範圍，因此最完整、最正確的答案就是第4項「以上皆是」。", "has_caveat": 0, "caveat_note": null}, {"id": 85, "source": "題庫05", "topic": "基礎知識", "question": "下列何者為我國首部專門規範人工智慧（AI）的法律？", "option_a": "個人資料保護法", "option_b": "數位發展基本法", "option_c": "人工智慧促進條例", "option_d": "人工智慧基本法", "correct_option": "D", "explanation": "這題在問「我國第一部專門規範AI的法律叫什麼名字」。正確答案是第4項「人工智慧基本法」，因為它是（影片所述）我國首部專門針對人工智慧發展、應用與治理所制定的基本法律；其他選項（個人資料保護法、數位發展基本法、人工智慧促進條例）皆非本題所指的首部AI專門規範法律。", "has_caveat": 1, "caveat_note": "此題涉及台灣立法現狀的時效性問題。影片內容主張「人工智慧基本法」為我國首部專門規範AI的法律，但此法在不同時間點可能仍處於草案／預告階段（由數位發展部等機關推動），是否已完成三讀並正式公布施行會隨時間變動，依資料截至範圍無法完全確認其最新狀態。強烈建議使用者於應試前查核數位發展部或立法院官方網站，確認此法律名稱、內容與施行狀態是否為最新事實，避免影片錄製當下的草案名稱與正式考試當下的官方答案不一致。"}, {"id": 86, "source": "題庫05", "topic": "基礎知識", "question": "下列何者「不屬於」台灣《人工智慧基本法》所揭示的人工智慧七大原則？", "option_a": "應遵循永續發展與福祉", "option_b": "隱私保護與資料治理", "option_c": "透明與可解釋", "option_d": "以市場效率與商業獲利為最高優先", "correct_option": "D", "explanation": "《人工智慧基本法》（依影片所述）訂下七大原則，目的是讓AI被負責任地發展與應用，保障大家的權益與公共價值。這七大原則包含：永續發展與福祉、人類自主、隱私保護與資料治理、資安與安全、透明與可解釋、公平與不歧視、問責。選項A、B、C都是七大原則中的實際內容；選項D「以市場效率與商業獲利為最高優先」並不是七大原則，因為法律並未把「獲利優先」放在最高順位，這部法律重視的是人本、安全、隱私、透明、公平，而不是「獲利第一、效率至上」。", "has_caveat": 1, "caveat_note": "同第85題，此題題幹預設台灣已有正式名為《人工智慧基本法》之法律並訂有「七大原則」，其法律現狀與七大原則內容的時效性需使用者自行查核最新官方資訊，建議應試前再次確認。"}, {"id": 87, "source": "題庫06", "topic": "基礎知識", "question": "關於AIGC，以下哪個描述最貼近實際應用？", "option_a": "自動產出影音等原創內容", "option_b": "分析網站訪客行為", "option_c": "儲存知識庫以供檢索", "option_d": "統一管理雲端帳號", "correct_option": "A", "explanation": "AIGC是指由AI自動生成內容的過程，應用包括文字、圖像、音訊等。", "has_caveat": 0, "caveat_note": null}, {"id": 88, "source": "題庫06", "topic": "基礎知識", "question": "下列哪個選項屬於AIGC常見應用場景？", "option_a": "繪製圖像作品", "option_b": "封鎖網路流量", "opt 隱藏訓練方式", "option_c": "排除使用者回饋", "option_d": "避免開源模型", "correct_option": "A", "explanation": "可解釋性強調讓使用者理解模型如何得出結論。", "has_caveat": 0, "caveat_note": null}, {"id": 146, "source": "題庫06", "topic": "倫理與法律", "question": "AI產出內容的法律歸屬爭議主要涉及？", "option_a": "財產稅問題", "option_b": "圖像處理技術", "option_c": "智慧財產權", "option_d": "生態永續", "correct_option": "C", "explanation": "AI產出內容涉及著作權歸屬，是IP法的重要爭議之一。", "has_caveat": 0, "caveat_note": null}, {"id": 147, "source": "題庫07", "topic": "綜合", "question": "生成式對抗網路 (Generative Adversarial Network, GAN) 的局限性為何？", "option_a": "生成器和鑑別器的訓練不穩定", "option_b": "需要大量的訓練資料", "option_c": "生成的資料缺乏多樣性", "option_d": "無法生成高品質的資料", "correct_option": "A", "explanation": "GAN 由生成器與鑑別器對抗訓練，兩者需達到平衡，訓練過程容易不穩定（如模式崩潰），是其公認的主要局限性。", "has_caveat": 0, "caveat_note": null}, {"id": 148, "source": "題庫07", "topic": "綜合", "question": "以下哪一種做法不利於提高AI生成內容的透明度？", "option_a": "公開模型架構", "option_b": "展示訓練資料", "option_c": "隱藏模型決策", "option_d": "解釋模型輸出", "correct_option": "C", "explanation": "透明度要求公開模型架構、訓練資料來源與決策邏輯，隱藏決策過程與透明度原則相違背。", "has_caveat": 0, "caveat_note": null}, {"id": 149, "source": "題庫07", "topic": "綜合", "question": "資料品質低落所造成的影響，何者為非？", "option_a": "降低資料分析產生的價值", "option_b": "可能引導決策者做出錯誤的判斷", "option_c": "造成大量且重複的作業", "option_d": "產出品質穩定的內容", "correct_option": "D", "explanation": "資料品質低落會降低分析價值、導致錯誤判斷、增加重工，不會產出品質穩定的內容，故此選項為非。", "has_caveat": 0, "caveat_note": null}, {"id": 150, "source": "題庫07", "topic": "綜合", "question": "ChatGPT-4o是OpenAI最新推出的什麼類型的AI模型？", "option_a": "文字生成模型", "option_b": "多模態模型 (文字、音訊、影片)", "option_c": "圖片生成模型", "option_d": "語音模型", "correct_option": "B", "explanation": "GPT-4o 為 OpenAI 的旗艦多模態模型，可整合文字、語音、影像輸入輸出。", "has_caveat": 1, "caveat_note": "GPT-4o 的 \"o\" 意指 omni，可同時處理文字、語音、影像（含視覺），選項描述方向正確但未列出「圖像」，屬於四選項中最貼切者。"}, {"id": 151, "source": "題庫07", "topic": "綜合", "question": "試圖理解所提供的資料結構和特徵，創造新資料，請問是指哪種人工智慧的技術？", "option_a": "監督式學習", "option_b": "圖形辨識", "option_c": "決策AI", "option_d": "生成式對抗網路 (Generative Adversarial Network, GAN)", "correct_option": "D", "explanation": "GAN 透過生成器學習資料分布特徵並生成近似真實資料的新樣本。", "has_caveat": 1, "caveat_note": "題幹描述（理解資料結構特徵、創造新資料）較泛指生成式模型／深度生成技術的共通特性，並非 GAN 獨有；但四個選項中僅 GAN 符合「生成新資料」此一核心特徵，故列為正確答案。"}, {"id": 152, "source": "題庫07", "topic": "綜合", "question": "以下哪一個不是Prompt技術的一種？", "option_a": "思維樹 (Tree of Thoughts, ToT)", "option_b": "思路鏈提示 (Chain-of-Thought Prompting)", "option_c": "檢索增強生成 (Retrieval-Augmented Generation, RAG)", "option_d": "物聯網 (Internet of Things, IoT)", "correct_option": "D", "explanation": "IoT 是硬體裝置連網技術，與 Prompt（提示）工程技術無關；其餘三者皆為提示技巧/生成強化方法。", "has_caveat": 0, "caveat_note": null}, {"id": 153, "source": "題庫07", "topic": "綜合", "question": "AI文字生成工具在學術寫作領域有以下何項道德上的隱憂？", "option_a": "AI工具觸及更多元學習者的潛力", "option_b": "無意中抄襲現有學術作品的風險", "option_c": "行政工作自動化並減少工作量", "option_d": "提供使用者個人化的學習體驗", "correct_option": "B", "explanation": "AI生成文字可能與既有文獻高度相似卻未標註來源，構成學術倫理上的抄襲風險。", "has_caveat": 0, "caveat_note": null}, {"id": 154, "source": "題庫07", "topic": "綜合", "question": "在教育領域中，AI可以透過分析學生的行為和表現來做什麼？", "option_a": "提供個人化的學習建議", "option_b": "判斷學生的品德特質", "option_c": "預測學生未來職業", "option_d": "代替教師進行課程教學", "correct_option": "A", "explanation": "AI分析學習數據可針對個別學生弱點與進度提供客製化建議，其餘選項超出現行技術合理應用範圍。", "has_caveat": 0, "caveat_note": null}, {"id": 155, "source": "題庫07", "topic": "綜合", "question": "下列何者是生成式人工智慧音樂創作的網站或服務？", "option_a": "Gamma", "option_b": "Canva", "option_c": "Leonardo AI", "option_d": "Suno AI", "correct_option": "D", "explanation": "Suno AI 為生成式AI音樂創作服務；Gamma為簡報生成、Canva為設計工具、Leonardo AI為圖像生成工具。", "has_caveat": 0, "caveat_note": null}, {"id": 156, "source": "題庫07", "topic": "綜合", "question": "優化Prompt的原則之一為「重點性」，請問何為「重點性」？", "option_a": "高階或特定領域用詞", "option_b": "寬泛且複合多種概念的提問", "option_c": "盡量使用英文縮寫", "option_d": "具備明確的目的", "correct_option": "D", "explanation": "依標示答案，重點性指提問時應具備明確目的，避免模糊發散的描述。", "has_caveat": 1, "caveat_note": "「重點性」一般定義較偏向「聚焦單一具體重點、避免模糊寬泛」，與選項B（寬泛且複合多種概念）互為反義更直接對應；「具備明確的目的」語意上較接近另一項常見原則（目的性/清晰性）。此處依畫面標示答案存檔，但答案與題意的對應關係較弱。"}, {"id": 157, "source": "題庫07", "topic": "綜合", "question": "AI生成內容對企業商業模式可提供的服務是什麼？", "option_a": "提高辦公室物理安全性", "option_b": "自動化精準財務審計", "option_c": "產出市場行銷文案", "option_d": "減少產品的物理缺陷", "correct_option": "C", "explanation": "生成式AI常見企業應用之一即為自動化產出行銷文案等內容，其餘選項非其核心能力。", "has_caveat": 0, "caveat_note": null}, {"id": 158, "source": "題庫07", "topic": "綜合", "question": "下列者是生成式AI在市場行銷的應用？", "option_a": "進行醫學研究", "option_b": "自動生成廣告文案", "option_c": "分析天氣資料", "option_d": "設計建築結構", "correct_option": "B", "explanation": "生成式AI於行銷領域常用於自動產製廣告文案、素材等內容。", "has_caveat": 0, "caveat_note": null}, {"id": 159, "source": "題庫07", "topic": "綜合", "question": "循環神經網路 (RNN) 的英文全名是什麼？", "option_a": "Recursive Neural Network", "option_b": "Recurrent Neural Network", "option_c": "Resourceful Neural Network", "option_d": "Reinvent Neural Network", "correct_option": "B", "explanation": "RNN 全名為 Recurrent Neural Network，為處理序列資料的神經網路架構。", "has_caveat": 0, "caveat_note": null}, {"id": 160, "source": "題庫07", "topic": "綜合", "question": "圖片生成中的「overfitting」是指什麼？", "option_a": "模型在訓練資料上表現良好，但在測試資料上表現差", "option_b": "反覆調整模型在測試資料上表現良好，但在訓練資料上表現差", "option_c": "模型對所有資料表現良好", "option_d": "模型無法收斂", "correct_option": "A", "explanation": "Overfitting（過擬合）標準定義為模型過度擬合訓練資料的細節與雜訊，導致在未見過的測試資料上泛化能力差。", "has_caveat": 0, "caveat_note": null}, {"id": 161, "source": "題庫07", "topic": "綜合", "question": "AI生成內容會面臨的道德問題是？", "option_a": "潛在的偏見和歧視", "option_b": "資料大量增加問題", "option_c": "演算法選擇和優化問題", "option_d": "硬體需求和能源消耗問題", "correct_option": "A", "explanation": "訓練資料中的偏見可能被AI模型放大並反映在生成內容中，是最核心的道德爭議之一；其餘選項屬技術/工程問題而非道德問題。", "has_caveat": 0, "caveat_note": null}, {"id": 162, "source": "題庫07", "topic": "綜合", "question": "在 Tree-of-Thought 方法中，哪一項不是其特點？", "option_a": "有助於分解複雜問題", "option_b": "促進逐步思考", "option_c": "僅依賴單一步驟解答", "option_d": "提高解決問題的準確性", "correct_option": "C", "explanation": "Tree-of-Thought 的核心特點是探索多條推理路徑並逐步展開，而非僅依賴單一步驟解答。", "has_caveat": 0, "caveat_note": null}, {"id": 163, "source": "題庫07", "topic": "綜合", "question": "根據歐盟《一般資料保護條例》(General Data Protection Regulation, GDPR)，如果AI生成內容涉及大規模監控和處理個人資料，哪一項是資料控制者應該遵循的最佳做法？", "option_a": "完全依賴AI進行自動化決策", "option_b": "僅在使用者提出異議時進行人工干預", "option_c": "進行資料保護影響評估 (Data Protection Impact Assessments, DPIA) 並採取必要的保護措施", "option_d": "僅在監管機構要求時進行資料審查", "correct_option": "C", "explanation": "GDPR 規定高風險處理（如大規模監控）應事先進行DPIA並採取相應保護措施，屬於主動合規義務，非被動等待異議或監管要求。", "has_caveat": 0, "caveat_note": null}, {"id": 164, "source": "題庫07", "topic": "綜合", "question": "調整參數在圖像生成中的作用是什麼？", "option_a": "添加文字到圖像之中", "option_b": "確保生成圖像符合特定風格或效果", "option_c": "更改工具的介面", "option_d": "提高生成圖像的分辨率", "correct_option": "B", "explanation": "圖像生成模型的參數（如引導強度、取樣步數等）主要用於控制生成結果的風格與效果，而非直接決定介面或單純提高解析度。", "has_caveat": 0, "caveat_note": null}, {"id": 165, "source": "題庫07", "topic": "綜合", "question": "哪一項是人工智慧倫理的重要目標？", "option_a": "增加企業利潤", "option_b": "提升使用者黏性", "option_c": "減輕社會不平等", "option_d": "優化技術性能", "correct_option": "C", "explanation": "AI倫理核心關注公平性與社會影響，減輕社會不平等是其重要目標；其餘選項屬商業或技術目標，非倫理目標。", "has_caveat": 0, "caveat_note": null}, {"id": 166, "source": "題庫07", "topic": "綜合", "question": "根據歐盟《一般資料保護規範》(General Data Protection Regulation, GDPR)，個人資料在處理過程中應該具備哪項特性？", "option_a": "透明度和可追溯性", "option_b": "任意性和自由共享", "option_c": "單一性和集中存儲", "option_d": "完全公開和無限制", "correct_option": "A", "explanation": "GDPR 要求個人資料處理具備透明度並可追溯其處理歷程，以保障當事人權益。", "has_caveat": 0, "caveat_note": null}, {"id": 167, "source": "題庫07", "topic": "綜合", "question": "在商業領域中運用AI生成內容提供即時的線上客戶服務，使得企業能夠更好地滿足客戶的需求，此背後訓練基礎為大型語言模型 (Large Language Model, LLM)，請問下列何為大型語言模型的特性？", "option_a": "專門用於視覺辨識和影像處理", "option_b": "能同時處理語言數據及視覺辨識", "option_c": "需要人工指導才能完成訓練", "option_d": "能夠處理龐大的語言數據並生成自然流暢的文本", "correct_option": "D", "explanation": "LLM 的核心特性是透過大規模語言數據訓練，生成自然流暢的文本。", "has_caveat": 0, "caveat_note": null}, {"id": 168, "source": "題庫07", "topic": "綜合", "question": "在Prompt中使用自然語言指令比直接代碼指令有何優勢？", "option_a": "增加生成的創造性", "option_b": "提高生成文字的長度", "option_c": "減少生成運算時間", "option_d": "更易於理解和調整", "correct_option": "D", "explanation": "自然語言指令對使用者而言更直觀，便於理解與反覆調整，不需具備程式撰寫能力。", "has_caveat": 0, "caveat_note": null}, {"id": 169, "source": "題庫07", "topic": "綜合", "question": "在使用AI生成內容工具生成內容之前，哪一項是資料前處理的關鍵步驟？", "option_a": "部署生成器", "option_b": "訓練機器學習模型", "option_c": "發布生成內容", "option_d": "收集高品質的原始資料", "correct_option": "D", "explanation": "資料前處理的起點是收集高品質原始資料，其品質直接影響後續模型訓練與生成結果。", "has_caveat": 0, "caveat_note": null}, {"id": 170, "source": "題庫07", "topic": "綜合", "question": "企業使用數據分析可以提前預測哪些變化？", "option_a": "技術變化", "option_b": "市場變化", "option_c": "自然變化", "option_d": "文化變化", "correct_option": "B", "explanation": "數據分析常用於預測市場趨勢與需求變化，協助企業提前因應。", "has_caveat": 0, "caveat_note": null}, {"id": 171, "source": "題庫07", "topic": "綜合", "question": "下列何者不屬於AI生成內容倫理問題的可能風險？", "option_a": "資訊安全疑慮", "option_b": "就業市場大規模擾動", "option_c": "資料隱私侵犯", "option_d": "管理架構日益完善", "correct_option": "D", "explanation": "管理架構完善屬正面治理成果，而非倫理風險；其餘三項皆為AI生成內容常被提及的倫理疑慮。", "has_caveat": 0, "caveat_note": null}, {"id": 172, "source": "題庫07", "topic": "綜合", "question": "在AI生成內容中，當一個模型在訓練資料上表現良好，但在測試資料上表現不佳時，往往是由於過度擬合 (Overfitting) 造成的。在模型的學習完成狀態下，且不提前終止訓練的情況下，以下哪個方法最能幫助降低模型的過度擬合？", "option_a": "減少模型的學習率", "option_b": "增加解決適定性問題或過適的技術", "option_c": "減少訓練資料的數據量", "option_d": "增加模型的複雜度", "correct_option": "B", "explanation": "抑制過擬合常見作法包含正則化、增加訓練資料、簡化模型等；減少資料量與增加複雜度皆會使過擬合惡化。", "has_caveat": 1, "caveat_note": "選項B文字疑似螢幕截圖重建時翻譯/斷句不順（原意應接近「增加正則化（regularization）等抑制過擬合的技術」），文字本身較拗口，但方向正確：減少資料量與增加模型複雜度皆會惡化過擬合，故可排除；此為四選項中唯一正確方向。"}, {"id": 173, "source": "題庫07", "topic": "綜合", "question": "使用AI生成資料視覺化，並根據反饋和新技術，應該怎麼做？", "option_a": "增加圖表顏色", "option_b": "持續改進視覺化工具和方法", "option_c": "避免使用者反饋", "option_d": "增加資料來源", "correct_option": "B", "explanation": "應依據使用者反饋與新技術持續迭代改進視覺化工具與方法，而非單純增加顏色或資料來源。", "has_caveat": 0, "caveat_note": null}, {"id": 174, "source": "題庫07", "topic": "綜合", "question": "聊天機器人的數據傳輸過程中使用什麼技術保護安全？", "option_a": "簡單傳輸", "option_b": "數據加密", "option_c": "開放訪問", "option_d": "簡單備份", "correct_option": "B", "explanation": "數據加密是保護傳輸過程中資料安全的標準技術，防止數據被竊取或竄改。", "has_caveat": 0, "caveat_note": null}, {"id": 175, "source": "題庫07", "topic": "綜合", "question": "在AI生成內容的過程中，為了防止資料洩露，企業應該實施哪一種安全策略？", "option_a": "定期進行安全審計和漏洞掃描", "option_b": "僅在問題發生後修補漏洞", "option_c": "完全依賴第三方安全公司", "option_d": "忽視安全更新", "correct_option": "A", "explanation": "主動定期進行安全審計與漏洞掃描屬於預防性資安策略，優於被動修補或忽視安全更新。", "has_caveat": 0, "caveat_note": null}, {"id": 176, "source": "題庫07", "topic": "綜合", "question": "在生成式AI聲音生成技術中，哪一個步驟將文本分解成語音單位？", "option_a": "語音波形生成", "option_b": "語音合成", "option_c": "聲音波形生成", "option_d": "文本分析", "correct_option": "D", "explanation": "文本分析（含文本正規化、音素切分）是語音合成流程的前置步驟，負責將文本分解成語音單位，再交由後續步驟合成波形。", "has_caveat": 0, "caveat_note": null}, {"id": 177, "source": "題庫07", "topic": "綜合", "question": "當AI模型生成錯誤或不相關的內容時，應該怎麼做？", "option_a": "增加生成內容的長度", "option_b": "增加Prompt的長度", "option_c": "調整Prompt使其更具體和清晰", "option_d": "使用高溫度參數 (Temperature) 設置", "correct_option": "C", "explanation": "將Prompt調整得更具體清晰可降低模型生成錯誤或離題內容的機率；提高溫度參數反而會增加隨機性與離題風險。", "has_caveat": 0, "caveat_note": null}, {"id": 178, "source": "題庫07", "topic": "綜合", "question": "關於使用ChatGPT時，「Prompt」指的為下列何者？", "option_a": "ChatGPT介面的顏色方案", "option_b": "給ChatGPT的命令，以開始對話", "option_c": "一種會員付費制度", "option_d": "請求翻譯語言", "correct_option": "B", "explanation": "Prompt 即使用者輸入給模型、用以引導對話或生成內容的指令文字。", "has_caveat": 0, "caveat_note": null}, {"id": 179, "source": "題庫07", "topic": "綜合", "question": "利用生成式AI撰寫自家產品描述時，最能幫助下列哪一項工作？", "option_a": "生成精確的技術規格", "option_b": "撰寫引人注目的產品特點", "option_c": "確保產品描述符合所有法律規範", "option_d": "直接與客戶進行互動", "correct_option": "B", "explanation": "生成式AI擅長產出具吸引力的行銷文字，但無法保證技術規格精確性或法律合規性，也不能直接與客戶互動。", "has_caveat": 0, "caveat_note": null}, {"id": 180, "source": "題庫07", "topic": "綜合", "question": "AI生成內容的運作過程中，模型架構的選擇對什麼有影響？", "option_a": "影響生成內容的品質及速度", "option_b": "影響模型的訓練資料", "option_c": "影響模型的超參數調整", "option_d": "影響模型的優化器選擇", "correct_option": "A", "explanation": "模型架構直接決定生成內容的品質表現與推論速度，是選擇架構時最直接的考量。", "has_caveat": 0, "caveat_note": null}, {"id": 181, "source": "題庫07", "topic": "綜合", "question": "在AI生成內容的最新應用中，哪個領域正在快速發展以生成逼真的語音和聲音內容？", "option_a": "區塊鏈", "option_b": "語音合成技術", "option_c": "電腦視覺", "option_d": "資料壓縮", "correct_option": "B", "explanation": "語音合成（含文字轉語音、聲音克隆）為近年生成式AI快速發展、用以生成逼真語音內容的領域。", "has_caveat": 0, "caveat_note": null}, {"id": 182, "source": "題庫07", "topic": "綜合", "question": "哪一種AI生成內容工具可以用來自動生成測驗和練習題來評估學生的學習進度？", "option_a": "音樂播放器", "option_b": "語音辨識軟體", "option_c": "自動測驗生成器", "option_d": "社群媒體平臺", "correct_option": "C", "explanation": "自動測驗生成器可依課程內容自動產生測驗與練習題，用於評估學習進度。", "has_caveat": 0, "caveat_note": null}, {"id": 183, "source": "題庫07", "topic": "綜合", "question": "下列何者是生成高品質文字著稱的語言模型？", "option_a": "GPT", "option_b": "Notion AI", "option_c": "Python", "option_d": "Sora", "correct_option": "A", "explanation": "GPT 是以生成高品質自然語言文字著稱的語言模型；Notion AI 為應用層產品、Python 為程式語言、Sora 為影片生成模型。", "has_caveat": 0, "caveat_note": null}, {"id": 187, "source": "題庫07", "topic": "綜合", "question": "優化Prompt的技巧之一是提供「視覺化輔助」，請問何者非「視覺化輔助」？", "option_a": "流程圖", "option_b": "長條圖", "option_c": "階層圖", "option_d": "樞紐分析", "correct_option": "D", "explanation": "流程圖、長條圖、階層圖皆為視覺化呈現形式；樞紐分析是資料整理/分析方法，不屬於視覺化輔助本身。", "has_caveat": 0, "caveat_note": null}, {"id": 189, "source": "題庫07", "topic": "綜合", "question": "在生成式AI領域中，常用於處理歌聲合成或音樂序列生成，且具備處理「長期依賴關係」能力的深度學習模型是？", "option_a": "光學字元識別 (Optical Character Recognition, OCR)", "option_b": "深度信念網路 (Deep Belief Network, DBN)", "option_c": "長短期記憶模型 (Long Short-Term Memory, LSTM)", "option_d": "卷積神經網路 (CNN)", "correct_option": "C", "explanation": "LSTM 是RNN的改良架構，能有效處理序列資料中的長期依賴關係，常用於歌聲合成、音樂序列生成等任務。", "has_caveat": 0, "caveat_note": null}, {"id": 190, "source": "題庫07", "topic": "綜合", "question": "哪種自主學習方法利用AI生成內容技術來自動生成個人化學習計劃？", "option_a": "傳統教學法", "option_b": "標準化測試", "option_c": "自適應學習系統", "option_d": "訓練營", "correct_option": "C", "explanation": "自適應學習系統會根據學習者表現動態調整內容與進度，可結合AI生成技術產出個人化學習計劃。", "has_caveat": 0, "caveat_note": null}, {"id": 192, "source": "題庫07", "topic": "綜合", "question": "若要使用AI技術協助批改學生的作業和考試，可以使用下列哪一項技術？", "option_a": "製作機器人", "option_b": "文字辨識與分類", "option_c": "雷達掃描", "option_d": "聲紋辨識", "correct_option": "B", "explanation": "批改文字作業與試卷需仰賴文字辨識（OCR）與內容分類技術判斷作答內容與正確性。", "has_caveat": 0, "caveat_note": null}, {"id": 193, "source": "題庫07", "topic": "綜合", "question": "ChatGPT系列模型由下列哪個機構開發？", "option_a": "Google", "option_b": "Meta", "option_c": "Microsoft", "option_d": "OpenAI", "correct_option": "D", "explanation": "ChatGPT 系列模型由 OpenAI 開發。", "has_caveat": 0, "caveat_note": null}, {"id": 194, "source": "題庫07", "topic": "綜合", "question": "在AI生成內容領域，使用生成式對抗網路 (Generative Adversarial Network, GAN) 生成新圖片時，鑑別器的主要功能是？", "option_a": "增加圖片亮度", "option_b": "調整圖片風格", "option_c": "辨識生成的圖片是否逼真", "option_d": "增強圖片解析度", "correct_option": "C", "explanation": "鑑別器負責判斷生成器產出的圖片是真實資料還是生成資料，驅動生成器持續改進逼真度。", "has_caveat": 1, "caveat_note": "與第203題同樣考「GAN鑑別器的主要功能」，選項組與情境描述不同（本題限定於圖片生成情境），經使用者確認兩題皆保留為獨立題目。"}, {"id": 195, "source": "題庫07", "topic": "綜合", "question": "AI生成內容在簡報生成中的最大挑戰之一是？", "option_a": "資料安全", "option_b": "生成速度", "option_c": "頁面美觀性", "option_d": "內容準確性", "correct_option": "D", "explanation": "AI生成簡報內容時，確保資訊正確無誤是最大挑戰之一，避免產出錯誤或過時的資訊。", "has_caveat": 0, "caveat_note": null}, {"id": 196, "source": "題庫07", "topic": "綜合", "question": "資料治理 (Data Governance) 的主要目的，以下何者正確？", "option_a": "保證資料的可靠性、品質、完整度與安全性等", "option_b": "增加資料的數量與規模", "option_c": "限制人們對於資料的使用與分析", "option_d": "降低資料的公開性與透明性", "correct_option": "A", "explanation": "資料治理的核心目的是確保資料在生命週期中可靠、優質、完整且安全，而非單純增加資料量或限制存取。", "has_caveat": 0, "caveat_note": null}, {"id": 197, "source": "題庫07", "topic": "綜合", "question": "在利用人工智慧生成內容時，必須遵守相關國際法規，以美國《健康保險可攜性和責任法案》(Health Insurance Portability and Accountability Act, HIPAA) 為例，該法案對於健康資料的處理有特定要求，在處理健康相關資料時，應該採取哪些關鍵措施？", "option_a": "未經授權將患者資料公開", "option_b": "使用加密技術保護患者資料", "option_c": "將所有資料保存於紙質檔案", "option_d": "僅在非商業用途時保護資料", "correct_option": "B", "explanation": "HIPAA 要求對受保護健康資訊（PHI）採取適當的技術性保護措施，加密是常見且關鍵的作法。", "has_caveat": 0, "caveat_note": null}, {"id": 198, "source": "題庫07", "topic": "綜合", "question": "大語言模型 (Large Language Model, LLM) 在確定性技術路徑中，表現改進的關鍵是什麼？", "option_a": "增加模型參數", "option_b": "提高運算能力", "option_c": "擴展多樣化的語言模式和結構", "option_d": "減少訓練資料量", "correct_option": "C", "explanation": "依標示答案，LLM 表現改進的關鍵在於擴展多樣化的語言模式與結構，而非單純堆疊參數或運算力。", "has_caveat": 0, "caveat_note": null}, {"id": 199, "source": "題庫07", "topic": "綜合", "question": "以下何者不是AI生成內容可能對藝術創作產生的影響？", "option_a": "創作自動化", "option_b": "模糊原創界線", "option_c": "促進跨界創新", "option_d": "提高創作利潤", "correct_option": "D", "explanation": "創作自動化、模糊原創界線、促進跨界創新都是AI生成內容對藝術創作常被討論的實際影響；提高創作利潤並非其直接或必然的影響。", "has_caveat": 0, "caveat_note": null}, {"id": 200, "source": "題庫07", "topic": "綜合", "question": "以下哪個是生成式AI的常見應用，並受益於提示工程 (Prompt Engineering)？", "option_a": "試算表計算", "option_b": "郵件管理", "option_c": "內容生成", "option_d": "硬體故障排除", "correct_option": "C", "explanation": "內容生成是生成式AI的核心應用場景，透過提示工程可有效引導生成結果的品質與方向。", "has_caveat": 0, "caveat_note": null}, {"id": 201, "source": "題庫07", "topic": "綜合", "question": "當使用生成式AI進行文字生成時，哪種操作有助於提升內容的相關性？", "option_a": "使用具體的關鍵詞", "option_b": "使用隨機數據", "option_c": "分享影音連結", "option_d": "減少輸入內容", "correct_option": "A", "explanation": "提供具體明確的關鍵詞能讓模型更精準掌握需求，提升生成內容與主題的相關性。", "has_caveat": 0, "caveat_note": null}, {"id": 202, "source": "題庫07", "topic": "綜合", "question": "生成式AI繪圖的「向量化」過程指的是？", "option_a": "將生成的圖片轉換為向量圖形", "option_b": "將文字轉換為向量模型以生成圖片", "option_c": "使用向量運算加速運算過程", "option_d": "將文字轉換為圖片像素直接生成圖片", "correct_option": "B", "explanation": "文字生圖流程中，文字會先被編碼（向量化）為語意向量，再透過模型依此向量生成對應圖片。", "has_caveat": 0, "caveat_note": null}, {"id": 203, "source": "題庫07", "topic": "綜合", "question": "請問在生成式對抗網路 (Generative Adversarial Network, GAN) 中，鑑別器 (Discriminator) 的主要功能為下列何者？", "option_a": "判斷資料的真偽", "option_b": "生成新的資料", "option_c": "訓練鑑別器", "option_d": "儲存樣本資料", "correct_option": "A", "explanation": "鑑別器的核心任務是判斷輸入資料是真實樣本還是生成器產出的假資料。", "has_caveat": 1, "caveat_note": "與第194題同樣考「GAN鑑別器的主要功能」，選項組與題幹情境不同，經使用者確認兩題皆保留為獨立題目。"}, {"id": 204, "source": "題庫07", "topic": "綜合", "question": "在使用AI文字生成工具進行教材製作時，應該注意的事項不包含下列何者？", "option_a": "內容是否符合目前時空背景", "option_b": "翻譯自不同國家教材的文化脈絡", "option_c": "教材來源是否有著作權問題", "option_d": "印製教材的成本花費", "correct_option": "D", "explanation": "印製成本屬於行政/預算考量，與AI生成教材內容的品質、時效性、文化脈絡、著作權等議題無直接關係。", "has_caveat": 0, "caveat_note": null}, {"id": 205, "source": "題庫07", "topic": "綜合", "question": "以下何者不屬於AI生成內容可能面臨的倫理道德挑戰？", "option_a": "資料隱私", "option_b": "公平正義", "option_c": "責任歸因", "option_d": "食品安全", "correct_option": "D", "explanation": "食品安全與AI生成內容的倫理道德議題無直接關聯；資料隱私、公平正義、責任歸因皆為常見AI倫理議題。", "has_caveat": 0, "caveat_note": null}, {"id": 206, "source": "題庫07", "topic": "綜合", "question": "假設你開了一家飲料店，數據分析能幫助你做什麼？", "option_a": "增加員工數量", "option_b": "分析飲料銷售數據", "option_c": "縮小店面面積", "option_d": "變更店名", "correct_option": "B", "explanation": "數據分析可協助店家掌握銷售趨勢、熱門品項等資訊，進而輔助經營決策；其餘選項與數據分析的直接效益無關。", "has_caveat": 1, "caveat_note": "選項C、D原始畫面文字排版重疊、斷句不清，依合理推測重建為「縮小店面面積」「變更店名」兩個獨立選項，不影響正確答案判斷。"}, {"id": 207, "source": "題庫07", "topic": "綜合", "question": "下列何者非金融領域應用生成式AI能獲得的效果？", "option_a": "生成個人化分析報告", "option_b": "更快速進行市場分析與預測", "option_c": "針對個人需求提供投資研究與建議", "option_d": "提供無風險但高報酬的投資建議", "correct_option": "D", "explanation": "投資必然伴隨風險，「無風險但高報酬」並不存在，屬不切實際的描述，非生成式AI應用金融領域可實際獲得的效果。", "has_caveat": 1, "caveat_note": "原始題幹「下列**何時**非...」疑似打字或辨識錯誤，已校正為「下列**何者**非...」。"}, {"id": 208, "source": "題庫07", "topic": "綜合", "question": "AI生成內容在簡報生成中的應用，可以幫助使用者實現什麼？", "option_a": "快速數據分析", "option_b": "自動內容審核", "option_c": "高效的內容生成", "option_d": "網路安全保障", "correct_option": "C", "explanation": "AI生成內容應用於簡報生成，核心價值在於提升內容產出的效率。", "has_caveat": 0, "caveat_note": null}, {"id": 209, "source": "題庫07", "topic": "綜合", "question": "為什麼在使用Prompt時需要確保其合理性？", "option_a": "增加生成的正確性", "option_b": "減少生成時間", "option_c": "提高硬體性能", "option_d": "降低耗能", "correct_option": "A", "explanation": "合理且清晰的Prompt能引導模型產出更符合需求、更正確的結果。", "has_caveat": 0, "caveat_note": null}, {"id": 211, "source": "題庫07", "topic": "綜合", "question": "下列哪一項不是生成式AI在數據分析中的挑戰？", "option_a": "資料隱私和安全問題", "option_b": "高度的運算資源需求", "option_c": "自動化資料清洗", "option_d": "模型的可解釋性", "correct_option": "C", "explanation": "自動化資料清洗屬於生成式AI可協助達成的效益/工具能力，而非其在數據分析中面臨的挑戰；其餘三項皆為常見挑戰。", "has_caveat": 0, "caveat_note": null}, {"id": 212, "source": "題庫07", "topic": "綜合", "question": "以下何者不是AI生成內容可能對教育產生的衝擊？", "option_a": "改變教學模式", "option_b": "促進個人化學習", "option_c": "提高師生比例", "option_d": "降低學習成本", "correct_option": "C", "explanation": "提高師生比例與AI生成內容的教育應用無直接因果關係；改變教學模式、促進個人化學習、降低學習成本皆為常被討論的實際衝擊。", "has_caveat": 0, "caveat_note": null}, {"id": 213, "source": "題庫07", "topic": "綜合", "question": "在學習生成式AI模型在文字生成方面常見的「幻覺」現象是指什麼？", "option_a": "生成虛構的資訊", "option_b": "無法生成連貫的文字", "option_c": "訓練過程中斷", "option_d": "無法理解多語言", "correct_option": "A", "explanation": "「幻覺」(Hallucination) 指模型生成看似合理但實際上虛構、不實或無根據的資訊。", "has_caveat": 0, "caveat_note": null}, {"id": 214, "source": "題庫07", "topic": "綜合", "question": "相較於傳統的判別式AI，生成式AI在追求更高層次的創意生成與邏輯推演時，面臨的主要資料挑戰為何？", "option_a": "資料特徵選擇過多", "option_b": "模型容易產生過度擬合", "option_c": "缺乏具備豐富邏輯性與準確性的標記數據", "option_d": "資料標籤的二元分類不夠精確", "correct_option": "C", "explanation": "生成式AI要產出具創意與邏輯性的內容，高度仰賴具備豐富邏輯性與準確性的標記資料，這類資料相對稀缺，是主要挑戰之一。", "has_caveat": 0, "caveat_note": null}, {"id": 216, "source": "題庫07", "topic": "綜合", "question": "當使用AI生成內容涉及到人物肖像時，以下哪一項是合法且合適的做法？", "option_a": "獲得肖像權人的同意", "option_b": "任意使用網路上找到的照片", "option_c": "只要不盈利就可自由使用", "option_d": "在使用後通知肖像權人", "correct_option": "A", "explanation": "使用他人肖像須事先取得當事人同意，未經同意任意使用、以不盈利為由自由使用、或事後才通知，皆不符合肖像權保護的基本原則。", "has_caveat": 0, "caveat_note": null}, {"id": 217, "source": "題庫07", "topic": "綜合", "question": "下列何者非生成式AI基本核心技術？", "option_a": "自然語言處理 (Natural Language Processing, NLP)", "option_b": "機器學習 (Machine Learning, ML)", "option_c": "深度學習 (Deep Learning)", "option_d": "擴增實境 (Augmented Reality, AR)", "correct_option": "D", "explanation": "AR為沉浸式顯示技術，與生成式AI的核心技術（NLP、ML、深度學習）性質不同。", "has_caveat": 0, "caveat_note": null}, {"id": 218, "source": "題庫07", "topic": "綜合", "question": "使用AI生成簡報時，應該採取甚麼措施確保其符合視覺設計原則？", "option_a": "使用固定模板", "option_b": "使用隨機配色", "option_c": "合理運用字體、顏色和佈局", "option_d": "自動生成文字", "correct_option": "C", "explanation": "視覺設計原則的核心在於字體、顏色與佈局的合理搭配，而非固定模板或隨機配色。", "has_caveat": 0, "caveat_note": null}, {"id": 219, "source": "題庫07", "topic": "綜合", "question": "下列哪一項不是提升Prompt的方法？", "option_a": "提供具體清晰的指示", "option_b": "使用範例進行迭代", "option_c": "聘請專業的Prompt工程師", "option_d": "訓練更大的AI模型", "correct_option": "D", "explanation": "訓練更大的模型屬於模型本身的改進，不屬於Prompt撰寫/優化的方法；其餘三項皆為提升Prompt品質的常見做法。", "has_caveat": 0, "caveat_note": null}, {"id": 220, "source": "題庫07", "topic": "綜合", "question": "使用AI生成為了確保視覺化過程的透明度，應該公開哪個方面？", "option_a": "圖表的大小", "option_b": "資料來源和方法", "option_c": "圖表的顏色", "option_d": "圖表的格式", "correct_option": "B", "explanation": "視覺化透明度的核心在於讓使用者能理解資料從何而來、如何處理，而非圖表的外觀呈現細節。", "has_caveat": 0, "caveat_note": null}, {"id": 221, "source": "題庫07", "topic": "綜合", "question": "下列何者為生成式對抗網路 (Generative Adversarial Network, GAN) 的核心概念？", "option_a": "兩個網路互相競爭", "option_b": "多個網路協同工作", "option_c": "單個網路自我學習", "option_d": "網路與人類互動學習", "correct_option": "A", "explanation": "GAN 的核心概念即生成器與鑑別器兩個網路互相對抗競爭，驅動生成品質不斷提升。", "has_caveat": 0, "caveat_note": null}, {"id": 222, "source": "題庫07", "topic": "綜合", "question": "為了確保AI模型的準確性和可靠性，應該怎麼做？", "option_a": "使用隨機訓練資料", "option_b": "使用高品質的訓練資料", "option_c": "使用固定訓練資料", "option_d": "使用單一訓練資料源", "correct_option": "B", "explanation": "訓練資料的品質直接影響模型表現，高品質資料是確保模型準確性與可靠性的基礎。", "has_caveat": 0, "caveat_note": null}, {"id": 223, "source": "題庫07", "topic": "綜合", "question": "為降低AI生成內容系統對社會的風險，下列哪一項措施最不重要？", "option_a": "提高系統的運算能力", "option_b": "完善相關的法律法規", "option_c": "加強對系統開發者的培訓", "option_d": "限制系統在關鍵領域的應用", "correct_option": "A", "explanation": "提高運算能力屬於效能面向，與降低社會風險（法規、培訓、應用限制）無直接關聯，故為最不重要的措施。", "has_caveat": 0, "caveat_note": null}, {"id": 224, "source": "題庫07", "topic": "綜合", "question": "生成式AI中，文字生成技術的核心原理是什麼？", "option_a": "機器學習", "option_b": "自然語言處理", "option_c": "自回歸分析", "option_d": "深度學習", "correct_option": "B", "explanation": "依標示答案，文字生成技術的核心原理歸類於自然語言處理領域。", "has_caveat": 0, "caveat_note": null}, {"id": 225, "source": "題庫07", "topic": "綜合", "question": "在商業應用中，AI生成內容生成的簡報主要用於實現以下哪一項目標？", "option_a": "執行複雜的科學實驗", "option_b": "生成可操作的商業洞察和決策支持的圖表展示", "option_c": "控制機器人的運動行為", "option_d": "提供即時客戶服務", "correct_option": "B", "explanation": "商業應用中AI生成簡報的核心價值在於協助呈現可操作的商業洞察與決策支持資訊。", "has_caveat": 0, "caveat_note": null}, {"id": 226, "source": "題庫07", "topic": "綜合", "question": "AI生成內容除了用於創作內容之外，還可以用於什麼任務？", "option_a": "精準預測股市", "option_b": "自動駕駛飛機", "option_c": "代替醫生做手術", "option_d": "自動回答問題和提供訊息", "correct_option": "D", "explanation": "自動回答問題與提供訊息（如客服、問答系統）是AI生成內容除創作外的常見應用；精準預測股市、自動駕駛飛機、代替醫生做手術皆超出其合理應用範圍。", "has_caveat": 0, "caveat_note": null}, {"id": 228, "source": "題庫07", "topic": "綜合", "question": "生成式AI的應用範圍不包括以下何者？", "option_a": "學術研究", "option_b": "商業行銷", "option_c": "真實情感體驗", "option_d": "醫療保健", "correct_option": "C", "explanation": "AI生成內容可應用於學術研究、商業行銷、醫療保健等領域，但AI不具備真實情感，無法提供「真實情感體驗」。", "has_caveat": 0, "caveat_note": null}, {"id": 229, "source": "題庫07", "topic": "綜合", "question": "以下選項中，何者為可能為AI影片生成技術的商業潛力？", "option_a": "辦公室自動化", "option_b": "遊戲開發", "option_c": "智能合約", "option_d": "數據分析", "correct_option": "B", "explanation": "AI影片生成技術可用於遊戲開發中的動畫、過場畫面等內容產製，為較直接相關的商業應用方向。", "has_caveat": 0, "caveat_note": null}, {"id": 231, "source": "題庫07", "topic": "綜合", "question": "Canva的哪個功能可以幫助簡報排版更優美？", "option_a": "配色工具", "option_b": "套用智慧模板", "option_c": "字體樣式選擇", "option_d": "圖像編輯工具", "correct_option": "B", "explanation": "Canva 的智慧模板功能可快速套用經過設計的排版，幫助簡報整體更美觀一致。", "has_caveat": 0, "caveat_note": null}, {"id": 233, "source": "題庫07", "topic": "綜合", "question": "使用AI生成簡報時，哪種技術可幫助自動摘要文字？", "option_a": "強化學習 (Reinforcement learning, RL)", "option_b": "自然語言處理 (Natural Language Processing, NLP)", "option_c": "圖片辨識", "option_d": "語音辨識", "correct_option": "B", "explanation": "自動摘要文字需理解語意並萃取重點，屬於自然語言處理的核心任務。", "has_caveat": 0, "caveat_note": null}, {"id": 234, "source": "題庫07", "topic": "綜合", "question": "在使用生成式AI製作簡報時，最能確保內容的正確性的方法是？", "option_a": "相信AI生成的所有內容", "option_b": "只使用AI生成的內容而不做任何修改", "option_c": "使用多個來源交叉檢驗資訊", "option_d": "依賴AI內建的資料庫和知識庫", "correct_option": "C", "explanation": "AI生成內容可能含有錯誤或過時資訊，透過多來源交叉查證是確保正確性的有效方法。", "has_caveat": 0, "caveat_note": null}, {"id": 235, "source": "題庫07", "topic": "綜合", "question": "下列哪個是用於處理自然語言的AI生成內容模型？", "option_a": "ResNet (Residual Neural Network)", "option_b": "ChatGPT-4", "option_c": "VGG-16", "option_d": "YOLO (You only live once)", "correct_option": "B", "explanation": "ResNet、VGG-16、YOLO 皆為電腦視覺（影像辨識/偵測）模型；ChatGPT-4 為處理自然語言的生成式模型。", "has_caveat": 0, "caveat_note": null}, {"id": 236, "source": "題庫07", "topic": "綜合", "question": "下列哪一項最恰當地描述生成式AI繪圖工具的工作原理？", "option_a": "使用大型語言模型從圖片資料庫中學習，將文字轉為向量繪圖", "option_b": "使用深度學習技術直接根據文字生成圖片像素", "option_c": "透過人工智慧模擬人類的手動繪圖過程", "option_d": "直接從現有圖片進行風格轉移生成新圖片", "correct_option": "B", "explanation": "生成式AI繪圖工具（如Diffusion模型）透過深度學習技術，依文字描述逐步生成對應的圖片內容。", "has_caveat": 0, "caveat_note": null}, {"id": 237, "source": "題庫07", "topic": "綜合", "question": "在生成特定風格的文字(如詩歌)時，最適合使用哪種技術？", "option_a": "卷積神經網路 (Convolutional Neural Network, CNN)", "option_b": "生成式對抗網路 (Generative Adversarial Network, GAN)", "option_c": "循環神經網路 (Recurrent neural network, RNN)", "option_d": "支援向量機 (Support Vector Machine, SVM)", "correct_option": "C", "explanation": "RNN 擅長處理序列資料，適合用於具有韻律、順序結構的文字生成（如詩歌）；CNN多用於影像、SVM為傳統分類器，皆非文字序列生成的典型選擇。", "has_caveat": 0, "caveat_note": null}, {"id": 239, "source": "題庫07", "topic": "綜合", "question": "歐盟《可信任AI倫理準則》的三大核心要素中，以下哪一項不包含在內？", "option_a": "合法性", "option_b": "倫理性", "option_c": "穩健性", "option_d": "實用性", "correct_option": "D", "explanation": "歐盟《可信任AI倫理準則》的三大核心要素為合法性、倫理性、穩健性；實用性不在其中。", "has_caveat": 0, "caveat_note": null}, {"id": 241, "source": "題庫07", "topic": "綜合", "question": "以下哪一項措施有助於防止AI生成內容中的資料洩露？", "option_a": "使用開放網路傳輸資料", "option_b": "定期更新和修補安全漏洞", "option_c": "允許所有員工存取所有資料", "option_d": "忽略安全警告", "correct_option": "B", "explanation": "定期更新系統並修補已知安全漏洞，是防止資料被入侵竊取的基本且關鍵的資安措施。", "has_caveat": 1, "caveat_note": "與第175題同樣考「防止資料洩露的安全策略」，選項組不同（本題聚焦「定期更新修補漏洞」，第175題聚焦「定期安全審計掃描」），經使用者確認兩題皆保留為獨立題目。"}, {"id": 242, "source": "題庫07", "topic": "綜合", "question": "下列何種框架不常用於深度學習圖片生成？", "option_a": "TensorFlow", "option_b": "PyTorch", "option_c": "Keras", "option_d": "Excel", "correct_option": "D", "explanation": "TensorFlow、PyTorch、Keras 皆為深度學習框架；Excel為試算表軟體，不具備深度學習模型訓練能力。", "has_caveat": 0, "caveat_note": null}, {"id": 243, "source": "題庫07", "topic": "綜合", "question": "生成式AI能夠模仿特定人的聲音，應用於語音導航、電子書朗讀等場合，並且在法律合規的前提下，用於數位繼承和娛樂產業。請問上述是指下列何者？", "option_a": "音樂生成", "option_b": "語音翻譯", "option_c": "語音助手", "option_d": "語音克隆", "correct_option": "D", "explanation": "語音克隆技術可模仿特定人聲音並應用於朗讀、數位繼承、娛樂產業等場景，與語音助手（通用語音互動）、語音翻譯（跨語言轉換）性質不同。", "has_caveat": 0, "caveat_note": null}, {"id": 244, "source": "題庫07", "topic": "綜合", "question": "哪個AI生成內容工具可以用來自動生成多語言學習資料以促進語言學習？", "option_a": "翻譯軟體", "option_b": "圖片處理軟體", "option_c": "網頁瀏覽器", "option_d": "音樂播放器", "correct_option": "A", "explanation": "翻譯軟體可將學習資料轉換為多種語言版本，直接促進多語言學習。", "has_caveat": 0, "caveat_note": null}, {"id": 245, "source": "題庫07", "topic": "綜合", "question": "資料分類和標籤貼附以區分不同類型，這是哪種人工智慧技術？", "option_a": "決策式AI", "option_b": "生成式AI", "option_c": "決策式BI", "option_d": "生成式BI", "correct_option": "A", "explanation": "資料分類與標籤貼附屬於判斷/分類任務，對應決策式AI（Discriminative AI）；生成式AI的核心任務是產生新內容，而非分類既有資料。", "has_caveat": 0, "caveat_note": null}, {"id": 246, "source": "題庫07", "topic": "綜合", "question": "何者是無效的Prompt？", "option_a": "你還記得三天前我跟你提到的問題嗎？", "option_b": "上次我問了一個關於健康減肥的問題，關於這個問題我還想進一步了解", "option_c": "我想了解牛頓萬有引力定律的基本原理", "option_d": "你能解釋一下達爾文的理論基礎嗎？", "correct_option": "A", "explanation": "多數對話式AI模型不具跨對話/跨session的長期記憶，直接要求模型「記得三天前的問題」卻未提供具體內容，屬於無效、無法被正確執行的Prompt。", "has_caveat": 0, "caveat_note": null}, {"id": 247, "source": "題庫08", "topic": "綜合", "question": "AI生成內容可能涉及的法律風險包括以下哪一項？", "option_a": "用電量大", "option_b": "系統過載", "option_c": "誹謗與中傷", "option_d": "硬碟空間不足", "correct_option": "C", "ex
